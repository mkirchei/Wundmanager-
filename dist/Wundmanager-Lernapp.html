<h3>8. Nicht-medikamentöse Maßnahmen <span class="seite">S. 25–30</span></h3>
<p>Wichtige Ergänzung, auch eigenständig; nicht alle ausreichend evidenzbasiert, steigern aber das Wohlbefinden. Modulation im Hinterhorn des Rückenmarks (A-beta-Fasern, absteigende Bahnen); Angst/Spannung verstärken, Ablenkung/Entspannung reduzieren Schmerz (S. 25).</p>
<div class="tabelle"><table>
  <thead><tr><th>Maßnahme</th><th>Kernaussagen (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Positionierung</td><td>entspannte Position nach Wunsch, Kissen/Rollen</td></tr>
    <tr><td>Kälte</td><td>v. a. akute Schmerzen, akut-entzündlich, nach Trauma (Hämatome, Prellungen); hemmt Schmerzrezeptoren/-leitung; Betroffene aktiv beteiligen (Selbstwirksamkeit)</td></tr>
    <tr><td>Wärme</td><td>länger andauernde Schmerzen, innere Verletzungen, neuropathisch; keine Leitlinie gibt pflegerische Maßnahmen explizit vor</td></tr>
    <tr><td>TENS</td><td>Niederspannung über Hautelektroden (4 Elektroden, 10–30 mA); Endorphine, Dopamin, Noradrenalin, Serotonin ↑; gut bei neuropathischen, kaum bei nozizeptiven Schmerzen; <b>nur nach ärztlicher Anordnung und auf intakter Haut</b></td></tr>
    <tr><td>Massagen</td><td>senken nachweislich Schmerzintensität; vor Verbandwechsel bei angstvollen Menschen; Praxis: Öl (30 ml Mandelöl, je 9 Tropfen Narde, Ylang Ylang, Lavendel), Hand-/Fußmassagen</td></tr>
    <tr><td>Akupunktur</td><td>TCM; wirksam bei Kniegelenkarthrose, chronischen Rückenschmerzen, Ergänzung bei Spannungskopfschmerz/Migräne; Scheinakupunktur ebenfalls wirksam; bei starken Schmerzen nicht ausreichend</td></tr>
    <tr><td>Information</td><td>vorab besprechen, gemeinsam Vorgehen vereinbaren → vertrauensbildend, angstreduzierend; Zeit wird durch Kooperation kompensiert; ggf. Bezugsperson; <b>„Stopp“ vereinbaren und unbedingt einhalten</b></td></tr>
    <tr><td>Entspannung</td><td>PMR nach Jacobson, Imagination, Meditation, Yoga, autogenes Training – vorab erlernen</td></tr>
    <tr><td>Ablenkung</td><td>aufmerksamkeitsbasiert (Gespräch, Fantasie, Bezugsperson); besonders gut bei Kindern</td></tr>
    <tr><td>Musik</td><td>reduziert Angst/Schmerz; einfach, kostenlos, kein Mehraufwand; Musikwunsch beachten</td></tr>
    <tr><td>Aromatherapie</td><td>Inhalation, Massage; keine gesicherte Evidenz zur Schmerzreduktion; Dufttuch 1–2 Tropfen; dezent, max. 1 Stunde</td></tr>

<p class="merke">Alle nicht-medikamentösen Maßnahmen müssen ebenso wie medikamentöse <b>geplant, angewendet und evaluiert</b> werden (S. 30).</p>

<h3>9. Übung III und Zusammenfassung <span class="seite">S. 31–34</span></h3>
<ul>
  <li><b>Redewendungen</b> (Lösung S. 34): z. B. „Ein Indianer kennt keinen Schmerz“, „Stellen Sie sich nicht so an!“, „Es wird gar nicht weh tun …“ – kulturell/familiär geprägte Glaubenssätze.</li>
  <li><b>Mythen</b> (S. 34): Fixierverband schmerzlos? – nein, gesteigerte Nervenempfindung in der Wundumgebung kann jedes Abnehmen schmerzhaft machen · Diabetisches Fußulcus schmerzfrei? – nein, neben Sensibilitätsverlust auch Nervensensibilität möglich · Analgetika vor dem Verbandwechsel einzige Methode? – nein, Suchtrisiko; nicht-medikamentöse Verfahren bedienen psychische und soziale Komponenten.</li>
  <li><b>Zusammenfassung</b> (S. 32): Schmerz ist oft größte Belastung; unzureichende Linderung → Sensibilisierung, auch Wundumgebung hyperalgetisch; „Umprogrammierung“ der Neuronen → Hyperalgesie. Intensive, wiederholte Schmerzen hinterlassen Spuren im Gehirn (Schmerzgedächtnis). Erwartete Schmerzen präventiv mit Analgetika und nicht-medikamentös behandeln.</li>
</ul>
<p class="hand">Handschriftlich (S. 22): Opioide – Dosis muss nicht wegen Gewöhnung gesteigert werden; verkürzen das Leben nicht.</p>

      a: "Ruhedruck = Anlagedruck in Ruhe im Liegen, beschreibt Kompressionsstärke, sinkt durch Bewegung/Ödemreduktion.\nArbeitsdruck = Widerstand des Verbandes gegen die Muskelausdehnung bei Bewegung; umso höher, je weniger dehnbar das Material.", s: "S. 5" },
    { k: "Wirkung", f: "Was bedeutet Stiffness?",
      a: "Steifigkeit: wie stark das Kompressionsmittel einer Umfangszunahme (Bewegung, Ödem, Aufstehen) widersteht. Langzug → geringer Druckanstieg; Zinkleim → sehr hoher. Je weniger das Material nachgibt, desto höher die Stiffness.", s: "S. 5" },
    { k: "Wirkung", f: "Welche Muskelpumpen gibt es? ★",
      a: "Handschr. („Prüfung“): Fußsohlenpumpe, Sprunggelenkspumpe, Wadenmuskelpumpe, Kniekehlenpumpe, Leisten-/Oberschenkelpumpe.\nDruck: Kompression steigert v. a. Sprunggelenk- und Wadenmuskelpumpe (Pascal-Gesetz).", s: "S. 5", h: true },
    { k: "Wirkung", f: "In welche Richtung soll der Druck abnehmen – und warum?",
      a: "Von distal nach proximal, damit dem Rückfluss wenig Widerstand entgegensteht. Laplace: bei größerem Umfang sinkt der Druck bei gleichem Zug → am normal geformten Unterschenkel entsteht das Gefälle von selbst; nicht zuerst stark, dann schwach wickeln.", s: "S. 5–6" },
    { k: "Wirkung", f: "Nenne Wirkungen der Kompressionstherapie.",
      a: "Rückfluss bis in tiefe Gefäße ↑, Venendruck ↓, Thromboseprophylaxe, Gerinnselabbau, Abtransport von Schlackenstoffen, Schließen dilatierter Klappen, Ödemreduktion, Lymphdrainage ↑, rasche Entstauung, Ulcusabheilung.", s: "S. 6" },
    { k: "Phasen", f: "Phasen der Kompressionstherapie bei CVI? ★",
      a: "1. Entstauung: Ödemreduktion → PKV (Kurzzug, Mehrkomponenten) oder MAK.\n2. Erhaltung: stabiler Zustand → MKS oder Ulcus-Strumpfsysteme.\n3. Prävention: nach Abheilung → MKS, meist KKL II.", s: "S. 6" },
    { k: "Risiken", f: "Risiken und Nebenwirkungen der Kompression?",
      a: "Unsachgemäß (zu hoher Druck, Strangulation): Schmerzen, Gewebeschäden, Nekrosen, Nervenschäden an Knochenvorsprüngen (Fibulaköpfchen). MKS falsch gehandhabt: Hautnekrosen, Nervenschäden. Empfindliche Haut: Juckreiz, Schuppung, Entzündung → Hautpflege.", s: "S. 7" },
    { k: "Methoden", f: "Welche vier Methoden gibt es?",
      a: "PKV (Binden; Entstauung) · MKS (Strümpfe; Erhaltung, Prävention) · MAK (Klett-/Wrap-Systeme; Entstauung) · IPK (apparativ, nur unterstützend, kein Ersatz).", s: "S. 7" },
    { k: "PKV", f: "Wechsel- vs. Dauerverband?",
      a: "Wechselverband: täglich neu, optimal über Nacht belassen.\nDauerverband (z. B. Mehrkomponentensystem): mehrere Tage, auch nachts. PKV schließt Fuß und Sprunggelenk ein, bis Fibulaköpfchen oder proximalen Oberschenkel.", s: "S. 8" },
    { k: "PKV", f: "Kurzzug- vs. Langzugbinde? ★",
      a: "Kurzzug (40–90 %): hoher Arbeits-, niedriger Ruhedruck; Kompression durch Bewegung; für Mobile. Langzug (100–200 %): hoher Ruhe-, niedriger Arbeitsdruck; Kompression geht vom Material aus; Gefahr von Einschnürungen bei Immobilen.", s: "S. 8–9, handschr. S. 2–3", h: true },
    { k: "PKV", f: "Was ist bei Kurzzugbinden zu beachten?",
      a: "Ruhedruck 40–60 mmHg, sinkt rasch (verrutschen, verlieren Form); in 24 h deutlich ↓ → in der Entstauung ggf. täglich erneuern. Täglich waschen, 15–20× bis 95 °C, bügeln, unter leichtem Zug aufrollen; ausgeleierte Binden austauschen.", s: "S. 8–9" },
    { k: "PKV", f: "Zinkleimbinden – Eigenschaften?",
      a: "Nahezu steif (< 10 %); sehr hoher Arbeits-, niedriger Ruhedruck; feucht angelegt, härten aus; schnelle Entstauung; Sprunggelenkspumpe eingeschränkt; kein Exsudat-Aufnahmevermögen → häufiger Wechsel (Mazeration, Geruch).", s: "S. 9" },
    { k: "PKV", f: "Vor- und Nachteile von Mehrkomponentensystemen?",
      a: "2–4 Komponenten (Polster, Kurz-, Langzug, kohäsiv); bei Ulcus cruris venosum effektiver und einfacher als Kurzzug; halten Druck bis zum Wechsel (bis 7 Tage).\nNachteile: Einmalprodukt, voluminös (Schuhe), höhere Kosten.", s: "S. 9–10" },
    { k: "PKV", f: "Wovon hängt die Druckbeständigkeit eines Verbandes ab?",
      a: "Bindenvordehnung, Bindentyp, -breite, -elastizität, Zugkraftabfall (Relaxation), Anzahl der Touren, Bandagierungstechnik, Feuchtigkeitsaufnahme, Pflege, Extremitätenzirkumferenz und -konfiguration.", s: "S. 10" },
    { k: "PKV", f: "ICC-Druckbereiche und Messpunkt?",
      a: "Leicht < 20 · mittelstark ≥ 20–40 · stark ≥ 40–60 · sehr stark > 60 mmHg. Messung mit elektronischem Gerät ca. 10 cm über dem Innenknöchel. Ulcus cruris venosum braucht ≥ 40–60 mmHg.", s: "S. 10–11" },
    { k: "PKV", f: "Wie schnell fällt der Druck unter Kurzzugbinden ab?",
      a: "Innerhalb der ersten 30 Minuten deutlich; nach 7 Stunden ca. 50 %. Merksatz: Kompression ist nur erfolgreich, wenn ein adäquater Druck über eine angemessene Zeit wirkt.", s: "S. 11" },
    { k: "Bandagierung", f: "Grundprinzipien des PKV?",
      a: "Mit Überlappung · Sprunggelenk rechtwinklig (Dorsalflexion) · Unterschenkel bis Fibulaköpfchen, Oberschenkel bis proximal · Druck distal → proximal abnehmend · keine Druckstellen, Schnürfurchen, Schmerzen · Material/Technik nach Indikation.", s: "S. 12" },
    { k: "Bandagierung", f: "Was ist bei jeder Bandagierung zu beachten?",
      a: "Hautschutz (Schlauchverband), Unterpolsterung, Pelotten, keine Fixierklammern am Menschen, passende Bindenbreite, mind. 2 Binden, Fuß in Funktionsstellung, Rolle unter Zug direkt auf der Haut, nicht zu straff/locker, bei Vorfußödem Zehen mitkomprimieren.", s: "S. 12" },
    { k: "Bandagierung", f: "Was sind Pelotten – wofür Polsterung?",
      a: "Pelotten = nierenförmige Schaumstoffpolster; gleichen anatomische Unebenheiten (z. B. hinter dem Knöchel) aus. Unterpolsterung mit Watte/Schaumstoff beugt Druckulzera, Hautnekrosen, Nervenschäden, Blasen vor.", s: "S. 13" },
    { k: "Bandagierung", f: "Ablauf beim Anlegen eines PKV am Bein?",
      a: "Schlauchverband (links gewendet) bis zwei Finger unter die Kniekehle, Unterpolsterung, Beginn unterhalb des Großzehengrundgelenks mit 2 Kreistouren, Fuß rechtwinklig, Ferse immer einbinden, Fehlstellung korrigierend wickeln; danach 20–30 min bewegen.", s: "S. 13–14" },
    { k: "Bandagierung", f: "Sigg vs. Pütter?",
      a: "Sigg: 1. Kurzzugbinde ab Großzehengrundgelenk in 1 cm überlappenden Touren bis untere Wade; 2. in Achtertouren bis unter die Kniekehle.\nPütter: Gegenwickeltechnik, 2 Binden gegenläufig. Keine Technik ist nachweislich überlegen.", s: "S. 14" },
    { k: "Bandagierung", f: "Wie wird der Erfolg kontrolliert?",
      a: "Einmal wöchentlich Vorfuß-, Knöchel- und Wadenumfang an der dicksten Stelle messen. Keine Entstauung → ineffiziente Versorgung oder eingeschränkte Venenpumpe.", s: "S. 15" },
    { k: "MKS", f: "Wann und wie werden MKS getragen?",
      a: "Langzeit-/Dauerbehandlung nach Ödemreduktion bzw. Ulcusabheilung, danach lebenslang als Rezidivprophylaxe. Morgens vor dem Aufstehen an, abends aus; Hautpflege abends. Höchster Druck in der Fesselgegend.", s: "S. 15" },
    { k: "MKS", f: "Welche Strumpflängen gibt es?",
      a: "Wadenstrumpf A-D · Halbschenkelstrumpf A-F · Schenkelstrumpf A-G · Strumpfhose A-T; je 3 Längen. CVI/UCV meist Wadenstrumpf. Merksatz: So lang wie nötig, so kurz wie möglich!", s: "S. 15–16" },
    { k: "MKS", f: "Flach- vs. rundgestrickt?",
      a: "Flach (mit Naht): hohe Stiffness, kein Einschneiden in Falten, individuelle Formen (Lymphödem), immer Maßanfertigung.\nRund (nahtlos): geringe Stiffness, kann in Gewebefalten einschneiden, begrenzte Formgebung.", s: "S. 16–17" },
    { k: "MKS", f: "Nenne die Kompressionsklassen.",
      a: "I leicht 18–21 mmHg · II mittel 23–32 · III kräftig 34–46 · IV sehr kräftig ≥ 49 mmHg. Genormt nach Ruhedruck im Fesselbereich; international uneinheitlich.", s: "S. 17" },
    { k: "MKS", f: "Welche KKL bei welcher Indikation?",
      a: "I: Thromboseprophylaxe, Varikose ohne Ödem.\nII: Varikose mit Ödem, Rezidivprophylaxe nach UCV, TVT, PTS, Lymphödem I, Lipödem.\nIII: florides UCV, Lymphödem III.\nIV: irreversibles Lymphödem.", s: "S. 18" },
    { k: "MKS", f: "Wie wird für MKS gemessen – und wie Adhärenz gefördert?",
      a: "Morgens am entstauten Bein, bei Adipösen im Stehen, jedes Bein separat. Etwa die Hälfte der MKS wird nicht getragen → Aufklärung und niedrigste wirksame KKL.", s: "S. 17" },
    { k: "MKS", f: "Was tun, wenn KKL III/IV nicht selbst angezogen werden kann?",
      a: "Prüfen: zwei Strümpfe niedrigerer KKL übereinander (KKL addieren sich) oder Einzelelemente (Vorfußkappe, Kniestrumpf, Capri, Radlerhose); Reißverschlüsse; An-/Ausziehhilfen.", s: "S. 18" },
    { k: "MKS", f: "Hinweise zum Anziehen und zur Hautpflege?",
      a: "Faltenfrei anziehen; keine Uhren/Ringe; kurze, gefeilte Finger- und Zehennägel; Hornhaut entfernen; intensive Hautpflege mit ureahaltigen Produkten abends nach dem Ablegen.", s: "S. 18–19" },
    { k: "MKS", f: "Welche An- und Ausziehhilfen gibt es?",
      a: "Gleiter (Ballonseide, klein, faltbar; Beweglichkeit bis zum Vorfuß nötig) und Gestelle (Sitzen/Stehen, sperrig) sowie genoppte Gummihandschuhe.\nIndikationen: Lähmungen, Kraftminderung, Arthrose/Rheuma, Adipositas permagna, Versteifungen.", s: "S. 19" },
    { k: "MKS", f: "Wie werden MKS gepflegt?",
      a: "Täglich waschen; Handwäsche oder Feinwäsche 30–40 °C im Netz; liegend trocknen. Ungeeignet: Vollwaschmittel, Weichspüler, Chlor, chemische Reinigung, Auswringen, Bügeln, Sonne, Heizung, Stopfen.", s: "S. 20" },
    { k: "MKS", f: "Was sind Ulcus-Strumpfsysteme?",
      a: "Zweilagig: dünner Unterziehstrumpf (auch nachts, fixiert Wundauflage) + kräftiger Überstrumpf; Stiffness ↑, Ruhedruck ≈ KKL III. Gut geeignet in der stabilen Heilungsphase des Ulcus cruris venosum.", s: "S. 20" },
    { k: "MAK", f: "Was kennzeichnet MAK?",
      a: "Klett-/Wrap-Bandagen; Druck einstellbar (auch von Betroffenen), z. T. mit Messscheibe; jederzeit nachjustierbar bei Ödemreduktion; hoher Arbeits-, niedriger Ruhedruck; Entstauungsphase; bis zu 6 Monate nutzbar; noch kein Klassifikationssystem.", s: "S. 20–21" },
    { k: "IPK", f: "Was ist IPK und wie wird sie angewendet?",
      a: "Apparative Wechseldrücke in Luftkammern, sequenziell distal → proximal; simuliert die Muskelpumpe; v. a. für teil-/immobile Menschen; Hilfsmittel PG 17; ersetzt weder Lymphdrainage noch Kompression; 30–60 min, 1–3× täglich.", s: "S. 21–22" },
    { k: "IPK", f: "Indikationen der IPK (soll/sollte)?",
      a: "Soll: Thromboembolieprophylaxe, wenn keine medikamentöse Prophylaxe möglich.\nSollte: therapieresistentes UCV, CVI C4b–C6 (CEAP), Lymphödem additiv, pAVK mit stabiler Claudicatio/kritischer Ischämie ohne Alternativen.", s: "S. 21" },
    { k: "IPK", f: "Kontraindikationen der IPK?",
      a: "Dekompensierte Herzinsuffizienz, ausgedehnte Thrombophlebitis/Thrombose(-verdacht), akutes Erysipel, akute Phlegmone, Kompartmentsyndrom, schwere Hypertonie, okkludierende Lymphabstromprozesse, Weichteiltrauma, ausgeprägte Neuropathie, blasenbildende Dermatosen.", s: "S. 22" },
    { k: "Bewegung", f: "Warum ist Bewegung Teil der Kompressionstherapie?",
      a: "Eigenbewegung ist stets Bestandteil einer effektiven Kompressionstherapie. Wirkung nur bei Sprunggelenksbeweglichkeit und normalem Abrollen. Übungen: Fußkreisen, Fußwippen, Zehenkrallen; Gehtraining, Nordic Walking; Bettlägerige: Drainagebeutel.", s: "S. 24" },
    { k: "Übungen", f: "Welche Binden für mobile Menschen mit UCV in der Entstauung? (Übung I)",
      a: "Kurzzugbinden und Mehrkomponentensysteme (hoher Arbeits-, niedriger Ruhedruck).\nMehrkomponenten: effektiver, einfacher, Druck bis zum Wechsel, aber voluminös. Kurzzug: Druck sinkt rasch, verrutscht, aber wiederverwendbar.", s: "S. 30" },
    { k: "Übungen", f: "Erhaltungsphase bei stabilem UCV – was beraten? (Übung I)",
      a: "Kompressionsstrümpfe oder Ulcus-Strumpfsysteme.\nBeratung: Kompression bleibt auch nach Abheilung nötig – Gefäße dehnen sich wieder, Klappen schließen nicht → Rezidive; danach meist KKL II, lebenslang.", s: "S. 30" },
    { k: "Übungen", f: "Phasengerechte Kompression bei UCV? (Übung II)",
      a: "Entstauung: Kurzzug, Mehrkomponenten, MAK – ja; Strümpfe nein.\nErhaltung: Kompressionsstrümpfe und Ulcus-Strumpfsysteme – ja.\nPrävention: nur Kompressionsstrümpfe. Beim Lymphödem: Entstauung und Erhaltung analog.", s: "S. 30" },
    { k: "Leitlinie", f: "Was gehört auf das Rezept für MKS?",
      a: "Anzahl, Strumpflänge (A-D, A-F, A-G, A-T), KKL, Indikation/Diagnose, Hilfsmittelnummer, ggf. Maßanfertigung, Fußspitze offen/geschlossen; ggf. Zusätze, flachgestrickt, Stiffness, Befestigung, Wechselversorgung.", s: "S. 26" },
    { k: "Leitlinie", f: "Nutzungsdauer von MKS und Kompression nach TVT?",
      a: "MKS: in der Regel 6 Monate; Erstversorgung mit Zweitverordnung (Hygiene). Binden mind. 15× waschbar. TVT: sofort Kompression beginnen und mind. 6 Monate fortsetzen, dann nach PTS-Zeichen.", s: "S. 27–29" },
    { k: "Leitlinie", f: "Wann ist die Kompression sofort zu entfernen?",
      a: "Blau- oder Weißfärbung der Zehen, Missempfindungen/Taubheit, zunehmende Schmerzen, Kurzatmigkeit, Schweißausbrüche, akute Bewegungseinschränkungen → Entfernen und klinischen Befund kontrollieren.", s: "S. 29" }
  ],

    { f: "Ulcus cruris mixtum – wovon hängt laut handschriftlicher Notiz ab, ob komprimiert wird?",

    { f: "Welche Faktoren erfordern laut Heft eine interdisziplinäre Nutzen-Risiko-Abwägung (Risikofaktoren, keine absolute KI)?",
      o: ["Ausgeprägte nässende Dermatosen", "Primär chronische Polyarthritis", "Phlegmasia coerulea dolens", "Dekompensierte Herzinsuffizienz (NYHA III + IV)"], r: 2,
      e: "Risikofaktoren: nässende Dermatosen, Materialunverträglichkeit, schwere Sensibilitätsstörungen, fortgeschrittene periphere Neuropathie, primär chronische Polyarthritis. Phlegmasia coerulea dolens und dekompensierte Herzinsuffizienz sind absolute KI.", s: "S. 4" },
    { f: "Wie wirkt Kompression auf die Venen?",

    { f: "Was beschreibt der Ruhedruck?",
      o: ["Den Anlagedruck in Ruhe im Liegen; er beschreibt die Kompressionsstärke", "Den Widerstand des Verbandes gegen die Muskelausdehnung beim Gehen", "Den Druck in den Luftkammern der IPK", "Einen Druck, der durch Bewegung und Ödemreduktion ansteigt"],
      e: "Ruhedruck = Anlagedruck; nimmt durch Bewegung und Ödemreduktion innerhalb weniger Stunden ab. Der Widerstand gegen die Muskelausdehnung ist der Arbeitsdruck.", s: "S. 5" },
    { f: "Wann ist der Arbeitsdruck eines Verbandes höher?",
      o: ["Je weniger dehnbar das Material ist", "Je dehnbarer das Material ist", "Je länger der Patient liegt", "Je stärker die Binde vorgedehnt im Schrank lagert"],
      e: "Arbeitsdruck entsteht beim Aufstehen und bei Muskelaktivität durch den Widerstand des Verbandes gegen die Muskelausdehnung – umso höher, je weniger dehnbar das Material.", s: "S. 5" },
    { f: "Welches Material zeigt laut Heft den stärksten Druckanstieg bei Umfangszunahme (Stiffness)?",

      e: "Stiffness = wie stark das Material der Umfangszunahme widersteht: Langzug → geringer, Zinkleim → sehr hoher Druckanstieg; rundgestrickte Strümpfe haben geringe Stiffness.", s: "S. 5, 16" },
    { f: "Welche Muskelpumpen nennt die handschriftliche Prüfungsnotiz?",

    { f: "Wie soll der Kompressionsdruck am Bein verlaufen?",

    { f: "In welcher Reihenfolge verlaufen die Phasen der Kompressionstherapie bei CVI?",
      o: ["Entstauung – Erhaltung – Prävention", "Prävention – Entstauung – Erhaltung", "Erhaltung – Entstauung – Prävention", "Entstauung – Prävention – Erhaltung"],

    { f: "Welche Mittel sind in der Entstauungsphase bei Ulcus cruris venosum geeignet (Übung II)?",

      e: "Gefäße dehnen sich wieder aus und Klappen schließen nicht → Rezidive; daher nach Abheilung MKS meist KKL II lebenslang.", s: "S. 6, 15, 30" },

  zusammenfassung: `
<p class="merke">„Kompression ist nicht alles, aber ohne Kompression kann nichts erreicht werden!“ (Kerstin Protz, S. 2) · Grundlegende, nebenwirkungsarme Basis bei chronischen Venenerkrankungen; unerlässlich bei venösen Ödemen und Ulcus cruris venosum. Eigennamen von Techniken: Pütter, Sigg, Fischer, Unna (S. 2).</p>
<p class="hand">Handschr. Prüfungsthemen (S. 2): Indikation, Kontraindikation, Wirkungsweise, Phasen (Entstauung …).</p>

<h3>1. Indikationen <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 3</span></h3>
<p>Bei allen venösen und lymphatischen Erkrankungen, die Ödeme der Beine nach sich ziehen.</p>
<div class="tabelle"><table>
  <thead><tr><th>Gruppe</th><th>Indikationen (Heft, nach Rabe 2018)</th></tr></thead>
  <tbody>
    <tr><td>chronische Venenkrankheiten</td><td>venöse Symptome, Lebensqualität, Prävention/Therapie venöser Ödeme und Hautveränderungen, <b>Ulcus cruris venosum</b> + Rezidivprävention, Schmerzreduktion, <b>gemischtes Ulcus</b> (unter Beachtung der KI!), Varikose, Ekzem/Pigmentierung, Dermatoliposklerose, Atrophie blanche, nach Varikosetherapie, funktionelle venöse Insuffizienz (Adipositas, Sitz-/Stehberufe), venöse Malformationen</td></tr>
    <tr><td>thromboembolische Venenkrankheiten</td><td>oberflächliche und tiefe Beinvenenthrombose, Armvenenthrombose, Z. n. Thrombose, postthrombotisches Syndrom, Thromboseprophylaxe bei mobilen Menschen</td></tr>
    <tr><td>Ödeme</td><td>Lymphödem, Lipödem ab Stadium II, Stauung bei Immobilität (arthrogenes Stauungssyndrom, Paresen), medikamentös bedingte Ödeme (wenn keine Umstellung möglich), Schwangerschaft, posttraumatisch/postoperativ, Reperfusionsödeme, zyklisch idiopathisch, berufsbedingt</td></tr>
    <tr><td>andere</td><td>Adipositas mit funktioneller venöser Insuffizienz, entzündliche Dermatosen der Beine, Schwangerschaftsbeschwerden, <b>Z. n. Verbrennungen</b> <span class="hand-inline">(handschr. hervorgehoben)</span>, Narbenbehandlung</td></tr>
  </tbody>
</table></div>

<h3>2. Kontraindikationen <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 4</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Absolute Kontraindikationen (Heft)</th><th>Risikofaktoren (Nutzen-Risiko-Abwägung, interdisziplinär)</th></tr></thead>
  <tbody>
    <tr><td>• fortgeschrittene <b>pAVK</b>, wenn einer zutrifft: <b>ABPI &lt; 0,5</b> · Knöchelarteriendruck <b>&lt; 60 mmHg</b> · Zehendruck <b>&lt; 30 mmHg</b> oder TcPO₂ <b>&lt; 20 mmHg</b> Fußrücken (mit unelastischem Material ggf. noch bei 50–60 mmHg unter engmaschiger Kontrolle)<br>• dekompensierte <b>Herzinsuffizienz</b> (NYHA III + IV)<br>• <b>septische Phlebitis</b><br>• <b>Phlegmasia coerulea dolens</b></td><td>ausgeprägte nässende Dermatosen · Unverträglichkeit auf Kompressionsmaterial · schwere Sensibilitätsstörungen · fortgeschrittene periphere Neuropathie (z. B. Diabetes) · primär chronische Polyarthritis</td></tr>
  </tbody>
</table></div>
<p class="hand">Handschr. „Prüfungsfrage“ (S. 4): Kontraindikationen – Herzinsuffizienz, septische Phlebitis, pAVK, Dermatosen.</p>
<p class="hand">Handschr. „Prüfung“ (S. 2): arterio-venöses Ulcus / Ulcus cruris mixtum – Kompressionstherapie ja oder nein? → abhängig vom Gefäßstatus; <b>ABI-Messung</b> (RR an beiden Armen und beiden Beinen); &lt; 0,5 kritischer Wert → keine Kompressionstherapie.</p>

<h3>3. Wirkungsweise und Begriffe <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 4–6</span></h3>
<p class="merke"><b>Kompressionstherapie</b> = „therapeutische Maßnahmen, die unter Anwendung von Druck zur Behandlung von Venenleiden, Lymphödem und Kombinationsleiden, bei traumatischen Indikationen wie postoperativen Ödemen oder Angiodysplasien dienen“ (Möller-Woltemade 2020). Basis jeder phlebologischen Therapie (S. 4).</p>
<ul>
  <li>Gefäßdurchmesser ↓ → Fließgeschwindigkeit Richtung Herz fast verdoppelt, transmuraler Druck ↓; dilatierte (nicht zerstörte) Venenklappen schließen wieder – bereits im Ruhezustand durch den Ruhedruck (S. 4).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Begriff</th><th>Definition (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Ruhedruck</td><td>= Anlagedruck; Druck in Ruhe im Liegen; beschreibt die Kompressionsstärke; nimmt durch Bewegung und Ödemreduktion innerhalb weniger Stunden ab</td></tr>
    <tr><td>Arbeitsdruck</td><td>entsteht beim Aufstehen und bei Muskelaktivität (Gehen) durch den Widerstand des Verbandes gegen die Muskelausdehnung; umso höher, je weniger dehnbar das Material</td></tr>
    <tr><td>Stiffness</td><td>Steifigkeit: wie stark das Material der Umfangszunahme widersteht; Langzug → geringer, Zinkleim → sehr hoher Druckanstieg</td></tr>
  </tbody>
</table></div>
<ul>
  <li>Kompression steigert die Effizienz der <b>Muskelpumpen</b>, v. a. Sprunggelenk- und Wadenmuskelpumpe; Druck verteilt sich nach dem <b>Pascal-Gesetz</b> im ganzen Bein (S. 5). <span class="hand-inline">Handschr. „Prüfung: Welche Pumpen gibt es?“ – Fußsohlenpumpe, Sprunggelenkspumpe, Wadenmuskelpumpe, Kniekehlenpumpe, Leisten-/Oberschenkelpumpe.</span></li>
  <li><b>Druck soll von distal nach proximal abnehmen</b> (Laplace: größerer Umfang → geringerer Druck bei gleichem Zug); daher nicht zuerst stark und zum Knie hin schwächer wickeln. Bei normal geformten Beinen entsteht das Druckgefälle von selbst (S. 5–6).</li>
  <li><b>Wirkungen</b> (S. 6): Rückfluss bis in tiefe Gefäße ↑, Venendruck ↓, Thromboseprophylaxe, Abbau bestehender Gerinnsel, Abtransport von Schlackenstoffen, Schließen dilatierter Klappen, Ödemreduktion, Lymphdrainage ↑ (Mikrozirkulation), rasche Entstauung, Abheilung von Ulzerationen.</li>
</ul>

<h3>4. Phasen der Kompressionstherapie bei CVI <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 6</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Phase</th><th>Ziel</th><th>Mittel</th></tr></thead>
  <tbody>
    <tr><td>1 Entstauungsphase (Therapiephase)</td><td>Entstauung, Ödemreduktion, Ulcus-Umfang minimieren</td><td>PKV (Kurzzugbinden oder Mehrkomponentensysteme) oder MAK</td></tr>
    <tr><td>2 Erhaltungsphase</td><td>stabiler Zustand (entstaut, Ulcus stabil heilend)</td><td>MKS: Kompressionsstrümpfe oder Ulcus-Strumpfsysteme</td></tr>
    <tr><td>3 Prävention</td><td>nach Abheilung: Rezidive und Ödeme vermeiden</td><td>MKS, i. d. R. <b>KKL II</b> ausreichend</td></tr>
  </tbody>
</table></div>
<p class="warnung"><b>Risiken</b> (S. 7): unsachgemäßes Bandagieren (zu hoher Druck, Strangulation) → Schmerzen, Gewebeschäden, Nekrosen, Nervenschäden v. a. an Knochenvorsprüngen (Fibulaköpfchen); MKS bei falscher Handhabung → Hautnekrosen, Nervenschäden; Juckreiz, Schuppung, Entzündung → Hautpflege.</p>

<h3>5. Methoden – Übersicht <span class="seite">S. 7</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>PKV</th><th>MKS</th><th>MAK</th><th>IPK</th></tr></thead>
  <tbody>
    <tr><td>Phlebologischer Kompressionsverband aus elastischen und/oder unelastischen Binden; v. a. <b>Entstauungsphase</b>, evtl. Erhaltung</td><td>Medizinische Kompressionsstrümpfe (elastisches Gestrick); <b>Erhaltung und Prävention</b></td><td>Medizinische adaptive Kompressionssysteme (Klett-/Wrap-Bandagen); <b>Entstauungsphase</b></td><td>Intermittierende pneumatische Kompression; nur <b>unterstützend</b>, kein Ersatz; Luftkammern, elektronisch gesteuert</td></tr>
  </tbody>
</table></div>

<h3>6. Phlebologischer Kompressionsverband (PKV) <span class="seite">S. 8–15</span></h3>
<ul>
  <li>Wechselverband (täglich neu, über Nacht belassen) oder Dauerverband (Mehrkomponentensystem, mehrere Tage). Schließt Fuß und Sprunggelenk ein, bis Fibulaköpfchen oder proximalen Oberschenkel. Mehrlagig gewickelte elastische Binden verhalten sich wie ein unelastischer Verband; mehrere Komponenten/Lagen fördern die Abheilung (S. 8).</li>
  <li>Binden: Breiten 6, 8, 10, 12 cm; Längen 5, 6, 7 m; Polyamid, Elastan, Baumwolle, Elastodien, Viskose. Zweizugelastische Binden „sitzen“ besser (S. 8).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Bindentyp</th><th>Dehnbarkeit</th><th>Druck</th><th>Besonderheiten (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Kurzzug</td><td>40–90 %</td><td><b>hoher Arbeits-, niedriger Ruhedruck</b> (Ruhedruck 40–60 mmHg, sinkt rasch)</td><td>für mobile Menschen; Druck in 24 h deutlich ↓ → in der Entstauung ggf. täglich erneuern; täglich waschen, 15–20× bis 95 °C, bügeln, unter leichtem Zug aufrollen</td></tr>
    <tr><td>Langzug</td><td>100–200 %</td><td><b>hoher Ruhe-, niedriger Arbeitsdruck</b></td><td>passt sich an, hält Druck über Tage; allein für starke Kompression nicht ratsam; bei Immobilen Einschnürungen → Thromboserisiko</td></tr>
    <tr><td>Zinkleim</td><td>&lt; 10 %</td><td>sehr hoher Arbeits-, niedriger Ruhedruck</td><td>feucht angelegt, härtet aus; schnelle Entstauung; Sprunggelenk eingeschränkt; nimmt kein Exsudat auf → häufiger Wechsel (Mazeration, Geruch)</td></tr>
    <tr><td>Mehrkomponenten</td><td>Set aus 2–4 Komponenten (Polster, Kurz-, Langzug, kohäsiv)</td><td>Anlagedruck bis zum nächsten Wechsel</td><td>effektiver und einfacher als Kurzzug bei Ulcus cruris venosum; bis 7 Tage; Einmalprodukt; voluminös (Schuhe); höhere Kosten</td></tr>
  </tbody>
</table></div>
<p class="hand">Handschr. „Prüfung!“ (S. 3): Unterschied in Dehnbarkeit und Druckverhalten – <b>Kurzzug</b>: wenig dehnbar, Kompression durch Bewegung, niedriger Ruhe- + hoher Arbeitsdruck; <b>Langzug</b>: stark dehnbar, Kompression geht vom Bindenmaterial aus, hoher Ruhe- + niedriger Arbeitsdruck.</p>
<ul>
  <li><b>Druckbeständigkeit</b> hängt ab von (S. 10): Vordehnung, Bindentyp, Breite, Elastizität, Zugkraftabfall (Relaxation), Anzahl der Touren, Technik, Feuchtigkeitsaufnahme, Pflege, Zirkumferenz, Konfiguration der Extremität.</li>
  <li><b>ICC-Druckbereiche</b> für Bandagierungen (S. 10): leicht &lt; 20 · mittelstark ≥ 20–40 · stark ≥ 40–60 · sehr stark &gt; 60 mmHg. Messung mit elektronischem Druckmessgerät ca. <b>10 cm über dem Innenknöchel</b> (S. 11).</li>
  <li>Ulcus cruris venosum braucht <b>starken Druck (≥ 40–60 mmHg)</b>; unter Kurzzug deutlicher Abfall in 30 min, nach 7 h ca. 50 % (S. 11).</li>
</ul>
<p class="merke">„Nur erfolgreich, wenn ein adäquater Druck über eine angemessene Zeit wirkt.“ (S. 11)</p>
<div class="tabelle"><table>
  <caption>Bandagierungsgrundsätze (S. 12–14)</caption>
  <tbody>
    <tr><td>Prinzipien</td><td>mit Überlappung · Sprunggelenk rechtwinklig (Dorsalflexion) · Unterschenkel bis Fibulaköpfchen, Oberschenkel bis proximal · Druck nimmt distal → proximal ab · keine Druckstellen, Schnürfurchen, Schmerzen · Material/Technik nach Indikation</td></tr>
    <tr><td>Aspekte</td><td>Hautschutz (Baumwoll-Schlauchverband bis unters Knie, „links“ gewendet) · Unterpolsterung gegen Druckulzera · Pelotten (nierenförmige Schaumstoffpolster) gleichen Unebenheiten aus · <b>keine Fixierklammern („Schwiegermütter“) am Menschen</b> – Pflasterstreifen · Breite ≤ Durchmesser des Körperteils · mind. 2 Binden · Fuß in Funktionsstellung · lockere Touren am Vorfuß → Ödem · Rolle unter Zug direkt auf der Haut abrollen · zu straffe Touren → Stauung, Thrombose, Nervenschäden, Nekrosen · bei Vorfuß-/Lymphödem Zehen mitkomprimieren</td></tr>
    <tr><td>Ablauf</td><td>Beginn unterhalb des Großzehengrundgelenks, 2 Kreistouren, Ferse immer einbinden, Fehlstellungen korrigierend wickeln; danach 20–30 min bewegen</td></tr>
    <tr><td>Sigg</td><td>mind. 2 Kurzzugbinden; 1. Binde ab Großzehengrundgelenk in kleinen, 1 cm überlappenden Touren bis untere Wade (hoher Knöcheldruck); 2. Binde in Achtertouren bis unter die Kniekehle</td></tr>
    <tr><td>Pütter</td><td>Gegenwickeltechnik: mind. 2 Kurzzugbinden gegenläufig (innen→außen, außen→innen); zwei Binden übereinander → Schuhe schwierig</td></tr>
    <tr><td>Bewertung</td><td>keine Technik ist nachweislich überlegen – die beherrschte Technik anwenden; <b>wöchentlich</b> Vorfuß-, Knöchel-, Wadenumfang messen (S. 14–15)</td></tr>
  </tbody>
</table></div>

<h3>7. Medizinische Kompressionsstrümpfe (MKS) <span class="seite">S. 15–20</span></h3>
<ul>
  <li>Für Langzeit-/Dauerbehandlung, nach Ödemreduktion bzw. Ulcusabheilung, danach lebenslang als Rezidivprophylaxe; morgens vor dem Aufstehen an, abends aus; Hautpflege abends; höchster Druck in der Fesselgegend (S. 15).</li>
  <li><b>Längen:</b> Wadenstrumpf A-D · Halbschenkel A-F · Schenkel A-G · Strumpfhose A-T; je 3 Längen. Unterschenkelödem, CVI, UCV meist Wadenstrumpf. <b>„So lang wie nötig, so kurz wie möglich!“</b> (S. 15–16).</li>
  <li><b>Strickung</b> (S. 16): flachgestrickt mit Naht – hohe Stiffness/Biegesteifigkeit, kein Einschneiden in Falten, individuelle Formen (Lymphödem), immer nach Maß · rundgestrickt nahtlos – geringe Stiffness, Einrutschen in Falten möglich, begrenzte Formgebung.</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>KKL</th><th>Intensität</th><th>mmHg (kPa)</th><th>Orientierungshilfe Indikationen (S. 18)</th></tr></thead>
  <tbody>
    <tr><td>I</td><td>leicht</td><td>18–21 (2,4–2,8)</td><td>Thromboseprophylaxe, Schwere-/Müdigkeitsgefühl, Varikose ohne Ödem, geringe Schwangerschaftsvarikose, Ödeme bei kompensierter pAVK/Herzinsuffizienz (seit 2018 verordnungsfähig)</td></tr>
    <tr><td>II</td><td>mittel</td><td>23–32 (3,1–4,3)</td><td>Schwangerschaftsvarikosis, Varikose mit Ödem, nach Varizenbehandlung, <b>Rezidivprophylaxe nach Ulcus</b>, TVT, PTS, Lymphödem Stadium I, Lipödem</td></tr>
    <tr><td>III</td><td>kräftig</td><td>34–46 (4,5–6,1)</td><td><b>florides Ulcus cruris venosum</b>, Lymphödem Stadium III, Angiodysplasie, reversibles Lymphödem</td></tr>
    <tr><td>IV</td><td>sehr kräftig</td><td>≥ 49 (≥ 6,5)</td><td>irreversibles Lymphödem; selten, kaum selbst anziehbar → flachgestrickt KKL II/III bevorzugen</td></tr>
  </tbody>
</table></div>
<ul>
  <li>KKL nach <b>Ruhedruck im Fesselbereich</b> genormt; international uneinheitlich. Vermessung morgens am entstauten Bein, bei Adipösen im Stehen, jedes Bein separat (S. 17). Rund die Hälfte verordneter MKS wird nicht getragen → <b>niedrigste wirksame KKL</b> wählen (S. 17).</li>
  <li>Bei Anziehproblemen: niedrigere KKL übereinander (KKL addieren sich) oder Einzelelemente; Reißverschlüsse. Faltenfrei anziehen, keine Uhren/Ringe, kurze Nägel, Hornhaut entfernen, Hautpflege mit Urea (S. 18–19).</li>
  <li><b>An-/Ausziehhilfen</b> (zugelassene Hilfsmittel): Gleiter (klein, Ballonseide; Wundauflagen verrutschen nicht) und Gestelle (sperrig, auch im Stehen); genoppte Gummihandschuhe. Indikationen: Lähmungen, altersbedingte Kraftminderung, Arthrose/Rheuma, Adipositas permagna, Versteifungen, degenerative Handerkrankungen, eingeschränkte Motorik (S. 19).</li>
  <li><b>Pflege</b> (S. 20): täglich waschen; geeignet Handwäsche, Feinwäsche 30–40 °C im Netz, liegend trocknen; ungeeignet Vollwaschmittel, Weichspüler, Chlor, chemische Reinigung, Auswringen, Bügeln, Sonne, Heizung, Stopfen.</li>
  <li><b>Ulcus-Strumpfsysteme</b> (S. 20): dünner Unterziehstrumpf (auch nachts) + kräftiger Überstrumpf; Wundauflagen fixierbar, Stiffness ↑, Ruhedruck ≈ KKL III; geeignet in der stabilen Heilungsphase.</li>
</ul>

<h3>8. MAK und IPK <span class="seite">S. 20–23</span></h3>
<ul>
  <li><b>MAK</b> (S. 20–21): Klett-/Wrap-Bandagen; Druck per Klett einstellbar (auch durch Betroffene), z. T. über Messscheibe kontrollierbar; jederzeit nachjustierbar bei Ödemreduktion; hoher Arbeits-, niedriger Ruhedruck (wie Kurzzug); Entstauungsphase; Längen kurz/normal/lang; allein oder mit MKS; bis zu <b>6 Monate</b> nutzbar; noch kein Klassifikationssystem.</li>
  <li><b>IPK</b> (S. 21–23): apparative Wechseldrücke in Luftkammern, sequenziell distal → proximal; simuliert Muskelpumpe; v. a. für teil-/immobile Menschen; Hilfsmittel Produktgruppe 17; <b>ersetzt weder Lymphdrainage noch Kompression</b>; 30–60 min, 1–3× täglich.</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>IPK</th><th>Inhalt (Heft)</th></tr></thead>
  <tbody>
    <tr><td>soll</td><td>Thromboembolieprophylaxe, wenn keine medikamentöse Prophylaxe möglich</td></tr>
    <tr><td>sollte</td><td>therapieresistentes Ulcus cruris venosum · schwere CVI C4b–C6 (CEAP) · Lymphödem additiv · pAVK mit stabiler Claudicatio/kritischer Ischämie ohne Übungs-/Rekonstruktionsmöglichkeit</td></tr>
    <tr><td>kann</td><td>posttraumatische Ödeme, therapieresistente venöse Ödeme, Lipödem, Lymphödem additiv, Hemiplegie mit Ödem, Thromboseprophylaxe zusätzlich</td></tr>
    <tr><td>kontraindiziert</td><td>dekompensierte Herzinsuffizienz, ausgedehnte Thrombophlebitis/Thrombose(-verdacht), akutes Erysipel, akute Phlegmone, Kompartmentsyndrom, schwere Hypertonie, okkludierende Prozesse im Lymphabstrom, ausgedehntes Weichteiltrauma, ausgeprägte Neuropathie, blasenbildende Dermatosen</td></tr>
    <tr><td>Sicherheit</td><td>textiler Hautschutz unter der Manschette, Hautinspektion; bei schlanken/kachektischen Menschen Polsterung von Dispositionsstellen</td></tr>
  </tbody>
</table></div>

<h3>9. Bewegung, Übungen, Leitlinienempfehlungen <span class="seite">S. 11, 23–30</span></h3>
<p class="merke"><b>Eigenbewegung ist stets Bestandteil einer effektiven Kompressionstherapie</b> – Wirkung nur bei Sprunggelenksbeweglichkeit und normalem Abrollen (S. 24). Übungen: Fußkreisen, Fußwippen, Zehenkrallen; kontrolliertes Gehtraining, Nordic Walking; Bettlägerige: Drainagebeutel/Luftballon-Konstruktion am Bettende.</p>
<div class="tabelle"><table>
  <caption>Übung II (Lösung S. 30)</caption>
  <thead><tr><th></th><th>Kurzzug</th><th>Mehrkomp.</th><th>Kompr.-strumpf</th><th>Ulcus-Strumpf</th><th>MAK</th></tr></thead>
  <tbody>
    <tr><td>UCV Entstauung</td><td>ja</td><td>ja</td><td>nein</td><td>nein</td><td>ja</td></tr>
    <tr><td>UCV Erhaltung</td><td>nein</td><td>nein</td><td>ja</td><td>ja</td><td>nein</td></tr>
    <tr><td>UCV Prävention</td><td>nein</td><td>nein</td><td>ja</td><td>nein</td><td>nein</td></tr>
    <tr><td>Lymphödem Entstauung</td><td>ja</td><td>ja</td><td>nein</td><td>nein</td><td>ja</td></tr>
    <tr><td>Lymphödem Erhaltung</td><td>nein</td><td>nein</td><td>ja</td><td>ja</td><td>nein</td></tr>
  </tbody>
</table></div>
<p><b>Übung I</b> (Lösung S. 30): Entstauung bei mobilen Menschen mit UCV → Kurzzugbinden und Mehrkomponentensysteme (hoher Arbeits-, niedriger Ruhedruck); Mehrkomponenten effektiver, einfacher, halten Druck bis zum Wechsel, besserer Tragekomfort, aber voluminös; Kurzzug verliert rasch Druck, verrutscht, ist wiederverwendbar. Erhaltung → Kompressionsstrümpfe oder Ulcus-Strumpfsysteme; Beratung: Kompression auch nach Abheilung nötig, da Gefäße sich wieder ausdehnen und Klappen nicht schließen → Rezidive; nach Abheilung MKS meist KKL II lebenslang.</p>
<ul>
  <li><b>Leitlinienempfehlungen</b> (Auswahl, S. 25–29): Aufpolsterung bei kleinen Radien/Kachexie (Laplace) · flachgestrickt bei großen Umfangsänderungen/Gewebefalten · MKS gemäß RAL GZG 387 und Richtlinie 93/42 EWG, Zweizugstrumpf · nach Entstauung MKS als Alternative zum PKV prüfen; bei UCV zweilagige Ulcus-MKS · Vermessung ödemfrei · niedrigste wirksame KKL · Nutzungsdauer in der Regel <b>6 Monate</b>, Erstversorgung mit Zweitverordnung · Binden mind. 15× waschbar · bei TVT <b>sofort</b> Kompression, mind. <b>6 Monate</b> fortsetzen.</li>
  <li><b>Rezept</b> (S. 26): Anzahl, Strumpflänge, KKL, Indikation/Diagnose, Hilfsmittelnummer, ggf. Maßanfertigung, Fußspitze offen/geschlossen; ggf. Zusätze, flachgestrickt, Stiffness, Befestigung, Wechselversorgung.</li>
  <li><b>Adhärenz:</b> ausführliche Aufklärung über Sinn, Nebenwirkungen, Anwendung und Begleitmaßnahmen (Hautpflege, Bewegung) (S. 29).</li>
</ul>
<p class="warnung"><b>Sofort entfernen und kontrollieren</b> bei (S. 29): Blau-/Weißfärbung der Zehen, Missempfindungen/Taubheit, zunehmenden Schmerzen, Kurzatmigkeit, Schweißausbrüchen, akuten Bewegungseinschränkungen.</p>

/*

Lernapp.thema({
  id: "hautintegritaet",
  titel: "Expertenstandard Erhaltung und Förderung der Hautintegrität in der Pflege",
  kurz: "Hautintegrität",
  quelle: "murimed-Lernheft Modul II",
  hinweis:
    "Quelle ist ausschließlich das Lernheft; Seitenzahlen in Klammern. Das Heft enthält keine handschriftlichen Notizen oder Prüfungsmarkierungen, daher keine ★. Die im Heft zitierte Primärquelle (v. a. DNQP 2023) wurde nicht separat geprüft.",

  karten: [
    { k: "Grundlagen", f: "Wie definiert der Expertenstandard Hautintegrität?",
      a: "„Kombination einer intakten Hautstruktur und einer Funktionsfähigkeit, welche die Struktur der Haut erhält.“ (DNQP 2023)", s: "S. 4" },
    { k: "Grundlagen", f: "Welches Ziel verfolgt der Expertenstandard?",
      a: "Jeder Mensch mit pflegerischem Unterstützungsbedarf und adressierten hautbezogenen Risiken oder Problemen erhält pflegerische Interventionen, welche die Hautintegrität erhalten und fördern. Vor allem präventiver Charakter.", s: "S. 3–4" },
    { k: "Grundlagen", f: "Eckdaten zum Expertenstandard?",
      a: "12. Expertenstandard des DNQP; Entscheidung 2020; wissenschaftliche Leitung Univ.-Prof. Dr. Jan Kottner; Expertengruppe: neun Pflegefachkräfte, eine Dermatologin, ein Pharmakologe.", s: "S. 2, 4" },
    { k: "Grundlagen", f: "Welche Themen deckt der Standard ab?",
      a: "Prävention von IAD, Windeldermatitis, Intertrigo, Skin Tears · Behandlung früher Formen von IAD, WD, Intertrigo ohne sichtbaren Barriereverlust · Behandlung von Xerosis cutis. Keine Aussagen zu anderen Dermatosen inkl. Wunden.", s: "S. 3–5" },
    { k: "Definitionen", f: "Was sind IAD und Windeldermatitis?",
      a: "Formen der irritativen Kontaktdermatitis durch längeren Kontakt mit Feuchtigkeit (Urin und/oder Stuhl), meist infolge Inkontinenz. WD bei Säuglingen/Kleinkindern; IAD bei älteren Kindern, Jugendlichen, Erwachsenen.", s: "S. 5" },
    { k: "Definitionen", f: "Was ist Intertrigo?",
      a: "Eine Form der irritativen Kontaktdermatitis in Hautfalten, insbesondere durch kontinuierliche Reibung in Verbindung mit Feuchtigkeit.", s: "S. 5" },
    { k: "Definitionen", f: "Was sind Skin Tears?",
      a: "Traumatische Hauteinrisse, v. a. an Armen und Beinen; die Epidermis löst sich von der Dermis und ggf. tieferem Gewebe. Besonders fragile, dünne Haut im Alter ist prädisponiert.", s: "S. 5" },
    { k: "Definitionen", f: "Was ist Xerosis cutis?",
      a: "Trockene Haut mit leichter bis starker Schuppung, gekennzeichnet durch Juckreiz und Entzündungssymptome (Austrocknungsekzem).\nGlossar: entsteht meist durch Entfernung oder Austrocknung der Epidermis.", s: "S. 5, 37" },
    { k: "Grundlagen", f: "Für wen gilt der Standard, wer wendet ihn an?",
      a: "Zielgruppe: Menschen jeden Alters (Reifgeborene bis Hochaltrige, nicht Frühgeborene) in professioneller Pflege mit hautbezogenem Risiko; Angehörige als Ressource.\nAnwender: Pflegefachkräfte; nicht bei reinem Behandlungspflege-Auftrag; Delegation an Hilfskräfte möglich.", s: "S. 5–6" },
    { k: "Grundlagen", f: "Nenne die vier Grundüberlegungen zur Umsetzung.",
      a: "1. Verschiedene hautbezogene Risiken in einem Dokument · 2. grundlegendes Wissen zu Hautintegrität/Hautpflege · 3. Anatomie/Physiologie so detailliert wie nötig, Fokus auf Produkte · 4. berufsgruppen- und sektorübergreifende Kommunikation und Zusammenarbeit.", s: "S. 6–7" },
    { k: "Aufbau", f: "Nenne die fünf Phasen des Standards.",
      a: "1. Risikoeinschätzung\n2. Maßnahmenplanung\n3. Information, Schulung und Beratung\n4. Maßnahmendurchführung und Koordination\n5. Evaluation", s: "S. 7" },
    { k: "Aufbau", f: "Struktur-, Prozess- und Ergebniskriterien?",
      a: "Struktur: Voraussetzungen – Was muss die Einrichtung vorhalten, was muss die Pflegefachkraft wissen/können?\nProzess: Was muss wann wie getan werden?\nErgebnis: Was muss vorliegen, um die Phase abzuschließen?", s: "S. 8" },
    { k: "Phase 1", f: "Was fordern S1, P1a, P1b und E1?",
      a: "S1: Kompetenz zur Identifikation · P1a: erste Einschätzung zu Beginn des Auftrags · P1b: bei Risiken vertiefte Einschätzung, Wiederholung individuell/anlassbezogen, ggf. weitere Expertise · E1: aktuelle, systematische Einschätzung liegt vor.", s: "S. 9–10" },
    { k: "Phase 1", f: "Welche Beobachtungen führen zur vertieften Einschätzung?",
      a: "Trockene, schuppige, gerötete oder feuchte Haut, Juckreiz, Schmerzen. Werden Fragen/Beobachtungen bejaht → vertiefte Einschätzung (Assessment). Auch, wenn Betroffene/Angehörige keine Auskunft geben können.", s: "S. 11–12" },
    { k: "Phase 1", f: "Welche Risikogruppen nennt das Heft?",
      a: "Säuglinge (< 1 Jahr), ältere Menschen, Inkontinenz, Diabetes mellitus, chronisch venöse Insuffizienz, Adipositas, eingeschränkte Mobilität, Einnahme von z. B. Diuretika oder Kortikosteroiden.", s: "S. 11" },
    { k: "Phase 1", f: "Welche Fragen eignen sich für die erste Einschätzung?",
      a: "Hautprobleme früher/aktuell? Reinigung/Pflege und Produkte? Hautveränderung? Kontaktallergien? Starkes Schwitzen? Wunde Stellen? Spannungsgefühl? Blutergüsse/Einreißen? Juckreiz/Schuppen? Brennen/Schmerz?", s: "S. 12" },
    { k: "Phase 1", f: "Was erfasst die vertiefte Einschätzung?",
      a: "Risiken/Probleme (Selbstpflege, Ursachen, Unterstützungsbedarf) · Unterstützung bei Ausscheidung/Waschen · Ess-/Trinkgewohnheiten · familiäre/berufliche Faktoren (Allergien, hautschädigende Substanzen) · Ressourcen · Lebensqualität (Kontakte, Kleidung, Schlaf).", s: "S. 13" },
    { k: "Phase 1", f: "Welche klinischen Zeichen werden bei der Hautinspektion beobachtet?",
      a: "Farbe (rot, bräunlich, bläulich), Feuchtigkeit, Erhabenheiten (Papeln, Bläschen), Schuppen, Erosionen; Symptome: Schmerz, Juckreiz, Brennen, Spannungsgefühl; durchblutungsbedingt: glänzende, haarlose Unterschenkel, Ödeme (Palpation).", s: "S. 13–14" },
    { k: "Phase 1", f: "Besonderheiten der Inspektion bei Neugeborenen und Säuglingen?",
      a: "Vernix caseosa, Storchenbiss, Kopfkneis bilden sich selbst zurück. Anhaltend trockene/juckende Haut, Milchschorf engmaschig kontrollieren (atopisches Ekzem). Säuglinge: Windelbereich; WD oft mit Pilz → auch Mundraum prüfen.", s: "S. 14" },
    { k: "Phase 1", f: "Worauf achten bei IAD-, Skin-Tear- und Intertrigo-Risiko?",
      a: "IAD: perineal, perianal, Leiste – Rötung, Erosion, Brennen.\nSkin Tears: dünne Haut an Armen, Beinen, Handrücken (Ältere, Kortison).\nIntertrigo: große Hautfalten – Rötung, Erosion, Sekundärinfektion. Dunkle Haut: Palpation!", s: "S. 14" },
    { k: "Phase 1", f: "Wie oft wird inspiziert – gibt es Instrumente?",
      a: "Individuell oder anlassbezogen (Diarrhoe, Schwitzen, neue Medikation); ambulant bei Problemen mind. einmal pro Woche. Keine eindeutige Empfehlung für standardisierte Instrumente (Skin Tears, IAD, WD), aber Vorteil für Monitoring.", s: "S. 15" },
    { k: "Phase 1", f: "Was wird dokumentiert?",
      a: "Zeitnah und fachlich korrekt; Fokus auf Hautläsionen und klinischen Zeichen, nicht auf Diagnosestellung. Fotodokumentation unter Datenschutz. Beispiele: Risiko für Intertrigo, Skin Tears, IAD/WD; Xerosis mit Schuppen, Erythem, Juckreiz.", s: "S. 15" },
    { k: "Phase 1", f: "Trockene Haut – sichtbare und nicht sichtbare Symptome? (Übung I)",
      a: "Sichtbar: sehr trockene Haut, große Schuppenbildung, gerötete/gereizte Stellen (Erytheme), Exkoriationen.\nNicht sichtbar: Juckreiz, Brennen, Spannungsgefühl, Schmerzen.", s: "S. 38" },
    { k: "Phase 1", f: "Wie werden Ziele formuliert?",
      a: "Gemeinsam mit dem Pflegeempfänger, individuell; z. B. Minderung von Juckreiz, Brennen, Schmerz, Spannungsgefühl; Verhinderung von Intertrigo, Schuppung, Rötung, Mazeration. Allgemeines Ziel: Hautintegrität erhalten/fördern, Wohlbefinden berücksichtigen.", s: "S. 16" },
    { k: "Phase 2", f: "Was fordern S2a, S2b, P2 und E2?",
      a: "S2a: Kompetenz zur Planung und Koordination · S2b: Verfahrensregelung der Einrichtung · P2: gemeinsame Planung mit Betroffenen/Angehörigen · E2: individueller Maßnahmenplan unter Berücksichtigung von Selbstmanagement und Ressourcen.", s: "S. 17" },
    { k: "Phase 2", f: "Was enthält die Maßnahmenplanung?",
      a: "Pflegerische Maßnahmen zu Reinigung und Pflege der Haut · ggf. Kooperation mit anderen Berufsgruppen · Inhalte und zeitliche Planung von Information, Beratung, Schulung · individuelle Zeitintervalle für Überprüfung/Evaluation.", s: "S. 17" },
    { k: "Phase 2", f: "Was muss die Verfahrensregelung enthalten?",
      a: "Vorgehen bei Risiken/Problemen · Beschreibung des Vorgehens (Leitfaden, Ablaufdiagramm) · Hinweise zum Dokumentationssystem · Einbeziehung weiterer Berufsgruppen · altersspezifische Reinigung, Hautmittel, Beratungs-/Schulungsangebote.", s: "S. 18" },
    { k: "Phase 2", f: "Was ist bei der Planung im ambulanten Bereich zu beachten?",
      a: "Pflegebedürftige tragen die Kosten für Hautpflegeprodukte selbst (oft nicht erstattungsfähig). Räumliche/materielle Gegebenheiten (Badewanne, Dusche) und vorhandene Mittel auf Angemessenheit prüfen.", s: "S. 18" },
    { k: "Phase 2", f: "Grundsatz bei Xerosis- oder Skin-Tear-Risiko für die Planung?",
      a: "Wasser sparsam verwenden und Haut vorsichtig trockentupfen. Schädliche Gewohnheiten (z. B. häufiges heißes Baden) benennen und beraten; Präferenzen und Wissen der Betroffenen stärken Selbstmanagement und Akzeptanz.", s: "S. 18–19" },
    { k: "Phase 3", f: "Informieren, Schulen, Beraten – Unterschiede?",
      a: "Informieren: Wissen zur Verfügung stellen.\nSchulen: Wissen, Fähigkeiten, Bewältigungsstrategien, Selbstmanagement, Pflegetechniken vermitteln.\nBeraten: auf Basis einer Problemanalyse gemeinsame Lösungen und Ziele erarbeiten.", s: "S. 20" },
    { k: "Phase 3", f: "Was fordern S3, P3a, P3b und E3?",
      a: "S3: Kompetenz zu Information/Schulung/Beratung · P3a: informiert, schult, berät, fördert Selbstmanagement · P3b: bei speziellem Bedarf weitere Expertise · E3: Betroffene/Angehörige kennen Bedeutung intakter Haut und wirken mit.", s: "S. 20" },
    { k: "Phase 3", f: "Welche Themen muss die Pflegekraft vermitteln können?",
      a: "Anatomie/Physiologie der Haut · Wirkung/Nebenwirkung der Reinigung · Hautpflege, Hautschutz, Hautmittel · krankhafte vs. nicht krankhafte Veränderungen · Risikofaktoren IAD, WD, Skin Tears · Ätiologie bis Therapie der Hautprobleme · zielgruppenspezifische Unterschiede.", s: "S. 20–21" },
    { k: "Phase 3", f: "Wo findet Beratung ambulant statt? Wann weitere Expertise?",
      a: "Bei Besuchen nach § 37 Abs. 3 SGB XI oder im Erstgespräch; Pflegekurse nach § 45 SGB XI. Weitere Expertise: Arzt/Dermatologe (anhaltende Xerosis, unklare Läsionen), Kontinenz-/Stomaexperten, Wundversorger, Ernährungsberater.", s: "S. 22" },
    { k: "Phase 4", f: "Was fordern S4a, S4b, P4 und E4?",
      a: "S4a: aktuelles zielgruppenspezifisches Wissen und Umsetzungskompetenz · S4b: Einrichtung stellt adäquate Hautmittel/Materialien · P4: Anwendung in Abstimmung mit Betroffenen · E4: Maßnahmen gemäß Planung und Bedarf durchgeführt.", s: "S. 23" },
    { k: "Phase 4", f: "Welche Produkteigenschaften sollen benannt werden?",
      a: "Statt „Duschbad, Creme, Salbe, Lotion“: pH-Wert und ob hydrophil oder lipophil. Hinweise: „Fettsalbe“, W/O → lipophil; O/W → hydrophil; leicht mit Wasser abwischbar → eher hydrophil.", s: "S. 23" },
    { k: "Phase 4", f: "Wie geht man mit Unverträglichkeiten um?",
      a: "Auf Duftstoffe, Feuchthaltefaktoren (z. B. Urea) achten; Juckreiz, Rötung, Entzündung möglich → bei Verdacht nicht mehr auftragen. Inhaltsstoffe per App COSMILE® (EAN-Barcode-Scan).", s: "S. 24" },
    { k: "Phase 4", f: "Hautreinigung bei Neugeborenen und Säuglingen?",
      a: "Erstes Wannenbad frühestens ab Tag 2; Vernix caseosa nicht entfernen; Wannenbad ohne Waschlappen, 37 °C, 5–10 min, alle paar Tage; Zusätze sparsam, pH 5,5–7,0; trocken tupfen; tägliche Inspektion; Raum 26–28 °C.", s: "S. 24–25" },
    { k: "Phase 4", f: "Hautreinigung bei Erwachsenen mit Risiken?",
      a: "Vollbäder vermeiden/begrenzen; lauwarm duschen; pH < 7; tupfen statt reiben; keine alkalischen Seifen; ggf. No-rinse-Tücher; Einmalwaschlappen; warmes Handtuch ohne Nutzen; lipophile Hautmittel mind. 1× täglich.", s: "S. 25" },
    { k: "Phase 4", f: "Maßnahmen bei Xerosis cutis?",
      a: "Wasser sparsam (selektiv Achseln, Falten, Genitalbereich); Reinigungsmittel sparsam; lipophile Hautmittel zum Verbleib, verstärkt durch Urea, Laktat; je trockener, desto häufiger. CVI: nach Ausziehen der MKS pH < 7 reinigen, lipophil pflegen.", s: "S. 25–26" },
    { k: "Phase 4", f: "Fußpflege bei Diabetes mellitus?",
      a: "pH-neutrale Hautmittel, tägliche Fußinspektion; Zehenzwischenräume sorgfältig trocknen; Fußbäder kritisch (Mazeration, Verbrennung, Infektion); lipophil mit Urea, Laktat oder Glycerin; Zehenzwischenräume beim Eincremen aussparen.", s: "S. 25–26" },
    { k: "Phase 4", f: "Maßnahmen bei IAD-Risiko?",
      a: "Weich, behutsam reinigen; Stuhlreste mit feuchtem Tuch rehydrieren; Inkontinenzmaterial mit Superabsorber regelmäßig wechseln; Hautschutz zum Verbleib; viskose Pasten (Zinkpaste) vermeiden; bei akuter Diarrhoe weiche Zinkpaste vorübergehend, sehr sparsam.", s: "S. 26" },
    { k: "Phase 4", f: "Maßnahmen bei Windeldermatitis-Risiko?",
      a: "Behutsam reinigen; Windel bei Nässe, spätestens nach 3–4 Stunden wechseln; Superabsorber, gute Passform; möglichst lange ohne Windel liegen lassen; lipophile Schutzmittel für Säuglinge deklariert, erst dünn auftragen.", s: "S. 26" },
    { k: "Phase 4", f: "Maßnahmen bei Intertrigo-Risiko?",
      a: "No-rinse-Produkte, lauwarmes Wasser; Reibung vermeiden, tupfen; keine eindeutige Empfehlung für Zinköl; Schutzmittel dünn, nicht bei Pilzbefall; Haut-zu-Haut-Kontakt vermeiden (Leinen/Baumwolle einlegen, 2× tgl. wechseln); atmungsaktive Kleidung.", s: "S. 26–27" },
    { k: "Phase 4", f: "Maßnahmen bei Skin-Tear-Risiko?",
      a: "Vorsichtig reinigen, tupfen; pH 5–7; ab > 75 Jahren mind. 2× täglich lipophile Pflege; keine klebenden Verbandmittel (Silikon, Schlauchverband, Mullbinden); Sturzprophylaxe, Schienbein-/Armschoner, lange Kleidung, kurze Nägel.", s: "S. 27" },
    { k: "Phase 5", f: "Was fordern S5, P5 und E5?",
      a: "S5: Kompetenz, die Wirksamkeit zu beurteilen · P5: Beurteilung in individuellen Zeitabständen und anlassbezogen · E5: Die Hautintegrität ist gefördert und erhalten.", s: "S. 28" },
    { k: "Phase 5", f: "Was wird evaluiert – und was, wenn Ziele verfehlt werden?",
      a: "Zeichen/Schweregrade (Trockenheit, IAD, WD, Intertrigo, Skin Tears), Wohlbefinden, Juckreiz, Brennen, Schmerz. Verfehlt → Gründe untersuchen (vorübergehende Veränderungen, unrealistische Ziele), anpassen, Akzeptanz und Beratungsbedarf prüfen.", s: "S. 28" },
    { k: "Prozess", f: "Wann führt die Evaluation zurück zur vertieften Einschätzung?",
      a: "Bei Veränderungen wie Diarrhoe, verstärktem Schwitzen oder neuer Medikation mit Einfluss auf die Haut sowie wenn die Maßnahmen nicht positiv wirken. Nicht akzeptiert → erneut informieren, beraten, schulen.", s: "S. 34" },
    { k: "Reinigung", f: "Was sind Surfactants und warum schaden „Seifen“?",
      a: "Stoffe, die lipophile und hydrophile Moleküle verbinden. „Seifen“ entfernen den Hydro-Lipid-Film, schädigen das Stratum corneum, lösen Entzündung aus und erhöhen den pH-Wert.", s: "S. 29" },
    { k: "Reinigung", f: "Was ist der Säureschutzmantel? Welcher pH ist physiologisch?",
      a: "Saurer pH der Hautoberfläche je nach Areal 4–6 (Glossar: 4,5–6); trägt zum Zusammenhalt der Hornzellschicht bei und erhält die mikrobielle Besiedlung. Zerstörung → Reizungen, pathologische Keimbesiedlung.", s: "S. 29, 37" },
    { k: "Pflege", f: "Kosmetikum, Arzneimittel, Medizinprodukt?",
      a: "Kosmetikum (EU-VO 1223/2009): reinigen, schützen, pflegen, parfümieren.\nArzneimittel: Heilung/Linderung/Verhütung; pharmakologisch, immunologisch, metabolisch.\nMedizinprodukt: nicht pharmakologisch, kein Stoffwechseleingriff.", s: "S. 30" },
    { k: "Pflege", f: "O/W vs. W/O – Creme vs. Lotion?",
      a: "Öl-in-Wasser: hydrophiler Anteil höher, mit Wasser mischbar, eher flüssig.\nWasser-in-Öl: lipophiler Anteil höher.\nHalbfeste Emulsion → Creme; flüssigere → Lotion.", s: "S. 30, 36–37" },
    { k: "Pflege", f: "Wonach soll ein Hautmittel ausgewählt werden?",
      a: "Nach Polarität und Verteilbarkeit statt Emulsionstyp: lipophil → trockene Haut · hydrophil → feuchte Haut · Urea, Laktat, Glycerin → sehr trockene Haut · großflächig → dünnflüssig · kleinflächig → dickflüssig.", s: "S. 31" },
    { k: "Pflege", f: "Unerwünschte Wirkungen von Hautmitteln?",
      a: "Hydrophile Produkte → Überwässerung, Lipidschicht gestört · auf normaler Haut Irritationsanfälligkeit ↑ · Pflanzenöle reizen · Konservierungs- und Duftstoffe irritierend/allergisierend, schon in niedriger Konzentration; pH ↑.", s: "S. 32–33" },
    { k: "Pflege", f: "Produkte bei sebostatischer (trockener) Haut? (Übung II)",
      a: "Tägliche Hautpflege · W/O-Produkte · Urea oder Kollagen (binden Feuchtigkeit) · Omega-3-6-9-Fettsäuren (Elastizität, Widerstandsfähigkeit) · Lipolotionen · Harnstoff lindert Juckreiz, reduziert Verhornung.", s: "S. 38" },
    { k: "Glossar", f: "Bulla, Vesikula, Papel, Plaque, Makula?",
      a: "Bulla: Flüssigkeit > 1 cm · Vesikula: ≤ 1 cm · Papel: erhaben, solide ≤ 1 cm · Plaque: tastbar > 1 cm · Makula: flach, nicht tastbar ≥ 1 cm · Nodus: fest > 1 cm in Dermis/Subcutis.", s: "S. 36–37" },
    { k: "Glossar", f: "Erosion, Exkoriation, Ulcus?",
      a: "Erosion: Verlust eines Teils oder der gesamten Epidermis.\nExkoriation: Epidermis + Teil der Dermis (Kratzen/exogene Verletzung).\nUlcus: Epidermis in voller Dicke + mind. Teil der Dermis, bis Subcutis möglich.", s: "S. 36–37" },
    { k: "Zusammenfassung", f: "Kernaussage der Zusammenfassung?",
      a: "Der Standard setzt nicht auf viele Produkte, sondern auf Maßnahmen und Mischverhältnisse – „weniger ist mehr“. Frühe Identifikation, rechtzeitige Reinigung/Pflege, regelmäßige Evaluation und Beratung verbessern oder vermeiden Hautprobleme.", s: "S. 35" }
  ],

  zusammenfassung: `
<h3>1. Hintergrund und Ziel <span class="seite">S. 2–5</span></h3>
<ul>
  <li>Haut = größtes Organ; Schutz vor Kälte, Wärme, mechanischen Reizen, UV, Erregern; Kommunikation, Selbst- und Fremdbild. Hautpflege ist <b>Kernaufgabe der Pflege</b> (S. 2).</li>
  <li>2020 Entscheidung für einen einheitlichen Standard; wissenschaftliche Leitung Univ.-Prof. Dr. Jan Kottner; <b>12. Expertenstandard des DNQP</b>; Expertengruppe aus neun Pflegefachkräften, einer Dermatologin und einem Pharmakologen (S. 2, 4).</li>
  <li>Vor allem <b>präventiver Charakter</b> – soll keine manifeste Hauterkrankung heilen. Eigene Routinen der Betroffenen nicht durch Zwang ändern; erprobte Strategien berücksichtigen (S. 3).</li>
</ul>
<p class="merke"><b>Hautintegrität</b> = „Kombination einer intakten Hautstruktur und einer Funktionsfähigkeit, welche die Struktur der Haut erhält.“ (S. 4)<br><b>Ziel:</b> Jeder Mensch mit pflegerischem Unterstützungsbedarf und adressierten hautbezogenen Risiken oder Problemen erhält pflegerische Interventionen, welche die Hautintegrität erhalten und fördern (S. 4).</p>
<p><b>Themen</b> (S. 3–4): Prävention von IAD, Windeldermatitis, Intertrigo und Skin Tears · Behandlung früher Formen von IAD, WD, Intertrigo, solange kein sichtbarer Barriereverlust vorliegt · Behandlung von Xerosis cutis. Keine Aussagen zu anderen Dermatosen inkl. Wunden.</p>
<div class="tabelle"><table>
  <thead><tr><th>Begriff</th><th>Definition (Heft)</th></tr></thead>
  <tbody>
    <tr><td>IAD / WD</td><td>Formen der irritativen Kontaktdermatitis durch längeren Kontakt mit Feuchtigkeit (Urin und/oder Stuhl), meist infolge Inkontinenz; <b>WD</b> bei Säuglingen und Kleinkindern, <b>IAD</b> bei älteren Kindern, Jugendlichen, Erwachsenen</td></tr>
    <tr><td>Intertrigo</td><td>irritative Kontaktdermatitis in <b>Hautfalten</b> durch kontinuierliche Reibung plus Feuchtigkeit</td></tr>
    <tr><td>Skin Tears</td><td>traumatische Hauteinrisse, v. a. an Armen und Beinen; Epidermis löst sich von der Dermis (ggf. auch tiefer); fragile, dünne Altershaut prädisponiert</td></tr>
    <tr><td>Xerosis cutis</td><td>trockene Haut mit leichter bis starker Schuppung, gekennzeichnet durch Juckreiz und Entzündungssymptome (Austrocknungsekzem)</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Zielgruppe:</b> Menschen jeden Alters (Reifgeborene bis Hochaltrige, außer Frühgeborene) in professioneller Pflege mit identifiziertem hautbezogenem Risiko/Problem; ambulant bei entsprechendem Auftrag; Angehörige als Ressource. <b>Anwender:</b> Pflegefachkräfte (Häuslichkeit, Langzeitpflege, Krankenhaus); nicht anzuwenden, wenn der Auftrag nur Behandlungspflege betrifft; Delegation an Pflegehilfskräfte möglich, Fachkraft steuert (S. 5–6).</li>
  <li><b>Vier Grundüberlegungen</b> (S. 6–7): 1. verschiedene hautbezogene Risiken in einem Dokument (Pflegebedürftige haben oft mehrere) · 2. grundlegendes Wissen zu Hautintegrität/Hautpflege (bisher zu wenig in Ausbildung) · 3. Anatomie/Physiologie so detailliert wie nötig, Fokus auf Produkte zu Reinigung/Pflege · 4. berufsgruppen- und sektorübergreifende Kommunikation und Zusammenarbeit (Ressourcen: Führungsmanagement; Wissen aktuell halten: Pflegefachkräfte).</li>
</ul>

<h3>2. Struktur: fünf Phasen mit S-, P-, E-Kriterien <span class="seite">S. 7–9</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Phase</th><th>Struktur (S)</th><th>Prozess (P)</th><th>Ergebnis (E)</th></tr></thead>

    <tr><td>1 Risikoeinschätzung</td><td>S1 Kompetenz zur Identifikation von Menschen mit hautbezogenen Risiken und Problemen</td><td>P1a <b>erste Einschätzung</b> zu Beginn des Auftrags · P1b bei Risiken/Problemen <b>vertiefte Einschätzung</b>, Wiederholung individuell und anlassbezogen; ggf. weitere Expertise</td><td>aktuelle, systematische Einschätzung der individuellen Risiken und Probleme</td></tr>
    <tr><td>2 Maßnahmenplanung</td><td>S2a Kompetenz zur Planung/Koordination · S2b Verfahrensregelung der Einrichtung</td><td>gemeinsame Planung mit dem Menschen und ggf. Angehörigen</td><td>individueller Maßnahmenplan unter Berücksichtigung von Selbstmanagementkompetenzen und Ressourcen</td></tr>
    <tr><td>3 Information, Schulung, Beratung</td><td>S3 Kompetenz zu Information, Schulung, Beratung</td><td>P3a informiert, schult, berät, fördert Selbstmanagement · P3b bei speziellem Bedarf weitere Expertise</td><td>Betroffene/Angehörige kennen Bedeutung intakter Haut und wirken mit</td></tr>
    <tr><td>4 Durchführung und Koordination</td><td>S4a aktuelles zielgruppenspezifisches Wissen · S4b Einrichtung stellt adäquate Hautmittel und Materialien</td><td>Maßnahmen in Abstimmung mit Betroffenen/Angehörigen anwenden</td><td>Maßnahmen entsprechend Planung und Bedarf/Bedürfnissen durchgeführt</td></tr>
    <tr><td>5 Evaluation</td><td>S5 Kompetenz, die Wirksamkeit zu beurteilen</td><td>Wirksamkeit individuell und anlassbezogen beurteilen</td><td><b>Hautintegrität ist gefördert und erhalten</b></td></tr>
  </tbody>
</table></div>
<p><b>Struktur</b> = Voraussetzungen (Was muss die Einrichtung vorhalten, was muss die Pflegefachkraft wissen/können?) · <b>Prozess</b> = Handlungen (Was muss wann wie getan werden?) · <b>Ergebnis</b> = Was muss vorliegen, um die Phase abzuschließen? (S. 8). Kompetenzbegriff nach DQR: Fachkompetenz und personale Kompetenz (S. 11).</p>

<h3>3. Phase 1 – Risikoeinschätzung <span class="seite">S. 10–16</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Schritt</th><th>Inhalt (Heft)</th></tr></thead>
  <tbody>
    <tr><td>1 erste Einschätzung (Screening)</td><td>systematisch während der Anamnese vor Versorgungsbeginn; Beobachtung, Inspektion, Palpation. Anlass für vertiefte Einschätzung: <b>trockene, schuppige, gerötete, feuchte Haut, Juckreiz, Schmerzen</b></td></tr>
    <tr><td>2 vertiefte Einschätzung (Assessment)</td><td>Risiken/Probleme (Selbstpflegefähigkeiten, Ursachen, Unterstützungsbedarf) · Unterstützungsbedarf bei Ausscheidung/Waschen · Ess-/Trinkgewohnheiten (Mangelernährung, Übergewicht, Trinkverhalten) · familiäre/berufliche Faktoren (Kontaktdermatitis, Allergien, hautschädigende Substanzen) · Ressourcen · Lebensqualität (soziale Kontakte, Kleiderwahl, Schlaf, Wohlbefinden)</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Risikogruppen</b> (S. 11): Säuglinge (&lt; 1 Jahr), ältere Menschen, Inkontinenz, Diabetes mellitus, CVI, Adipositas, eingeschränkte Mobilität, Einnahme z. B. von Diuretika oder Kortikosteroiden.</li>
  <li><b>Fragen an Betroffene</b> (S. 12): frühere/aktuelle Hautprobleme · Reinigung/Pflege und Produkte · Hautveränderung · Kontaktallergien · starkes Schwitzen · wunde Stellen · Spannungsgefühl · Blutergüsse/Einreißen · Juckreiz/Schuppen · Brennen/Schmerz.</li>
  <li><b>Werden eine oder mehrere Fragen bzw. Beobachtungen bejaht → vertiefte Einschätzung.</b> Können Betroffene/Angehörige keine Auskunft geben, ebenfalls vertiefte Einschätzung (S. 12). Kompensieren Angehörige die Probleme, dokumentieren und vertiefte Einschätzung beenden (S. 13).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Hautinspektion (S. 13–14)</th><th></th></tr></thead>
  <tbody>
    <tr><td>klinische Zeichen</td><td>Farbe (rot, bräunlich, bläulich), Feuchtigkeit, Erhabenheiten (Papeln, Bläschen), Schuppen, Erosionen; Symptome: Schmerzen, Juckreiz, Brennen, Spannungsgefühl; durchblutungsbedingt: glänzende, haarlose Unterschenkelhaut, Ödeme (Palpation auf Verhärtung, Überwärmung)</td></tr>
    <tr><td>dunkle Hauttypen</td><td>Farbveränderungen schwer erkennbar → Palpation besonders wichtig</td></tr>
    <tr><td>Neugeborene</td><td>Vernix caseosa („Käseschmiere“), Storchenbiss, Kopfkneis bilden sich selbst zurück; anhaltend trockene/juckende Haut oder Milchschorf engmaschig kontrollieren (Form des atopischen Ekzems)</td></tr>
    <tr><td>Säuglinge/Kleinkinder</td><td>Windelbereich prüfen; WD häufig mit Pilzinfektion → auch Mundraum prüfen</td></tr>
    <tr><td>Inkontinenz/IAD-Risiko</td><td>perineal, perianal und Leiste auf Rötung, Erosionen; Schmerz und Brennen als Anzeichen</td></tr>
    <tr><td>Skin-Tear-Risiko</td><td>Ältere, Neugeborene, chronisch Kranke, lokale/systemische Kortisontherapie; dünne Haut an Armen, Beinen, Handrücken</td></tr>
    <tr><td>Xerosis cutis</td><td>Gesicht, Kopfhaut, Stamm, Hände, v. a. Beine und Füße (und Intimbereich); exogene (Waschverhalten, Beruf) und endogene Ursachen (Alter, Erkrankungen, Medikamente)</td></tr>
    <tr><td>Intertrigo-Risiko</td><td>Übergewicht, Diabetes, Inkontinenz: große Hautfalten (Bauch, unter der Brust, Achseln, Intimbereich); Sekundärinfektion beachten</td></tr>
  </tbody>
</table></div>
<ul>
  <li>Weitere Experten bei Bedarf (Wundversorger bei Wundumgebung, Gefäßspezialist bei Durchblutungsstörung). Wiederholung individuell oder anlassbezogen (Diarrhoe, Schwitzen, neue Medikation); ambulant entsprechend Pflegeauftrag – bei Problemen <b>mindestens einmal pro Woche</b> inspizieren (S. 15).</li>
  <li><b>Keine eindeutige Empfehlung für standardisierte Instrumente</b> (Skin Tears, IAD, WD) – keine Evidenz gegenüber pflegefachlicher Einschätzung; aber Vorteil bei Vergleichbarkeit/Monitoring (S. 15).</li>
  <li>Dokumentation zeitnah; Fokus auf <b>Hautläsionen und klinischen Zeichen</b>, nicht Diagnosestellung; Fotodokumentation unter Datenschutz. Auch nach Wohlbefinden fragen (S. 15–16).</li>
  <li><b>Übung I</b> (Lösung S. 38): sichtbar – sehr trockene Haut, große Schuppenbildung, Erytheme, Exkoriationen; nicht sichtbar – Juckreiz, Brennen, Spannungsgefühl, Schmerzen.</li>
  <li><b>Zielformulierung</b> (S. 16): gemeinsam erarbeiten; z. B. Minderung von Juckreiz, Brennen, Schmerz, Spannungsgefühl; Verhinderung von Intertrigo, Schuppung, Rötung, Mazeration. Allgemeines Ziel: Hautintegrität erhalten und fördern unter Berücksichtigung des Wohlbefindens.</li>
</ul>

<h3>4. Phase 2 – Maßnahmenplanung <span class="seite">S. 17–19</span></h3>
<ul>
  <li><b>Inhalt des Plans:</b> Reinigung und Pflege der Haut · ggf. Kooperation mit anderen Berufsgruppen · Informations-, Beratungs-, Schulungsangebote · individuelle Zeitintervalle für Evaluation (S. 17).</li>
  <li><b>Verfahrensregelung</b> enthält (S. 18): Vorgehen bei Risiken/Problemen · Beschreibung des Vorgehens (Leitfaden, Ablaufdiagramm) · Hinweise zum Dokumentationssystem · Einbeziehung weiterer Berufsgruppen · altersspezifische Reinigung, Hautmittel, Beratungs-/Schulungsangebote.</li>
  <li><b>Ambulant</b> tragen Pflegebedürftige die Kosten der Hautpflegeprodukte selbst (oft nicht erstattungsfähig) (S. 18). Räumliche/materielle Gegebenheiten beachten (Badewanne/Dusche).</li>
  <li>Bei erhöhtem Risiko für Xerosis cutis oder Skin Tears: <b>Wasser sparsam</b>, vorsichtig trockentupfen. Schädliche Gewohnheiten (z. B. häufiges heißes Baden) benennen, beraten. Präferenzen, Wünsche, Wissen im Mittelpunkt → Selbstmanagement und Akzeptanz ↑ (S. 18–19).</li>
  <li>Plan für alle einsehbar und handlungsleitend: empfohlene/nicht sinnvolle Produkte, Dauer und Häufigkeit; ggf. Wundversorger, Kontinenzberater, Ärzte (S. 19).</li>
</ul>

<h3>5. Phase 3 – Informieren, Schulen, Beraten <span class="seite">S. 20–22</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Begriff</th><th>Bedeutung (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Informieren</td><td>Weitergabe von Informationen mit dem Ziel, Wissen zur Verfügung zu stellen</td></tr>
    <tr><td>Schulen</td><td>Vermittlung von krankheits-/problembezogenem Wissen sowie Fähigkeiten, Bewältigungsstrategien, Selbstmanagementkompetenzen und Pflegetechniken für den Alltag</td></tr>
    <tr><td>Beraten</td><td>auf Basis einer Problemanalyse gemeinsame Lösungswege und Ziele erarbeiten; einmalig oder mehrere Termine; fördert eigene Lösungskompetenz</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Themen:</b> Anatomie/Physiologie der Haut · Wirkung/Nebenwirkung der Reinigung · Hautpflege, Hautschutz, Hautmittel · Abgrenzung krankhafter/nicht krankhafter Veränderungen · Risikofaktoren IAD, WD, Skin Tears · Ätiologie bis Therapie von Xerosis, IAD, WD, Intertrigo, Skin Tears · zielgruppenspezifische Unterschiede (S. 20–21).</li>
  <li>Empathisch, offen; Routinen sensibel ändern; erlernbar und alltagstauglich; bei Nichtakzeptanz Alternativen suchen. Materialien: Ratgeber des Zentrums für Qualität in der Pflege, Fachgesellschaften (S. 21).</li>
  <li>Ambulant: Beratung v. a. bei Besuchen nach <b>§ 37 Abs. 3 SGB XI</b> oder im Erstgespräch; Pflegekurse nach <b>§ 45 SGB XI</b>. Broschüren besonders bei Krankenhausentlassung relevant (S. 22).</li>
  <li>Weitere Expertise: Arzt/Dermatologe bei anhaltender Xerosis, Verschlechterung, unklaren Läsionen; Stoma-/Kontinenzexperten, Wundversorger bei IAD/WD; Ernährungsberater bei Mangelernährung. Alles nachvollziehbar dokumentieren, ggf. übergeben („Familiale Pflege“) (S. 22).</li>
</ul>

<h3>6. Phase 4 – Durchführung und Koordination <span class="seite">S. 23–27</span></h3>
<ul>
  <li>Keine spezifische Weiterbildung erforderlich. Statt Begriffen wie „Duschbad, Creme, Salbe, Lotion“ grundlegende Eigenschaften benennen: <b>pH-Wert</b> und <b>hydrophil oder lipophil</b> (S. 23).</li>
  <li>Hinweise: „Fettsalbe“, „W/O“ → lipophil; „O/W“ → hydrophil; leicht mit Wasser abwischbar → eher hydrophil (S. 23).</li>
  <li>Unverträglichkeiten (Duftstoffe, Feuchthaltefaktoren wie Urea) → Juckreiz, Rötung; bei Verdacht nicht mehr auftragen. Inhaltsstoffe per App <b>COSMILE®</b> (EAN-Scan) (S. 24).</li>
  <li>Krankenhäuser stellen Hautmittel; Langzeitpflege/ambulant tragen Bewohner/Klienten die Kosten → Beratung zur Beschaffung wichtig. Veränderungen dokumentieren (S. 24).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Gruppe</th><th>Empfohlene Maßnahmen (Heft, S. 24–27)</th></tr></thead>
  <tbody>
    <tr><td>Neugeborene, Säuglinge</td><td>erstes Wannenbad frühestens ab dem <b>2. Tag</b>; Reinigung nach Geburt durch schonendes Abtragen (Einmalhandschuhe); <b>Vernix caseosa nicht entfernen</b>; Wannenbad ohne Waschlappen, <b>37 °C</b> (Thermometer), 5–10 min, alle paar Tage; Zusätze sparsam, für Säuglinge deklariert, <b>pH 5,5–7,0</b>; trocken tupfen; täglich Hautinspektion, bei jedem Windelwechsel; Wickel-/Badebereich <b>26–28 °C</b>, keine Zugluft</td></tr>
    <tr><td>Erwachsene mit Risiken</td><td>Vollbäder vermeiden/begrenzen, nicht zu heiß; lauwarm duschen; Hautmittel pH-hautneutral bis sauer (<b>pH &lt; 7</b>); sanft, tupfen statt reiben (Hautfalten, Zehenzwischenräume); möglichst keine alkalischen Seifen; bei häufiger Reinigung „No-rinse“-Tücher (Vorsicht Irritanzien, absprechen); Einmalwaschlappen/-handtücher; warmes Handtuch ohne Nutzen; <b>lipophile Hautmittel mind. 1× täglich</b> nach der Reinigung</td></tr>
    <tr><td>Xerosis cutis</td><td>Wasser sparsam (selektiv Achseln, Falten, Genitalbereich); Reinigungsmittel sparsam/auf Wunsch; Reinigungstücher; lipophile Hautmittel zum Verbleib, <b>Urea, Laktat</b> verstärken; je trockener, desto häufiger. Diabetes: tägliche Fußinspektion, Zehenzwischenräume trocknen, <b>Fußbäder kritisch</b> (Mazeration, Verbrennung, Infektion), Fußpflege lipophil (Urea, Laktat, Glycerin), Zehenzwischenräume aussparen. CVI: nach Ausziehen der MKS pH &lt; 7 reinigen, lipophil pflegen</td></tr>
    <tr><td>IAD-Risiko</td><td>weich, behutsam reinigen; Stuhlreste mit feuchtem Tuch rehydrieren; Inkontinenzmaterial mit Superabsorber regelmäßig wechseln; Hautschutz zum Verbleib; <b>viskose Pasten (Zinkpaste) vermeiden</b> (erschweren Beurteilung, schwer entfernbar); bei akuter Diarrhoe weiche Zinkpaste vorübergehend, sehr sparsam</td></tr>
    <tr><td>WD-Risiko</td><td>behutsam reinigen; Windel bei Nässe, <b>spätestens nach 3–4 Stunden</b> wechseln; Superabsorber, gute Passform; möglichst lange ohne Windel liegen lassen; lipophile Schutzmittel für Säuglinge deklariert, erst dünn auftragen</td></tr>
    <tr><td>Intertrigo-Risiko</td><td>No-rinse-Produkte, Einmalwaschlappen, lauwarmes Wasser, keine/milde Reiniger; Reibung vermeiden, trocken tupfen; <b>keine eindeutige Empfehlung für Zinköl</b>; Schutzmittel dünn, trocknen lassen, nicht bei Pilzbefall; Haut-zu-Haut-Kontakt vermeiden (Leinen, Vlies, Baumwolle einlegen, bei Durchfeuchtung mind. 2× täglich wechseln); Kleidung: Baumwoll-BH, Unterhosen mit Beinen, atmungsaktiv, nicht zu warm</td></tr>

  </tbody>
</table></div>

<h3>7. Phase 5 – Evaluation und Prozessablauf <span class="seite">S. 28, 34</span></h3>
<ul>
  <li>Wirksamkeit bezogen auf vereinbarte Ziele bewerten; Gesundheitszustand einschätzen; ggf. Maßnahmen anpassen oder dermatologische Expertise. Standardisierte Instrumente möglich, wenn in Verfahrensregelung vorgesehen. Individuelle Evaluationsintervalle; Veränderungen dokumentieren (S. 28).</li>
  <li>Überprüfung anhand der Kriterien der vertieften Einschätzung (Zeichen, Schweregrade); Wohlbefinden, Juckreiz, Brennen, Schmerz, Spannungsgefühl erfragen. Ziel nicht erreicht → Gründe untersuchen (vorübergehende Veränderungen, unrealistische Ziele), Akzeptanz und weiteren Beratungsbedarf prüfen (S. 28).</li>
  <li><b>Prozessablauf</b> (S. 34): Auftragsbeginn/Risikoänderung → erste Einschätzung → Risiken vorhanden/zu erwarten? (nein → Wiederholung in festgelegten Abständen) → vertiefte Einschätzung → ggf. dermatologische Experten → gemeinsame Planung/Zielvereinbarung → informieren, beraten, schulen → Koordination/Durchführung → Evaluation → Akzeptanz? (nein → erneut beraten) · Veränderungen wie Diarrhoe, Schwitzen, neue Medikation? (ja → vertiefte Einschätzung) → positive Wirkung? (nein → vertiefte Einschätzung; ja → <b>Hautintegrität erhalten und gefördert</b>).</li>
</ul>

<h3>8. Grundlagen Hautreinigung und Hautpflege <span class="seite">S. 29–33</span></h3>
<ul>
  <li><b>Hautreinigung</b> = Entfernung unerwünschter Substanzen (Staub, Schweiß, Korneozyten, organisches Material, Kosmetikreste). <b>Surfactants</b> verbinden lipophile und hydrophile Moleküle (umgangssprachlich „Seifen“) (S. 29).</li>
  <li>„Seifen“ entfernen den Hydro-Lipid-Film, schädigen Lipiddoppelschichten des Stratum corneum, lösen Entzündung aus und <b>erhöhen den pH-Wert</b>. Physiologischer pH der Hautoberfläche je nach Areal <b>4–6</b> (Glossar: 4,5–6) – <b>„Säureschutzmantel“</b> (Zusammenhalt, Mikrobiom). Zusätze (Duft-, Konservierungsstoffe) reizen zusätzlich. Langer Wasserkontakt entfernt Feuchtigkeitsfaktoren; Reiben und Kleidungsdruck belasten (S. 29).</li>
  <li><b>Hautpflege</b> = Hautmittel, die auf der Haut verbleiben, teilweise resorbiert oder durch Abrieb verloren gehen. Bezeichnungen nach Format (Creme, Salbe), Applikation (Spray, Shampoo), Effekt (Hautschutz, feuchtigkeitsspendend) → erschweren Vergleich (S. 30).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Kategorie</th><th>Definition (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Kosmetische Mittel</td><td>EU-VO Nr. 1223/2009: Stoffe/Gemische zum äußerlichen Kontakt mit Haut, Haaren, Nägeln, Lippen, Intimregionen, Zähnen, Mundschleimhaut – um zu reinigen, parfümieren, Aussehen verändern, schützen, in gutem Zustand halten, Körpergeruch beeinflussen</td></tr>
    <tr><td>Arzneimittel</td><td>Heilung, Linderung, Verhütung von Krankheiten; pharmakologische, immunologische, metabolische Wirkung</td></tr>
    <tr><td>Medizinprodukte</td><td>wirken <b>nicht pharmakologisch</b>, greifen nicht in den Stoffwechsel ein; Verhütung, Behandlung, Linderung</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Emulsionen</b>: lipophile (Öle, Vaseline, Wachse) + hydrophile (Wasser, Alkohole) Bestandteile mit Emulgatoren. Hydrophiler Anteil höher → <b>Öl-in-Wasser</b>; lipophiler höher → <b>Wasser-in-Öl</b>. Halbfest → Creme; flüssiger → Lotion (S. 30).</li>
  <li>Emulsionstyp nicht alltagstauglich → nach <b>Polarität</b> („wässrig“ oder „fettig“) und <b>Verteilbarkeit</b> wählen (S. 31): lipophil → <b>trockene</b> Haut · hydrophil → <b>feuchte</b> Haut · Feuchthaltefaktoren (Urea, Laktat, Glycerin) → sehr trockene Haut · großflächig → dünnflüssig · kleinflächig → dickflüssig.</li>
  <li>Hautmittel zum Verbleib glätten, erhöhen Wassergehalt im Stratum corneum (Okklusion, Feuchthaltefaktoren), schützen (S. 31). Wirkung durch Mischung und Menge nach Verdunsten flüchtiger Stoffe (Wasser, Propylenglykol); Vaseline z. B. erweichend, schützend, konsistenzgebend (S. 32).</li>
  <li><b>Unerwünschte Wirkungen</b> (S. 32–33): hydrophile Produkte → Überwässerung, Lipidschicht beeinträchtigt · auf normaler Haut Irritationsanfälligkeit ↑ · Pflanzenöle reizen (v. a. nach dem Baden nicht entfernt) · Konservierungs- und Duftstoffe irritierend/allergisierend; schon niedrige Konzentrationen sensibilisieren, pH ↑.</li>
  <li><b>Übung II</b> (Lösung S. 38) – sebostatische (trockene) Haut: tägliche Hautpflege, W/O-Produkte, Urea oder Kollagen (binden Feuchtigkeit), Omega-3-6-9-Fettsäuren, Lipolotionen, Harnstoff lindert Juckreiz und Verhornung.</li>
</ul>
<p class="merke"><b>Zusammenfassung</b> (S. 35): Der Standard setzt auf Maßnahmen und Mischverhältnisse statt auf viele Produkte – <b>„weniger ist mehr“</b>. Frühe Identifikation von Risiken, rechtzeitige Reinigungs-/Pflegemaßnahmen, regelmäßige Evaluation und Beratung verbessern oder vermeiden Hautprobleme.</p>

    { k: "Störfaktoren", f: "Trockene Nekrose bei pAVK – was gilt? ★",

    { k: "Handschriftlich", f: "Merkpunkte aus den Notizen?",

    { k: "Wundreinigung", f: "Pro-Argumente für eine Wundreinigung? (Übung II)",

    { k: "APW", f: "Hygiene und Schonung bei der mechanischen Wundreinigung?",

    { k: "APW", f: "Wie werden Spüllösungen temperiert?",

    { k: "APW", f: "Kochsalz- vs. Ringerlösung?",

    { k: "APW", f: "Was bedeutet Isotonie?",

    { k: "APW", f: "Warum ist Leitungswasser keimbelastet?",

    { k: "APW", f: "Was kennzeichnet die ultraschall-assistierte Wundreinigung?",

    { k: "Dekontamination", f: "Was ist Dekontamination?",
