    { k: "Dekontamination", f: "PVP-Iod – Eigenschaften und Kontraindikationen?",
      a: "Breites Spektrum, bei 2–24 h auch Sporen; Eiweißfehler (Entfärbung = Wirkverlust); zytotoxisch.\nKI: Schilddrüsenerkrankung, Iodallergie, Radioiodtherapie, Schwangerschaft/Stillzeit; inkompatibel u. a. mit H₂O₂, Octenidin, Silbersalzen.", s: "S. 14–15" },
    { k: "Dekontamination", f: "Welches Antiseptikum für welche Wunde?",
      a: "PHMB: kritisch kolonisiert/infektgefährdet, Verbrennungen, postoperativ.\nPVP-Iod: Biss-, Schuss-, Stichwunden.\nOctenidin: mit MRE kolonisiert oder infiziert.", s: "S. 15" },
    { k: "Dekontamination", f: "Wundspüllösung vs. Antiseptikum? ★",

    { k: "Dekontamination", f: "Welche Lösung für die periodische Wundreinigung?",
      a: "Bevorzugt neutrale, wirkstofffreie Lösungen. Polihexanid, Octenidin, PVP-Iod als zugelassene Antiseptika ausschließlich im Rahmen der Dekontamination bei Verdacht auf erregerbedingte Entzündung.", s: "S. 16" },
    { k: "PPW", f: "Was ist die passive periodische Wundreinigung?",
      a: "Lösung avitalen Gewebes, während die Wunde steril abgedeckt ist → Reinigung unter dem Sekundärverband durch feuchtes Milieu; intaktes Granulationsgewebe wird nicht zerstört; Überleitung in die Granulationsphase.", s: "S. 7, 17" },
    { k: "PPW", f: "Pro und Contra der PPW?",
      a: "Pro: unterstützt Reinigung, seltenere Verbandwechsel, mehr Unabhängigkeit, weniger Aufwand/Schmerz bei APW.\nContra: Schmerzen, Ekel (Larven), Allergie/Unverträglichkeit, Kosten, Kontraindikationen.", s: "S. 17" },
    { k: "PPW", f: "Was ist Autolyse?",
      a: "Abbau von Proteinen und Gewebeeinschmelzung durch zelleigene Enzyme, die beim Zellzerfall frei werden. Polyacrylat, Hydrogel und Enzyme unterstützen die Autolyse – schonender, aber langsamer.", s: "S. 18, 20" },
    { k: "PPW", f: "Wie wirkt die Dauerbefeuchtung mit Polyacrylat?",
      a: "Superabsorber-Kissen, mit Ringer (oder PHMB) aktiviert; nimmt Proteine, Exsudat, Toxine, Zelltrümmer auf und gibt Ringer ab (Saug-Spül-Prozess) → Autolyse; 1–3 Tage auf der Wunde; chronische, infizierte, nekrotische Wunden.", s: "S. 18" },
    { k: "PPW", f: "Was ist bei Hydrogel zu beachten?",
      a: "Bis 95 % Wasser; Autolyse, Rehydrierung; Tube 3 Tage, Gelplatte bis 7 Tage; 0,3–0,5 cm dick; Sekundärverband nach Exsudat. Nicht bei stark nässenden/blutenden Wunden; trockene Nekrosen nicht rehydrieren; bei UCV 8–14 % Sensibilisierung.", s: "S. 18–19" },
    { k: "PPW", f: "Enzymatische Wundreinigung – Wirkstoffe und Nachteile?",
      a: "Streptokinase/Streptodornase, Clostridiopeptidase A (Kollagenase) und B; 2–3 mm dick; nur oberflächliche Nekrosen. Nachteile: Schmerz, Brennen, Mazeration, lange Dauer, hohe Kosten (1–2× tägl. VW).", s: "S. 19–20" },
    { k: "PPW", f: "Wie wirken Fliegenlarven – und wie werden sie angewendet?",
      a: "Lucilia sericata, reine Nekrophagen; extrakorporale Verdauung mit Proteasen; vitales Gewebe geschützt. Bio-Bags oder Freiläufer; 5–8 Larven/cm², Zyklus max. 4–5 Tage; täglicher VW mit NaCl 0,9 %; Wunde frei von Lokaltherapeutika.", s: "S. 20–21" },
    { k: "PPW", f: "Wann keine Fliegenlarven?",

    { k: "PPW", f: "Medizinischer Honig – Wirkung und Empfehlung?",
      a: "pH 3,9 (Glukonsäure); Osmolarität, H₂O₂ (Glukose-Oxidase), Phytochemie; Manuka: Methylglyoxal. Nicht bei freiliegenden Knochen/Gelenken, Allergien. Wegen hoher Schmerzbelastung in der Leitlinie nicht empfohlen.", s: "S. 22–23" },
    { k: "Débridement", f: "Indikationen des chirurgischen Débridements?",
      a: "Lokale Entzündung, vom Wundbereich ausgehende systemische Infektion, großflächige Nekrosen/Beläge; beim diabetischen Fußulcus indiziert (Taschen, Unterminierungen entfernen). Überführt sekundäre in primäre Heilung.", s: "S. 23–24" },
    { k: "Débridement", f: "Wer führt es durch – welche Instrumente?",

    { k: "Débridement", f: "Wann nicht oder nur eingeschränkt?",

    { k: "Zusammenfassung", f: "Worauf ist bei der Auswahl des Verfahrens zu achten?",

  <thead><tr><th></th><th>Wundreinigung</th><th>(Chirurgisches) Débridement</th></tr></thead>
  <tbody>
    <tr><td>Definition</td><td>„Abtragung von avitalem Gewebe, Nekrosen, Belägen und/oder Entfernung von Fremdkörpern <b>bis an intakte anatomische Strukturen</b> heran unter Erhalt von Granulationsgewebe“ (DGfW 2012)</td><td>„<b>radikale</b> Abtragung von avitalem Gewebe, Nekrosen, Belägen und/oder Entfernung von Fremdkörpern mit Skalpell, Shaver, Ringkürette oder mittels Wasserdruck <b>bis in intakte anatomische Strukturen</b>“ (DGfW 2012)</td></tr>
    <tr><td>Charakter</td><td>oberflächlich; durch Pflegefachkräfte; Verfahren: APW, PPW, Dekontamination</td><td>radikal, invasiv, nicht gewebeschonend, aber schnellste und effektivste Methode; <b>nur durch Ärzt:innen</b></td></tr>
    <tr><td>Gemeinsames Ziel</td><td colspan="2">Eliminierung von Störungen im physiologischen Heilungsverlauf</td></tr>
  </tbody>
</table></div>
<p><span class="hand-inline">Handschr. „Prüfungsfrage“ (S. 2, 17): Unterschied Wundreinigung/Débridement. Handschr. „Prüfung“ (S. 5): Wundreinigung = aktiv.</span> Beide nur nach <b>Aufklärung und darauf basierendem Einverständnis</b> der betroffenen Person (S. 4).</p>

<h3>2. Indikation und Störfaktoren <span class="seite">S. 3–5, 27</span></h3>
<ul>
  <li>Beurteilung von Wundgrund, -fläche, -tiefe wird erschwert durch Nekrosen, Fibrinbeläge, Biofilm, Detritus (breiige Masse aus zerfallenen Zellen), Fremdkörper, Abfallstoffe, Verbandrückstände, überschüssiges Exsudat, avitales und schlecht heilendes Gewebe (S. 3).</li>
  <li><b>Methodenwahl</b> hängt ab von: Schmerzempfinden, Lebenssituation, Kenntnissen der Anwender, Materialien, Grunderkrankung/Wundursache, Art und Ursache des Belags (S. 3).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Begriff</th><th>Inhalt (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Nekrose</td><td>durch eine Noxe (Hypoxie, Strahlung) induzierter pathologischer Zelltod (S. 3). Fördert bakterielles Wachstum, verhindert Granulation, macht Beobachtung des Wundgrunds unmöglich. <b>Trocken:</b> dunkelbraun bis schwarz, hart, lederartig. <b>Feucht:</b> grau-gelb, weich, faserig/schmierig (S. 3, 27)</td></tr>
    <tr><td>Trockene Nekrose bei pAVK</td><td>erst <b>nach erfolgreicher Revaskularisation</b> (Bypass, Dilatation) oder zur Entlastung akuter Infektionen entfernen. <b>Dürfen vor dem Débridement auf keinen Fall angeweicht werden – nur trockene Verbandwechsel!</b> (S. 3–4)</td></tr>
    <tr><td>Fibrinbelag</td><td>Fibrin = Endprodukt der Blutgerinnung, wasserunlösliches Proteinpolymer. Physiologisch erster Wundverschluss und Baugerüst der Granulation; bei chronischen Wunden durch ständige Reizung übermäßig; <b>lässt sich im Gegensatz zu Eiter nicht abwischen/abspülen</b> → muss entfernt werden (S. 4)</td></tr>
    <tr><td>Biofilm</td><td>mikrobielle Gemeinschaft aus <b>Bakterien, Pilzen, Protozoen</b> an Grenzflächen; schleimige EPS-Matrix (Polysaccharide, DNA, Proteine); Quorum sensing. Wundgrund glänzend, gelartig; Nachweis nur mikroskopisch; mechanische Entfernung (chirurgisches Débridement, ultraschall-assistiert) am erfolgreichsten; Erfolg an Heilungsfortschritt und weniger Exsudat erkennbar (S. 4)</td></tr>
  </tbody>
</table></div>
<p class="hand">Handschr. (S. 4–5): Granulationsgewebe muss immer dunkelrot sein = gesund · Fibrin: anfangs für die Heilung gebraucht, festanhaftend, muss abgetragen werden · Eiter: leicht abwischbar, Wundabstrich – „Essener Kreisel, Levine-Technik (Prüfungsfrage)“ · trockene Nekrosen niemals aufweichen/rehydrieren → feuchtes Gangrän, Sepsis (Prüfungsfrage) · Biofilm → chirurgisches Débridement; glänzend, gelartig, wenig Exsudat, Wunde stagniert; „Prontosan: 20 Min Einwirkzeit“ · Detritus: breiige Masse aus Zellen.</p>

<h3>3. Wundreinigung – Grundlagen <span class="seite">S. 6–7</span></h3>
<ul>
  <li>Bei chronischen Wunden in der Exsudationsphase empfohlen; <b>keine evidenzbasierte Empfehlung zur Häufigkeit</b> und keine Evidenz für Vorteil bezüglich Endpunkt „Wundheilung“ → individuell abwägen (S. 6).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Pro (Wundreinigung)</th><th>Contra</th></tr></thead>
  <tbody>
    <tr><td>Entzündungsrisiko ↓ (weniger Fixierungsmöglichkeiten, z. B. Fibrin; kein Nährboden) · Lösen/Entfernen von avitalem Gewebe, Belägen, Exsudat, Mikroorganismen, Biofilm · Entfernen von Verbandresten/Fremdkörpern · bessere Wundkontraktion · bessere Beurteilbarkeit, Wundtaschen/Abszesse sichtbar · weniger Geruch · Lebensqualität ↑</td><td>häufig <b>schmerzhaft</b> (Schmerzgedächtnis → Schmerztherapie) · Materialkosten · Personalkosten durch längere Behandlungszeit · keine eindeutige Auswirkung auf den Endpunkt „Wundheilung“</td></tr>
  </tbody>
</table></div>
<p class="hand">Handschr. „Prüfung: Was spricht gegen eine Wundreinigung?“ (S. 17)</p>
<div class="tabelle"><table>
  <thead><tr><th>Verfahren</th><th>Ziel</th><th>Beispiele</th></tr></thead>
  <tbody>
    <tr><td><b>APW</b> – aktive periodische Wundreinigung <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span></td><td>vollständiges Lösen, Entfernen, Ausschwemmen bis an das gesunde Gewebe; <b>gezielte, wiederkehrende mechanische Wundreinigung im Rahmen des Verbandwechsels</b></td><td>Auswischen, Spülung ohne/mit chemischen Zusätzen, Auflegen angefeuchteter Kompressen</td></tr>
    <tr><td><b>Dekontamination</b></td><td>systemische Infektion vermeiden, lokale Entzündung durch humanpathogene Mikroorganismen therapieren; antiseptisch + mechanisch</td><td>Polihexanid, Octenidin, PVP-Iod</td></tr>
    <tr><td><b>PPW</b> – passive periodische Wundreinigung</td><td>Lösung avitalen Gewebes, während die Wunde steril abgedeckt ist → Reinigung unter dem Sekundärverband; Granulation bleibt intakt</td><td>Fliegenlarven, enzymatisch, Polyacrylat, Honig, Hydrogel</td></tr>
  </tbody>
</table></div>

<h3>4. Aktive periodische Wundreinigung (APW) <span class="seite">S. 7–13</span></h3>
<ul>
  <li>Am effektivsten durch <b>mechanische Wundreinigung</b>: Auswischen (sterile, trockene/angefeuchtete Kompressen, Pinzette, Reinigungspads, ultraschall-assoziiert) und/oder Spülen (NaCl, Ringer, H₂O₂) (S. 7).</li>
  <li>Unter keimarmen (ambulant) bzw. sterilen Bedingungen, <b>Non-Touch-Technik</b>. Jede mechanische Reinigung ist ein Gewebereiz → in Granulations-/Epithelisierungsphase möglichst keine Spülung, sonst sehr schonend (S. 8). <span class="hand-inline">Handschr.: keimarme Wundreinigung, z. B. Schere abkochen.</span></li>
  <li>Stress und Schmerzen → <b>adäquate Schmerztherapie</b>. Schonende Alternative: wiederholtes Auflegen angefeuchteter steriler Kompressen mit leichtem Druck (weniger Schmerz, aber zeitaufwendig, weniger effektiv) (S. 8).</li>
</ul>
<p class="merke">Am ehesten zur wirksamen Wundreinigung geeignet: <b>regelmäßige mechanische Wundreinigung mit sterilen Mull- oder Vlieskompressen in Kombination mit einer Spülung</b> – mechanisch + ausspülend, kostengünstig, einfach (DGfW 2012, S. 8).</p>
<ul>
  <li>Spülen nur vorsichtig, mit geringem Druck. <b>Nicht direkt aus dem Kühlschrank</b> (Auskühlung, Schmerz); auf Körpertemperatur erwärmen (Wärmeschrank, Wasserbad, Hosentasche) – <b>keine Mikrowelle</b> (Verbrennungsgefahr); mindestens Zimmertemperatur <b>20–24 °C</b>. Abfluss der Spülflüssigkeit sicherstellen; Applikation per Spritze mit Einmalkatheter/Knopfkanüle, Miniplasco (S. 8–9).</li>
  <li><b>Anforderungen an Wundspüllösungen</b> <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> (S. 9): steril, physiologisch, farblos, nicht reizend, temperierbar, nicht schmerzerzeugend, ohne resorbierbare Inhaltsstoffe. <span class="hand-inline">(Handschr. als Prüfungsfrage markiert.)</span></li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th></th><th>Isotone Kochsalzlösung</th><th>Ringerlösung</th></tr></thead>
  <tbody>
    <tr><td>Prinzip</td><td>Spüleffekt → mechanische Reinigung + Verdünnung</td><td>wie NaCl</td></tr>
    <tr><td>Hinweise</td><td>nicht konserviert → sofort verbrauchen, Reste verwerfen; Spraydose bis zum Ende nutzbar, wenn Sprühkopf die Wunde nicht berührt (vorher in die Luft sprühen)</td><td>nicht konserviert; enthält zusätzlich <b>Natrium, Calcium, Kalium</b></td></tr>
    <tr><td>Vorteile/Besonderheit</td><td>isoton, keine Zelltoxizität, keine Allergien; längerfristig/Dauerbenetzung → Elektrolytverschiebungen</td><td>isoton, keine Zelltoxizität; <b>bei längerfristiger Anwendung bevorzugt</b></td></tr>
  </tbody>
</table></div>
<p>Isotonie: ca. 270–330 mosmol/l bzw. Blutplasma ca. 290 mosmol/l (S. 9).</p>
<ul>
  <li><b>Leitungswasser</b> (S. 10–11): günstig, verfügbar, Ausduschen steigert Lebensqualität, wird oft als weniger schmerzhaft empfunden – aber <b>nicht steril</b>. RKI: „Jede Spülflüssigkeit muss steril sein. Leitungswasser ist nicht frei von Mikroorganismen“ → <b>nicht geeignet</b>. Leitlinie: kein Konsens; Aufklärung über Vor-/Nachteile und Präferenz erfragen; bei Ischämie/Diabetes höheres Infektionsrisiko als bei venösen Ulcera. Trinkwasserverordnung erlaubt bis 100 Keime/ml (22 °C und 36 °C); in Hausinstallationen Kontamination (Pseudomonaden, gramnegative Erreger) möglich; Nutzen von Bakterienfiltern unklar. Duschen mit abgedeckter Wunde ist eine separate Frage. <span class="hand-inline">Handschr.: wichtig – Filter, wenn Leitungswasser-„Ausduschen“ angeordnet wurde!</span></li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Spüllösung mit Zusätzen (S. 11–12)</th><th>Merkmale (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Polihexanid, Octenidin, Hypochlorit-haltige Lösung</td><td>Spüleffekt (mechanisch + Verdünnung); <b>konserviert</b> → nach Öffnung begrenzt verwendbar (Herstellerangaben)</td></tr>
    <tr><td>Wasserstoffperoxid</td><td>Katalase spaltet H₂O₂ → Aufschäumen, Ablösen, Zytotoxizität; mit mind. 3-facher Menge NaCl/Ringer nachspülen; <b>kein Spülen von Wundhöhlen/-taschen → Emboliegefahr!</b>; toxisch für Fibroblasten/Keratinozyten → <b>unzeitgemäß</b></td></tr>
    <tr><td>Farbstofflösungen (Ethacridinlactat, Kaliumpermanganat)</td><td>schwach bakterizid, schmales Spektrum; zytotoxisch, trocknen aus, Allergisierung, mutagen, erschweren Beurteilung → <b>unzeitgemäß</b></td></tr>
  </tbody>
</table></div>
<p class="warnung">Sind Polihexanid, Octenidin oder Natriumhypochlorit/Hypochlorsäure nur als <b>konservierende Zusätze</b> deklariert, ist die Lösung ein <b>Medizinprodukt</b> (Wundspüllösung), <b>kein Antiseptikum</b> → keine Anwendung bei infizierten Wunden. Dort: Wundantiseptika im Rahmen der Dekontamination (S. 12).</p>
<ul>
  <li><b>Ultraschall-assistierte Wundreinigung (UAW)</b> (S. 13): mechanisch, niederfrequent (bis 25 kHz); Sonotrode, 2–3 Tropfen Spülflüssigkeit/Sekunde, Feuchtnebel; Spritzschutz; isotone Ringer-/NaCl-Lösung, bei kritisch kolonisierten/infizierten Wunden Antiseptikum möglich. Kein vitales Gewebe beschädigt; Temperatur ca. 40 °C; Kavitation; in vitro: Fibrinolyse, Proteinsynthese, Zellwachstum, Angiogenese ↑. Besonders für Menschen mit Durchblutungsstörungen; keine belastbaren Aussagen zu Nutzen/Schaden.</li>
</ul>

<h3>5. Dekontamination und Antiseptika <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 13–16</span></h3>
<ul>
  <li>Antiseptische Wundbehandlung + mechanische Reinigung zur Beseitigung lokaler Entzündung durch humanpathogene Mikroorganismen und Prävention systemischer Infektion; grundsätzlich eine APW mit <b>Antiseptika (Arzneimittel)</b> (S. 13).</li>
  <li>Proteine und Biofilme schützen Mikroorganismen → <b>zuerst mechanisch reinigen</b>, dann Antiseptikum (oder Reinigung mit Antiseptikum) (S. 14).</li>
  <li><b>Erforderlich</b> bei manifester mikrobiell bedingter Entzündung und bei auffälligem Befund (Beläge, Geruch, Wundrandveränderungen) zur Infektionsprävention (S. 14).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Antiseptikum</th><th>Pro</th><th>Contra / Hinweise (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Polihexanid (PHMB) 0,02 % / 0,04 %</td><td>breites Spektrum (inkl. MRSA, Pilze), geringe Zytotoxizität, farblos</td><td>begrenzte Haltbarkeit nach Anbruch (4–8 Wochen); nicht sporozid, nicht viruzid</td></tr>
    <tr><td>PVP-Iod (inkl. Cadexomer-Iod)</td><td>breites Spektrum (bei längerer Einwirkung 2–24 h auch Sporen), Cadexomer bindet Exsudat</td><td>Eiweißfehler (Entfärbung braun → gelb = Wirkverlust), zytotoxisch, nicht farblos; <b>KI: Schilddrüsenerkrankung, Iodallergie, Radioiodtherapie, Schwangerschaft/Stillzeit</b>; inkompatibel u. a. mit Silber-, Quecksilbersalzen, H₂O₂, Octenidin</td></tr>
    <tr><td>Octenidin</td><td>breites Spektrum (grampositiv/-negativ, Pilze, Protozoen, einige Viren), farblos, geringer Eiweißfehler</td><td>höhere Zytotoxizität, schlechtere Gewebeverträglichkeit als PHMB; <b>Gewebeschädigung bei Einbringen unter Druck ohne Abfluss</b> (Wundhöhlen, Drainage); Inaktivierung durch Eiweiß</td></tr>
  </tbody>
</table></div>
<div class="tabelle"><table>
  <thead><tr><th>Wundart (S. 15)</th><th>Antiseptikum</th></tr></thead>
  <tbody>
    <tr><td>kritisch kolonisiert, infektgefährdet · Verbrennungen · postoperativ (Infektionsprävention)</td><td>Polihexanid (PHMB)</td></tr>
    <tr><td>Biss-, Schuss-, Stichwunden</td><td>PVP-Iod</td></tr>
    <tr><td>mit MRE kolonisiert oder infiziert</td><td>Octenidin</td></tr>
  </tbody>
</table></div>
<div class="tabelle"><table>
  <thead><tr><th>Übersicht <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> (S. 16)</th><th>Wundspüllösungen</th><th>Antiseptika</th></tr></thead>
  <tbody>
    <tr><td>Ziel</td><td>Reinigung (Lösen, Entfernen, Ausschwemmen)</td><td>Abtötung von Keimen</td></tr>
    <tr><td>Indikation</td><td>avitales Gewebe, Beläge, Fremdkörper</td><td>infektgefährdete, kritisch kolonisierte, infizierte Wunden</td></tr>
    <tr><td>Inhalt</td><td>ohne Zusätze (NaCl, Ringer) oder mit nur konservierenden Zusätzen</td><td>Arzneimittel: Octenidin, Polihexanid, PVP-Iod</td></tr>
    <tr><td>Dauer</td><td>fortlaufend möglich</td><td>begrenzt, bis Infektzeichen beseitigt – <b>max. 14 Tage</b></td></tr>
    <tr><td>Applikation</td><td>spülen, wischen, tupfen, einweichen</td><td>gießen, sprühen, einweichen, wischen, tupfen – nur <b>oberflächlich</b> (auch Wundhöhle, z. B. Dekubitus)</td></tr>
    <tr><td>Zulassung</td><td>europaweit als <b>Medizinprodukt</b> (physikalisch)</td><td>national als <b>Arzneimittel</b> (pharmakologisch)</td></tr>
  </tbody>
</table></div>
<p class="merke">Für die <b>periodische Wundreinigung</b> bevorzugt <b>neutrale, wirkstofffreie Lösungen</b>; Polihexanid, Octenidin, PVP-Iod als Antiseptika <b>ausschließlich im Rahmen der Dekontamination</b> bei Verdacht auf erregerbedingte Entzündung (S. 16). <span class="hand-inline">(Seite handschr. als „Prüfungsfrage!“ markiert.)</span></p>

<h3>6. Passive periodische Wundreinigung (PPW) <span class="seite">S. 17–23</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Pro</th><th>Contra</th></tr></thead>
  <tbody>
    <tr><td>unterstützt Reinigung (Zeitmanagement) · weniger Verbandwechsel → Unabhängigkeit, Lebensqualität · weniger Aufwand und Schmerz bei der APW</td><td>Schmerzen · Ekelgefühle (Fliegenlarven) · Kontaktallergie/Unverträglichkeit · Kosten · Kontraindikationen nach Herstellerangaben</td></tr>
  </tbody>
</table></div>
<div class="tabelle"><table>
  <thead><tr><th>Methode</th><th>Kernaussagen (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Polyacrylat (Nasstherapie)</td><td>Superabsorber-Kissen mit Ringer (oder Polihexanid) aktiviert; nimmt Proteine, Exsudat, Toxine, Zelltrümmer auf, gibt Ringer ab (Saug-Spül-Prozess) → Autolyse; <b>1–3 Tage</b>; für chronische (Dekubitus 2–4, Ulcus cruris, DFU), infizierte und nekrotische Wunden (Verbrennung I/II)</td></tr>
    <tr><td>Hydrogel</td><td>bis 95 % Wasser; Autolyse, Rehydrierung trockener/schmerzhafter Wunden; Tubengel 3 Tage, Gelplatte bis 7 Tage; <b>0,3–0,5 cm</b> dick; Sekundärverband: Folie (wenig Exsudat), feinporiger PU-Schaum (mehr Exsudat), Distanzgitter + Kompresse (täglich). Nutzen bei DFU belegt; bei UCV 8–14 % Sensibilisierung; <b>nicht bei stark nässenden oder blutenden Wunden</b>; trockene Nekrosen <b>nicht rehydrieren</b> (feuchte Gangrän)</td></tr>
    <tr><td>Enzymatisch</td><td>Streptokinase/Streptodornase, Clostridiopeptidase A (Kollagenase) und B; 2–3 mm Schicht; nur oberflächliche Nekrosen; Nebenwirkungen: Schmerz, Brennen, Hautreizung, Mazeration, lange Dauer, hohe Kosten (1–2 × täglich VW); heute schonendere Alternativen</td></tr>
    <tr><td>Fliegenlarven (Lucilia sericata)</td><td>reine Nekrophagen → kein Débridement im Sinne der Definition; extrakorporale Verdauung mit Proteasen; vitales Gewebe durch Proteasenhemmer geschützt. Bio-Bags oder Freiläufer; <b>5–8 Larven/cm²</b>, Zyklus <b>max. 4–5 Tage</b>, tägl. Spülung mit NaCl 0,9 %; Wunde frei von Lokaltherapeutika; durch <b>Pseudomonas aeruginosa</b> gehemmt (grünes Exsudat) → Abstrich vorher; keine Druckbelastung. <b>Nicht</b> bei Blutungsneigung, Nähe großer Gefäße, Verbindung zu Körperhöhlen/Organen, schlechter Durchblutung, Antikoagulation, Ablehnung aus Ekel</td></tr>
    <tr><td>Medizinischer Honig</td><td>Glukonsäure → pH 3,9; Wirkung durch Osmolarität, H₂O₂ (Glukose-Oxidase), Phytochemie; Manuka: Methylglyoxal 100-fach. Nicht bei freiliegenden Gelenken, Knochen, Knorpel, Allergien. Höhere Schmerzbelastung → in der Leitlinie <b>nicht empfohlen</b></td></tr>
  </tbody>
</table></div>
<p>Polyacrylat, Hydrogel und enzymatische Reinigung <b>unterstützen die körpereigene Autolyse</b> (Abbau durch zelleigene Enzyme) – schonender, aber langsamer (S. 18, 20). <span class="hand-inline">Handschr. (S. 17): Fliegenlarven-Notiz „körpereigene (Madentherapie) unkontrollierbar“ – Lesung unsicher.</span></p>

<h3>7. Chirurgisches Débridement <span class="seite">S. 23–24</span></h3>
<ul>
  <li>Überführt sekundär heilende Wunden durch Ausschneiden im vitalen Gewebe in primäre Wundheilung. Indikationen: lokale Entzündung, systemische Infektion vom Wundbereich, großflächige Nekrosen/Beläge; beim diabetischen Fußulcus indiziert, Taschen und Unterminierungen entfernen (S. 23–24).</li>
  <li>Schmerzhaft → Lokalanästhesie, Analgosedierung oder Vollnarkose. <b>Nur durch Ärzt:innen.</b> Scharfe Löffel und Scheren ungeeignet (quetschen Gewebe, Keime gelangen tief ins Gewebe) (S. 24).</li>
  <li><b>Nicht bzw. eingeschränkt</b> bei: Gerinnungsstörung/Antikoagulation, starker Schmerzempfindlichkeit, eingeschränkter Narkosefähigkeit, fehlendem qualifiziertem Personal, eingeschränkter Transportfähigkeit, Ablehnung (S. 24).</li>
</ul>
<p class="merke"><b>Prozessablauf</b> (S. 26): avitales Gewebe, Nekrosen, Beläge, Fremdkörper vorhanden? Nein → keine Wundreinigung/kein Débridement. Ja → Bedingungen für chirurgisches Débridement (lokale Entzündung, systemische Infektion, großflächige Nekrosen)? Ja → Débridement mit Schmerztherapie; nein → Wundreinigung primär mechanisch, bei PPW neutrale wirkstofffreie Lösungen; bei Verdacht auf erregerbedingte Entzündung zugelassene Antiseptika (max. 14 Tage) → erneut prüfen.</p>
<p><b>Zusammenfassung</b> (S. 25): Auswahl nach Zielen und Wünschen der Betroffenen, Wundsituation, Wirtschaftlichkeit und Expertenempfehlungen; besonders beachten: <b>Schmerzvermeidung</b>, physiologisch feuchtes Wundmilieu, kein Flüssigkeitsaustritt aus dem Verband. Die wichtigste Rolle bei der Entscheidung spielt der betroffene Mensch.</p>

Lernapp.thema({

  titel: "Wundbehandlung und Verbandstoffe",
  kurz: "Verbandstoffe",
  quelle: "murimed-Kursheft Wundbehandlung und Verbandstoffe, Modul II",
  hinweis:
    "Quelle ist ausschließlich das Kursheft; Seitenzahlen in Klammern (gedruckte Heftseiten). ★ = im Heft handschriftlich als „Prüfung“ bzw. „Prüfungsfrage“ markiert. Handschriftliche Notizen sind gekennzeichnet und nicht geprüft; Produktnamen darin sind Beispiele, keine Empfehlung des Hefts. Die zitierte Primärquelle (v. a. Vasel-Biergans 2018) wurde nicht separat geprüft.",

  karten: [
    { k: "Grundlagen", f: "Wie definiert das SGB V Verbandmittel?",
      a: "§ 31 Abs. 1a SGB V: „Gegenstände einschließlich Fixiermaterial, deren Hauptwirkung darin besteht, oberflächengeschädigte Körperteile zu bedecken, Körperflüssigkeiten aufzusaugen oder beides zu erfüllen.“", s: "S. 3" },
    { k: "Grundlagen", f: "Welche ergänzenden Wirkungen können Verbandmittel haben?",
      a: "Wunde feucht halten, Wunde reinigen, Geruch binden, antibakterielle oder Metallbeschichtung. Auch Gegenstände zum Stabilisieren, Immobilisieren, Komprimieren gelten als Verbandstoffe.", s: "S. 3" },
    { k: "Grundlagen", f: "Warum sind Verbandmittel Medizinprodukte?",
      a: "CE-zertifiziert, unterliegen dem MPG; Hauptwirkung weder pharmakologisch, immunologisch noch metabolisch. Klasse nach „Verletzbarkeit des Körpers“ (Zweckbestimmung, Ort, Dauer) → vier Risikoklassen.", s: "S. 3" },
    { k: "Risikoklassen", f: "Risikoklasse I und IIa? ★",
      a: "I (niedrig): oberflächliche, primär heilende Wunden – Mull-, Saugkompressen, Fixiermittel, elastische Binden, semipermeable Folien.\nIIa (mittel): beeinflussen Mikroklima – Alginat-, Hydrogel-, Schaumstoff-Kompressen, Hydrokolloide.", s: "S. 4" },
    { k: "Risikoklassen", f: "Risikoklasse IIb und III? ★",
      a: "IIb (erhöht): Leder-/Unterhaut, sekundäre Heilung – Alginat-/Schaumstoff-Tamponaden, Hydrogel aus der Tube.\nIII (hoch): infektgefährdet/infiziert, mit Arzneimitteln oder tierischen Bestandteilen – PVP-Iod-, PHMB-, Kollagen-, Gelatine-Auflagen.", s: "S. 4" },
    { k: "Einteilung", f: "Konventionelle vs. moderne Wundauflagen?",
      a: "Konventionell (passiv, handschr. „klassisch“): decken ab und schützen.\nModern: halten das feuchte Wundmilieu, enthalten u. a. Eiweiß-/Zuckermoleküle und unterstützen die Heilungsphasen.", s: "S. 4", h: true },
    { k: "Einteilung", f: "Primär- vs. Sekundärverband?",
      a: "Primärverband: direkt auf Haut bzw. Wundfläche (handschr.: unmittelbar auf der Wunde).\nSekundärverband: deckt die Wundauflage ab oder fixiert sie (handschr.: Pflaster etc.).", s: "S. 5", h: true },
    { k: "Anforderungen", f: "Funktionelle Anforderungen an Wundauflagen? ★",
      a: "Schutz vor Fremdkörpern, Infektion, Druck, Reibung, Wärmeverlust, Austrocknung · Gasaustausch · Unterstützung der autolytischen Wundreinigung · ausreichende Saugkapazität (Blut, Wundflüssigkeit, Gewebetrümmer, Bakterien).", s: "S. 5" },
    { k: "Anforderungen", f: "Anforderungen an die Verträglichkeit? ★",
      a: "Keine Fasern/Partikel in der Wunde · keine Schmerzen · kein Anhaften am Wundgrund · atraumatischer Verbandwechsel · gut verträglich, gering allergen · Wundruhe · Akzeptanz bei Betroffenen und Anwendern.", s: "S. 5" },
    { k: "Anforderungen", f: "Welche Kriterien betreffen die Wirtschaftlichkeit?",
      a: "Verfügbarkeit unterschiedlicher Packungsgrößen, einfache und sichere Handhabung, Wundruhe durch seltene Verbandwechsel (längere Intervalle meist teurer, verkürzen aber die Behandlung).", s: "S. 6" },
    { k: "Konventionell", f: "Was zählt zu den konventionellen Wundauflagen? ★",
      a: "Mull-, Vliesstoffkompressen, kombinierte Saugkompressen, Wundschnellverbände, Wundnahtstreifen, Fixiermittel, imprägnierte und hydroaktiv imprägnierte Wundgazen, Wundkontaktverbände mit Silikon. Vor allem für primär heilende Wunden.", s: "S. 6" },
    { k: "Konventionell", f: "Vor- und Nachteile von Mullkompressen?",
      a: "Pro: standardisiert, reinigend beim Auswischen, hohe Saugkraft.\nContra: Mazeration, häufige Wechsel, Infektionsgefahr bei Durchnässung, Austrocknung, Verkleben, Fasern in der Wunde, wenig Polster, Fixierung nötig.", s: "S. 7" },
    { k: "Konventionell", f: "Kontraindikation und Anwendung von Mullkompressen?",
      a: "KI: Primärverband bei sekundär heilenden, granulierenden, epithelisierenden oder schwach exsudierenden Wunden. Anwendung: tiefe Wunden locker austamponieren; oberflächlich mind. 2 × 8-lagig; VW bei Durchnässung.", s: "S. 7" },
    { k: "Konventionell", f: "Kombinierte Saugkompressen – Aufbau und Anwendung?",
      a: "Saugkern (Zellstoff/Watte) in Tissue, außen glattes Vlies; große Saugkraft, gute Polsterung. Postoperativ, sehr stark nässend, Sekundärverband. Nicht bei mäßig bis schwach exsudierenden Wunden. Feuchtigkeitsabweisende Seite nach außen.", s: "S. 8–9" },
    { k: "Konventionell", f: "Wundschnellverbände – wofür, wofür nicht?",
      a: "Erstversorgung kleiner Schnitt-/Schürfwunden; schnell, leichte Kompression zur Blutstillung; auf trockene, fettfreie Haut. Nicht für tieferliegende, sekundär heilende Wunden.", s: "S. 9–10" },
    { k: "Konventionell", f: "Wundnahtstreifen – Vorteile und Anwendung?",
      a: "Atraumatischer Verschluss ohne Lokalanästhesie, weniger Infektionen, kaum Narben. Gesicht, Platzwunden, Transplantate, Naht-/Narbenentlastung. Mit dem ersten Streifen in der Mitte beginnen; behutsam entfernen.", s: "S. 10–11" },
    { k: "Konventionell", f: "Was ist bei imprägnierten Wundgazen zu beachten?",
      a: "Vaseline/Paraffin verhindert Verkleben, preiswert. Nie doppelt oder dreifach gefaltet auflegen (Exsudatstau, kein O₂, Infektionsgefahr); Saugkompresse und Fixierung nötig; bei nachlassendem Exsudat mind. täglicher Wechsel.", s: "S. 11–12" },
    { k: "Konventionell", f: "Hydroaktiv imprägnierte Wundgazen?",
      a: "Enthalten gelbildende Partikel → feuchtes Milieu, kein Ankleben; Erschöpfung erkennbar. Oberflächlich, mäßig bis stark nässend (Abschürfung, Verbrennung, Ulcus cruris). VW spätestens nach 4 Tagen.", s: "S. 12" },
    { k: "Konventionell", f: "Wundkontaktverbände mit Silikon?",
      a: "Haften schonend auf trockener Haut, nicht auf Wunde; atraumatisch, Wundrandschutz, Wundruhe. Nicht saugend. Für Verbrennungen, Transplantate, postoperativ, empfindliche Haut. KI: Silikonüberempfindlichkeit.", s: "S. 13" },
    { k: "Modern", f: "Welche Gruppen moderner Wundauflagen gibt es?",
      a: "Hydroaktive, interaktive sowie antibakterielle und geruchsbindende Wundauflagen. Hydroaktiv: feucht-warmes Milieu, kein Schorf, Granulation und Zellmigration ungehindert.", s: "S. 14" },
    { k: "Hydroaktiv", f: "Alginate – Indikationen?",
      a: "Aus Seealgen; werden mit Exsudat zu Gel, nehmen viel Flüssigkeit, Bakterien, Zelltrümmer auf. Mäßig–stark nässend, tiefe Wunden/Höhlen, infiziert, blutend (blutstillend), Exsudationsphase, Verbrennung 2°.", s: "S. 14" },
    { k: "Hydroaktiv", f: "Alginate – Kontraindikationen und Anwendung?",
      a: "Nicht auf trockene, nekrotische Wunden oder Verbrennung 3° (Austrocknung). Nicht über den Wundrand – passgenau zuschneiden (Mazeration); tiefe Wunden austamponieren; VW bei Durchfeuchtung, 1–7 Tage.", s: "S. 14–15" },
    { k: "Hydroaktiv", f: "Aquafilament-Verbände?",
      a: "Reißfest, silberhaltig, hydrophile Fasern; vertikale Aufnahme verhindert Mazeration; für exsudierende und trockene Wunden (anfeuchten); alle Phasen; darf Wundrand überlappen; VW täglich (Exsudation), dann spätestens nach 3 Tagen.", s: "S. 15–16" },
    { k: "Hydroaktiv", f: "Hydrophile Faserverbände?",
      a: "Trocken aufgelegt, saugen und gelieren nur im feuchten Wundbereich → Wundrand bleibt trocken; unter Kompression; ausreichend Exsudat nötig; VW spätestens nach 7 Tagen. Handschr.: Hydrofaser besser als Alginat.", s: "S. 16–17", h: true },
    { k: "Hydroaktiv", f: "Hydrogel-Kompressen?",
      a: "Geben Feuchtigkeit ab, weichen Beläge auf; schwach–mäßig exsudierend, Granulation/Epithelisierung; kühlend. Nicht bei stark nässenden oder blutenden Wunden. Erschöpfung = blasenförmige Verformung; VW spätestens nach 7 Tagen.", s: "S. 17–18" },
    { k: "Hydroaktiv", f: "Hydrogele aus der Tube?",
      a: "Sehr hoher Wassergehalt; feucht halten, Beläge aufweichen, Wundfüller in Höhlen. Mit sterilem Spatel; angebrochene Tuben verwerfen; nicht bei stark nässend/blutend; VW alle 2–3 Tage (Beläge: täglich).", s: "S. 19" },
    { k: "Hydroaktiv", f: "Hydrokolloide – Wirkung und Kontraindikationen?",
      a: "Selbstklebend, quellen zu Gel; leicht–stark exsudierend, kein Sekundärverband, Duschen möglich. Nicht bei klinisch infizierten Wunden, freiliegenden Muskeln/Sehnen/Knochen, ischämischen Ulzera (wenig O₂). Häufig Hautirritationen.", s: "S. 19–20" },
    { k: "Hydroaktiv", f: "Wann wird ein Hydrokolloid gewechselt?",
      a: "Wenn sich die Gelblase über die gesamte Wunde erstreckt oder Exsudat ausläuft; 1–7 Tage. Wundumgebung trocken und fettfrei, faltenfrei andrücken. Handschr.: wird kaum noch verwendet; kein Gasaustausch.", s: "S. 5, 19–20", h: true },
    { k: "Hydroaktiv", f: "Kombinierte Wundverbände?",
      a: "Primär- und Sekundärverband in einem; sehr hohe Aufnahme, Wundrandschutz, unter Kompression. Mäßig–stark nässend; infiziert kritisch; nicht bei trockenen Nekrosen; bis 7 Tage.", s: "S. 20–21" },
    { k: "Hydroaktiv", f: "Schaumstoffkompressen vs. Hydropolymere?",
      a: "Weichschaum: nimmt auf ohne Form zu ändern.\nHydropolymer: quillt der Wunde entgegen. Mäßig–stark exsudierend, atraumatisch, polsternd; geben keine Flüssigkeit ab; ungeeignet für trockene, nekrotische Wunden.", s: "S. 21" },
    { k: "Hydroaktiv", f: "Offenporige Schaumstoffkompressen?",
      a: "Wundkonditionierung: haften in der Granulation an, VW reißt auf → Blutung → gut durchblutetes Granulationsgewebe (z. B. vor Hauttransplantation, offene Frakturen). Schmerzhaft; Wundrand nicht überlappen.", s: "S. 22" },
    { k: "Hydroaktiv", f: "Semipermeable Wundfolien?",
      a: "Transparent; Bakterien/Nässe bleiben draußen, O₂-/Wasserdampfaustausch; Beobachtung, Duschen möglich. KI: nässende und klinisch infizierte Wunden. Nicht gedehnt anbringen; Haare kürzen; VW spätestens nach 7 Tagen.", s: "S. 23" },
    { k: "Hydroaktiv", f: "Wundauflagen mit Superabsorber?",
      a: "Sehr große Saugkapazität, Gel schließt Keime und Zelltrümmer ein, Wundrandschutz, Geruch ↓; mäßig–stark exsudierend, exulzerierende Karzinome. Nicht bei schwach exsudierenden oder trockenen Wunden (Austrocknung).", s: "S. 24" },
    { k: "Interaktiv", f: "Was sind interaktive Wundauflagen?",
      a: "Halten feucht und warm, mit körpereigenen Substanzen identisch/verwandt: Kollagen, Gelatine, Hyaluronsäure. Nutzen weitgehend ungeklärt, sehr teuer → kritisch hinterfragen.", s: "S. 24–25" },
    { k: "Interaktiv", f: "Kollagen- und Gelatine-Wundauflagen?",
      a: "Hohe Saugkapazität, vollständige Resorption (bleiben liegen, nur Sekundärverband wechseln).\nGelatine: sehr schnelle Blutstillung. Nicht bei infizierten Wunden und trockenen Nekrosen; schwach exsudierend mit NaCl anfeuchten.", s: "S. 25–26" },
    { k: "Interaktiv", f: "Hyaluronsäurehaltige Wundauflagen?",
      a: "Binden Wasser, Gelbildung, wirken in der Initialphase; Granulat, Auflage, Film. Nachteil: Sekundärverband. Chronische, sekundär heilende Wunden. Laut Heft bei infizierten Wunden und mit Antiseptika kontraindiziert (Folgesatz widersprüchlich).", s: "S. 26" },
    { k: "Antibakteriell", f: "Welche antibakteriellen/geruchsbindenden Auflagen gibt es?",
      a: "Aktivkohlekompressen, silberhaltige Wundauflagen, Wundauflagen mit Honig, hydrophobe Wundauflagen, antiseptikahaltige Wundauflagen. Für infizierte bzw. sehr geruchsintensive Wunden.", s: "S. 27" },
    { k: "Antibakteriell", f: "Aktivkohlekompressen?",
      a: "Trocken Geruchsfilter, durchfeuchtet Bindung von Eiweiß/Bakterien; mit Silber Keimreduktion. Klinisch infizierte, geruchsintensive Wunden. Dürfen nicht zugeschnitten werden; Fixierung nötig; Kohle deckt den saugenden Primärverband ab.", s: "S. 27" },
    { k: "Antibakteriell", f: "Silberhaltige Wundauflagen?",
      a: "Wirken nur mit Flüssigkeit; kritisch kolonisiert/lokal infiziert; enger Wundkontakt; Auswahl nach Wundverhältnissen, nicht Silbergehalt. Wirksamkeit ungeklärt, toxisch möglich, teuer → so lange wie nötig, so kurz wie möglich (handschr.: max. 14 Tage).", s: "S. 28", h: true },
    { k: "Antibakteriell", f: "Wundauflagen mit Honig – Vor- und Nachteile?",
      a: "Pro: angenehmer Geruch, hohe Akzeptanz; Zucker zieht Flüssigkeit, Ödeme ↓, reinigt.\nContra: schwankende Eigenschaften, Kontamination (Pestizide, Clostridien, Antibiotika), Schmerz durch osmotischen Zug, Allergien, Sekundärverband.", s: "S. 28" },
    { k: "Antibakteriell", f: "Hydrophobe Wundauflagen?",
      a: "Rein physikalische Bindung von Keimen durch hydrophobe Anziehung → keine Allergie, keine Resistenz. Kontaminierte/infizierte postoperative, traumatische Wunden, Fisteln, Abszesse, Dehiszenzen. Nicht mit fetthaltigen Materialien kombinieren.", s: "S. 29" },
    { k: "Antibakteriell", f: "Antiseptikahaltige Wundauflagen?",
      a: "Kompressen und Hydrogele; Wirkstoff unterstützt Reinigung und reduziert Bakterien im Verband; Gele konserviert länger haltbar. Nachteile: begrenzte Aufnahme, Kontraindikationen je Wirkstoff, Sekundärverband.", s: "S. 29" },
    { k: "Sonstige", f: "Sprühpflaster – Indikation und Kontraindikationen?",
      a: "Filmbildner, elastisch, wasserfest, atmungsaktiv; kleine oberflächliche Wunden nach Blutstillung. KI: blutend/nässend, infiziert, tief/großflächig, Verbrennungen, Augen, Mund, Schleimhäute.", s: "S. 30" },
    { k: "Sonstige", f: "Was zählt zu den lokalen Wundtherapeutika?",
      a: "Unkonservierte und konservierte Wundspüllösungen, Wundantiseptika, Wundsprays, Wund- und Heilsalben, Wundrandschutz/Hautschutz, lokale Hautkleber. Halten feuchtes Milieu; heute eher untergeordnet; phasengerecht.", s: "S. 30" },
    { k: "Vergleich", f: "Welche Auflagen dürfen nicht über den Wundrand?",
      a: "Alginate und offenporige Schaumstoffkompressen – passgenau zuschneiden. Dürfen überlappen: Aquafilament-Verbände; hydrophile Faser geliert nur im Feuchten (Wundrand bleibt trocken).", s: "S. 14–16, 22" },
    { k: "Vergleich", f: "Welche Auflagen nicht bei trockenen Wunden/Nekrosen?",
      a: "Alginate, Schaumstoffkompressen, Superabsorber, kombinierte Wundverbände (trockene Nekrosen), Kollagen/Gelatine (trockene Nekrosen). Für trockene Wunden: Hydrogel (Tube/Kompresse), angefeuchtete Aquafilament-Verbände.", s: "S. 14–25" },
    { k: "Vergleich", f: "Welche Auflagen nicht bei stark nässenden/blutenden Wunden?",
      a: "Hydrogel-Kompressen und Hydrogele aus der Tube, semipermeable Folien (nässend), Sprühpflaster. Bei Blutung geeignet: Alginate, Gelatine (blutstillend).", s: "S. 14–30" },
    { k: "Vergleich", f: "Maximale Wechselintervalle laut Heft?",
      a: "Hydroaktive Gaze spätestens 4 Tage · Aquafilament nach Exsudationsphase spätestens 3 Tage · Hydrogel-Tube alle 2–3 Tage · Faserverband, Hydrogel-Kompresse, Folie, kombinierter Verband spätestens 7 Tage · Alginat, Hydrokolloid 1–7 Tage.", s: "S. 12–24" },
    { k: "Kernbotschaft", f: "Worauf kommt es bei der Produktwahl an?",
      a: "Nicht das Neueste oder Teuerste, sondern zu erkennen, welches Produkt wann, wofür und wie lange genutzt werden kann – Indikation, Kontraindikation, Anwendungshinweise, Wechselintervall.", s: "S. 2, 31" }
  ],

  quiz: [

    { f: "Welche Produkte nennt das Heft als Beispiele für Risikoklasse IIa?",

    { f: "Welcher Risikoklasse ist Hydrogel aus der Tube zugeordnet?",

    { f: "Was kennzeichnet Risikoklasse III?",
      o: ["Produkte mit Arzneimitteln und/oder tierischen Bestandteilen für infektionsgefährdete/infizierte Wunden", "Produkte für oberflächliche, primär heilende Wunden", "Reine Fixiermittel und Binden", "Produkte, die nur das Mikroklima oberflächlicher Wunden beeinflussen"],
      e: "III (hoch): sekundär heilende Wunden bis in die Unterhaut, infektionsgefährdet/infiziert; enthalten Arzneimittel und/oder tierische Bestandteile (z. B. PVP-Iod-, PHMB-, Kollagen-, Gelatine-Auflagen).", s: "S. 4" },
    { f: "Was unterscheidet moderne von konventionellen Wundauflagen?",

    { f: "Was ist ein Sekundärverband?",

    { f: "Welche Punkte zählt das Heft zu den funktionellen Anforderungen an Wundauflagen? ★",

      e: "Funktion: Schutz vor Fremdkörpern, Infektion, Druck, Reibung, Wärmeverlust, Austrocknung · Gasaustausch · autolytische Wundreinigung · ausreichende Saugkapazität. Keine Fasern in der Wunde und Wundruhe sind gefordert.", s: "S. 5" },

<p class="merke"><b>Verbandmittel</b> (§ 31 Abs. 1a SGB V): „Gegenstände einschließlich Fixiermaterial, deren Hauptwirkung darin besteht, oberflächengeschädigte Körperteile zu bedecken, Körperflüssigkeiten von oberflächengeschädigten Körperteilen aufzusaugen oder beides zu erfüllen.“ Ergänzend möglich: feucht halten, reinigen, Geruch binden, antibakterielle oder Metallbeschichtung. Auch Gegenstände zum Stabilisieren, Immobilisieren oder Komprimieren nicht oberflächengeschädigter Körperteile gelten als Verbandstoffe.</p>
<p>Verbandmittel sind <b>CE-zertifizierte Medizinprodukte</b> (MPG); bestimmungsgemäße Hauptwirkung <b>weder pharmakologisch noch immunologisch noch metabolisch</b> (§ 3 MPG). Klasse richtet sich nach der „Verletzbarkeit des Körpers“ (Zweckbestimmung, Anwendungsort, -dauer) → vier Risikoklassen (S. 3).</p>
<div class="tabelle"><table>

    <tr><td>I – niedrig</td><td>oberflächliche, primär heilende Wunden; mechanische Barriere, Exsudatabsorption, Fixierung, Kompression</td><td>Mull-, Saugkompressen, Fixiermittel, elastische Binden, semipermeable Folien</td></tr>
    <tr><td>IIa – mittel</td><td>beeinflussen Umgebung und Mikroklima oberflächlicher Wunden</td><td>Alginat-, Hydrogel-, Schaumstoff-Kompressen, Hydrokolloide</td></tr>
    <tr><td>IIb – erhöht</td><td>Wunden in Leder- oder Unterhaut mit sekundärer Wundheilung</td><td>Alginat-, Schaumstoff-Tamponaden, Hydrogel aus der Tube, Mullbinde zur Tamponade</td></tr>

<h3>2. Wundauflagen: Einteilung und Anforderungen <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 4–6</span></h3>

<p><b>Primärverband</b> = direkt auf Haut/Wundfläche; <b>Sekundärverband</b> = deckt ab oder fixiert (S. 5). <span class="hand-inline">Handschr.: primär = unmittelbar auf der Wunde; sekundär = Pflaster etc.</span></p>

    <tr><td>Imprägnierte Wundgazen (Vaseline/Paraffin)</td><td>kein Verkleben, preiswert</td><td>Saugkompresse + Fixierung nötig, zeitaufwendig; Verkleben bei wenig Exsudat</td><td><b>nie doppelt/dreifach falten</b> (Exsudatstau, kein O₂, Infektion); mind. täglicher VW</td></tr>
    <tr><td>Hydroaktiv imprägnierte Gazen</td><td>Gelbildung → feuchtes Milieu, kein Ankleben; Erschöpfung erkennbar</td><td>Sekundärverband, teurer</td><td>oberflächlich, mäßig bis stark nässend (Abschürfung, Verbrennung, Spalthaut, Ulcus cruris); VW <b>spätestens nach 4 Tagen</b></td></tr>
    <tr><td>Wundkontaktverbände mit Silikon</td><td>sehr schonend, atraumatisch, Wundrandschutz, Wundruhe (nur Sekundärverband wechseln)</td><td>nicht saugend; <b>KI: Silikonüberempfindlichkeit</b></td><td>oberflächlich bis tief (Verbrennungen), Transplantate, postoperativ, Hautschutz, empfindliche Haut; Maschen groß genug für Exsudat</td></tr>
  </tbody>
</table></div>
<p>Konventionelle Verbände werden meist mehrfach täglich erneuert, Austrocknung, Infektions- und Verletzungsrisiko, kein einheitlicher Standard (S. 13).</p>

<h3>4. Moderne Wundauflagen – hydroaktiv <span class="seite">S. 14–24</span></h3>
<p>Drei Gruppen: <b>hydroaktive, interaktive, antibakterielle/geruchsbindende</b> Wundauflagen. Hydroaktiv = feucht-warmes Milieu über den gesamten Therapieverlauf; kein Schorf, Granulation und Zellmigration ungehindert (S. 14).</p>
<div class="tabelle"><table>
  <thead><tr><th>Auflage</th><th>Prinzip / Indikation</th><th>Wichtige Hinweise (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Alginate (Seealgen)</td><td>trocken → feuchtes Gel; nehmen sehr viel Flüssigkeit, Bakterien, Zelltrümmer auf; mäßig–stark nässend, tief, Höhlen, infiziert, blutend (blutstillend), Exsudationsphase, Verbrennung 2°</td><td><b>nicht</b> auf trockene, nekrotische Wunden oder Verbrennung 3°; <b>nicht über den Wundrand</b> (passgenau, Mazeration); austamponieren möglich; VW 1–7 Tage. <span class="hand-inline">Handschr.: löst/weicht Beläge ab</span></td></tr>
    <tr><td>Aquafilament-Verbände</td><td>reißfest, silberhaltig (Keimreduktion), hydrophile Fasern; akut, schwer heilend, exsudierend <b>und trocken</b> (dann anfeuchten)</td><td>vertikale Aufnahme → kein Mazerieren; schneidbar; unter Kompression; alle Phasen; <b>darf Wundrand überlappen</b>; VW in Exsudationsphase täglich, danach spätestens nach 3 Tagen</td></tr>
    <tr><td>Hydrophile Faserverbände</td><td>trocken aufgelegt, saugen Flüssigkeit und Zelltrümmer, Gel nur im feuchten Bereich → Wundrand bleibt trocken</td><td>ausreichend Exsudat nötig; Sekundärverband; unter Kompression; VW spätestens nach 7 Tagen. <span class="hand-inline">Handschr.: Hydrofaser besser als Alginat, über den Wundrand möglich</span></td></tr>
    <tr><td>Hydrogel-Kompressen</td><td>geben Feuchtigkeit ab, weichen Beläge auf, Feuchtigkeitsgleichgewicht; schwach–mäßig exsudierend, Granulation/Epithelisierung; kühlend, atraumatisch</td><td><b>nicht bei stark nässenden/blutenden Wunden</b>; Erschöpfung = blasenförmige Verformung; VW spätestens nach 7 Tagen</td></tr>
    <tr><td>Hydrogele aus der Tube</td><td>sehr hoher Wassergehalt; feucht halten, Beläge aufweichen, Wundfüller</td><td>nicht bei stark nässend/blutend; steriler Spatel; angebrochene Tuben verwerfen; VW alle 2–3 Tage (Beläge: täglich). <span class="hand-inline">Handschr.: bei zu trockenen Wunden, wenig Exsudat</span></td></tr>
    <tr><td>Hydrokolloide</td><td>Schaumstoff + selbstklebende quellende Masse → zähes Gel; leicht–stark exsudierend, alle Phasen; selbstklebend, kein Sekundärverband, Duschen möglich</td><td><b>nicht</b> bei klinisch infizierten Wunden, freiliegenden Muskeln/Sehnen/Knochen, ischämischen Ulzera (wenig O₂); häufig Hautirritation/Allergie; faltenfrei; VW wenn Blase die ganze Wunde bedeckt oder Exsudat ausläuft (1–7 Tage). <span class="hand-inline">Handschr.: wird kaum noch verwendet; z. B. bei Stomata, VAC, Wundrändern</span></td></tr>
    <tr><td>Kombinierte Wundverbände</td><td>Primär + Sekundär in einem; sehr hohe Aufnahme, Wundrandschutz, unter Kompression</td><td>infizierte Wunden kritisch; nicht bei trockenen Nekrosen; bis 7 Tage</td></tr>
    <tr><td>Schaumstoffkompressen / Hydropolymere</td><td>Weichschaum nimmt auf ohne Formänderung; Hydropolymere quellen der Wunde entgegen; mäßig–stark exsudierend; atraumatisch, polsternd, unter Kompression</td><td>geben keine Flüssigkeit ab; Austrocknung bei wenig Exsudat; ungeeignet für trockene, nekrotische Wunden; infiziert kritisch. <span class="hand-inline">Handschr.: VAC-System – Schwamm in der Wunde aktiviert Granulation</span></td></tr>
    <tr><td>Offenporige Schaumstoffkompressen</td><td>Wundkonditionierung: haften in der Granulation an, VW reißt auf → Blutung → durchblutetes Granulationsgewebe (z. B. vor Hauttransplantation, offene Frakturen)</td><td>schmerzhaft, zeitaufwendig, Partikel bleiben zurück; <b>Wundrand nicht überlappen</b></td></tr>
    <tr><td>Semipermeable Wundfolien</td><td>transparent; kein Eindringen von Bakterien/Nässe, O₂- und Wasserdampfaustausch; Beobachtung, Duschen möglich</td><td>nicht saugend; <b>KI: nässende und klinisch infizierte Wunden</b>; nicht gedehnt anbringen; Haare kürzen; VW spätestens nach 7 Tagen; Altershaut beachten</td></tr>
    <tr><td>Superabsorber</td><td>sehr große Saugkapazität, Gel schließt Keime/Zelltrümmer ein, Wundrandschutz, Geruch ↓; mäßig–stark exsudierend, exulzerierende Karzinome</td><td><b>nicht</b> bei schwach exsudierenden oder trockenen Wunden (Austrocknung); Volumen-/Gewichtszunahme; Austamponieren kritisch</td></tr>
  </tbody>
</table></div>

<h3>5. Interaktive Wundauflagen <span class="seite">S. 24–26</span></h3>
<p>Halten die Wunde feucht und warm; mit körpereigenen Substanzen identisch oder verwandt. Nutzen für die Wundheilung <b>weitgehend ungeklärt</b>, sehr teuer → kritisch hinterfragen.</p>
<div class="tabelle"><table>
  <thead><tr><th>Auflage</th><th>Inhalt (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Kollagen</td><td>offenporig, saugt Exsudat und Zelltrümmer; soll Granulation/Epithelisierung beschleunigen, belastbarere Narbe; hohe Saugkapazität, reinigend, <b>vollständige Resorption</b> (bleibt bis dahin liegen, nur Sekundärverband wechseln). <b>Nicht bei infizierten Wunden und trockenen Nekrosen</b>; schwach exsudierend → mit NaCl anfeuchten</td></tr>
    <tr><td>Gelatine</td><td>quillt in Wasser; sehr schnelle Blutstillung, hohe Aufnahme, vollständige Resorption; sonst wie Kollagen. <span class="hand-inline">Handschr.: Gelaspon – Blutstillung (Schwamm)</span></td></tr>
    <tr><td>Hyaluronsäure</td><td>bindet Wasser, Gelbildung, wirkt in der Initialphase; Granulat, Auflage, Film; Nachteil: Sekundärverband; chronische, sekundär heilende Wunden.</td></tr>
  </tbody>
</table></div>
<p class="warnung">Heft widersprüchlich (Hyaluronsäure, S. 26): Einsatz bei infizierten Wunden und mit Antiseptika <b>kontraindiziert</b>, im Folgesatz „bei infizierten Wunden und starker Geruchsentwicklung eingesetzt“.</p>

<h3>6. Antibakterielle und geruchsbindende Wundauflagen <span class="seite">S. 27–29</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Auflage</th><th>Inhalt (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Aktivkohle</td><td>trocken Geruchsfilter; durchfeuchtet Bindung von Eiweiß/Bakterien; mit Silber Keimreduktion. Klinisch infizierte, sehr geruchsintensive Wunden; Unterstützung von Débridement/Antibiotika. <b>Nicht zuschneiden</b>; Fixierung nötig; Kohle deckt saugenden Primärverband ab</td></tr>
    <tr><td>Silberhaltig</td><td>nur bei Flüssigkeit wirksam; kritisch kolonisierte, lokal infizierte Wunden; enger Kontakt zum Wundgrund; Auswahl nach Wundverhältnissen, nicht nach Silbergehalt. Ungeklärte Wirksamkeit, potenzielle Toxizität, teuer → <b>so lange wie nötig, so kurz wie möglich</b>. <span class="hand-inline">Handschr.: nicht länger als 14 Tage anwenden</span></td></tr>
    <tr><td>Honig</td><td>hohe Zuckerkonzentration zieht Flüssigkeit, Ödeme ↓, Reinigung; angenehmer Geruch, hohe Akzeptanz. Nachteile: schwankende Eigenschaften, Kontamination (Pestizide, Clostridien, Antibiotika), Schmerz durch osmotischen Zug, Allergien, Sekundärverband</td></tr>
    <tr><td>Hydrophob</td><td>rein physikalisch: hydrophobe Anziehung bindet Keime → keine Allergie/Resistenz; kontaminierte/infizierte postoperative, traumatische Wunden, nach Fistel-/Abszessentfernung, Dehiszenzen. <b>Nicht mit fetthaltigen Materialien kombinieren</b> (hebt Bindung auf). <span class="hand-inline">Handschr.: Cutimed Sorbact – sehr gut wirksam (bakterienbindende Auflage, Gelkompresse); als „interaktiv“ notiert</span></td></tr>
    <tr><td>Antiseptikahaltig</td><td>Kompressen und Hydrogele; Wirkstoff unterstützt Reinigung und reduziert Bakterien im Verband; Hydrogele befeuchten, konserviert länger haltbar; begrenzte Aufnahme, KI je Wirkstoff, Sekundärverband</td></tr>
  </tbody>
</table></div>

<h3>7. Sprühpflaster und lokale Wundtherapeutika <span class="seite">S. 30–31</span></h3>
<ul>
  <li><b>Sprühpflaster:</b> Filmbildner in schnell verdunstenden Lösungsmitteln; elastisch, wasserfest, atmungsaktiv; kleine, oberflächliche Wunden nach Blutstillung. <b>KI:</b> blutende/nässende, infizierte, tiefe/großflächige Wunden, Verbrennungen, Augen, Mund, Schleimhäute.</li>
  <li><b>Lokale Wundtherapeutika</b> halten das feuchte Milieu aufrecht; heute eher untergeordnet, phasengerecht anwenden; nachgewiesene Wirksamkeit, gute Verträglichkeit, gering allergen. Dazu: unkonservierte/konservierte Spüllösungen, Wundantiseptika, Wundsprays, Wund-/Heilsalben, Wundrandschutz/Hautschutz, lokale Hautkleber.</li>
</ul>
<p class="merke"><b>Kernbotschaft</b> (S. 2, 31): Nicht das Neueste oder Teuerste zählt, sondern zu erkennen, <b>welches Produkt wann, wofür und wie lange</b> genutzt werden kann – mit Indikation, Kontraindikation, Anwendungshinweisen und Wechselintervall.</p>

    "Quelle ist ausschließlich das Lernheft; Seitenzahlen in Klammern. Das Heft enthält keine handschriftlichen Notizen oder Prüfungsmarkierungen, daher keine ★. Die im Heft zitierten Primärquellen (v. a. DNQP 2017, NPUAP 2014, Protz/Hinnerk 2019) wurden nicht separat geprüft.",

  karten: [
    { k: "Grundlagen", f: "Welcher Leitsatz leitet den Expertenstandard ein?",
      a: "„Die effektive Prävention von Dekubitus ist eine Kernaufgabe in der Pflege.“ (DNQP 2017) Dekubitus gilt als Indikator der Versorgungsqualität; Prävalenz in Deutschland ca. 2–4 %.", s: "S. 2" },
    { k: "Grundlagen", f: "Welche rechtliche Bedeutung haben Expertenstandards?",
      a: "Sie haben den Charakter vorweggenommener Sachverständigengutachten und dienen vor Gericht als Maßstab bei Verletzung der Sorgfaltspflicht. Der MDK prüft den Standard als Transparenzkriterium.", s: "S. 2" },
    { k: "Basiswissen", f: "Wie ist ein Dekubitus definiert?",
      a: "„Eine lokal begrenzte Schädigung der Haut und/oder des darunter liegenden Gewebes, typischerweise über knöchernen Vorsprüngen, infolge von Druck oder von Druck in Verbindung mit Scherkräften.“ (NPUAP 2014)", s: "S. 3" },
    { k: "Basiswissen", f: "Scherkräfte vs. Reibung?",
      a: "Scherkräfte verformen tieferliegendes Gewebe. Reibung wirkt oberflächlich, meist zwischen Haut und Bettlaken – nicht gleichbedeutend. Einen Schwellenwert für schädlichen Druck gibt es nicht.", s: "S. 3" },
    { k: "Basiswissen", f: "Welche Mechanismen führen zum druckbedingten Zelltod?",
      a: "1. Direkte mechanische Deformation des Gewebes (Muskelzellen besonders anfällig – Nekrose in Minuten).\n2. Verschluss von Blut- und Lymphgefäßen → O₂-/Nährstoffmangel, Stoffwechselprodukte bleiben. Beide verstärken sich.", s: "S. 4" },
    { k: "Basiswissen", f: "Warum kann ein Dekubitus unter intakter Haut liegen?",
      a: "Druckgeschwüre entwickeln sich zuerst in anfälligem Gewebe wie der Muskulatur; die darüberliegende Haut kann intakt sein. Tiefe Schädigungen müssen nicht zwangsläufig ein offener Dekubitus sein.", s: "S. 4" },
    { k: "Risikofaktoren", f: "Welche drei Risikofaktoren sind am wichtigsten?",
      a: "1. Beeinträchtigung der Mobilität (direkt mehr Druck/Scherkraft)\n2. Störung der Durchblutung (schwächt Gewebetoleranz)\n3. Beeinträchtigter Hautzustand bzw. vorhandener Dekubitus. Rahmenmodell der Einschätzung.", s: "S. 4–5" },
    { k: "Risikofaktoren", f: "Weitere Risikofaktoren – zwei Gruppen?",
      a: "Druck/Scherkräfte ↑: eingeschränkte Eigenmobilität, neurologische Störungen, Dauer/Intensität, Reibung, medizinische Geräte (Zu-/Ableitungen).\nGewebetoleranz ↓: Mangelernährung, Durchblutung/O₂, Hautfeuchtigkeit, Hauttoleranz/Auflageflächen.", s: "S. 5" },
    { k: "Risikofaktoren", f: "Wie hängen Gesundheitsprobleme und Risiko zusammen?",
      a: "Je komplexer und schwerwiegender die Gesundheitsprobleme, desto höher der Unterstützungsbedarf. Je höher der Unterstützungsbedarf, desto höher kann das Dekubitusrisiko sein. Faktoren treten meist gemeinsam auf.", s: "S. 5" },
    { k: "Klassifikation", f: "Dekubitus Kategorie I?",
      a: "Intakte Haut mit nicht wegdrückbarer Rötung, meist über einem Knochenvorsprung; Bereich ggf. schmerzhaft, härter, wärmer oder kälter. (EPUAP/NPUAP/PPPIA; ICD-10: Druckzone mit nicht wegdrückbarer Rötung)", s: "S. 5" },
    { k: "Klassifikation", f: "Dekubitus Kategorie II?",
      a: "Teilzerstörung der Haut (Epidermis/Dermis): flaches, offenes Geschwür, rot-rosa Wundbett ohne Beläge; auch intakte/offene serumgefüllte Blase. Nicht für Skin Tears, Pflasterschäden oder Mazeration verwenden.", s: "S. 5–6" },
    { k: "Klassifikation", f: "Dekubitus Kategorie III und IV?",
      a: "III: vollständiger Hautverlust, Subcutis sichtbar, Knochen/Sehnen/Muskeln nicht offen; Beläge, Taschen möglich.\nIV: vollständiger Gewebeverlust mit freiliegenden Knochen, Sehnen, Muskeln; Osteomyelitis, Nekrosen, hohes Infektionsrisiko.", s: "S. 6" },
    { k: "Klassifikation", f: "Unbekannte Tiefe vs. vermutete tiefe Gewebeschädigung?",
      a: "Unbekannte Tiefe: vollständiger Gewebeverlust, Wundbett durch Beläge/Schorf verdeckt. Vermutete tiefe Schädigung: intakte Haut, livide oder rötlich-braun, ggf. blutgefüllte Blase; Gewebe schmerzhaft, fest, breiig, wärmer/kälter.", s: "S. 6" },
    { k: "Aufbau", f: "Welches Ziel hat der Expertenstandard?",
      a: "Jeder dekubitusgefährdete Mensch erhält eine Prophylaxe, die die Entstehung eines Dekubitus verhindert. Im Vordergrund stehen Interventionen, v. a. Bewegungsförderung, zur Druckentlastung und -verteilung.", s: "S. 7" },
    { k: "Aufbau", f: "Was muss das Pflegefachpersonal gewährleisten?",
      a: "Systematische Risikoeinschätzung · Information, Schulung, Beratung (auch Angehörige) · Bewegungsförderung · Druckentlastung und -verteilung · Kontinuität und Evaluation prophylaktischer Maßnahmen.", s: "S. 7" },
    { k: "Aufbau", f: "Gilt das Ziel auch in der Sterbephase?",
      a: "Bei lebensbedrohlichen Zuständen oder anderer Prioritätensetzung (Sterbephase) ist das Ziel ggf. nicht erreichbar. Das entbindet aber nicht von Risikoeinschätzung, Information und gemeinsamer Entscheidung über passende Maßnahmen.", s: "S. 7" },
    { k: "Aufbau", f: "Anwender und Zielgruppe?",
      a: "Anwender: Pflegefachkräfte ambulant, stationäre Altenhilfe, Gesundheitsversorgung.\nZielgruppe: Menschen jeden Alters mit erhöhtem Dekubitusrisiko; Angehörige/informelle Pflegende ausdrücklich eingeschlossen.", s: "S. 7–8" },
    { k: "Aufbau", f: "Nenne die fünf Phasen der Dekubitusprophylaxe.",
      a: "1. Risikoeinschätzung\n2. Maßnahmenplanung\n3. Information, Beratung, Schulung\n4. Maßnahmendurchführung (Bewegungsförderung, Hilfsmitteleinsatz)\n5. Evaluation – jeweils mit Struktur-, Prozess-, Ergebniskriterien.", s: "S. 8" },
    { k: "Phase 1", f: "Was fordern S1, P1 und E1?",
      a: "S1: aktuelles Wissen zur Entstehung, Kompetenz zur Einschätzung · P1: unmittelbar zu Beginn bei allen systematisch: Screening, ggf. differenzierte Beurteilung; Wiederholung · E1: aktuelle, systematische Einschätzung liegt vor.", s: "S. 10" },
    { k: "Phase 1", f: "Welches Wissen umfasst S1?",
      a: "Aufbau und Funktion der Haut · Ursachen und Risikofaktoren · Anzeichen eines Risikos inkl. Kategorien · gefährdete Körperstellen · besonders gefährdete Populationen. Nur durch regelmäßige Fortbildung erreichbar.", s: "S. 11" },
    { k: "Phase 1", f: "Was wird in der differenzierten Einschätzung beurteilt?",
      a: "Mobilität/Immobilität · Hautzustand/vorhandener Dekubitus · Durchblutungsstörungen · sensorische Wahrnehmung · Diabetes mellitus · Allgemeinzustand/Begleiterkrankungen · Ernährungszustand · Hautfeuchtigkeit.", s: "S. 11" },
    { k: "Phase 1", f: "Welche Rolle spielen Braden- und Norton-Skala?",
      a: "Standardisierte Assessments wie Braden oder Norton werden nicht empfohlen, können aber als unterstützende Informationsquelle genutzt werden. Maßgeblich ist die klinische Einschätzung inkl. Hautinspektion. Ja/Nein- oder Punktbögen eher ungünstig.", s: "S. 11–12" },
    { k: "Phase 1", f: "Wann muss erneut eingeschätzt werden?",
      a: "In individuell festzulegenden Abständen · unverzüglich bei Veränderung der Mobilität/Selbstständigkeit (BRi) · beim Hinzukommen externer Faktoren (z. B. Katheter), die Druck/Scherkräfte verlängern.", s: "S. 12" },
    { k: "Phase 1", f: "Wann darf das Screening übersprungen werden?",
      a: "Bei bestimmten Patientengruppen (z. B. Intensivpflege, Geriatrie), weil dort grundsätzlich ein Dekubitusrisiko besteht → sofort differenzierte Risikoeinschätzung.", s: "S. 22" },
    { k: "Phase 2", f: "Was fordern S2a, S2b, P2 und E2?",
      a: "S2a: Planungs- und Steuerungskompetenz · S2b: Verfahrensregelung · P2: individuelle Planung mit Betroffenen/Angehörigen, Information aller Beteiligten · E2: Gefährdung und Maßnahmen allen bekannt und kontinuierlich fortgeführt.", s: "S. 12" },
    { k: "Phase 2", f: "Warum ist Kontinuität so wichtig – wer wird informiert?",
      a: "Prophylaxe ist nur wirksam, wenn kontinuierlich durchgeführt; Versorgung meist berufsgruppen- und sektorübergreifend → alle Beteiligten informieren, z. B. Personal in Arztpraxen und Transportdiensten.", s: "S. 12–13" },
    { k: "Phase 3", f: "Was fordern S3a, S3b, P3 und E3?",
      a: "S3a: Fähigkeiten zu Information, Schulung, Beratung · S3b: Einrichtung stellt Material · P3: erläutert Gefährdung, Maßnahmen, Evaluation · E3: Betroffene/Angehörige kennen Gefahr und Maßnahmen und wirken mit.", s: "S. 13" },
    { k: "Phase 3", f: "Ziele der Anleitung und Schulung?",
      a: "Förderung der Eigenbewegung · Befähigung zur Hautinspektion · Durchführung druckentlastender Interventionen · sicherer und adäquater Einsatz druckverteilender/-entlastender Hilfsmittel.", s: "S. 14" },
    { k: "Phase 3", f: "Was gehört in das Beratungsgespräch?",
      a: "Alternativen aufzeigen · Vor- und Nachteile der Bewegungsmaßnahmen · Ziele der Maßnahmen · Folgen nicht stattfindender Intervention · Bedeutung regelmäßiger Hautinspektionen. Der Beratungsprozess ist nie gänzlich abgeschlossen.", s: "S. 14" },
    { k: "Phase 4", f: "Was fordern S4, P4 und E4?",
      a: "S4: Wissen zu druckentlastenden, bewegungsfördernden Maßnahmen; haut-/gewebeschonende Techniken · P4: fördert Eigenbewegung; sonst sofortige Druckentlastung und vollständige Freilage · E4: Eigenbewegung gefördert, Stellen entlastet.", s: "S. 15" },
    { k: "Phase 4", f: "Nenne die vier Interventionskategorien.",
      a: "1. Förderung der Eigenbewegung\n2. angemessene Positionen und regelmäßige Positionswechsel (Wechselpositionierung)\n3. vollständige Entlastung stark gefährdeter Stellen (Freilage)\n4. Reduktion therapiebedingter Druck-/Scherkräfte (Zu- und Ableitungen).", s: "S. 16" },
    { k: "Phase 4", f: "Aktive vs. passive Bewegung?",
      a: "Passiv sind alle Maßnahmen, die eine pflegerisch durchgeführte Wechselpositionierung oder Freilage beinhalten. Während der Positionierung Hautzustand kontrollieren und Schmerzen/Unbehagen erfassen; Angehörige anleiten.", s: "S. 16" },
    { k: "Phase 4", f: "Was gehört in den Bewegungsförderungsplan?",
      a: "Nicht nur Rechts-Links-Rücken, sondern z. B. 30–40° Seitenlage, Oberkörperhochlage max. 30°, Mobilisierung; individuelle Bewegungsintervalle und deren Auswertung; Hautkontrolle (Fingertest) und Ergebnisse.", s: "S. 16–17" },
    { k: "Phase 4", f: "Welche Haltung gilt gegenüber den Wünschen der Betroffenen?",
      a: "Der Wille des dekubitusgefährdeten Menschen und seiner Angehörigen ist stets zu respektieren; ihnen obliegt die freie Entscheidung über den Umfang der Mitwirkung. Ablehnung wird dokumentiert.", s: "S. 15, 19" },
    { k: "Hilfsmittel", f: "Was fordern S5a, S5b, P5 und E5?",
      a: "S5a: Kompetenz zu Notwendigkeit und Eignung von Hilfsmitteln · S5b: Wechseldruck-/Weichlagerungssysteme unverzüglich zugänglich · P5: Hilfsmittel, wenn Bewegungsförderung nicht ausreicht · E5: unverzüglich auf geeignetem Hilfsmittel.", s: "S. 17" },
    { k: "Hilfsmittel", f: "Braucht jeder gefährdete Mensch eine Spezialmatratze?",
      a: "Nein. Hilfsmittel unterstützen, ersetzen aber nicht die Förderung der Eigenbewegung. Es gibt nicht „ein richtiges“ Hilfsmittel – die Wahl richtet sich nach dem individuellen Nutzen.", s: "S. 17–18" },
    { k: "Hilfsmittel", f: "Kriterien für die Hilfsmittelauswahl?",
      a: "Ressourcen der Eigenbewegung · vorrangige Pflege-/Therapieziele (z. B. Schmerzreduktion) · Möglichkeiten der Eigenbewegung · gefährdete Körperpartien · Gewicht · Kosten/Nutzen · Präferenzen · Praktikabilität · Nachteile.", s: "S. 18" },
    { k: "Hilfsmittel", f: "Welche Hilfsmittel sind geeignet?",
      a: "Weichlagerungskissen, Weichlagerungsmatratzen, Wechseldruckauflagen/-matratzen, Spezialbetten (z. B. Luftkissenbetten).", s: "S. 18" },
    { k: "Hilfsmittel", f: "Welche Hilfsmittel sind ungeeignet – und warum?",
      a: "Lagerungsringe (Druckerhöhung an den Rändern) · Felle, Watteverbände, Wassermatratzen (fehlende Wirksamkeit) · reibungskraftreduzierte Hydrokolloid-Pflaster (Ferse).", s: "S. 18" },
    { k: "Hilfsmittel", f: "Wie schnell muss Druck entlastet werden?",
      a: "Bereits 10–20 Minuten erhöhter Druck/Scherkraft können zu Dekubitus führen → unverzüglich Druckverteilung/-entlastung; bis Hilfsmittel eintreffen, individuell angepasste Positionierung.", s: "S. 18" },
    { k: "Hilfsmittel", f: "Wann sind Hilfsmittel unverzüglich einzusetzen (P5)?",
      a: "Wenn eine ausreichende Bewegungsförderung nicht möglich ist, z. B. bei Kachexie, fehlender Eigenbeweglichkeit oder krankheits-/therapiebedingten Kontraindikationen. Sonst bleibt Bewegungsförderung oberstes Gebot.", s: "S. 19" },
    { k: "Hilfsmittel", f: "Hilfsmittelversorgung ambulant – was tun?",
      a: "Versorgung meist über die Pflegekassen → Pflegekasse bzw. Ärzte über Notwendigkeit und Dringlichkeit informieren, Verordnung anregen. Ablehnung durch Kostenträger oder Betroffene dokumentieren.", s: "S. 18–19" },
    { k: "Phase 5", f: "Was fordern S6a, S6b, P6, E6a und E6b?",
      a: "S6a: Kompetenz, Effektivität zu beurteilen · S6b: Ressourcen zur Erfassung · P6: Hautzustand in individuellen Abständen begutachten · E6a: kein Dekubitus · E6b: Zahlen zu Häufigkeit und Wirksamkeit.", s: "S. 19" },
    { k: "Phase 5", f: "Wie funktioniert der Fingertest?",
      a: "Leichter Fingerdruck auf die gerötete Stelle (alternativ transparente Plastikscheibe):\nHaut wird weiß → kein Dekubitus.\nHaut bleibt rot → Dekubitus Kategorie I.", s: "S. 20" },
    { k: "Phase 5", f: "Was gilt bei dunkel pigmentierter Haut?",
      a: "Die Verfärbung ist ggf. nicht sichtbar → weitere Parameter beurteilen: Ist der Bereich schmerzhaft, härter, weicher, wärmer oder kälter als das umgebende Gewebe?", s: "S. 20" },
    { k: "Phase 5", f: "Was ist zu tun, wenn ein Dekubitus festgestellt wird?",
      a: "Prophylaktische Maßnahmen überprüfen; Wunde nach dem Expertenstandard Pflege von Menschen mit chronischen Wunden versorgen. Inspektion stets der gesamten Körperoberfläche; Hilfsmittel auf Intaktheit prüfen.", s: "S. 20–21" },
    { k: "Einführung", f: "Schritte zur Einführung des Standards?",
      a: "Auseinandersetzung auf Managementebene (PDL/QMB) · Verständnis der Zielsetzung · Reflexion der Ressourcen · Anpassung im Qualitätszirkel · Implementierungsschritte mit verbindlicher Terminierung · Information und Schulung.", s: "S. 21–22" },
    { k: "Prozess", f: "Beschreibe den Prozessablauf.",
      a: "Risikogruppe? Ja → differenzierte Beurteilung; nein → Screening (ausschließbar → Ende). Risiko → sofortige Druckentlastung + Planung → Beratung → Durchführung → Eigenbewegung ausreichend? (nein → Freilage + Hilfsmittel) → Evaluation → erfolgreich? → kein Dekubitus.", s: "S. 24" }
  ],

    { f: "Wie definiert die NPUAP (2014) einen Dekubitus?",

    { f: "Was unterscheidet Scherkräfte von Reibung?",

    { f: "Welches Gewebe gilt als besonders anfällig für druckbedingte Schäden?",

    { f: "Welcher Merksatz zu Risikofaktoren steht im Heft?",

    { f: "Was unterscheidet Kategorie IV von Kategorie III?",

    { f: "Welches Ziel verfolgt der Expertenstandard Dekubitusprophylaxe?",
      o: ["Jeder dekubitusgefährdete Mensch erhält eine Prophylaxe, die die Entstehung eines Dekubitus verhindert", "Jeder Mensch über 65 erhält eine Spezialmatratze", "Bestehende Dekubitus sollen innerhalb von zwei Wochen abheilen", "Die Risikoeinschätzung soll durch Hilfsmittel ersetzt werden"],

    { f: "Was gilt in der Sterbephase?",

    { f: "Wer gehört zur Zielgruppe des Expertenstandards?",

    { f: "Welche Kriterienarten gibt es in jeder Phase des Expertenstandards?",

    { f: "Wann erfolgt die Risikoeinschätzung nach P1?",

    { f: "Was folgt, wenn das initiale Screening ein Dekubitusrisiko ausschließt?",

    { f: "Welche Rolle spielen Braden- und Norton-Skala laut Expertenstandard?",

    { f: "Bei welchen Gruppen kann das Screening übersprungen werden?",

      e: "Bei bestimmten Gruppen (z. B. Intensivpflege, Geriatrie) besteht grundsätzlich ein Dekubitusrisiko → sofort differenzierte Risikoeinschätzung.", s: "S. 22" },
    { f: "Welche Aussage zur Maßnahmenplanung (Phase 2) trifft zu?",

      e: "Der Beratungsprozess ist nie gänzlich abgeschlossen; er erfolgt wiederholt im gesamten Pflegeprozess und wird dokumentiert.", s: "S. 14" },
    { f: "Welche gehören zu den vier Interventionskategorien der Maßnahmendurchführung?",

      e: "Vier Kategorien: Eigenbewegung fördern · angemessene Positionen und regelmäßige Positionswechsel (Wechselpositionierung) · Freilage · Reduktion therapiebedingter Druck-/Scherkräfte (Zu- und Ableitungen). Lagerungsringe sind ungeeignet.", s: "S. 16, 18" },
    { f: "Was versteht das Heft unter passiver Bewegung?",

      e: "Passiv sind alle Maßnahmen, die eine pflegerisch durchgeführte Wechselpositionierung oder Freilage beinhalten; dabei Hautzustand und Unbehagen kontrollieren.", s: "S. 16" },
    { f: "Welche Positionierungsangaben nennt das Heft für den Bewegungsförderungsplan?",

      e: "Der Plan dokumentiert nicht nur Rechts-Links-Rücken, sondern z. B. 30–40° Seitenlage, Oberkörperhochlage max. 30°, Mobilisierung, Bewegungsintervalle und Hautkontrolle (Fingertest).", s: "S. 16–17" },
    { f: "Braucht jeder dekubitusgefährdete Mensch eine Spezialmatratze?",

    { f: "Welche Hilfsmittel nennt das Heft als geeignet?",

<h3>1. Hintergrund <span class="seite">S. 2</span></h3>

<h3>2. Basiswissen Dekubitus <span class="seite">S. 3–6</span></h3>
<p class="merke"><b>Dekubitus</b> (NPUAP 2014): „eine lokal begrenzte Schädigung der Haut und/oder des darunter liegenden Gewebes, typischerweise über knöchernen Vorsprüngen, infolge von <b>Druck oder von Druck in Verbindung mit Scherkräften</b>.“</p>
<ul>
  <li>Druck auf weiches Gewebe zwischen harter Unterlage und Knochenvorsprung; Scherkräfte verformen tieferes Gewebe (≠ Reibung, die oberflächlich wirkt). Schaden abhängig von Dauer und Stärke; <b>kein Schwellenwert</b> bekannt; zusätzlich von weiteren Risikofaktoren abhängig (S. 3).</li>
  <li><b>Ursachen</b> (S. 4): direkte mechanische <b>Deformation</b> → Zelltod (Muskelzellen besonders anfällig, Muskelnekrosen in wenigen Minuten; Hautzellen widerstandsfähiger) und <b>Verschluss von Blut- und Lymphgefäßen</b> → Minderversorgung mit O₂/Nährstoffen, Stoffwechselprodukte bleiben; bei Druckentlastung Entzündung. Beide Mechanismen verstärken sich gegenseitig.</li>
  <li>Druckgeschwüre entstehen zuerst in anfälligem Gewebe wie der Muskulatur – die darüberliegende Haut kann intakt sein: <b>Tiefe Schädigungen müssen nicht zwangsläufig ein offener Dekubitus sein</b> (S. 4).</li>
</ul>

<h3>3. Ziel, Anwender, Struktur <span class="seite">S. 7–9</span></h3>
<ul>
  <li>Interventionen v. a. <b>Bewegungsförderung</b> zur Druckentlastung und -verteilung. <b>Ziel:</b> jeder dekubitusgefährdete Mensch erhält eine Prophylaxe, die einen Dekubitus verhindert (S. 7).</li>
  <li><b>Pflegefachpersonal gewährleistet:</b> systematische Risikoeinschätzung · Information, Schulung, Beratung (auch Angehörige) · Bewegungsförderung · Druckentlastung und -verteilung · Kontinuität und Evaluation (S. 7).</li>
  <li>Wenn die gesundheitliche Situation dagegen spricht (lebensbedrohlich) oder andere Prioritäten gelten (Sterbephase), ist das Ziel ggf. nicht erreichbar – entbindet aber <b>nicht</b> von Risikoeinschätzung, Information und gemeinsamer Entscheidung (S. 7).</li>
  <li><b>Anwender:</b> Pflegefachkräfte (ambulant, stationäre Altenhilfe, Gesundheitsversorgung). <b>Zielgruppe:</b> Menschen jeden Alters mit erhöhtem Risiko; Angehörige/informelle Pflegende ausdrücklich eingeschlossen. Aktuelle Fassung umfasst auch Neugeborene, Säuglinge, Kinder; das Lernheft behandelt nur Erwachsene und Ältere (S. 7–8).</li>
  <li>Sechs zentrale Bereiche in <b>fünf Phasen</b>: Risikoeinschätzung · Maßnahmenplanung · Information, Beratung, Schulung · Maßnahmendurchführung (Bewegungsförderung + Hilfsmittel) · Evaluation; jeweils Struktur-, Prozess-, Ergebniskriterien (S. 8).</li>

<p><b>Phase 1 – Risikoeinschätzung</b> (S. 10–12)</p>
<ul>
  <li><b>S1-Wissen:</b> Aufbau/Funktion der Haut, Ursachen und Risikofaktoren, Anzeichen inkl. Kategorien, gefährdete Körperstellen und Populationen; nur über regelmäßige Fortbildung erreichbar.</li>
  <li><b>Screening</b>: erste Beobachtung und Anamnese zu Hinweisen auf erhöhte/verlängerte Druck- oder Scherkrafteinwirkung; Risiko ausgeschlossen → keine weitere Einschätzung. Sonst <b>differenzierte Einschätzung</b> von: Mobilität, Hautzustand/vorhandener Dekubitus, Durchblutung, sensorische Wahrnehmung, Diabetes mellitus, Allgemeinzustand/Begleiterkrankungen, Ernährungszustand, Hautfeuchtigkeit.</li>
  <li>Bögen mit nur Ja/Nein oder Punktbewertung eher ungünstig. <b>Braden oder Norton</b>: nicht empfohlen, aber als unterstützende Informationsquelle nutzbar; Kern ist die <b>klinische Einschätzung</b> (inkl. Hautinspektion); Ergebnis in Pflegeplanung bzw. Risikomatrix im Strukturmodell.</li>
  <li><b>Erneute Einschätzung:</b> individuell festgelegte Abstände · unverzüglich bei Veränderung der Mobilität/Selbstständigkeit (BRi) · bei externen Einflussfaktoren (z. B. Katheter).</li>
  <li>Screening kann bei bestimmten Gruppen (Intensivpflege, Geriatrie) übersprungen werden – dort grundsätzlich Risiko → direkt differenzierte Einschätzung (S. 22).</li>
</ul>
<p><b>Phase 2 – Maßnahmenplanung</b> (S. 12–13): Prophylaxe nur wirksam, wenn <b>kontinuierlich</b>; Verfahrensregelung (z. B. Ablaufdiagramm) für Informationsweitergabe; auch Personal von Arztpraxen und <b>Transportdiensten</b> informieren.</p>
<p><b>Phase 3 – Information, Beratung, Schulung</b> (S. 13–14): Selbstbestimmungsrecht, gemeinsame Entscheidungsfindung. Ziele: Eigenbewegung fördern, Hautinspektion, druckentlastende Interventionen, sicherer Hilfsmitteleinsatz. In der Beratung: Alternativen, Vor-/Nachteile, Ziele, Folgen unterlassener Intervention, Bedeutung regelmäßiger Hautinspektion. <b>Der Beratungsprozess ist nie gänzlich abgeschlossen</b>, er erfolgt wiederholt im gesamten Pflegeprozess; dokumentieren.</p>
<p><b>Phase 4 – Maßnahmendurchführung</b> (S. 15–19): Wille der Betroffenen stets respektieren (freie Entscheidung über Mitwirkung).</p>
<ul>
  <li><b>Vier Interventionskategorien:</b> Eigenbewegung fördern · angemessene Körperpositionen und regelmäßige Positionswechsel („Wechselpositionierung“) · vollständige Entlastung stark gefährdeter Stellen („<b>Freilage</b>“) · Vermeidung therapiebedingter Druck-/Scherkräfte (Zu- und Ableitungen). Bezug zu den Standards Sturzprophylaxe und Mobilität (S. 16).</li>
  <li>Einschränkungen (z. B. Schmerzen) vorab klären; individueller <b>Bewegungsförderungsplan</b>; aktiv vs. passiv (passiv = pflegerisch durchgeführte Wechselpositionierung/Freilage); Hautzustand und Unbehagen regelmäßig kontrollieren; Angehörige anleiten (S. 16).</li>
  <li>Plan dokumentiert nicht nur Rechts-Links-Rücken, sondern z. B. <b>30–40° Seitenlage</b>, <b>Oberkörperhochlage max. 30°</b>, Mobilisierung; Bewegungsintervalle und <b>Hautkontrolle (Fingertest)</b> dokumentieren (S. 16–17).</li>
  <li>Hilfsmittel unterstützen, <b>ersetzen aber nicht</b> die Förderung der Eigenbewegung. <b>Nicht jeder dekubitusgefährdete Mensch benötigt eine Spezialmatratze.</b> Es gibt nicht „ein richtiges“ Hilfsmittel (S. 17–18).</li>
  <li><b>Auswahlkriterien:</b> Ressourcen der Eigenbewegung, vorrangige Pflege-/Therapieziele, Möglichkeiten der Eigenbewegung, gefährdete Körperpartien, Gewicht, Kosten/Nutzen, Präferenzen, Praktikabilität, Nachteile (S. 18).</li>
  <li>Bereits <b>10–20 Minuten</b> erhöhter Druck/Scherkraft können zu Dekubitus führen → Druckentlastung <b>unverzüglich</b> (S5b); bis Hilfsmittel da sind, angepasste Positionierung (S. 18). Ambulant: Pflegekasse/Ärzte über Notwendigkeit und Dringlichkeit informieren, Verordnung anregen.</li>
  <li><b>P5:</b> Hilfsmittel unverzüglich, wenn Bewegungsförderung nicht möglich (z. B. Kachexie, fehlende Eigenbeweglichkeit, Kontraindikationen); sonst bleibt Bewegungsförderung oberste Bedeutung. Ablehnung von Hilfsmitteln oder durch Kostenträger dokumentieren – Selbstbestimmung hat oberste Priorität (S. 19).</li>
</ul>

<p><b>Phase 5 – Evaluation</b> (S. 19–21): Wirksamkeit durch Hautkontrolle und wiederholte Risikoeinschätzung; Akzeptanz entscheidend; Probleme gemeinsam lösen. Einrichtung (S6b): Personal, Fortbildung, Instrumente, Hilfsmittel, Erfassung von Dekubitushäufigkeit, interne Qualitätsprüfungen. Inspektion der <b>gesamten Körperoberfläche</b>; bei Dekubitus Prophylaxe überprüfen, Wunde nach Expertenstandard chronische Wunden versorgen; Hilfsmittel auf Intaktheit prüfen.</p>

  <li><b>Prozessablauf</b> (S. 24): Versorgungsbeginn/Veränderung der Mobilität oder externer Faktoren → Risikogruppe? (ja → differenzierte Beurteilung; nein → initiales Screening → Risiko ausschließbar? ja → keine weitere Einschätzung) → Risiko? → <b>sofortige Druckentlastung + Maßnahmenplanung</b> → Information, Beratung, Schulung (Betroffene, Angehörige, alle Beteiligten) → Durchführung → ausreichende Eigenbewegung? (ja → Bewegungsförderung; nein → haut-/gewebeschonende Bewegung + Freilage + Hilfsmittel) → Evaluation → erfolgreich? (nein → zurück zur Planung; ja → <b>kein Dekubitus</b>, Evaluation regelmäßig wiederholen).</li>
</ul>
