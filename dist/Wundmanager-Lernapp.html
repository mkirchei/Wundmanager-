<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wundmanager Prüfungstrainer</title>
<meta name="theme-color" content="#0e6a64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wundtrainer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: eine zentrale Arbeitsspalte, oben feste Navigation; Karten als einziges "Objekt" mit Fläche. */
:root {
  --bg: #eef3f2;
  --surface: #ffffff;
  --surface-2: #f6f9f8;
  --ink: #132523;
  --muted: #566a66;
  --line: #d3dedb;
  --accent: #0e6a64;
  --accent-ink: #ffffff;
  --accent-soft: #d8ebe8;
  --ok: #2b7a4b;
  --ok-soft: #dff0e5;
  --warn: #9a6512;
  --warn-soft: #f6ead3;
  --bad: #b03f35;
  --bad-soft: #f6e0dd;
  --hand: #6c4f9e;
  --hand-soft: #ece6f6;
  --box0: #c4d0cd;
  --box1: #c9574c;
  --box2: #d98b3a;
  --box3: #c9b23f;
  --box4: #6aa86f;
  --box5: #2b7a4b;
  --shadow: 0 1px 2px rgba(19, 37, 35, .06), 0 6px 20px rgba(19, 37, 35, .07);
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1615; --surface: #15211f; --surface-2: #1a2826; --ink: #e2ecea; --muted: #94a8a4; --line: #2a3a37;
    --accent: #4fb5ab; --accent-ink: #06201d; --accent-soft: #19332f;
    --ok: #63c38d; --ok-soft: #173326; --warn: #e2b25a; --warn-soft: #362a14; --bad: #e57f73; --bad-soft: #3a1d1a;
    --hand: #b9a1e6; --hand-soft: #2a2238;
    --box0: #3a4a47; --box1: #d8675b; --box2: #e09a4c; --box3: #d6c055; --box4: #7cbc81; --box5: #4fae74;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1615; --surface: #15211f; --surface-2: #1a2826; --ink: #e2ecea; --muted: #94a8a4; --line: #2a3a37;
  --accent: #4fb5ab; --accent-ink: #06201d; --accent-soft: #19332f;
  --ok: #63c38d; --ok-soft: #173326; --warn: #e2b25a; --warn-soft: #362a14; --bad: #e57f73; --bad-soft: #3a1d1a;
  --hand: #b9a1e6; --hand-soft: #2a2238;
  --box0: #3a4a47; --box1: #d8675b; --box2: #e09a4c; --box3: #d6c055; --box4: #7cbc81; --box5: #4fae74;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
main { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- Kopf & Navigation ---------- */
.kopf {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.kopf-innen {
  max-width: 880px; margin: 0 auto; padding: 10px 16px 0;
  display: flex; flex-direction: column; gap: 8px;
}
.marke { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.marke h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
.marke span { color: var(--muted); font-size: .85rem; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
.nav::-webkit-scrollbar { display: none; }
.nav button {
  border: 0; background: none; cursor: pointer; white-space: nowrap;
  padding: 8px 12px 10px; font-family: var(--f-display); font-weight: 600; font-size: .98rem;
  color: var(--muted); border-bottom: 3px solid transparent;
}
.nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.nav button:hover { color: var(--ink); }

main { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
section[role="tabpanel"] { display: flex; flex-direction: column; gap: 20px; }
section[role="tabpanel"] > * { min-width: 0; }

/* ---------- Allgemeine Bausteine ---------- */
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.leise { color: var(--muted); }
.klein { font-size: .875rem; }
.zeile { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.zeile-sb { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.stapel { display: flex; flex-direction: column; gap: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 700; font-size: .95rem;
  min-height: 42px; text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.btn.primaer { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primaer:hover { filter: brightness(1.07); }
.btn.gefahr { color: var(--bad); }
.btn.gefahr.scharf { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.gross { padding: 12px 20px; font-size: 1.02rem; min-height: 50px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; cursor: pointer; font-size: .9rem; font-weight: 700; color: var(--muted);
  display: inline-flex; gap: 6px; align-items: center;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip .zahl { font-variant-numeric: tabular-nums; font-weight: 400; opacity: .8; }

.feld { display: flex; flex-direction: column; gap: 6px; }
.feld label { font-weight: 700; font-size: .9rem; }
.feld input, .feld select, .feld textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%;
}
.feld textarea { min-height: 96px; resize: vertical; }
textarea.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .82rem; min-height: 180px; }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.panel h2 { font-size: 1.2rem; }
.panel h3 { font-size: 1.05rem; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
  white-space: nowrap;
}
.badge.seite { font-variant-numeric: tabular-nums; }
.badge.hand { background: var(--hand-soft); color: var(--hand); border-color: transparent; }
.badge.akzent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.meldung { border-radius: 10px; padding: 10px 14px; font-size: .92rem; }
.meldung.ok { background: var(--ok-soft); color: var(--ok); }
.meldung.fehler { background: var(--bad-soft); color: var(--bad); }

/* ---------- Übersicht ---------- */
.held { display: flex; flex-direction: column; gap: 14px; padding-block: 6px; }
.held h2 { font-size: clamp(1.6rem, 4.5vw, 2.2rem); letter-spacing: -.02em; }
.held p { margin: 0; max-width: 60ch; color: var(--muted); }
.kennzahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kennzahl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kennzahl b { display: block; font-family: var(--f-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kennzahl span { color: var(--muted); font-size: .85rem; }

.themaliste { display: flex; flex-direction: column; gap: 12px; }
.themazeile { display: flex; flex-direction: column; gap: 10px; }
.themazeile .kopfzeile { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.themazeile h3 { font-size: 1.1rem; }
.faecher { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--box0); }
.faecher i { display: block; height: 100%; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.legende span { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.legende span::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c); }

/* ---------- Lernkarten ---------- */
.lernbereich { display: flex; flex-direction: column; gap: 14px; }
.fortschritt { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fortschritt i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.karte {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  padding: 22px 22px 18px; min-height: 300px; display: flex; flex-direction: column; gap: 16px;
  cursor: pointer; position: relative;
}
.karte .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.karte .frage { font-family: var(--f-display); font-size: clamp(1.25rem, 3.6vw, 1.55rem); font-weight: 600; line-height: 1.3; text-wrap: balance; }
.karte .antwort { white-space: pre-line; font-size: 1.05rem; border-top: 1px dashed var(--line); padding-top: 14px; }
.karte .tipp { margin-top: auto; color: var(--muted); font-size: .85rem; }
.bewertung { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bewertung .btn { flex-direction: column; gap: 0; min-height: 58px; }
.bewertung .btn small { font-weight: 400; font-size: .75rem; color: var(--muted); }
.bewertung .nein { border-color: var(--bad); color: var(--bad); }
.bewertung .halb { border-color: var(--warn); color: var(--warn); }
.bewertung .ja { border-color: var(--ok); color: var(--ok); }
.tasten { font-size: .78rem; color: var(--muted); }
kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); }

/* ---------- Quiz ---------- */
.optionen { display: flex; flex-direction: column; gap: 10px; }
.option {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-size: 1rem;
}
.option:hover:not([disabled]) { border-color: var(--accent); }
.option .bst {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: .85rem;
}
.option[disabled] { cursor: default; }
.option.richtig { border-color: var(--ok); background: var(--ok-soft); }
.option.richtig .bst { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.option.falsch { border-color: var(--bad); background: var(--bad-soft); }
.option.falsch .bst { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.option.mehr .bst { border-radius: 6px; }
.option.gewaehlt { border-color: var(--accent); background: var(--accent-soft); }
.option.gewaehlt .bst { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.option.verpasst { border-style: dashed; background: var(--surface); }
.option.verpasst .bst { background: var(--surface); color: var(--ok); }
.sim-panel { border-color: var(--accent); }
.sim-uhr { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.sim-uhr .knapp { color: var(--bad); }
.erklaerung { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--line); }
.ergebnis-zahl { font-family: var(--f-display); font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }

/* ---------- Skript ---------- */
.skript { font-size: 1rem; }
.skript h3 { font-size: 1.15rem; margin-top: 26px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; scroll-margin-top: 120px; }
.skript h3:first-child { margin-top: 0; }
.skript h4 { font-size: 1rem; margin-top: 16px; margin-bottom: 4px; }
.skript ul { margin: 6px 0; padding-left: 1.2em; }
.skript li { margin: 4px 0; max-width: 72ch; }
.skript p { margin: 8px 0; max-width: 72ch; }
.skript .seite { font-family: var(--f-body); font-size: .78rem; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.skript .stern { color: var(--warn); }
.skript .warnung { background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.skript .warnung::before { content: "Achtung · "; font-weight: 700; color: var(--warn); }
.skript .hand { background: var(--hand-soft); border-radius: 10px; padding: 10px 14px; }
.skript .hand::before { content: "Handschriftlich · "; font-weight: 700; color: var(--hand); }
.skript .hand-inline { background: var(--hand-soft); border-radius: 4px; padding: 0 4px; }
.skript .merke { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; }
.tabelle { overflow-x: auto; max-width: 100%; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; }
.tabelle table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.tabelle caption { text-align: left; font-weight: 700; padding: 10px 12px 6px; font-family: var(--f-display); }
.tabelle th, .tabelle td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.tabelle th { background: var(--surface-2); font-size: .82rem; letter-spacing: .02em; }
.tabelle td:first-child { font-weight: 700; white-space: nowrap; }
.inhalt { display: flex; flex-wrap: wrap; gap: 6px; }
.inhalt a { font-size: .85rem; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
.treffer { display: flex; flex-direction: column; gap: 10px; }
.treffer .panel { gap: 6px; padding: 14px; }
.treffer .a { white-space: pre-line; }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ---------- Themen ---------- */
.themen-tabelle { display: flex; flex-direction: column; gap: 10px; }
.themen-tabelle .panel { gap: 10px; }
details.panel > summary { cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
details.panel[open] > summary { margin-bottom: 4px; }
pre.vorlage { overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .8rem; margin: 0; }

.leer { text-align: center; padding: 30px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }

@media (max-width: 520px) {
  .nav button { padding: 8px 8px 10px; font-size: .94rem; }
  .karte { padding: 18px 16px 14px; min-height: 260px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-innen">
    <div class="marke">
      <h1>Wundmanager Prüfungstrainer</h1>
      <span id="kopf-info"></span>
    </div>
    <nav class="nav" role="tablist" aria-label="Bereiche">
      <button role="tab" id="tab-start" aria-controls="p-start" data-tab="start">Start</button>
      <button role="tab" id="tab-karten" aria-controls="p-karten" data-tab="karten">Karten</button>
      <button role="tab" id="tab-quiz" aria-controls="p-quiz" data-tab="quiz">Quiz</button>
      <button role="tab" id="tab-skript" aria-controls="p-skript" data-tab="skript">Skript</button>
      <button role="tab" id="tab-themen" aria-controls="p-themen" data-tab="themen">Themen</button>
    </nav>
  </div>
</header>

<main>
  <section role="tabpanel" id="p-start" aria-labelledby="tab-start"></section>
  <section role="tabpanel" id="p-karten" aria-labelledby="tab-karten" hidden></section>
  <section role="tabpanel" id="p-quiz" aria-labelledby="tab-quiz" hidden></section>
  <section role="tabpanel" id="p-skript" aria-labelledby="tab-skript" hidden></section>
  <section role="tabpanel" id="p-themen" aria-labelledby="tab-themen" hidden></section>
</main>

<script>
/* Register für Themen. Jede Datei in themen/ ruft Lernapp.thema({...}) auf. */
window.Lernapp = {
  eingebaut: [],
  thema: function (t) { t.eingebaut = true; this.eingebaut.push(t); }
};
</script>

<!-- ============================================================
     THEMEN-DATEIEN
     Neues Thema: Datei in themen/ anlegen und hier eine Zeile ergänzen.
     ============================================================ -->
<script>/* themen/pruefung.js */
/*
 * Thema: Prüfungsschwerpunkte Modul I (aus der Mitschrift)
 * Quellen: "Pruefungsuebersicht_Modul1.pdf" und "Lernkarten_Pruefungsschwerpunkte_Mitschrift.pdf".
 * Seitenangaben mit Heftkürzel: G = Gefäße, H = Haut, M = Dekubitus/Ulcus cruris/DFU,
 * W = Wundarten/Wundheilung, D = Dokumentation, Hy = Hygiene.
 *
 * Quiz-Format: Die ersten "r" Optionen sind richtig (ohne "r": nur die erste);
 * die App mischt die Reihenfolge. Nie alle Optionen richtig – wie in der Prüfung.
 * "h: true" = Inhalt stammt (teilweise) nur aus handschriftlichen Notizen.
 */
Lernapp.thema({
  id: "pruefungsschwerpunkte",
  titel: "Prüfungsschwerpunkte Modul I (Mitschrift)",
  kurz: "Prüfungsschwerpunkte",
  quelle: "Mitschrift + murimed-Kurshefte",
  hinweis:
    "Abgleich der handschriftlichen Mitschrift mit den sechs Kursheften; Seitenangaben beziehen sich auf das jeweilige Heft (G = Gefäße, H = Haut, M = Dekubitus/Ulcus cruris/DFU, W = Wundarten, D = Dokumentation, Hy = Hygiene). Primärquellen wurden nicht separat geprüft.",

  karten: [
    { k: "Haut", f: "Was sind die Adnexorgane der Haut?",
      a: "Hautanhangsgebilde: Haare, Nägel und Hautdrüsen (Schweiß-, Duft- und Talgdrüsen).", s: "H S. 3" },
    { k: "Haut", f: "Nenne die Schichten der Epidermis von innen nach außen – deutsch und lateinisch.",
      a: "1. Basalzellschicht – Stratum basale\n2. Stachelzellschicht – Stratum spinosum\n3. Körnerzellschicht – Stratum granulosum\n4. Glanzschicht – Stratum lucidum\n5. Hornschicht – Stratum corneum", s: "H S. 3–5" },
    { k: "Haut", f: "In welcher Schicht liegen die Langerhans-Zellen und was tun sie?",
      a: "In der Stachelzellschicht (Stratum spinosum); aus dem Knochenmark, fangen mit ihren Dendriten Pathogene und Antigene ab – „Wachposten des Immunsystems“.", s: "H S. 4" },
    { k: "Haut", f: "Welche Schicht kommt nur an Handflächen und Fußsohlen vor?",
      a: "Die Glanzschicht (Stratum lucidum) – 1–2 Lagen kernloser Keratinozyten.", s: "H S. 4" },
    { k: "Haut", f: "Erysipel: Erreger, Klinik, Komplikationen?",
      a: "Akute bakterielle Infektion der Dermis durch β-hämolysierende Streptokokken Gruppe A; klar begrenzte, schmerzhafte, überwärmte Rötung, Fieber; Komplikationen Sepsis, Lymphödem. Häufigste Komplikation des chronischen Lymphödems.", s: "H S. 20" },
    { k: "Haut", f: "Was ist eine Mykose?",
      a: "Pilzinfektion (Dermatophyten, Schimmel-, Hefepilze) von Haut, Schleimhaut, Nägeln oder systemisch; begünstigt durch verminderte Abwehr.", s: "H S. 22" },
    { k: "Haut", f: "Unterschied Tumor und Neoplasie?",
      a: "Neoplasie: autonome Gewebeneubildung (benigne, semimaligne, maligne).\nTumor: jede örtliche Zunahme des Gewebevolumens (Schwellung) – weiter gefasst.", s: "H S. 33" },
    { k: "Haut", f: "Erkläre die ABCD(E)-Regel.",
      a: "A – Asymmetrie\nB – Begrenzung unscharf\nC – Color, Mehrfarbigkeit\nD – Dynamik, Veränderung\nE – Erhabenheit (nur handschriftlich im Heft)", s: "H S. 27", h: true },
    { k: "Gefäße", f: "Was gehört zum Herz-Kreislauf-System?",
      a: "Herz als Druck-Saug-Pumpe, Blutgefäße (Arterien, Venen, Kapillaren) und Lymphgefäße als Leitungsröhren bzw. Stätten des Stoffaustauschs.", s: "G S. 3" },
    { k: "Gefäße", f: "Welche Aufgaben hat das Blutgefäßsystem?",
      a: "Ernährung des Organismus, Abtransport von Schlackenstoffen, Hormontransport (Steuerung vegetativer Funktionen), Wärmeregulation.", s: "G S. 3" },
    { k: "Gefäße", f: "Wie lauten die drei Kreisläufe des Blutgefäßsystems?",
      a: "Kleiner Kreislauf/Lungenkreislauf · großer Körperkreislauf · Pfortaderkreislauf.", s: "G S. 3" },
    { k: "Gefäße", f: "Was sind arteriovenöse Anastomosen?",
      a: "Querverbindungen zwischen Arteriolen und Venolen; umgehen die Kapillaren (Kollateralkreislauf), regulieren die Durchblutung, z. B. Hautdurchblutung für den Wärmehaushalt.", s: "G S. 5" },
    { k: "Gefäße", f: "Was ist Diffusion?",
      a: "Wanderung von Teilchen durch ihre Eigenbeweglichkeit vom Ort höherer zum Ort niedrigerer Konzentration bis zum Ausgleich; langsam. Beispiel: Tinte in Wasser.", s: "G S. 7" },
    { k: "Gefäße", f: "Was ist Filtration?",
      a: "Schnelle Flüssigkeitsverschiebung zwischen Blutplasma und Zwischenzellraum: bei Druckunterschied werden alle Teilchen, die durch die Membranporen passen, vom Ort höheren zum niedrigeren Blutdruck gepresst.\nBeispiel: Kaffeefilter.", s: "G S. 7" },
    { k: "Gefäße", f: "Wie viel Flüssigkeit wird täglich filtriert, reabsorbiert und als Lymphe abtransportiert?",
      a: "Ca. 20 l ins Interstitium filtriert, ca. 18 l reabsorbiert, 2 l gelangen als Lymphe über das Lymphgefäßsystem in die Blutbahn.", s: "G S. 7" },
    { k: "Gefäße", f: "Was ist die Windkesselfunktion – und wo findet sie statt?",
      a: "Funktion der elastischen Arterien (herznah): Aorta dehnt sich bei Herzkontraktion und zieht sich danach zusammen → stoßweise wird kontinuierliche Strömung.", s: "G S. 4, 6" },
    { k: "Lymphe", f: "Woraus besteht das Lymphsystem?",

    { k: "Lymphe", f: "Warum heißt das Lymphgefäßsystem „halboffen“?",
      a: "Es beginnt blind mit Lymphkapillaren, die interstitielle Flüssigkeit aufnehmen, durchzieht den Körper wie ein Netz und mündet in den Blutkreislauf.", s: "G S. 7" },
    { k: "Lymphe", f: "Beschreibe den Weg der Lymphe.",
      a: "Lymphkapillaren → kleine/große Lymphgefäße mit Klappen → Lymphknoten → Lymphstämme → Ductus thoracicus → linke Schlüsselbeinvene (V. subclavia).", s: "G S. 7–8" },
    { k: "Lymphe", f: "Warum kann die Lymphe nicht zurückfließen?",
      a: "Die Lymphgefäße besitzen wie kleine Venen Klappen (schwingende Zipfel), die den Rückfluss verhindern.", s: "G S. 7" },
    { k: "Lymphe", f: "Wie wird die Lymphe ohne eigenes Pumporgan transportiert?",
      a: "Kontraktion der Gefäßmuskulatur und Drucksteigerung durch Puls-, Atem- und Körperbewegung.\nMitschrift: Muskelpumpe, Darmperistaltik.", s: "G S. 8", h: true },
    { k: "Lymphe", f: "Welche Abfallprodukte sammelt die Lymphe – und was transportiert sie zusätzlich?",

    { k: "Lymphe", f: "Welche Aufgabe haben Lymphknoten?",

    { k: "pAVK", f: "Welche diagnostischen Maßnahmen gibt es bei pAVK?",

    { k: "pAVK", f: "Wie wird der ABI berechnet und was ist zu beachten?",
      a: "Syst. Druck Knöchel ÷ syst. Druck Arm; gesund ca. 1,0, ≤ 0,9 = pAVK.\nBei Mönckeberg-Sklerose falsch hohe Werte.", s: "G S. 12; M S. 24" },
    { k: "Venen", f: "Nenne die CVI-Stadien nach Widmer.",
      a: "I Corona phlebectatica, Phlebödem\nII Ödem, Dermatoliposklerose, Atrophie blanche, Purpura jaune d’ocre, Stauungsekzem\nIIIa abgeheiltes Ulcus\nIIIb florides Ulcus", s: "G S. 16; M S. 15" },
    { k: "Venen", f: "Einteilung der Varikose nach Hach?",
      a: "1 – nur die Venenklappe betroffen\n2 – Klappen bis Mitte Oberschenkel defekt\n3 – Insuffizienz bis unter das Kniegelenk\n4 – bis zum Sprunggelenk", s: "Zusatzskript Varikose S. 2" },
    { k: "Wunde", f: "IAD vs. Dekubitus – wie unterscheidet man sie?",
      a: "Dekubitus: über knöchernen Vorsprüngen, scharf begrenzt, Ursprung in der Tiefe.\nIAD/Feuchtigkeitswunde: Ursprung an der Epidermis, in Hautfalten (Gesäßfalte), ohne Bezug zu Knochenvorsprüngen.", s: "M S. 9–10" },
    { k: "Wunde", f: "Was ist bei analnahen Wunden zu beachten?",

<ul>
  <li><b>Theorieprüfung:</b> Prüfungslink am Montag um 10:00 Uhr; <b>60 Fragen in 90 Minuten</b>; Multiple Choice – mindestens eine, oft mehrere richtige Antworten, niemals alle vier. <span class="hand-inline">Zum Üben: Quiz → „Prüfungssimulation“.</span></li>
  <li><b>FPA (fachpraktische Aufgabe) am Freitag:</b> Praxisaufgabe zu nur einer Wunde, wird in der App bzw. per Mail zugeschickt; Einsendung laut Notiz an „Wund@murimed.de“ (Schreibweise aus der Handschrift übernommen – bitte prüfen).</li>
  <li><b>Zum Ausdrucken (aus der App):</b> Formular Varikosis (als „Prüfung!“ markiert) · Beratungsprotokoll (vgl. Verweis in D S. 7) · Einteilung der Varikose nach Hach (App-Anhang).</li>
</ul>

    <tr><td style="white-space:normal">CVI nach Widmer</td><td>G S. 16; M S. 15</td><td>✔ in beiden Heften identisch</td></tr>

<h3>3. Prüfungsstoff Tag 1 – Haut</h3>
<div class="tabelle"><table>
  <caption>Epidermis von innen nach außen (H S. 3–5)</caption>
  <thead><tr><th>Nr.</th><th>Deutsch</th><th>Latein</th><th>Kernmerkmal</th></tr></thead>
  <tbody>
    <tr><td>1</td><td>Basalzellschicht</td><td>Stratum basale</td><td>Keimzellen, Teilung → Regeneration; Merkelzellen</td></tr>
    <tr><td>2</td><td>Stachelzellschicht</td><td>Stratum spinosum</td><td>Desmosomen; Langerhans-Zellen (Immunabwehr)</td></tr>
    <tr><td>3</td><td>Körnerzellschicht</td><td>Stratum granulosum</td><td>Keratinozyten flachen ab, beginnen zu verhornen</td></tr>
    <tr><td>4</td><td>Glanzschicht</td><td>Stratum lucidum</td><td>nur an Handflächen und Fußsohlen</td></tr>
    <tr><td>5</td><td>Hornschicht</td><td>Stratum corneum</td><td>äußerste Schicht, abgestorbene Korneozyten, Schutz vor Wasserverlust</td></tr>
  </tbody>
</table></div>
<p>Darunter: Dermis (Stratum papillare, Stratum reticulare) und Subcutis. Adnexorgane: Haare, Nägel, Schweiß-, Duft-, Talgdrüsen. Erneuerung der Epidermis 27–30 Tage (ab 65 Jahren 5–7 Wochen).</p>
<ul>
  <li><b>Erysipel:</b> akute bakterielle Infektion der Dermis durch β-hämolysierende Streptokokken der Gruppe A; häufigste Komplikation des chronischen Lymphödems; klar begrenzte, schmerzhafte Rötung, Überwärmung, Fieber; Komplikationen Sepsis, Lymphödem (H S. 20).</li>
  <li><b>Mykose:</b> Pilzinfektion (Dermatophyten, Schimmel-, Hefepilze) von Haut, Schleimhaut, Nägeln oder systemisch; begünstigt durch verminderte Abwehr. Onychomykose ca. ¼ aller Nagelkrankheiten (H S. 22).</li>
  <li><b>Neoplasie</b> = autonome Gewebeneubildung (benigne, semimaligne, maligne). <b>Tumor</b> = jede örtliche Zunahme des Gewebevolumens (Schwellung) – weiter gefasst (H S. 33).</li>
  <li><b>ABCD(E)-Regel:</b> Asymmetrie · Begrenzung unscharf · Color (Mehrfarbigkeit) · Dynamik · <span class="hand-inline">E = Erhabenheit (nur handschriftlich)</span> (H S. 27).</li>
</ul>

<h3>4. Prüfungsstoff Tag 2 – Gefäßsystem</h3>
<ul>
  <li><b>Herz-Kreislauf-System</b> (kardiovaskuläres System): Herz als Druck-Saug-Pumpe · Blutgefäße (Arterien, Venen, Kapillaren) · Lymphgefäße als Leitungsröhren bzw. Stätten des Stoffaustauschs (G S. 3).</li>
  <li><b>Blutgefäßsystem:</b> Ernährung des Organismus, Abtransport von Schlackenstoffen, Hormontransport, Wärmeregulation; geschlossenes System mit drei Kreisläufen: Lungenkreislauf, großer Körperkreislauf, Pfortaderkreislauf (G S. 3–4).</li>
  <li><b>Arteriovenöse Anastomosen:</b> Querverbindungen zwischen Arteriolen und Venolen; umgehen die Kapillaren (Kollateralkreislauf), regulieren die Durchblutung, z. B. Hautdurchblutung für den Wärmehaushalt (G S. 5).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th></th><th>Diffusion</th><th>Filtration</th></tr></thead>
  <tbody>
    <tr><td>Prinzip</td><td>Wanderung von Teilchen durch Eigenbeweglichkeit vom Ort höherer zum Ort niedrigerer Konzentration bis zum Ausgleich</td><td>Teilchen, die durch die Membranporen passen, werden bei einem Druckunterschied vom Ort höheren zum Ort niedrigeren Blutdrucks gepresst</td></tr>
    <tr><td>Tempo</td><td>langsam; braucht große Austauschflächen und kurze Wege (Kapillaren)</td><td>schnell; Flüssigkeitsverschiebung zwischen Blutplasma und Zwischenzellraum</td></tr>
    <tr><td>Beispiel (Mitschrift)</td><td>Tinte in Wasser</td><td>Kaffeefilter: Wasser läuft durch, Kaffeesatz bleibt zurück</td></tr>
  </tbody>
</table></div>
<p class="merke">Durch Diffusion und Filtration gelangen täglich ca. 20 l ins Interstitium, ca. 18 l werden – laut Foliensatz durch Osmose – reabsorbiert, die übrigen 2 l fließen als Lymphe ab (G S. 7).</p>
<ul>
  <li><b>Lymphsystem</b> = Lymphgefäße + Lymphknoten, Knochenmark, Mandeln, Milz; zusätzliches Abflusssystem; halboffenes System, das den Körper wie ein Netz durchzieht (G S. 7).</li>
  <li><b>Weg der Lymphe:</b> Lymphkapillaren (dehnbar, fingerförmig) → kleine/große Lymphgefäße mit Klappen (schwingende Zipfel) gegen Rückfluss → Lymphknoten (Lymphozytenbildung, fangen Erreger ab und machen sie unschädlich; schwellen bei Entzündung) → Lymphstämme → Ductus thoracicus → linke Schlüsselbeinvene (V. subclavia), wo das Lymphgefäßsystem endet (G S. 7–8).</li>
  <li><b>Kein eigenes Pumporgan:</b> Transport durch Kontraktion der Gefäßmuskulatur, Drucksteigerung durch Puls-, Atem- und Körperbewegung (G S. 8); der Foliensatz bezeichnet die Pulsbewegung als „Windkesselfunktion“ und betont: Bewegung ist essentiell. <span class="hand-inline">Mitschrift ergänzt: Muskelpumpe und Darmperistaltik.</span></li>
  <li><b>Was transportiert die Lymphe?</b> Abfallprodukte des Stoffwechsels – Reste abgestorbener Zellen und Eiweißkörper; außerdem die über den Darm resorbierten Fette (G S. 8).</li>
  <li><b>Windkesselfunktion</b> gehört zu den elastischen Arterien: stoßweise Strömung am Aortenanfang → annähernd kontinuierliche Strömung (G S. 6; <span class="hand-inline">handschriftlich S. 4: Herz kontrahiert → Aorta dehnt sich; Herz entspannt → Aorta zieht sich zusammen</span>).</li>
</ul>
<p class="merke"><b>Diagnostik pAVK – Mitschrift:</b> Anamnese, Allgemeinzustand, Schmerz, Gangbild, Temperatur, schwacher Fußpuls, Blutdruck/ABI-Messung an den Extremitäten, Bildgebung.<br><b>Heft ergänzt:</b> ABI = syst. Druck Knöchel ÷ syst. Druck Arm, gesund ca. 1,0, ≤ 0,9 = pAVK; Ratschow-Lagerungsprobe, Ultraschall/Doppler/Duplex, Laufband, MRT, Angiographie, CT (G S. 12); tcpO₂, Labor; bei Mönckeberg-Sklerose falsch hohe ABI-Werte (M S. 24–25).</p>
<div class="tabelle"><table>
  <caption>CVI nach Widmer ★ (G S. 16; M S. 15)</caption>
  <thead><tr><th>Grad</th><th>Klinik</th></tr></thead>
  <tbody>
    <tr><td>I</td><td>Corona phlebectatica (Fußrand), Phlebödem</td></tr>
    <tr><td>II</td><td>Ödem, Dermatoliposklerose, Atrophie blanche, Purpura jaune d’ocre, Stauungsekzem</td></tr>
    <tr><td>IIIa</td><td>abgeheiltes Ulcus (Ulcusnarbe)</td></tr>
    <tr><td>IIIb</td><td>florides Ulcus</td></tr>
  </tbody>
</table></div>
<p class="merke"><b>Varikose nach Hach ★</b> (Zusatzskript Varikose S. 2; Stammvarikose, meist V. saphena magna): 1 nur die Venenklappe betroffen · 2 Klappen bis mittlerer Oberschenkel defekt · 3 Insuffizienz bis unter das Kniegelenk · 4 gesamte Länge bis zum Sprunggelenk. Deine Notiz im Gefäß-Heft stimmt damit überein. Mehr im Thema „Varikose“.</p>

<h3>5. Weitere Notizen</h3>
<ul>
  <li><b>IAD</b> (inkontinenzassoziierte Dermatitis) <b>vs. Dekubitus:</b> Dekubitus entsteht über knöchernen Vorsprüngen, scharf begrenzt, in der Tiefe; Feuchtigkeitswunden (IAD, Mazeration, Intertrigo) entstehen an der Epidermis, in Hautfalten (z. B. Gesäßfalte), unabhängig von Knochenvorsprüngen (M S. 9–10).</li>
  <li><b>Analnahe Wunden:</b> trotz wochenlanger Heilung nicht chronisch (geplante Sekundärheilung, gut durchblutet); hohe Sekretbildung → Wundumgebung vor Feuchtigkeit schützen (W S. 15), z. B. mit transparenten Hautschutzfilmen oder Barrierecremes (D S. 24).</li>
</ul>

  karten: [
    { k: "Wundarten", f: "Definiere den Begriff Wunde.",

    { k: "Wundarten", f: "Nach welchen Kriterien werden Wunden eingeteilt?",
      a: "Entstehungshergang, Entstehungsart, Heilungsdauer, Keimbesiedelung (Kolonisationsgrad), Art und Tiefe der Gewebeschädigung.", s: "S. 3" },
    { k: "Wundarten", f: "Welche vier Entstehungshergänge gibt es?",
      a: "Mechanisch, thermisch, chemisch, strahlenbedingt.", s: "S. 3" },
    { k: "Wundarten", f: "Was sind mechanische Wunden? Nenne Beispiele.",
      a: "Folge von Gewalteinwirkung.\nSchnitt-, Stich-, Quetsch-, Riss-, Platz-, Schürf-, Kratz-, Bisswunden, Blasen, Ablederungen, Amputationen, Schuss-, Pfählungsverletzungen.", s: "S. 3" },
    { k: "Thermisch", f: "Nenne die Verbrennungsgrade 1 und 2a.",
      a: "1: Epidermis; Rötung, starke Schmerzen, Heilung ohne Narbe.\n2a: oberflächliche Dermis; Blasen, Haare fest, Wundgrund rosig, rekapillarisierend, starke Schmerzen; Heilung meist in 14 Tagen.", s: "S. 6" },
    { k: "Thermisch", f: "Nenne die Verbrennungsgrade 2b, 3 und 4.",
      a: "2b: tiefe Dermis; Blasen, Haare leicht zu entfernen, blasser Grund, reduzierter Schmerz.\n3: komplette Dermis; weiß, lederartig, keine Schmerzen, Nekrosen.\n4: bis Muskel/Knochen; Verkohlung.", s: "S. 6" },
    { k: "Thermisch", f: "Ab wann droht ein Verbrennungsschock?",
      a: "Bei 2.–3.-gradiger Verbrennung ab 10 % verbrannter Körperoberfläche bei Erwachsenen, ab 5 % bei Kindern (hypovolämischer Schock).", s: "S. 7" },
    { k: "Chemisch", f: "Säure- vs. Laugenverätzung?",
      a: "Säure: Koagulationsnekrose – fester, trockener Schorf, scharf begrenzt.\nLauge: Kolliquationsnekrose – glasig, weich, unscharf begrenzt, dunkelbrauner Grund; schwerwiegender.", s: "S. 8" },
    { k: "Strahlen", f: "Was kennzeichnet strahlenbedingte Wunden?",
      a: "Zuerst Stratum basale betroffen (hohe Mitoserate); Spätschäden: Fibrose, Gefäßveränderungen, Strahlenulzera – Entartung zum Plattenepithelkarzinom nach 4–40 Jahren möglich; Behandlung wie Verbrennung.", s: "S. 9" },
    { k: "Entstehung", f: "Traumatische, iatrogene und chronische Wunden?",
      a: "Traumatisch: äußere Gewalt.\nIatrogen: durch ärztliche/therapeutische Maßnahmen (Inzision, Punktion, Amputation).\nChronisch: keine Heilungstendenz nach 4–12 Wochen trotz fachgerechter Therapie.", s: "S. 9" },
    { k: "Entstehung", f: "Was bedeutet „Vulnerando sanamus“?",
      a: "„Heilen durch Verletzen“ – Grundsatz iatrogener Wunden.", s: "S. 9" },
    { k: "Entstehung", f: "Akute vs. chronische Wunde?",
      a: "Akut: Phasen regelrecht durchlaufen, Heilung innerhalb von 4 Wochen.\nChronisch: Phasen nicht regelrecht, keine Heilungstendenz nach 4–12 Wochen; von Beginn an chronisch bei chronischer Grunderkrankung.", s: "S. 11, 13" },
    { k: "Keime", f: "Nenne die sechs Kolonisationsgrade.",
      a: "Aseptisch · kontaminiert · kolonisiert · kritisch kolonisiert · lokal infiziert · systemisch infiziert.\nKeine Wunde ist steril.", s: "S. 10" },
    { k: "Keime", f: "Kontaminiert vs. kolonisiert vs. kritisch kolonisiert?",
      a: "Kontaminiert: Keime vermehren sich nicht.\nKolonisiert: vermehrungsfähige Keime, Heilung nicht nachhaltig gestört.\nKritisch kolonisiert: erhöhte Besiedlung, infektgefährdet.", s: "S. 10" },
    { k: "Keime", f: "Wann gilt eine Wunde als aseptisch?",
      a: "Fast keimfrei, keine Entzündungszeichen; z. B. OP-Wunden oder frische Verletzungen (nicht älter als 4–6 h), primär verschlossen.", s: "S. 10" },
    { k: "Keime", f: "Nenne die klassischen Entzündungszeichen (deutsch und lateinisch).",
      a: "Rötung – rubor\nSchwellung – tumor\nÜberwärmung – calor\nSchmerz – dolor\nFunktionseinschränkung – functio laesa", s: "S. 10" },
    { k: "Keime", f: "Weitere Anzeichen einer Wundinfektion? (Übung I)",
      a: "Eitrige Beläge, viel/zähes Exsudat, Geruch, blutendes bröckeliges Granulationsgewebe, stagnierende Heilung, Wundvergrößerung, Hypergranulation, Lymphknotenschwellung, Wundaufbruch.", s: "S. 25" },
    { k: "Keime", f: "Lokale vs. systemische Infektion?",
      a: "Lokal: Erreger bleiben in Wunde und naher Umgebung.\nSystemisch: Erreger verteilen sich über den Blutkreislauf im ganzen Organismus (Sepsis).", s: "S. 10–11" },
    { k: "Tiefe", f: "Geschlossene vs. offene Wunden?",
      a: "Geschlossen: unter intakter Haut (Distorsion, Luxation, geschlossene Fraktur); nur Hämatom/Schwellung sichtbar.\nOffen: immer Verletzung von Haut oder Schleimhaut.", s: "S. 12–13" },
    { k: "Tiefe", f: "Welche offenen Wunden unterscheidet man nach der Tiefe?",
      a: "Oberflächlich: nur Epidermis, narbenfrei (Erosion, Exkoriation).\nPerforierend: alle Hautschichten (Messerstich).\nKompliziert: zusätzlich Gefäße, Nerven, Organe (offene Fraktur).", s: "S. 13" },
    { k: "Heilung", f: "Definiere Wundheilung.",
      a: "Physiologische Vorgänge zur Regeneration zerstörten Gewebes, die insbesondere durch Neubildung von Bindegewebe und Kapillaren den Verschluss einer Wunde bewirken.", s: "S. 14" },
    { k: "Heilung", f: "Warum braucht die Wundheilung ein feucht-warmes Milieu?",
      a: "Zellteilung setzt erst ab ca. 28 °C ein; in feucht-warmer Umgebung wandern die Zellen schneller und ordnen sich an.", s: "S. 15" },
    { k: "Heilung", f: "Merkmale der primären Wundheilung?",
      a: "Aseptische OP-Wunden oder frische Verletzungen (< 6 h); glatte, adaptierte Wundränder; Heilung in 6–10 Tagen mit minimaler Narbe.", s: "S. 14" },
    { k: "Heilung", f: "Was ist eine verzögerte Primärheilung?",
      a: "Gleiche Voraussetzungen wie bei der Primärheilung, aber die Wunde wird wegen Kontaminationsverdacht nicht sofort verschlossen (z. B. Schnittverletzung > 6 h).", s: "S. 14" },
    { k: "Heilung", f: "Merkmale der sekundären Wundheilung?",
      a: "Bei infizierten, großflächigen Wunden (Verbrennung, Dekubitus, Ulcus cruris); Heilung Schicht um Schicht von unten nach oben und außen nach innen über Granulationsgewebe; großflächige Narbe; länger, infektionsgefährdet.", s: "S. 14" },
    { k: "Heilung", f: "Reparatur vs. Regeneration?",
      a: "Reparatur: Ersatz durch Bindegewebe → Narbe (Primär-, verzögerte Primär-, Sekundärheilung).\nRegeneration: Ersatz durch identische Zellen, narbenfrei (oberflächliche Epidermis-, Schleimhautverletzungen).", s: "S. 15" },
    { k: "Heilung", f: "Was sind Narben?",
      a: "Faserreiches, qualitativ weniger hochwertiges Reparaturgewebe mit paralleler Kollagenanordnung – weniger elastisch, ohne Talg- und Schweißdrüsen.", s: "S. 16" },
    { k: "Heilung", f: "Warum gelten analnahe Wunden nicht als chronisch?",
      a: "Die Sekundärheilung ist nach proktologischen Eingriffen geplant und die Wunden sind gut durchblutet – trotz wochenlanger Heilung.", s: "S. 15" },
    { k: "Phasen", f: "Nenne die fünf Wundheilungsphasen in der richtigen Reihenfolge.",
      a: "1. Hämostase\n2. Exsudation\n3. Granulation\n4. Epithelisierung\n5. Remodulierung\nPraxis: oft 3 Phasen – Exsudation, Granulation, Epithelisierung.", s: "S. 16" },
    { k: "Phasen", f: "Was passiert in der Hämostase?",
      a: "Kapillaren ziehen sich zusammen, Vasokonstriktion; Blut und Plasma füllen den Wundspalt; Thrombozyten und Erythrozyten bilden einen Thrombus, der die Wunde verschließt.", s: "S. 16, 20" },
    { k: "Phasen", f: "Was passiert in der Exsudationsphase?",
      a: "Reinigungsphase: starke Exsudation, Makrophagen und Granulozyten beginnen die Wundreinigung, lokale Entzündung (≠ Infektion), Abtransport von Zelltrümmern; bei akuten Wunden nach ca. 3 Tagen abgeschlossen.", s: "S. 17" },
    { k: "Phasen", f: "Was passiert in der Granulationsphase?",
      a: "Ab ca. Tag 2, bis 14 Tage: Fibroblasten bilden Kollagen → Granulationsgewebe (tiefrot, gekörnt, feucht glänzend), neue Kapillarschleifen (Neoangiogenese), Wundkontraktion, Exsudat nimmt ab.", s: "S. 17–18" },
    { k: "Phasen", f: "Was passiert in der Epithelisierungsphase?",
      a: "Ab ca. Tag 4, bis 21 Tage: Granulationsgewebe verliert Gewebewasser; Epithelzellen wandern vom Rand ein („Überhäutung“); erstes Narbengewebe; Epidermis verdickt durch Keratin.", s: "S. 18–19" },
    { k: "Phasen", f: "Was passiert in der Remodulierungsphase?",
      a: "Über Monate: Kollagenfasern richten sich nach Zuglinien aus, Kapillaren bilden sich zurück; weißliche, zell- und gefäßarme Narbe mit max. ca. 80 % der ursprünglichen Belastbarkeit.", s: "S. 19–20" },
    { k: "Phasen", f: "Ordne zu (Übung II): Kapillarschleifen, Wundreinigung, Gewebewasser, Wundspalt, Narbengewebe.",
      a: "Hämostase – Blut und Plasma füllen Wundspalt\nExsudation – Beginn der Wundreinigung\nGranulation – neue Kapillarschleifen\nEpithelisierung – Granulationsgewebe verliert Gewebewasser\nRemodulierung – Narbengewebe", s: "S. 25" },
    { k: "Störungen", f: "Nenne die Wundkomplikationen nach dem Heft.",
      a: "Serom, Wundhämatom, Wundrandnekrose, Wundinfektion, Wunddehiszenz, Fremdkörperreaktion, hypertrophe Narbe und Keloid, Narbenkarzinom.", s: "S. 21" },
    { k: "Störungen", f: "Was ist ein Serom und wie wird es behandelt?",
      a: "Ansammlung von serösem Exsudat (Lymphe, Serum) in Wundhohlräumen, meist postoperativ.\nKlein: Resorption; groß: steril abpunktieren + leichter Kompressionsverband; infiziert: wie Abszess.", s: "S. 21" },
    { k: "Störungen", f: "Transsudat vs. Exsudat?",

    { k: "Störungen", f: "Ursachen und Behandlung eines Wundhämatoms?",
      a: "Mangelhafte Blutstillung, unvollständige oder vorzeitig entfernte Drainage, Antikoagulanzien.\nInfektionsgefahr (Nährboden) → größere Hämatome operativ ausräumen.", s: "S. 21–22" },
    { k: "Störungen", f: "Wie wird eine Wundrandnekrose behandelt?",
      a: "Möglichst trocken halten und die Demarkation abwarten (scharfe Abgrenzung zwischen gesundem und krankem Gewebe).\nUrsache: mangelhafte Durchblutung der Wundränder.", s: "S. 22" },
    { k: "Störungen", f: "Welche postoperativen Wundinfektionen unterscheidet man?",
      a: "Oberflächlich (Haut, Subcutis) · tief (zusätzlich Muskeln, Faszien) · Infektion von Organen/Körperhöhlen im OP-Gebiet.", s: "S. 22" },
    { k: "Störungen", f: "Wunddehiszenz, Narbenhernie, Platzbauch?",

    { k: "Störungen", f: "Hypertrophe Narbe vs. Keloid?",
      a: "Hypertroph: häufig, < 6 Monate, auf Verletzung beschränkt, bildet sich oft zurück.\nKeloid: selten, > 6 Monate, wächst über die Verletzung hinaus, keine Rückbildung, oft nach Minimaltrauma.", s: "S. 23" },
    { k: "Störungen", f: "Was ist ein Narbenkarzinom?",

    { k: "Folien", f: "Beschreibe die Hämostase in sechs Schritten.",
      a: "1. Kapillaren ziehen sich zusammen\n2. Vasokonstriktion der nächstgrößeren Gefäße\n3. Blut und Plasma füllen den Wundspalt\n4. Thrombozyten haften an Kollagenfasern\n5. Thrombus mit Erythrozyten\n6. erste Reinigungszellen wandern ein", s: "Foliensatz" },
    { k: "Folien", f: "Nenne lokale und allgemeine Einflussfaktoren auf die Wundheilung.",
      a: "Lokal: Fremdkörper, Infektion, Naht/Spannung, Durchblutungsstörung, mechanische Belastung, ungeeignete Versorgung.\nAllgemein: Alter, Ernährung, Stoffwechsel, Immunschwäche, Medikamente, Grunderkrankungen.", s: "Foliensatz" },
    { k: "Folien", f: "Was sind nutritive Gefäße?",

  zusammenfassung: `
<h3>1. Wunde – Definition und Einteilung <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 3</span></h3>
<p class="merke"><b>Wunde</b> = Unterbrechung des Zusammenhangs von Körpergeweben mit oder ohne Substanzverlust (Pfitzmann 2020).</p>
<ul>
  <li>Wunden sind oft, aber nicht zwangsläufig mit Gewebeverlust und Funktionseinschränkung verbunden.</li>
  <li>Einteilungskriterien: Entstehungshergang · Entstehungsart · Heilungsdauer · Keimbesiedelung (Kolonisationsgrad) · Art und Tiefe der Gewebeschädigung.</li>
</ul>

<h3>2. Entstehungshergang <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 3–9</span></h3>
<ul>
  <li>Vier Ursachen: mechanisch, thermisch, chemisch, strahlenbedingt.</li>
  <li><b>Mechanische Wunden</b> = Folge von Gewalteinwirkung: Schnitt-, Stich-, Quetsch-, Riss-, Platz-, Schürf-, Kratz- und Bisswunden, Blasen, Ablederungen, Amputationen, Schuss- und Pfählungsverletzungen. <span class="hand-inline">Die Detailtabelle (S. 4–5) ist handschriftlich als „kein Prüfungsstoff“ markiert.</span> Merkpunkte: Stichwunden neigen zur Infektion (Keimverschleppung in die Tiefe); Bisswunden – kleine Einstiche, große Kavernen, Keimübertragung; Schürfwunde – nur Epidermis, punktförmige Blutungen aus dem Stratum papillare, sehr schmerzhaft.</li>
  <li><b>Thermische Wunden:</b> Verbrennungen/Verbrühungen, Erfrierungen, Stromverletzungen (S. 6).</li>
</ul>
<div class="tabelle"><table>
  <caption>Schweregrade von Verbrennungen (S. 6)</caption>
  <thead><tr><th>Grad</th><th>Schicht</th><th>Merkmale</th></tr></thead>
  <tbody>
    <tr><td>1</td><td>Epidermis</td><td>Rötung (Erythem), starke Schmerzen, Heilung spontan ohne Narbe (z. B. Sonnenbrand)</td></tr>
    <tr><td>2a</td><td>oberflächliche Dermis</td><td>Blasen, Haare fest verankert, Wundgrund rosig und rekapillarisierend, starke Schmerzen; Heilung meist spontan innerhalb von 14 Tagen</td></tr>
    <tr><td>2b</td><td>tiefe Dermis mit Hautanhangsgebilden</td><td>Blasen, Haare leicht zu entfernen, Wundgrund blasser, kaum rekapillarisierend, reduziertes Schmerzempfinden</td></tr>
    <tr><td>3</td><td>komplette Dermis</td><td>trockener, weißer, lederartig harter Wundgrund, keine Haare, keine Schmerzen, Nekrosen – oft operative Entfernung</td></tr>
    <tr><td>4</td><td>Subcutis, Faszie, Muskel, Knochen</td><td>Verkohlung; Operation unerlässlich</td></tr>
  </tbody>
</table></div>
<p class="warnung">Verbrennungsschock (hypovolämisch): bei 2.–3.-gradiger Verbrennung ab 10 % KOF bei Erwachsenen, ab 5 % bei Kindern (S. 7).</p>
<p class="hand">Kein Prüfungsstoff: Stromverletzungen (Nieder- &lt; 1000 V, Hochspannung &gt; 1000 V, Blitzschlag mit Blitzfiguren) und Erfrierungen (Grad 1 Congelatio erythematosa, 2 bullosa, 3 gangraenosa; gefährdet sind Akren; Nässegangrän auch über 0 °C möglich) (S. 7–8).</p>
<ul>
  <li><b>Chemische Wunden (S. 8):</b> Verätzung durch Säuren oder Laugen; Laugen sind schwerwiegender als Säuren.</li>
</ul>
<div class="tabelle"><table>
  <caption>Säure- vs. Laugenverätzung (S. 8)</caption>
  <thead><tr><th></th><th>Säure</th><th>Lauge</th></tr></thead>
  <tbody>
    <tr><td>Nekroseform</td><td>Koagulationsnekrose (Gerinnungsnekrose)</td><td>Kolliquationsnekrose (Verflüssigungsnekrose)</td></tr>

<p class="hand">Auf Eigenschutz achten; Kleidung über der Verletzung ausziehen, nicht verteilen.</p>
<ul>
  <li><b>Strahlenbedingte Wunden (S. 9):</b> ionisierende Wirkung; zuerst das Stratum basale betroffen (hohe Mitoserate). Früh: akuter Strahlenschaden; spät: Gefäßveränderungen, Fibrose, Strahlenulzera – maligne Transformation (Plattenepithelkarzinom) nach 4–40 Jahren möglich. 4 Schweregrade; Behandlung wie bei Verbrennungen.</li>
</ul>

<h3>3. Entstehungsart und Heilungsdauer <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 9–13</span></h3>
<ul>
  <li><b>Traumatisch</b> – äußere Gewalteinwirkung (Schnitt, Biss, Platzwunde).</li>
  <li><b>Iatrogen</b> – durch ärztliche/therapeutische Maßnahmen (Inzision, Punktion, Laser, Spalthautentnahme, Amputation); Grundsatz „Vulnerando sanamus“ – Heilen durch Verletzen.</li>
  <li><b>Chronisch</b> – keine Heilungstendenz innerhalb von 4–12 Wochen unter fachgerechter Therapie; oft Symptom einer Grunderkrankung (pAVK, CVI, Diabetes).</li>
  <li><b>Akut:</b> Wundheilungsphasen regelrecht durchlaufen, Heilung innerhalb von 4 Wochen. Chronische Wunden entstehen meist nicht auf gesunder Haut; WHS: kein geordneter, zeitgerechter Ablauf. Hard-to-heal: Ulcera &gt; 6 cm², älter als 6 Monate (S. 11–13).</li>
</ul>

<h3>4. Kolonisationsgrad <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 10–11</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Grad</th><th>Merkmale</th></tr></thead>
  <tbody>
    <tr><td>aseptisch</td><td>fast keimfrei, keine Entzündungszeichen; z. B. OP-Wunden oder frische Verletzungen (&lt; 4–6 h), primär verschlossen</td></tr>
    <tr><td>kontaminiert</td><td>Keime vorhanden, vermehren sich aber nicht; keine Entzündungszeichen</td></tr>
    <tr><td>kolonisiert</td><td>vermehrungsfähige Keime, Heilung nicht nachhaltig gestört; von „kontaminiert“ nur mikrobiologisch unterscheidbar</td></tr>
    <tr><td>kritisch kolonisiert</td><td>erhöhte Besiedlung; infektgefährdet, Übergang auf den Körper droht</td></tr>
    <tr><td>lokal infiziert</td><td>bakterielles Wachstum mit immunologischer Reaktion, Erreger in Wunde und naher Umgebung</td></tr>
    <tr><td>systemisch infiziert</td><td>Ausbreitung über den Blutkreislauf (Sepsis)</td></tr>
  </tbody>
</table></div>
<p class="merke">Keine Wunde ist steril.</p>
<ul>
  <li><b>Klassische Entzündungszeichen ★:</b> Rötung (rubor) · Schwellung (tumor) · Überwärmung (calor) · Schmerz (dolor) · Funktionseinschränkung (functio laesa).</li>
  <li><b>Weitere Infektionszeichen</b> (Lösung Übung I, S. 25): eitrige Beläge, viel Exsudat, unangenehmer Geruch, zähes Exsudat, blutendes, bröckeliges Granulationsgewebe, stagnierende Heilung, Wundvergrößerung, Hypergranulation, geschwollene Lymphknoten, Wundaufbruch.</li>
</ul>

<h3>5. Tiefe und Ausdehnung <span class="seite">S. 12–13</span></h3>
<ul>
  <li><b>Geschlossene Wunden:</b> unter intakter Haut (Distorsion, Luxation, geschlossene Fraktur, Muskel-/Sehnenriss); außen nur Hämatom und Schwellung sichtbar, oft sehr schmerzhaft.</li>
  <li><b>Offene Wunden:</b> oberflächlich (nur Epidermis, heilt narbenfrei; Erosion, Exkoriation) · perforierend (alle Hautschichten; Messerstich, Ablederung, Verätzung) · kompliziert (zusätzlich Gefäße, Nerven, ggf. Organe; offene Fraktur, traumatische Amputation).</li>
</ul>

<h3>6. Arten und Mechanismen der Wundheilung <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 13–16</span></h3>
<p class="merke"><b>Wundheilung</b> = „physiologische Vorgänge zur Regeneration zerstörten Gewebes, die insbesondere durch Neubildung von Bindegewebe und Kapillaren den Verschluss einer Wunde bewirken“ (Pfitzmann 2020). Ziel: Wunde verschließen, Verlust von Blut, Lymphe und Wärme vermeiden, Austrocknung und äußere Einflüsse verhindern.</p>
<ul>
  <li>Optimal ist ein feucht-warmes Milieu: Zellteilung erst ab 28 °C, Zellen wandern schneller (S. 15).</li>
  <li>Analnahe Wunden gelten trotz wochenlanger Heilung nicht als chronisch (geplante Sekundärheilung, gut durchblutet); Wundumgebung vor Überfeuchtung schützen (S. 15).</li>
</ul>
<div class="tabelle"><table>
  <caption>Primäre vs. sekundäre Wundheilung (S. 14)</caption>
  <thead><tr><th></th><th>Primäre Wundheilung</th><th>Sekundäre Wundheilung</th></tr></thead>
  <tbody>
    <tr><td>Wann</td><td>aseptische OP-Wunden, frische aseptische Verletzungen (&lt; 6 h)</td><td>infektionsgefährdete, infizierte, großflächige Wunden (Verbrennung, Dekubitus, Ulcus cruris)</td></tr>
    <tr><td>Wundränder</td><td>glatt, liegen dicht aneinander bzw. adaptiert</td><td>nicht adaptiert</td></tr>
    <tr><td>Verlauf</td><td>6–10 Tage, minimale Narbe</td><td>Schicht um Schicht von unten nach oben und außen nach innen; Granulationsgewebe → großflächige Narbe, ggf. Bewegungseinschränkung; länger, höheres Infektionsrisiko</td></tr>
  </tbody>
</table></div>
<p><b>Verzögerte Primärheilung:</b> gleiche Voraussetzungen, aber wegen Kontaminationsverdacht nicht sofort verschlossen (z. B. Schnittverletzung &gt; 6 h alt). <span class="hand-inline">Handschriftlich: z. B. ca. 4 Tage offen, dann verschlossen.</span></p>
<div class="tabelle"><table>
  <caption>Reparatur vs. Regeneration (S. 15)</caption>
  <thead><tr><th></th><th>Reparatur</th><th>Regeneration</th></tr></thead>
  <tbody>
    <tr><td>Ersatz</td><td>durch Bindegewebe → Narbe</td><td>durch identische Zellen, narbenfrei</td></tr>
    <tr><td>Vorkommen</td><td>Primärheilung, verzögerte Primärheilung, sekundäre Heilung (die meisten Wunden)</td><td>oberflächliche Verletzungen (nur Epidermis, Basalzellen erhalten), Schleimhautverletzungen</td></tr>
  </tbody>
</table></div>
<p>Narben sind faserreiches, qualitativ weniger hochwertiges Reparaturgewebe mit paralleler Kollagenanordnung – weniger elastisch, ohne Talg- und Schweißdrüsen (S. 16).</p>

<h3>7. Phasen der Wundheilung <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 16–20</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Phase</th><th>Zeit (akute Wunde)</th><th>Vorgänge</th></tr></thead>
  <tbody>
    <tr><td>1 Hämostase</td><td>sofort</td><td>Kapillaren ziehen sich zusammen, Vasokonstriktion; Thrombozyten + Erythrozyten → Thrombus verschließt die Wunde; Grundlage für Reparatur</td></tr>
    <tr><td>2 Exsudation (Reinigung)</td><td>bis ca. Tag 3</td><td>starke Exsudation; Entzündung (≠ Infektion) mit Makrophagen und Granulozyten; Abwehr, Abtransport von Zelltrümmern; Fibroblasten angelockt, Neoangiogenese eingeleitet</td></tr>
    <tr><td>3 Granulation (Proliferation)</td><td>ab ca. Tag 2, bis 14 Tage</td><td>Fibroblasten bilden Kollagen → gefäßreiches Granulationsgewebe (tiefrot, gekörnt, feucht glänzend); neue Kapillarschleifen; Wundkontraktion; Exsudat nimmt ab; Epithelisierung beginnt</td></tr>
    <tr><td>4 Epithelisierung</td><td>ab ca. Tag 4, bis 21 Tage</td><td>Granulationsgewebe verliert Gewebewasser; Epithelzellen wandern vom Rand ein („Überhäutung“); Kollagenfasern reifen; erstes Narbengewebe; Keratinbildung</td></tr>
    <tr><td>5 Remodulierung (Reifung, Maturation)</td><td>mehrere Monate</td><td>Narbengewebe: Kollagen richtet sich an Zuglinien aus, Kapillaren bilden sich zurück, Narbe schrumpft und verblasst; max. ca. 80 % der ursprünglichen Belastbarkeit</td></tr>
  </tbody>
</table></div>
<p>Die Phasen überlappen. In der Praxis oft 3 Phasen: Exsudation, Granulation, Epithelisierung. Bei immungeschwächten Menschen ist die Entzündung abgeschwächt oder verzögert → Infektionsrisiko, Heilungsstillstand. Chronische Wunden: Wochen bis Jahre.</p>
<p class="merke"><b>Übung II (Lösung S. 25):</b> Hämostase → Blut und Plasma füllen Wundspalt · Exsudation → Beginn der Wundreinigung · Granulation → Bildung neuer Kapillarschleifen · Epithelisierung → Granulationsgewebe verliert Gewebewasser · Remodulierung → Entstehung von Narbengewebe.</p>

<h3>8. Wundheilungsstörungen <span class="seite">S. 21–24</span></h3>
<ul>
  <li>Ursachen: lokal (Fremdkörper, Infektion, Naht- und Spannungsprobleme) und allgemein (Alter, Ernährung, Stoffwechselstörungen).</li>
  <li>Komplikationen: Serom · Wundhämatom · Wundrandnekrose · Wundinfektion · Wunddehiszenz · Fremdkörperreaktion · hypertrophe Narbe und Keloid · Narbenkarzinom.</li>
  <li><b>Serom:</b> Ansammlung von serösem Exsudat (Lymphe, Serum) in Wundhohlräumen, meist postoperativ bei eröffneten Lymphbahnen. Kleine werden resorbiert; größere steril abpunktieren + leichter Kompressionsverband; infiziert → wie Abszess behandeln. Transsudat = nicht entzündlich (klar, zell- und eiweißarm); Exsudat = entzündlich bedingt.</li>
  <li><b>Wundhämatom:</b> blutgefüllter Hohlraum durch mangelhafte Blutstillung, unzureichende oder zu früh entfernte Drainage, Antikoagulanzien; Infektionsgefahr (Nährboden) → größere operativ ausräumen.</li>
  <li><b>Wundrandnekrose:</b> mangelhaft durchblutete Wundränder (Naht, Trauma, Schnittführung) – blass/zyanotisch, dann braun-nekrotisch; trocken halten, Demarkation abwarten.</li>
  <li><b>Wundinfektion:</b> häufigste Komplikation; postoperativ oberflächlich (Haut, Subcutis), tief (Muskeln, Faszien) oder Organ/Körperhöhle; Gefahr der Sepsis.</li>
  <li><b>Wunddehiszenz:</b> sekundäres Auseinanderweichen genähter Wundränder. Sonderform Narbenhernie (häufigste Komplikation nach Bauch-OP, meist im 1. Jahr, Haut intakt); vollständige Dehiszenz mit freiliegenden Eingeweiden = Platzbauch.</li>
</ul>
<div class="tabelle"><table>
  <caption>Hypertrophe Narbe vs. Keloid (S. 23)</caption>
  <thead><tr><th>Merkmal</th><th>Hypertrophe Narbe</th><th>Keloid</th></tr></thead>

    <tr><td>Inzidenz</td><td>häufig</td><td>selten, steigt mit Hautpigmentierung</td></tr>

    <tr><td>Ausdehnung</td><td>auf ursprüngliche Verletzung beschränkt</td><td>wächst über die Verletzung hinaus</td></tr>
    <tr><td>Rückbildung</td><td>häufig</td><td>nicht</td></tr>
    <tr><td>Ursache</td><td>vorausgegangene Verletzung</td><td>Verletzung, oft unbemerkte „Minimaltraumata“ (Follikulitis, Insektenstich)</td></tr>
  </tbody>
</table></div>
<p>Beide sind gutartig; Behandlung bei Juckreiz, Schmerz, Funktionseinschränkung oder ästhetischer Belastung (S. 24).</p>
<ul>
  <li><b>Narbenkarzinom (S. 24):</b> selten; auf dem Boden chronischer Irritation (instabile Narbe, Fistel, Ulcera, Radiodermatitis), v. a. Brandnarben; meist Plattenepithelkarzinom. Risiko nach Brandverletzung 1–2 %, Unterschenkel 0,8 %. Der Begriff „Marjolin-Ulkus“ wird dafür fälschlicherweise verwendet. Therapie: weite Exzision, plastische Deckung, ggf. Amputation.</li>
</ul>
<p class="hand">Nur handschriftlich (S. 25), nicht im Drucktext: gelbes Exsudat = unauffällig; grünes Exsudat → Pseudomonas (Wundinfektion). Wunddokumentation: Wundart, -umgebung, -grund, -rand, Größe (Länge/Breite), Entzündungszeichen, Geruch; Evaluation alle 7 Tage oder bei Veränderung.</p>

      a: "Salben/Pasten in offene Wunden reiben; Zusatz-/Parfümstoffe; Alkohol (Franzbranntwein); abdichtende Pasten; Fette und Öle (Melkfett, Babyöl); Puder; Massieren gefährdeter Stellen.", s: "S. 16" },
    { k: "Pflege", f: "Was ist bei Pergament-, Kortison- oder Altershaut zu beachten?",
      a: "Silikonbeschichtete Wundauflagen oder unbeschichtete Hydrogelkompressen – keine Wundauflagen mit Kleberand.", s: "S. 15" },

    { k: "Schleimhaut", f: "Wodurch unterscheidet sich Schleimhaut von Haut und wo kommt sie vor?",
      a: "Keine Hornschicht, keine Haare; Schleim aus Becherzellen. Mind. zwei Schichten (Epithel, Lamina propria).\nAtemwege, Bindehaut, Mittelohr, Geschlechtsorgane, Harnwege, Verdauungskanal.", s: "S. 16" },
    { k: "Schleimhaut", f: "Wie ist die Gefäßversorgung der Haut aufgebaut?",
      a: "Drei arterielle und venöse Gefäßgebiete übereinander; Kapillarschlingen der Papillen versorgen die gefäßlose Epidermis; viele arteriovenöse Anastomosen (Blutdruck, Wärmeregulation).", s: "S. 17" },

    { k: "Infektion", f: "Was ist ein Erysipel? (Erreger, Klinik, Komplikationen)",
      a: "Akute bakterielle Infektion der Dermis durch β-hämolysierende Streptokokken Gruppe A; häufigste Komplikation des chronischen Lymphödems.\nKlar begrenzte, schmerzhafte, überwärmte Rötung, Fieber.\nKomplikationen: Sepsis, Lymphödem.", s: "S. 20" },
    { k: "Infektion", f: "Erysipel vs. Phlegmone?",
      a: "Phlegmone ist schwerer: einschmelzende Entzündung von Dermis und Subcutis, Strepto-/Staphylokokken, diffus abszedierend, Fisteln, Nekrosen, Sepsis. Ein Erysipel kann in eine Phlegmone übergehen.", s: "S. 20" },
    { k: "Infektion", f: "Erreger und klinische Merkmale des Gasbrands?",
      a: "Clostridien (anaerob), Inkubation 5–48 h.\nÖdem, plötzlicher Wundschmerz, gelbbraun bis blauschwarz, Knistern (Crepitatio), wenig Eiter, kaum Fieber, schneller Puls, fadsüßlicher Geruch.", s: "S. 20–21" },
    { k: "Infektion", f: "Was ist ein Panaritium?",
      a: "Eitrige Entzündung der Finger (selten Zehen) nach Bagatellverletzung; gerötet, pulsierend, druckschmerzhaft. Frühzeitige operative Entlastung.", s: "S. 21" },
    { k: "Infektion", f: "Wie entsteht Herpes zoster und was ist eine Folge?",
      a: "Reaktivierung des Varizella-zoster-Virus aus Nervenzellen; brennender Schmerz, halbseitige bandartige Bläschen im Dermatom.\nFolge: postherpetische Neuralgie.", s: "S. 22" },
    { k: "Infektion", f: "Was ist eine Mykose und was begünstigt Onychomykose?",
      a: "Pilzinfektion (Dermatophyten, Schimmel-, Hefepilze) von Haut, Schleimhaut, Nägeln oder systemisch.\nOnychomykose: vorgeschädigte Nägel, enge Schuhe, Durchblutungsstörungen.", s: "S. 22" },
    { k: "Infektion", f: "Kennzeichen der Psoriasis?",
      a: "Chronisch-entzündlich, polygen vererbt; symmetrische, scharf begrenzte rote Papeln und Plaques mit silbrig-weißer Schuppung; Beginn in 50 % vor dem 25. Lebensjahr.", s: "S. 23" },

    { k: "Tumoren", f: "Neoplasie vs. Tumor? (Übung II)",
      a: "Neoplasie: autonome Gewebeneubildung (benigne, semimaligne, maligne).\nTumor: jede örtliche Zunahme des Gewebevolumens (Schwellung) – weiter gefasst.", s: "S. 33" },
    { k: "Tumoren", f: "Was ist eine aktinische Keratose?",
      a: "In-situ-Karzinom, Vorstufe des Plattenepithelkarzinoms; lichtexponierte Stellen, hellhäutige Menschen, meist ab 60; raue, scharf begrenzte, rötliche Herde, später Krusten; meist kein Jucken.", s: "S. 24–25" },
    { k: "Tumoren", f: "Kennzeichen des Basalzellkarzinoms?",
      a: "Häufigster maligner Tumor Mitteleuropas; lokal zerstörend, metastasiert äußerst selten. Perlschnurartiger Saum mit Teleangiektasien.\nTherapie: vollständige operative Entfernung.", s: "S. 25–26" },
    { k: "Tumoren", f: "Melanom: Bedeutung und Typen?",
      a: "Höchste Metastasierungsrate, > 90 % der Hauttumor-Todesfälle.\nSuperfiziell spreitend ca. 60 %, nodulär ca. 20 %, Lentigo-maligna ca. 10 %, akrolentiginös ca. 5 %.", s: "S. 26" },
    { k: "Tumoren", f: "Erkläre die ABCD-Regel.",
      a: "A – Asymmetrie\nB – Begrenzung unscharf\nC – Color, Mehrfarbigkeit\nD – Dynamik, Veränderung\nHandschriftlich: E – Erhabenheit.", s: "S. 27", h: true },
    { k: "Tumoren", f: "Risikofaktoren des Plattenepithelkarzinoms?",
      a: "Hohe UV-Dosis, chronische oder infizierte Wunden, Hauterkrankungen, Verbrennungsnarben, strahlengeschädigte Haut, Dauerreizung, Immunsuppression.", s: "S. 27" },

    { k: "Innere", f: "Gicht: Ursache, typische Lokalisation, Therapie?",
      a: "Purinstoffwechselstörung mit Harnsäureablagerung; akuter Anfall nachts, meist Großzehengrundgelenk.\nRuhigstellung, kalte Umschläge, NSAR, Glukokortikoide, Colchicin, ggf. Canakinumab.", s: "S. 28" },
    { k: "Innere", f: "Was kennzeichnet das Pyoderma gangraenosum?",
      a: "Neutrophile Dermatose, oft mit CED oder Neoplasien; schmerzhafte Pustel nach Bagatelltrauma → rasch nekrotisches Geschwür; Rand unterminiert, livide, scharf begrenzt.", s: "S. 29" },

    { k: "MARSI", f: "Was bedeutet MARSI und welche Schäden gehören dazu?",
      a: "Medical Adhesive-Related Skin Injuries.\nEpidermales Stripping, Spannungsblasen, Skin Tears, toxisches und allergisches Kontaktekzem, Mazeration, Follikulitis.", s: "S. 30–31" },
    { k: "MARSI", f: "Wie vermeidet man Spannungsblasen?",
      a: "Dehnbare Produkte nicht unter Spannung anbringen; an Gelenken in Beugung anlegen; faltenfrei applizieren.", s: "S. 30" },
    { k: "MARSI", f: "Toxisches vs. allergisches Kontaktekzem durch Verbandmittel?",
      a: "Toxisch: klar begrenzt, deckungsgleich mit dem Verband.\nAllergisch: gerötet, juckend, nässend, Bläschen, über die Auflagefläche hinaus.", s: "S. 31" },
    { k: "MARSI", f: "Skin-Tear-Kategorien?",
      a: "I – kein Gewebeverlust, Lappen repositionierbar\nII – teilweiser Verlust des Hautlappens\nIII – vollständiger Hautlappenverlust", s: "S. 31" },
    { k: "MARSI", f: "Versorgung eines Skin Tears in 4 Schritten?",
      a: "1. Blutung mit sterilen Kompressen stillen\n2. sanft mit NaCl 0,9 % oder Wundspüllösung reinigen\n3. Hautlappen repositionieren (sterile Pinzette)\n4. mit silikonbeschichteten, nicht klebenden Verbandmitteln fixieren", s: "S. 31" },
    { k: "MARSI", f: "Wie beugt man Follikulitis vor?",
      a: "Haare mit elektrischer Haarschneidemaschine kürzen statt rasieren; Verbandmittel immer in Haarwuchsrichtung abziehen.", s: "S. 31" },
    { k: "Folien", f: "Welche Funktion haben die einzelnen Hautanhangsgebilde?",
      a: "Haare: mechanischer Schutz, Temperaturregulation\nNägel: Schutz der Finger-/Zehenspitzen, Greifen\nSchweißdrüsen: Temperaturregulation, Ausscheidung\nTalgdrüsen: Hautfett für den Säureschutzmantel", s: "Foliensatz Haut" },
    { k: "Folien", f: "Wie wird der Hautfaltentest beurteilt?",
      a: "Hautfalte (z. B. Handrücken) zusammenkneifen und loslassen. Normal: glättet sich sofort bzw. in 1–2 s. Bleibt sie länger → verminderter Turgor (Dehydration, Alter, Gewichtsverlust).", s: "Foliensatz Haut" },
    { k: "Folien", f: "Welche Aufgaben haben die Bestandteile des Säureschutzmantels?",
      a: "Schweiß: wässriger Anteil mit Salzen\nFettsäuren: antimikrobiell\nCholesterin: stabilisiert die Barriere\nTalg: Geschmeidigkeit, Wasserschutz", s: "Foliensatz Haut" },
    { k: "Folien", f: "Was bedeuten sebostatisch und seborrhoisch – und wie pflegt man?",
      a: "Sebostatisch = trocken: W/O-Produkte + Urea.\nSeborrhoisch = fettig: milde Syndets, wässrige O/W-Produkte.", s: "Foliensatz Haut" },
    { k: "Folien", f: "Panaritium: Formen und Therapie?",
      a: "Cutaneum – Abtragung und Inspektion\nSubcutaneum – seitliche Inzision\nTendinosum (Sehnenscheide) – sofortige operative Eröffnung", s: "Foliensatz Haut" },
    { k: "Folien", f: "Wo treten Lentigo-maligna- und akrolentiginöses Melanom auf?",
      a: "Lentigo-maligna: meist bei Älteren im Gesicht.\nAkrolentiginös: Handflächen, Fußsohlen, Nägel.", s: "Foliensatz Haut" },
    { k: "Folien", f: "Welche Verbandmittel bei Alters-, Pergament-, Kortison- und Ödemhaut?",
      a: "Altershaut: Silikon, keine Kleberänder\nPergamenthaut: Hydrogelkompressen\nKortisonhaut: minimale Klebekraft, häufige Kontrollen\nÖdemhaut: dehnbare Materialien, Druckentlastung", s: "Foliensatz Haut" },
    { k: "Folien", f: "Wie dokumentiert man verbandmittelbedingte Hautschäden?",
      a: "Erstbeurteilung vor Verbandanlage · Kontrolle bei jedem Verbandwechsel · Fotodokumentation · Maßnahmen und Produktwechsel dokumentieren.", s: "Foliensatz Haut" },
    { k: "Folien", f: "Welche rechtlichen Aspekte gelten bei MARSI?",
      a: "Sorgfaltspflicht, Dokumentationspflicht, Aufklärungspflicht, Haftung – vermeidbare Hautschäden können Schadensersatzforderungen nach sich ziehen.", s: "Foliensatz Haut" },
    { k: "Folien", f: "Was sind neutrophile Dermatosen?",
      a: "Seltene, nicht infektiöse Hauterkrankungen unklarer Ursache mit Ansammlung neutrophiler Granulozyten: sterile Pusteln, Nekrosen; z. B. Pyoderma gangraenosum.", s: "Foliensatz Haut" }
  ],

    <tr><td style="white-space:normal">Psoriasis</td><td>➜ streckseitig betont; auch Nägel, Lymphknoten und Gelenke beteiligt.</td></tr>
    <tr><td style="white-space:normal">Basalzellkarzinom</td><td>➜ ca. 200 Neuerkrankungen/100.000/Jahr, Lebenszeitprävalenz ca. 10 %; OP mit ca. 95 % Erfolgsrate (Heft: 5-Jahres-Rezidivrate 2–8 %).</td></tr>
    <tr><td style="white-space:normal">Melanom-Typen</td><td>➜ Lentigo-maligna: meist Ältere im Gesicht · akrolentiginös: Handflächen, Fußsohlen, Nägel · nodulär: aggressiv.</td></tr>
    <tr><td style="white-space:normal">Plattenepithelkarzinom</td><td>➜ bei Metastasen systemische Chemotherapie.</td></tr>
    <tr><td style="white-space:normal">Calcinosis cutis</td><td>➜ Kalksalzablagerung durch gestörten Kalzium-Phosphat-Stoffwechsel; vorwiegend Nieren, Lunge, Herz, seltener Haut; Therapie: Grunderkrankung, ggf. Exzision.</td></tr>
    <tr><td style="white-space:normal">Livedo-Vaskulopathie</td><td>➜ blitzförmige Ulzera; Therapie mit Gerinnungshemmern, IVIG, Immunsuppressiva.</td></tr>
    <tr><td style="white-space:normal">Neutrophile Dermatosen</td><td>➜ selten, nicht infektiös, sterile Pusteln, Nekrosen; Pyoderma gangraenosum breitet sich zentrifugal aus, schubartig-rezidivierend.</td></tr>
  </tbody>
</table></div>
