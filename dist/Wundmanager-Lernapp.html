Lernapp.thema({
  id: "wundbetreuung-dokumentation",
  titel: "Wundbetreuung und Dokumentation",
  kurz: "Dokumentation",
  quelle: "murimed-Kursheft Wundexperte Modul I",
  hinweis:
    "Quelle ist ausschließlich das Kursheft; Seitenzahlen in Klammern. Die im Heft zitierten Gesetze und Primärquellen wurden nicht separat geprüft.",

  karten: [
    { k: "Recht", f: "Welche Gesetze und Vorschriften regeln die Pflege- bzw. Wunddokumentation?",
      a: "PflBG (§ 4, § 5), SGB XI (§§ 85, 104, 105, 112–114, 140), SGB V (§ 70, § 135a), Heimgesetz § 13, Transparenzvereinbarungen PTV-S/PTV-A, Expertenstandards.", s: "S. 3" },
    { k: "Recht", f: "Wie lange muss die Wunddokumentation aufbewahrt werden?",
      a: "§ 630f BGB: Pflegedokumentation 10 Jahre.\n§ 199 BGB: 30 Jahre Verjährungsfrist für Schadensersatz bei Körperverletzung → Empfehlung: Wunddoku inkl. Fotos 30 Jahre.", s: "S. 10" },
    { k: "Recht", f: "Darf die Krankenkasse die Wunddokumentation anfordern?",
      a: "Nein. Auszüge aus Pflegedokumentation und Patientenunterlagen dürfen ausschließlich an den Medizinischen Dienst (MD) übermittelt werden (§ 275 SGB V).", s: "S. 10" },
    { k: "Recht", f: "Wunddokumentation vs. Leistungsnachweis?",
      a: "Wunddoku: Teil der Pflegedokumentation.\nLeistungs-/Durchführungsnachweis: separates Formular (Anzahl, Art, Datum, Uhrzeit, Handzeichen); ambulant Abrechnungsgrundlage. Nicht auf einem Bogen kombinieren.", s: "S. 3" },
    { k: "Ziele", f: "Welche Aufgaben und Ziele hat die Wunddokumentation?",
      a: "Heilungsverlauf nachvollziehbar machen, Basis koordinierter Therapie, Doppeluntersuchungen und Versorgungsbrüche vermeiden, Probleme schnell sichtbar machen, rechtliche Absicherung, Kommunikation, Qualitätssicherung.", s: "S. 4" },
    { k: "Anforderung", f: "Nenne die vier Grundanforderungen an die Dokumentation.",
      a: "Richtig, vollständig, nachvollziehbar, objektiv.\nDazu: dokumentenecht, persönlich, zeitnah, nicht im Voraus, mit Handzeichen.", s: "S. 4" },
    { k: "Anforderung", f: "Wie werden Korrekturen in der Dokumentation vorgenommen?",
      a: "Einmal durchstreichen, sodass es lesbar bleibt, mit aktuellem Datum und Handzeichen.\nVerboten: Korrekturfluid, Überkleben, Schwärzen, Seiten austauschen – ggf. Urkundenfälschung.", s: "S. 4" },
    { k: "Anforderung", f: "Was gilt für Handzeichen und Delegation von Einträgen?",
      a: "Jeder Eintrag mit Unterschrift oder Handzeichen (Handzeichenlegende mind. jährlich aktualisieren, neue Mitarbeitende sofort eintragen). Einträge nicht im Voraus und nicht an Kolleg:innen delegieren.", s: "S. 4" },
    { k: "Bestandteile", f: "Was gehört nach dem Expertenstandard zur Wunddokumentation?",
      a: "1. pflegerische Anamnese\n2. wundspezifisches Assessment inkl. Heilungsverlauf/Wundbericht\n3. idealerweise Fotodokumentation", s: "S. 6, 11" },
    { k: "Bestandteile", f: "Braucht jede Wunde eine eigene Dokumentation?",
      a: "Ja – auch bei identischen Wunden mit ähnlichem Verlauf (z. B. Dekubitus Nr. 1 am Steißbein, Nr. 2 am Schulterblatt).", s: "S. 7" },
    { k: "Anamnese", f: "Welche vier Kriterien umfasst die pflegerische Anamnese nach Expertenstandard?",
      a: "1. Verständnis des Krankseins\n2. wund- und therapiebedingte Einschränkungen\n3. vorhandene wundbezogene Hilfsmittel\n4. Selbstmanagementkompetenzen", s: "S. 7" },
    { k: "Anamnese", f: "Was gehört zu den wund- und therapiebedingten Einschränkungen?",
      a: "Schmerz (Ort, Stärke, Qualität, Auslöser), Mobilität, Schlaf, psychosoziale Aspekte, Abhängigkeit von Hilfe, Juckreiz/Beinschwellung, Kleidung/Schuhe, persönliche Hygiene.", s: "S. 7" },
    { k: "Anamnese", f: "Was gehört zu den Selbstmanagementkompetenzen?",
      a: "Umgang mit Einschränkungen, Einstellung zu Wunde und Verbandwechsel, Alltagsaktivitäten, krankheitsspezifische Maßnahmen (Entstauung, Gefäßtraining, Fußpflege, Druckentlastung), Hautschutz, Ernährung, Blutzucker, Raucherentwöhnung.", s: "S. 7" },
    { k: "Assessment", f: "Nenne die Kriterien des wundspezifischen Assessments.",
      a: "Med. Wunddiagnose, Lokalisation, Dauer, Rezidive, Größe, Wundgrund/Gewebeart, Exsudat, Geruch, Wundrand, Wundumgebung, Entzündungszeichen, Wundschmerz.", s: "S. 8–9, 11" },
    { k: "Assessment", f: "Wann muss das wundspezifische Assessment wiederholt werden?",
      a: "Nach Verlauf und Prognose, bei Verschlechterung, nach Interventionen (z. B. Débridement, Infektion), spätestens nach 4 Wochen.", s: "S. 9" },
    { k: "Foto", f: "Welche Regeln gelten für die Fotodokumentation?",
      a: "Einwilligung nach Aufklärung; gleiche Bedingungen (Abstand, Winkel, Licht, Kamera, Lagerung); nach der Reinigung; dunkler einfarbiger Hintergrund; Wunde ≥ ⅓ des Bildes; Lineal; eindeutige Zuordnung.", s: "S. 10" },
    { k: "Foto", f: "Kann die Fotodokumentation die schriftliche ersetzen?",
      a: "Nein. Fotos dienen nur zur Unterstützung; Dreidimensionalität, Unterminierungen, Farben werden mangelhaft dargestellt.", s: "S. 6, 10" },
    { k: "Diagnose", f: "Welche Klassifikation gehört zu welcher Wunde?",
      a: "Dekubitus – EPUAP/NPUAP\nUlcus cruris venosum – Widmer, CEAP\nUlcus cruris arteriosum – Fontaine, TASC, Rutherford\nDiab. Fußulkus – Wagner-Armstrong", s: "S. 8, 13" },
    { k: "Lokalisation", f: "Wie beeinflusst die Lokalisation die Heilung?",
      a: "Gut durchblutete Stellen (Gesicht) heilen schneller als z. B. Haut über dem Schienbein; Muskulatur schneller als Faszien/Sehnen; über Gelenken Zugkräfte und Reibung.", s: "S. 13" },
    { k: "Lokalisation", f: "Kranial, kaudal, proximal, distal?",
      a: "Kranial – kopfwärts\nKaudal – zum Steißbein hin\nProximal – zur Körpermitte/zum Rumpf\nDistal – vom Rumpf weg", s: "S. 14" },
    { k: "Lokalisation", f: "Medial, lateral, dexter, sinister, palmar, plantar?",
      a: "Medial – zur Körpermitte · lateral – seitlich · dexter – rechts · sinister – links · palmar – zur Handfläche · plantar – zur Fußsohle.", s: "S. 14" },
    { k: "Lokalisation", f: "Anterior, posterior, radial, ulnar, tibial, fibular?",
      a: "Anterior/ventral – vorne · posterior/dorsal – hinten · radial – zur Speiche · ulnar – zur Elle · tibial – zum Schienbein · fibular – zum Wadenbein.", s: "S. 14" },
    { k: "Dauer", f: "Warum ist die Wunddauer relevant?",
      a: "Je älter die Wunde, desto länger die Heilung und desto höher die Wahrscheinlichkeit fehlerhafter Zellteilung/Entartung; bei länger bestehenden Wunden neuen Gefäßstatus erheben. Rezidive auf Narben heilen schlechter.", s: "S. 14" },
    { k: "Größe", f: "Welche Größenangaben sind ungeeignet?",
      a: "Vergleiche wie handtellergroß, tomatengroß, erbsengroß, Ein-Euro-Stück-groß sowie „Wunde schaut prima aus“ oder „ohne Befund“.", s: "S. 15" },
    { k: "Größe", f: "Wie werden Länge und Breite gemessen?",
      a: "Länge = größter Abstand in Kopf-Fuß-Achse (vertikal), Breite = größter horizontaler Abstand; beide im 90°-Winkel. Messpunkte im Team einheitlich.", s: "S. 15" },
    { k: "Größe", f: "Wie funktioniert die Uhrmethode?",
      a: "Für Taschen, Fisteln, Unterminierungen: Kopf = 12 Uhr, Fuß = 6 Uhr, unabhängig von der Lage. An Hand/Fuß: Finger-/Zehenspitzen = 12 Uhr, Handgelenk/Ferse = 6 Uhr.", s: "S. 16" },
    { k: "Größe", f: "Wie misst man Tiefe und Volumen einer Wunde?",
      a: "Tiefe: senkrecht an der tiefsten Stelle mit sterilen Pinzetten, Sonden, Knopfkanülen, Spülkathetern – keine Watteträger.\nVolumen: Auslitern mit Folie und Ringerlösung (ml).", s: "S. 16" },
    { k: "Gewebe", f: "Trockene vs. feuchte Nekrose?",
      a: "Trocken: dunkelbraun bis schwarz, hart, lederartig, klar abgegrenzt.\nFeucht: grau-gelb, weich, faserige oder schmierige Beläge.", s: "S. 17" },
    { k: "Gewebe", f: "Warum Nekrosen abtragen – und wann nicht?",
      a: "Fördert die Heilung, macht das Wundausmaß beurteilbar, entfernt das Keimreservoir – erst nach Demarkation.\nAusnahme: hochgradige pAVK – erst nach Behandlung der Grunderkrankung.", s: "S. 17" },
    { k: "Gewebe", f: "Was ist eine Gangrän?",
      a: "Spezielle Nekrose: akral, meist scharf begrenzt, durch Durchblutungsstörung; Wasserverlust → Mumifizierung; schwarz durch Blutabbauprodukte.", s: "S. 17" },
    { k: "Gewebe", f: "Wie unterscheidet man Eiter von Fibrin?",
      a: "Mit steriler Kompresse über die Wunde wischen: Eiter lässt sich abwischen, Fibrinbeläge haften fest am Wundgrund. (Sicher nur histologisch.)", s: "S. 18" },
    { k: "Gewebe", f: "Gutes vs. schlechtes Granulationsgewebe?",
      a: "Gut: rot, feinkörnig, feucht glänzend, fest.\nSchlecht: blassrosa bis gräulich, schwammig, grobkörnig, stark exsudierend (Durchblutung, Eiweißmangel, Keimlast, fehlende Druckentlastung).", s: "S. 18" },
    { k: "Gewebe", f: "Was ist Hypergranulation und wie wird sie behandelt?",
      a: "Überschießendes Granulationsgewebe über Hautniveau (vermutlich durch Entzündung, Fremdkörper, Reibung).\nTrockene Wundversorgung oder kontrollierte Druckverbände.", s: "S. 19" },
    { k: "Gewebe", f: "Wie wird eine frisch epithelisierte Wunde versorgt?",
      a: "Mit einem Schutzverband abdecken – Folienverbände oder transparente Hydrokolloide –, da das neue Gewebe empfindlich und wenig belastbar ist.", s: "S. 19" },
    { k: "Gewebe", f: "Aussehen von Fettgewebe, Muskel, Sehne?",
      a: "Fett: gelb-orange/weiß/grau, ölig, kugelig; abgestorben grau, bröselig.\nMuskel: vital rot; abgestorben fahlgrau bis schwarz.\nSehne: gelblich, glatt, glänzend, längs gefasert.", s: "S. 19–20" },
    { k: "Exsudat", f: "Welche Funktionen hat das Exsudat?",
      a: "Verhindert Austrocknen, erleichtert Einwandern von Fibroblasten, ermöglicht Zellbewegung und -teilung, liefert Nährstoffe, transportiert Immun- und Wachstumsfaktoren, unterstützt Autolyse.", s: "S. 20" },
    { k: "Exsudat", f: "Was bedeutet eine plötzlich zunehmende Exsudation bei fortgeschrittener Heilung?",
      a: "Mögliches Zeichen einer beginnenden Infektion – der Körper versucht, Keime und Fremdkörper auszuspülen.", s: "S. 21" },
    { k: "Exsudat", f: "Was deutet grünes, graublaues oder klares Exsudat an?",
      a: "Grün: Pseudomonas aeruginosa\nGrau/blau: Rückstände silberhaltiger Auflagen\nKlar/bernstein: normal serös; ggf. Harnwegs-/Lymphfistel", s: "S. 21" },
    { k: "Exsudat", f: "Zähflüssiges vs. dünnflüssiges Exsudat?",
      a: "Zäh: hoher Eiweißanteil (Entzündung), Verbandrückstände, Nekrose in Autolyse, Darmfistel.\nDünn: wenig Eiweiß (Mangelernährung, venöse/kardiale Erkrankung), Lymph-/Gelenk-/Harnwegsfistel.", s: "S. 22" },
    { k: "Geruch", f: "Wie wird Wundgeruch dokumentiert?",
      a: "Nur ja/nein – Geruch ist nicht objektiv erfassbar; Begriffe wie süßlich, faulig sind subjektiv. Nicht jeder Geruch bedeutet Infektion.", s: "S. 22" },
    { k: "Wundrand", f: "Unterminierung, Wundtasche, Untertunnelung?",
      a: "Unterminiert: bis max. 1 cm unterhöhlt.\nWundtasche: ab 1 cm.\nUntertunnelung: Verbindungsgang zu einer anderen Wunde.", s: "S. 23" },
    { k: "Wundrand", f: "Warum muss der Wundrand gereinigt werden?",
      a: "Die Epithelisierung geht vom Wundrand aus; Verkrustungen (z. B. eingetrocknetes Exsudat) verhindern das Einwandern der Epithelzellen.", s: "S. 24" },
    { k: "Wundrand", f: "Wie schützt man den Wundrand?",
      a: "Alkoholfreie transparente Hautschutzfilme (Hydropolymere, Silikone), Barrierecremes; trocknen lassen, keine zusätzlichen fetthaltigen Produkte.", s: "S. 24" },
    { k: "Wundrand", f: "Warum eignet sich Zinkpaste nicht als Wundrandschutz?",
      a: "Verhindert Beurteilung, schwer entfernbar (Öle stören Kleben), verdeckt Rötungen, stört in der Wunde die Heilung, mechanische Belastung beim Entfernen, trocknet aus → Risse und Keimeintritt.", s: "S. 24" },
    { k: "Umgebung", f: "Was bedeuten MASD und MARSI?",
      a: "MASD: Moisture Associated Skin Damage – Hautschäden durch Feuchtigkeit.\nMARSI: Medical Adhesive-Related Skin Injury – Schäden durch Ablösen von Wundauflagen.", s: "S. 25" },
    { k: "Infektion", f: "Entzündung vs. Infektion einer Wunde?",
      a: "Entzündung: durch die Gewebeschädigung selbst ausgelöst, physiologisch in der Exsudationsphase.\nInfektion: Eindringen, Anheften, Vermehren von Erregern; in jeder Phase; lokal, ausbreitend, systemisch.", s: "S. 25–26" },
    { k: "Infektion", f: "Was ist bei Infektionszeichen bei pAVK und diabetischer Neuropathie zu beachten?",
      a: "pAVK: Rötung und Überwärmung kaum vorhanden – Schmerz ist das aussagekräftigste Zeichen.\nNeuropathie: Schmerz fehlt, Fieber höchstens subfebril.", s: "S. 27" },
    { k: "Infektion", f: "Zeichen einer Infektion in Wundtaschen?",
      a: "Geröteter, verhärteter, ödematöser, schmerzhafter Wundrand; starke, dickflüssige, eitrige Exsudation; Geruch; oft Auslöser systemischer Infektion.", s: "S. 28" },
    { k: "Schmerz", f: "Mit welchen Instrumenten wird Wundschmerz erfasst?",
      a: "Selbsteinschätzung: VRS (verbal), NRS (numerisch), GRS (Gesichter).\nFremdeinschätzung: BESD, BISAD. Dazu Qualität und Auslöser dokumentieren.", s: "S. 28" },
    { k: "Sinne", f: "Welche Sinne nutzt man bei der Wundbeurteilung?",
      a: "Hören (Anamnese, Schmerzlaute), Sehen (Haut, Gangbild, Schuhe, Hilfsmittel), Tasten (Verhärtung, Ödem, Temperatur), Riechen (Geruch ja/nein). Alte Farbmodelle (schwarz/gelb) nicht mehr verwenden.", s: "S. 29" }
  ],

  quiz: [

      e: "Richtig, vollständig, nachvollziehbar, objektiv; dazu dokumentenecht, persönlich, zeitnah, nicht im Voraus, mit Handzeichen.", s: "S. 4" },

    { f: "Wann muss das wundspezifische Assessment spätestens wiederholt werden?",
      o: ["Spätestens nach 4 Wochen", "Spätestens nach 12 Monaten", "Nur bei Abheilung", "Täglich bei jedem Verbandwechsel"],

    { f: "Was gilt für die Fotodokumentation?",
      o: ["Sie ergänzt die schriftliche Dokumentation, ersetzt sie aber nie", "Sie ersetzt die schriftliche Dokumentation vollständig", "Sie ist ohne Einwilligung erlaubt", "Fotos werden vor der Wundreinigung gemacht"],

    { f: "Wie groß sollte die Wunde auf dem Foto mindestens abgebildet sein?",

    { f: "Wie wird die Länge einer Wunde gemessen?",

    { f: "Welche Angabe zur Wundgröße ist geeignet?",

<h3>1. Rechtliche Grundlagen der Dokumentation <span class="seite">S. 3</span></h3>
<ul>
  <li>Pflegeberufegesetz (PflBG): § 4 Vorbehaltene Tätigkeiten, § 5 Ausbildungsziel.</li>
  <li>SGB XI: § 85 Pflegesatzverfahren, § 104 Pflichten der Leistungserbringer, § 105 Abrechnung, § 140 Überleitung in Pflegegrade, § 112 Qualitätsverantwortung, § 113 Maßstäbe und Grundsätze der Pflegequalität, § 114 Qualitätsprüfungen.</li>
  <li>SGB V: § 70 Qualität, Humanität und Wirtschaftlichkeit, § 135a Verpflichtung zur Qualitätssicherung. (Im Heft steht hier versehentlich „Fünftes Buch (SGB XI)“.)</li>
  <li>Heimgesetz § 13 Aufzeichnungs- und Aufbewahrungspflicht · Transparenzvereinbarungen PTV-S (stationär) und PTV-A (ambulant) · Expertenstandards.</li>
  <li>Wunddokumentation ist Teil der Pflegedokumentation – nicht der Leistungs-/Durchführungsnachweise (separate Formulare mit Anzahl, Art, Datum, Uhrzeit, Handzeichen; ambulant Abrechnungsgrundlage). Beides auf einem Bogen widerspräche fachlichen und datenschutzrechtlichen Zielen.</li>
</ul>

<h3>2. Aufgaben, Ziele und Anforderungen <span class="seite">S. 4–5</span></h3>
<ul>
  <li><b>Ziele:</b> Heilungsverlauf anhand festgelegter Parameter für alle Beteiligten nachvollziehbar machen; Basis koordinierter Therapie; Doppeluntersuchungen und Versorgungsbrüche vermeiden; Probleme schnell sichtbar machen, schnelles Eingreifen; rechtliche Absicherung; Kommunikationsmittel und Teil der Qualitätssicherung.</li>
</ul>
<p class="merke"><b>Grundsätzliche Anforderungen (S. 4):</b> richtig, vollständig, nachvollziehbar, objektiv · Papier dokumentenecht (Kugelschreiber); digital unveränderbar (Rollen, Speicher-/Löschregeln, Passwörter) · immer persönlich und zeitnah · nicht im Voraus, nicht delegieren · jeder Eintrag mit Unterschrift bzw. Handzeichen (Handzeichenlegende mind. jährlich aktualisieren) · Korrekturen: einmal durchstreichen, lesbar lassen, Datum + Handzeichen · Korrekturfluid, Überkleben, Schwärzen, Seiten austauschen sind verboten – rechtlich ggf. Urkundenfälschung.</p>
<ul>
  <li><b>Spezifische Anforderungen</b> (Expertenstandard chronische Wunden, S. 5): ersichtlich sein muss, welche hygienischen Maßnahmen erfolgen, wie der Mensch mit wund- und therapiebedingten Beeinträchtigungen umgeht, Informationen zu Druckentlastung, Bewegung, Kompression, Ernährung, Rezidivprophylaxe, Selbstmanagementkompetenzen, Beteiligung an Maßnahmen, Wirkung, Verbesserung/Verschlechterung und Gründe für Änderungen.</li>
  <li>Der Expertenstandard empfiehlt, zur primären Wunddokumentation pflegerische Fachexpert:innen (z. B. Wundexpert:innen) hinzuzuziehen – intern oder extern (S. 5).</li>
</ul>

<h3>3. Bestandteile der Wunddokumentation <span class="seite">S. 6–10</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Bestandteil</th><th>Inhalt</th><th>Besonderheit</th></tr></thead>
  <tbody>
    <tr><td style="white-space:normal">Pflegerische Anamnese ★</td><td>Einschätzung der wund- und therapiebedingten Einschränkungen und der Selbstmanagementkompetenzen von Betroffenen und Angehörigen</td><td>keine validen Instrumente → Kriterien der Expert:innenarbeitsgruppe</td></tr>
    <tr><td style="white-space:normal">Wundspezifisches Assessment</td><td>Beschreibung nach festgelegten Kriterien, bisheriger Versorgungsprozess, Heilungsverlauf/Wundbericht</td><td>standardisierte Verfahren, z. B. EPUAP, PSST, PUSH, CEAP, Wagner-Armstrong</td></tr>
    <tr><td style="white-space:normal">Fotodokumentation</td><td>Visualisierung des Heilungsverlaufs</td><td>nur ergänzend – ersetzt nie die schriftliche Dokumentation</td></tr>
  </tbody>
</table></div>
<p>Keine standardisierten bundesweiten Bögen. Einfache Bögen mit Ankreuzfeldern vermeiden subjektive Aussagen wie „Wunde sifft“ oder „sieht gut aus“. Für jede Wunde eine eigene Dokumentation – auch bei gleichartigen Wunden (S. 6–7).</p>
<div class="tabelle"><table>
  <caption>Pflegerische Anamnese – Kriterien ★ (S. 7–8)</caption>
  <thead><tr><th>Kriterium</th><th>Komponenten</th></tr></thead>

    <tr><td style="white-space:normal">Verständnis des Krankseins</td><td>Ursache, Heilung und Vorstellung zur Heilungszeit, Symptome (Geruch, Exsudat, Juckreiz), Bedeutung spezieller Maßnahmen</td></tr>
    <tr><td style="white-space:normal">Wund- und therapiebedingte Einschränkungen</td><td>Schmerz (Ort, Stärke, Qualität, Dauer, Auslöser, Linderung), Mobilität/Aktivität, Schlaf, psychosoziale Aspekte, Abhängigkeit von Hilfe, Juckreiz/Beinschwellung, Kleidung/Schuhe, Hygiene</td></tr>
    <tr><td style="white-space:normal">Wundbezogene Hilfsmittel</td><td>z. B. Kompressionsstrümpfe, spezielle Schuhe, Orthesen, druckverteilende Matratzen, Sitzkissen</td></tr>
    <tr><td style="white-space:normal">Selbstmanagementkompetenzen</td><td>Umgang mit Einschränkungen, Einstellung zu Wunde und Verbandwechsel, Alltagsaktivitäten, krankheitsspezifische Maßnahmen (Entstauung, Gefäßtraining, Fußpflege/-inspektion, Druckentlastung), Hautschutz, Ernährung, Blutzucker, Raucherentwöhnung</td></tr>
  </tbody>
</table></div>
<p>Zusätzlich: Name, Geburtsdatum, Medikation, Allergien, soziales Umfeld, behandelnde Ärzt:innen, Immunstatus, Begleiterkrankungen, Operationen, geistiger/seelischer Zustand, Lebensgewohnheiten, Wissen und Einstellung, Kontinenzsituation.</p>
<ul>
  <li><b>Wundspezifisches Assessment (S. 8–9):</b> medizinische Wunddiagnose, Lokalisation, Dauer, Rezidivzahl, Größe, Wundgrund, Exsudat, Geruch, Rand, Umgebung, Entzündungszeichen, Schmerz; dazu Therapie, Behandlungsschema, vollständige Produktbezeichnung und -größe, Datum und Handzeichen.</li>
  <li><b>Wiederholung:</b> je nach Verlauf, bei Verschlechterung oder nach Interventionen (z. B. Débridement, Infektion), spätestens nach 4 Wochen (S. 9, 11).</li>
</ul>
<h4>Fotodokumentation (S. 10)</h4>
<ul>
  <li>Einwilligung des Betroffenen bzw. gesetzlichen Vertreters nach Aufklärung über Grund und Zweck.</li>
  <li>Bei Wiederholung gleicher Abstand, Winkel, Belichtung, Kamera und Lagerung.</li>
  <li>Grundsätzlich nach der Reinigung fotografieren (Ausnahme: Auffälligkeiten, die nur vorher sichtbar sind).</li>
  <li>Einfarbiger, dunkler Hintergrund; Wunde mind. ⅓ des Bildes; Lineal/Maßband zur Größenbestimmung.</li>
  <li>Eindeutig zuordenbar (Name, Datum, Körperseite); bei den Dokumentationsunterlagen aufbewahren.</li>
</ul>
<p class="merke"><b>Aufbewahrung und Krankenkassen (S. 10):</b> § 630f BGB – Pflegedokumentation 10 Jahre aufbewahren. § 199 BGB – 30 Jahre Verjährungsfrist für Schadensersatz bei Verletzung von Körper und Gesundheit → empfohlen: Wunddokumentation inkl. Fotos 30 Jahre. Krankenkassen dürfen die Wunddokumentation nicht anfordern; Auszüge nur an den Medizinischen Dienst (MD) (§ 275 SGB V).</p>
<p class="hand">Als Prüfungsthema markiert: „Paragraphen“, § 630f BGB, § 199 BGB.</p>

<h3>4. Kriterien der Wundbeurteilung <span class="seite">S. 11–28</span></h3>
<ul>
  <li><b>Medizinische Wunddiagnose (S. 12–13):</b> Grunderkrankung, Wundart, Schweregrad – Dekubitus nach EPUAP/NPUAP, Ulcus cruris venosum nach Widmer/CEAP, arteriosum nach Fontaine/TASC/Rutherford, diabetisches Fußulkus nach Wagner-Armstrong. Fehlt sie, bei Ärzt:innen erfragen und dokumentieren.</li>
  <li><b>Lokalisation (S. 13–14):</b> schriftlich und grafisch. Gut durchblutete Stellen (Gesicht) heilen schneller als z. B. Haut über dem Schienbein; Muskulatur schneller als Faszien/Sehnen; Gelenkregionen durch Zugkräfte und Reibung belastet.</li>
</ul>
<div class="tabelle"><table>
  <caption>Lagebezeichnungen (S. 14)</caption>
  <thead><tr><th>Begriff</th><th>Bedeutung</th><th>Begriff</th><th>Bedeutung</th></tr></thead>

  </tbody>
</table></div>
<ul>
  <li><b>Wunddauer (S. 14):</b> Zeitspanne seit Auftreten. Je älter die Wunde, desto länger die Heilung und desto höher das Risiko einer Entartung; bei länger bestehenden Wunden neuen Gefäßstatus erheben. Rezidive auf Narbengewebe heilen schlechter.</li>
  <li><b>Rezidive (S. 15):</b> Anzahl und rezidivfreie Zeit in Monaten erfassen.</li>
  <li><b>Wundgröße (S. 15–16):</b> keine Vergleiche wie „handtellergroß“, „Ein-Euro-Stück“ oder „Wunde o. B.“. Länge = größte Ausdehnung in Kopf-Fuß-Achse, Breite = größte horizontale Ausdehnung, im 90°-Winkel; Einmalpapierlineal, Folie zum Umzeichnen. Messpunkte im Team einheitlich festlegen.</li>
  <li><b>Uhrmethode:</b> v. a. für Taschen, Fisteln, Unterminierungen; Kopf = 12 Uhr, Fuß = 6 Uhr unabhängig von der Lage; an Händen/Füßen Zehen- bzw. Fingerspitzen = 12 Uhr, Ferse/Handgelenk = 6 Uhr.</li>
  <li><b>Tiefe:</b> senkrecht an der tiefsten Stelle mit sterilen Pinzetten, Sonden, Knopfkanülen, Spülkathetern – keine Watteträger (Rückstände, Infektionsrisiko). <b>Volumen:</b> Auslitern mit Folie und z. B. Ringerlösung, Angabe in ml.</li>
</ul>
<h4>Wundgrund und Gewebearten (S. 16–20)</h4>
<ul>
  <li><b>Nekrose:</b> Endstadium einer Zellschädigung. Trocken: dunkelbraun bis schwarz, hart, lederartig, klar abgegrenzt. Feucht: grau-gelb, weich, faserig/schmierig. Ausdehnung der Wunde nicht beurteilbar. Gangrän: akraler, scharf begrenzter Gewebeuntergang durch Durchblutungsstörung, Mumifizierung, schwarz.</li>
  <li>Nekrosen grundsätzlich abtragen (Heilung, Wundausmaß, Keimreservoir) – aber erst nach Demarkation. Ausnahme: hochgradige pAVK → äußerste Vorsicht, erst nach Behandlung der Grunderkrankung (S. 17).</li>
  <li><b>Fibrinbeläge:</b> Fibrin = wasserunlösliches Protein; erster Wundverschluss und Gerüst für Granulation; zu fest anhaftend → Störung. Infektfibrin: festsitzend, hell- bis dunkelgelb, schmierig. Eiter vs. Fibrin: optisch gleich; mit steriler Kompresse wischen – Eiter lässt sich abwischen, Fibrin haftet fest (S. 18).</li>
  <li><b>Granulationsgewebe:</b> feucht glänzend, leicht verletzlich, tiefrot, körnig. Gut: rot, feinkörnig, feucht glänzend, fest (gute Durchblutung, Eiweiß, Druckentlastung). Schlecht: blassrosa bis gräulich, schwammig, grobkörnig, stark exsudierend (schlechte Durchblutung, Eiweißmangel, Keimlast, fehlende Druckentlastung). Hypergranulation (über Hautniveau) behandeln: trockene Versorgung oder kontrollierte Druckverbände (S. 18–19).</li>
  <li><b>Epithelgewebe:</b> frisch rosa, wächst vom Rand ein; frisch epithelisierte Wunden mit Schutzverband (Folien, transparente Hydrokolloide) abdecken (S. 19).</li>
  <li><b>Fettgewebe:</b> gelb-orange, weiß oder grau, ölig, kugelig; schlecht durchblutet; abgestorben gräulich, bröselig. <b>Muskel:</b> vital rot, abgestorben fahlgrau bis schwarz. <b>Knochen:</b> gelb-weiß bis grau, hart. <b>Sehnen:</b> gelblich, glatt, glänzend, längs gefasert; geschädigt bräunlich, abgefasert; Taschen entlang des Verlaufs (S. 19–20).</li>
</ul>
<h4>Exsudat (S. 20–22)</h4>
<ul>
  <li><b>Funktion:</b> verhindert Austrocknen, erleichtert das Einwandern von Fibroblasten, ermöglicht Zellbewegung und -teilung, liefert Nährstoffe, transportiert Immun- und Wachstumsfaktoren, unterstützt Autolyse.</li>
  <li>Zu viel → Mazeration, Hautirritation, toxisches Kontaktekzem. Physiologisch nimmt die Menge ab; plötzlicher Anstieg bei fortgeschrittener Heilung → beginnende Infektion.</li>
  <li>Erfassen: Quantität (Verbandwechselhäufigkeit, durchnässte Kompressen) und Qualität (Farbe, Viskosität); Mengenkategorien im Team vereinbaren.</li>
</ul>

<ul>
  <li><b>Wundgeruch (Foetor) (S. 22):</b> nicht objektiv erfassbar → nur ja/nein; nicht immer Infektion (auch sich reinigende Wunden riechen); belastet die Lebensqualität stark.</li>
  <li><b>Wundrand (S. 22–24):</b> Grenze zur intakten Haut; mit fortschreitender Heilung glatt und rosa. Zur Epithelisierung Verkrustungen entfernen. Schutz: alkoholfreie transparente Hautschutzfilme (Hydropolymere, Silikone), Barrierecremes; trocknen lassen, keine zusätzlichen fetthaltigen Produkte.</li>
</ul>

  </tbody>
</table></div>
<p class="warnung">Warum keine Zinkpaste als Wundrandschutz? (S. 24) Verhindert die Beurteilung, lässt sich schwer entfernen (Öle stören dann das Kleben), verdeckt Rötungen als Infektionszeichen, stört in der Wunde die Heilung, mechanische Belastung beim Entfernen, trocknet durch Puderanteil aus → Risse, Eintrittspforte für Keime.</p>
<ul>
  <li><b>Wundumgebung (S. 24–25):</b> angrenzende Haut; z. B. unauffällig, trocken, rissig, atroph, livide. Ausschlag, Juckreiz, Ödem unter dem Kleberand → Allergie; gerötet, warm, schmerzhaft → Infektion. MASD = Moisture Associated Skin Damage (Feuchtigkeit); MARSI = Medical Adhesive-Related Skin Injury (Ablösen von Auflagen).</li>
  <li><b>Entzündung vs. Infektion (S. 25–26):</b> Entzündung = Abwehrreaktion auf chemische/physikalische Reize, Mikroorganismen oder Zellzerfall; in der Wunde durch die Gewebeschädigung selbst ausgelöst, gehört zur Exsudationsphase. Infektion = aktives/passives Eindringen, Anheften und Vermehren von Erregern; in jeder Phase möglich: lokal, sich ausbreitend, systemisch.</li>
  <li><b>Infektionszeichen nach EWMA (S. 26–27)</b> unterscheiden sich je Wundart. Besonderheiten: bei pAVK sind Rötung und Überwärmung kaum vorhanden – Schmerz ist das aussagekräftigste Infektionszeichen; bei diabetischer Neuropathie fehlt der Schmerz, Fieber höchstens subfebril. Diabetischer Fuß u. a. „probes to bone“, Fluktuation, Ulcusbasis von rosa nach gelb/grau; arteriell u. a. trockene Nekrose wird nass.</li>
  <li><b>Infektion in Wundtaschen (S. 28):</b> geröteter, verhärteter, ödematöser, schmerzhafter Rand; starke, dickflüssige, eitrige Exsudation; Geruch; oft Auslöser systemischer Infektion.</li>
  <li><b>Wundschmerz (S. 28):</b> Quantität und Qualität bei jedem Verbandwechsel erfassen; Selbsteinschätzung mit VRS, NRS, GRS (Gesichter), Fremdeinschätzung mit BESD, BISAD; schmerzauslösende und lindernde Situationen sowie Qualität (pochend, brennend, stechend) dokumentieren; Expertenstandards Schmerz beachten.</li>
</ul>
<p class="merke"><b>Wundbeurteilung mit allen Sinnen (S. 29):</b> Hören (Anamnese, Schmerzlaute), Sehen (Haut, Gangbild, Kleidung, Schuhe, Hilfsmittel), Tasten (Verhärtung, Ödem, Temperatur, Faszienlücken), Riechen (Geruch ja/nein). Alte Farbmodelle (schwarz = Nekrose, gelb = Fibrin) werden nicht mehr verwendet.</p>
<p><b>Übungen (Lösung S. 30):</b> 1 – Dekubitus Kategorie IV, Exsudationsphase, Fettnekrose, Tasche spülen und austamponieren; 2 – Ulcus cruris arteriosum mit trockener, demarkierter Nekrose in der Exsudationsphase → Nekrose entfernen.</p>

<script>/* themen/hygiene.js */
/*
 * Thema: Hygienemaßnahmen in der Wundversorgung
 * Quelle: murimed-Kursheft Wundexperte Modul I (Seitenangaben beziehen sich auf das Heft).
 * Inhalte übernommen aus "Zusammenfassung_Hygienemassnahmen.pdf" und
 * "Lernkarten_Hygienemassnahmen.pdf".
 *
 * Quiz-Format: bei "o" (Optionen) steht die RICHTIGE Antwort immer an erster
 * Stelle; die App mischt die Reihenfolge beim Anzeigen.
 * "h: true" = Inhalt stammt (teilweise) nur aus handschriftlichen Notizen im Heft.
 */
Lernapp.thema({
  id: "hygiene",
  titel: "Hygienemaßnahmen in der Wundversorgung",
  kurz: "Hygiene",
  quelle: "murimed-Kursheft Wundexperte Modul I",
  hinweis:
    "Quelle ist ausschließlich das Kursheft; Seitenzahlen in Klammern. „Kein Prüfungsstoff“ = im Heft handschriftlich mit „Ø Prüfung“ markiert. Die im Heft zitierten Regelwerke und Primärquellen wurden nicht separat geprüft.",

  karten: [
    { k: "Grundlagen", f: "Was bedeutet der Begriff Hygiene?",
      a: "Umgangssprachlich Sauberkeit, Keimfreiheit, Entfernung schädlicher Substanzen durch Reinigung und Desinfektion. Als Fachgebiet: Einfluss von Erregern und Noxen auf die Gesundheit und Präventionsmaßnahmen.", s: "S. 3" },
    { k: "Grundlagen", f: "Welche Regelwerke sind für die Hygiene maßgeblich?",
      a: "Arbeitsschutzgesetz, Biostoffverordnung, TRBA, RKI-Richtlinien, Fachgesellschaften (z. B. DGKH); Hygienepläne z. B. des NLGA.", s: "S. 4" },
    { k: "Infektion", f: "Entzündung vs. Infektion? (Übung I)",
      a: "Entzündung: Abwehrreaktion auf Reize (chemisch, physikalisch, Zellzerfall, Erreger); Teil der Wundheilung.\nInfektion: Eindringen und Vermehrung pathogener Erreger; anfangs unsichtbar, Nachweis per Wundabstrich.", s: "S. 6, 33" },
    { k: "Infektion", f: "Nenne die Entzündungszeichen.",
      a: "Rubor – Rötung · Calor – Überwärmung · Tumor – Schwellung · Dolor – Schmerz · Functio laesa – Funktionseinschränkung.", s: "S. 33" },
    { k: "Infektion", f: "Wie wird eine Infektion nach Ausbreitung unterteilt?",
      a: "Lokale Infektion · sich ausbreitende Infektion · generalisierte (systemische) Infektion/Sepsis. Möglich in jeder Wundheilungsphase.", s: "S. 6" },
    { k: "Infektion", f: "Was ist bei Infektionszeichen an der Wunde zuerst zu tun?",
      a: "Immer zuerst einen Wundabstrich durchführen (nach Absprache mit dem Arzt), um den Erreger zu bestimmen.", s: "S. 6, 10" },
    { k: "Prävention", f: "Hygienische Präventionsmethoden? (Übung I)",
      a: "Händedesinfektion, Non-Touch-Methode, Händewaschen, Ablauf von aseptisch zu systemisch infiziert („von sauber zu unrein“), Einmalschürze, Händehygiene (kein Schmuck, keine langen Nägel), sterile Materialien.", s: "S. 33" },
    { k: "Ablauf", f: "Welche Grundregel gilt bei der Versorgung mehrerer Wunden?",
      a: "Von sauber zu unrein: zuerst keimfreie/keimarme, dann kontaminierte und kolonisierte, dann infizierte Wunden, zum Schluss Wunden mit MRE.", s: "S. 7" },
    { k: "Ablauf", f: "Nenne die Reihenfolge der Wundinspektionen.",
      a: "1. aseptisch\n2. kontaminiert\n3. kolonisiert\n4. kritisch kolonisiert\n5. lokal infiziert\n6. systemisch infiziert", s: "S. 7" },
    { k: "Ablauf", f: "Kontaminiert vs. kolonisiert vs. kritisch kolonisiert?",
      a: "Kontaminiert: Keime vermehren sich nicht.\nKolonisiert: vermehrungsfähige Keime, Heilung nicht nachhaltig gestört.\nKritisch kolonisiert: erhöhte Besiedlung, infektgefährdet.", s: "S. 7" },
    { k: "Ablauf", f: "Maßnahmen bei kritisch kolonisierter und lokal infizierter Wunde?",
      a: "Kritisch kolonisiert: aseptischer Verband + Wundabstrich.\nLokal infiziert: aseptischer Verband; je nach Abstrich Antiseptika/antimikrobielle Lokaltherapie.", s: "S. 8" },
    { k: "Ablauf", f: "Maßnahmen bei systemischer Infektion?",
      a: "Aseptischer Wundverband, wiederholter Wundabstrich, Antiseptika/antimikrobielle Lokaltherapie, systemische antimikrobielle Therapie.", s: "S. 8" },
    { k: "Risiko", f: "Welche Faktoren begünstigen eine Wundinfektion?",
      a: "Lokalisation (Anus, Sakralbereich, Füße, Inkontinenz), Umgebungsfaktoren (Hygiene, Haustiere), (Begleit-)Erkrankungen (Immunschwäche, Diabetes, Aids, terminale Phase), Wundart (Verbrennung, DFU, Tumorexulzeration).", s: "S. 9" },
    { k: "Risiko", f: "Anzeichen infektgefährdeter Wunden?",
      a: "Entzündungszeichen, viel/trübes/zäh-eitriges Exsudat, Geruch, bröckeliges blutendes Granulationsgewebe, Verfärbung, Taschen, Vergrößerung, Erythem, Verhärtung, Ödem, Zellulitis, Leukozytose, Abszess.", s: "S. 10" },
    { k: "Risiko", f: "Infektionszeichen bei pAVK und diabetischer Neuropathie?",
      a: "pAVK: Rötung kaum, Überwärmung eingeschränkt – Schmerz ist das aussagekräftigste Zeichen.\nNeuropathie: kaum Schmerz, Fieber höchstens subfebril.", s: "S. 10–11" },
    { k: "Risiko", f: "Was beschreibt die PEDIS-Klassifikation?",
      a: "Schwere der (diabetischen) Fußinfektion nach Lipsky 2006:\n1 nicht infiziert · 2 leicht (≤ 2 cm, oberflächlich) · 3 moderat (tief, Abszess, Knochen) · 4 schwer (systemische Zeichen).", s: "S. 11" },
    { k: "Keime", f: "Was ist eine nosokomiale Infektion?",
      a: "Infektion, die Patient:innen im Zusammenhang mit einer medizinischen Maßnahme erwerben – z. B. im Krankenhaus, in Pflegeeinrichtungen oder ambulanten Praxen (RKI).", s: "S. 12" },
    { k: "Keime", f: "Eiterbild von Staphylo-, Streptokokken und Pseudomonas?",
      a: "Staphylokokken: rahmig, gelblich, geruchlos\nStreptokokken: gelbgrau, dünnflüssig\nPseudomonas: blau-grünlich, süßlich riechend", s: "S. 12" },
    { k: "Keime", f: "Was sind Mikroorganismen (BioStoffV)?",
      a: "Zelluläre oder nichtzelluläre mikroskopisch kleine biologische Einheiten, die sich vermehren oder genetisches Material weitergeben können: Bakterien, Viren, Protozoen, Pilze.", s: "S. 12" },
    { k: "MRE", f: "Was bedeutet „multiresistent“? (Übung II)",
      a: "Keime haben eine Resistenz gegenüber mehreren Antibiotikagruppen entwickelt.", s: "S. 33" },
    { k: "MRE", f: "Helfen Antiseptika und Händedesinfektion gegen MRE?",
      a: "Ja. Resistenz bezieht sich nur auf Antibiotika. Händedesinfektion vernichtet alle MRE; Alkohol, PVP-Jod, Chlorhexidin, Polihexanid, Octenidin wirken. Ausnahme: H₂O₂ und Silber (Lücken; manche Pseudomonas silberresistent).", s: "S. 13–14" },
    { k: "MRE", f: "Was ist MRSA und wie wird er übertragen?",
      a: "Methicillin-resistenter Staphylococcus aureus; v. a. direkter Kontakt über die Hände, auch Niesen, Kleidung, Bettwäsche, Oberflächen; gefährlich bei Immunschwäche.", s: "S. 14" },
    { k: "MRE", f: "Was kennzeichnet VRE und MRGN/ESBL?",
      a: "VRE: Vancomycin-resistente Enterokokken aus der Darmflora; bis 1 Woche außerhalb des Menschen überlebensfähig.\nMRGN/ESBL: gramnegative Erreger aus Darm/Umwelt; gefährlich für Abwehrgeschwächte.", s: "S. 14" },
    { k: "MRE", f: "Was ist das Besondere an Clostridium difficile?",
      a: "Anaerobes grampositives Stäbchen im Darm; unter Antibiotika Vermehrung mit Toxin- und Sporenbildung – Sporen werden durch gängige Desinfektionsmittel nicht abgetötet; starker Durchfall.", s: "S. 14" },
    { k: "MRE", f: "Wann sind MRE meldepflichtig, welche Maßnahmen bei MRSA/VRE?",
      a: "Erst bei Nachweis in Blut oder Liquor.\nMRSA/VRE: Einzelisolierung, Mund-Nasen-Schutz, Schutzkittel, Handschuhe, Händedesinfektion vor und nach Kontakt.", s: "S. 15" },
    { k: "MRE", f: "Was gehört zur Basishygiene? (Übung II)",
      a: "Händedesinfektion, Flächendesinfektion, Schutzkleidung, Isolation.", s: "S. 33" },
    { k: "VW", f: "Was ist vor jedem Verbandwechsel rechtlich erforderlich?",
      a: "Schriftliche ärztliche Anordnung (Häufigkeit, Vorgehen, Medikamente, Wundauflage) und Einverständnis der aufgeklärten Person.", s: "S. 15" },
    { k: "VW", f: "Was ist das Remonstrationsrecht?",
      a: "Recht und Pflicht, eine gefahrengeneigte Versorgung (z. B. veraltete oder gefährdende Verordnung) schriftlich und nachweislich anzuzeigen; Gespräch mit dem Arzt dokumentieren.", s: "S. 15" },
    { k: "VW", f: "Welche Ziele hat ein Verbandwechsel?",
      a: "Wundkontrolle, Wundbeurteilung und Therapieanpassung, Vorbeugung von Keimeinschleppung, Bekämpfung bestehender Infektion, Schmerzvermeidung, Unterstützung der Heilung.", s: "S. 16" },
    { k: "VW", f: "Welche Grundmaßnahmen und Schutzkleidung sind beim Verbandwechsel obligatorisch?",
      a: "Uhren/Schmuck ab, Haare zurück, keine langen Ärmel; Einmalhandschuhe und Einmalschürze/-kittel, nach jedem Patientenkontakt wechseln; bei MRE/großflächigen Wunden zusätzlich MNS.", s: "S. 16" },
    { k: "VW", f: "Was gilt für Spüllösungen und festklebende Kompressen?",
      a: "Spüllösung steril, Haltbarkeit beachten (handschriftlich: Raumtemperatur, nicht kalt).\nFestklebende Kompressen mit steriler Pinzette entfernen.", s: "S. 17", h: true },
    { k: "Hände", f: "Warum ist die Händedesinfektion so wichtig?",
      a: "Grundlegendste Hygienemaßnahme; laut RKI die wichtigste Maßnahme gegen nosokomiale Infektionen; 100- bis 1000-mal wirksamer als Händewaschen.", s: "S. 18" },
    { k: "Hände", f: "Wer war Ignaz Semmelweis?",
      a: "Arzt (geb. 1818) am Wiener Allgemeinen Krankenhaus; erkannte die Übertragung von Kindbettfieber über Ärztehände nach Sektionen; Chlorkalklösung; „Retter der Mütter“. Händedesinfektion vor OPs erst 1867 eingeführt.", s: "S. 18, 32" },
    { k: "Hände", f: "Gegen was wirken alkoholische Händedesinfektionsmittel – und gegen was nicht?",
      a: "Wirksam: Bakterien inkl. MRSA, Pilze, Hefen, M. tuberculosis, behüllte Viren.\nEingeschränkt: unbehüllte Viren (Noro) → Spezialpräparat.\nUnwirksam: Sporen → danach Hände waschen.", s: "S. 19" },
    { k: "Hände", f: "Was fordert die TRBA 250 für die Hände?",
      a: "Keine Schmuckstücke, Ringe, Armbanduhren, Piercings, künstlichen Fingernägel oder Armbänder an Händen und Unterarmen; Nägel kurz und rund geschnitten.", s: "S. 19" },
    { k: "Hände", f: "Nenne die 5 Indikationen der Händedesinfektion (RKI).",
      a: "1. vor Patientenkontakt\n2. vor aseptischen Tätigkeiten\n3. nach Kontakt mit infektiösem Material\n4. nach Patientenkontakt\n5. nach Kontakt mit der Patientenumgebung", s: "S. 20" },
    { k: "Hände", f: "Menge und Einwirkzeit bei der Händedesinfektion?",
      a: "So viel, wie in eine hohle Hand passt (3–5 ml); Hände über die gesamte Einreibezeit (üblicherweise 30 s) benetzt halten. Ablauf nach DIN EN 1500.", s: "S. 20" },
    { k: "Hände", f: "Fehlerquellen bei der Händedesinfektion? (Übung III)",
      a: "Händewaschen statt Desinfektion, zu kurze Einwirkzeit, zu wenig Mittel, zu selten, vorgeschädigte Haut, Schmuck oder lange Nägel nicht abgelegt.", s: "S. 33" },
    { k: "Kosten", f: "Was steht Pflegebedürftigen nach § 40 Abs. 2 SGB XI zu?",
      a: "Pflegehilfsmittel-Paket bis max. 40 € monatlich ab Pflegegrad 1 bei häuslicher Versorgung: MNS, Einmalhandschuhe, Einmalschürzen, Bettschutzeinlagen, Hände-/Flächendesinfektion.", s: "S. 22" },
    { k: "Durchführung", f: "Was ist stationär am Krankenbett zu beachten?",
      a: "Informieren, Einverständnis, Stoppsignale, Analgetika rechtzeitig; Arbeitsfläche schaffen, sterile Materialien patientenfern, Bett ist keine Ablage; Licht, Arbeitshöhe, Türen/Fenster zu, Besucher raus.", s: "S. 23–24" },
    { k: "Durchführung", f: "Besonderheiten im ambulanten Bereich?",
      a: "Material staub-, hitze-, feuchtgeschützt in Kunststoffboxen; Licht (Stirnlampe); Haustiere raus; desinfiziertes Kunststofftablett; Bett/Fußboden keine Ablage; Abwurfbehälter nicht aus Glas.", s: "S. 24" },
    { k: "Durchführung", f: "Wie wird die Wunde gereinigt?",
      a: "Aseptisch mit sterilen Instrumenten und Tupfern/Kompressen; wischen, nicht tupfen; pro Wischgang ein neuer Tupfer bzw. eine neue Kompresse.", s: "S. 25" },
    { k: "Durchführung", f: "Wann erfolgen Handschuhwechsel und Händedesinfektion beim Verbandwechsel?",
      a: "Zu Beginn; nach Entfernen des alten Verbands; vor der Wundreinigung (nach ggf. Abstrich); nach der Inspektion vor dem neuen Verband; am Ende nach Entsorgung.", s: "S. 25" },
    { k: "Technik", f: "Was ist die Non-Touch-Technik?",
      a: "Nur steriles Material berührt die Wunde: unsterile Handschuhe + sterile Instrumente, Wunde nie mit den Händen berühren; alternativ sterile Handschuhe oder sterile/unsterile Hand. Unsauberes Material nie zurück zur Wunde.", s: "S. 26" },
    { k: "Abstrich", f: "Wie wird ein Wundabstrich vorbereitet?",
      a: "Aus der Wundtiefe; vorher mechanische Reinigung mit angefeuchteten Kompressen und/oder Spülung mit NaCl – keine Antiseptika.\nAusnahme: Verdacht auf MRE → ohne vorherige Säuberung.", s: "S. 26" },
    { k: "Abstrich", f: "Was ist beim Wundabstrich zu dokumentieren und zu beachten?",
      a: "Entnahmestelle, Wundart, Grunderkrankung, bisherige Antibiose; Begleitschein und Etikett vollständig; gewünschte Untersuchung; Lagerung bei Zimmertemperatur; zeitnaher Transport.", s: "S. 27" },
    { k: "Abstrich", f: "Essener Wundkreisel vs. Levine-Technik?",
      a: "Essener Wundkreisel: kreisend von außen nach innen, großes Areal – MRE-Screening.\nLevine: ca. 1 cm² unter leichtem Druck – Erregersuche bei Infektverdacht, Taschen/Unterminierungen.", s: "S. 27" },
    { k: "Nach", f: "Was gehört zur Nachbereitung des Verbandwechsels?",
      a: "Instrumente sicher entsorgen, Handschuhe/Kittel ab, Händedesinfektion inkl. Unterarme, Patient lagern, nach Beschwerden fragen, Flächen desinfizieren, Müll außerhalb entsorgen, Dokumentation, Wagen auffüllen.", s: "S. 28" },
    { k: "Nach", f: "Komplikationen mangelnder Hygiene beim Verbandwechsel? (Übung III)",
      a: "Schmerzhafte Entzündungen, Ausbreitung zur systemischen Infektion, Sepsis, Organinfektionen (Pneumonie), MRE-Ausbreitung auf Immungeschwächte, Wundheilungsstörung.", s: "S. 34" },
    { k: "Nach", f: "Fehlerquellen beim Umgang mit Material und Spüllösungen? (Übung III)",
      a: "Geöffnete Materialien, Haltbarkeit (auch nach Öffnen) nicht beachtet, unsteril oder feucht gelagert, keine Non-Touch-Technik, keine aseptische Wundreinigung.", s: "S. 34" }
  ],

  quiz: [
    { f: "In welcher Reihenfolge werden mehrere Wunden versorgt?",
      o: ["Von sauber zu unrein: aseptisch zuerst, Wunden mit MRE zum Schluss", "Die größte Wunde immer zuerst", "Infizierte Wunden zuerst, damit sie schnell versorgt sind", "Von unten nach oben am Körper"],
      e: "Zuerst keimfreie/keimarme, dann kontaminierte und kolonisierte, dann infizierte Wunden, zum Schluss Wunden mit MRE.", s: "S. 7" },
    { f: "Welche Maßnahme gehört bei einer kritisch kolonisierten Wunde zusätzlich zum aseptischen Verband?",
      o: ["Wundabstrich", "Systemische Antibiotikatherapie", "Sofortige Einzelisolierung", "Keine weitere Maßnahme"],
      e: "Kontaminiert/kolonisiert: aseptischer Wundverband · kritisch kolonisiert: aseptischer Verband + Wundabstrich.", s: "S. 8" },
    { f: "Was ist bei Infektionszeichen an einer Wunde immer zuerst zu tun?",
      o: ["Einen Wundabstrich durchführen (nach Absprache mit dem Arzt)", "Sofort ein Antiseptikum auftragen", "Die Wunde mit Zinkpaste abdecken", "Den Verbandwechsel ausfallen lassen"],
      e: "Bei Infektionszeichen immer zuerst Wundabstrich, um den Erreger zu bestimmen.", s: "S. 6, 10" },
    { f: "Was beschreibt die Maßnahmen bei einer systemisch infizierten Wunde?",
      o: ["Aseptischer Verband, wiederholter Abstrich, Antiseptika/Lokaltherapie und systemische antimikrobielle Therapie", "Nur ein aseptischer Wundverband", "Nur ein einmaliger Wundabstrich", "Nur Händewaschen vor dem Verbandwechsel"],
      e: "Systemisch infiziert: aseptischer Wundverband, wiederholter Wundabstrich, Antiseptika/antimikrobielle Lokaltherapie, systemische antimikrobielle Therapie.", s: "S. 8" },
    { f: "Wie viel wirksamer ist die Händedesinfektion als Händewaschen?",
      o: ["100- bis 1000-mal", "2- bis 3-mal", "Gleich wirksam", "10-mal"],
      e: "Grundlegendste Hygienemaßnahme; laut RKI die wichtigste Maßnahme gegen nosokomiale Infektionen; 100- bis 1000-mal wirksamer als Händewaschen.", s: "S. 18" },
    { f: "Wie viel Händedesinfektionsmittel und wie lange?",
      o: ["Eine hohle Hand voll (3–5 ml), Hände über die gesamte Einreibezeit (meist 30 s) benetzt halten", "Ein Tropfen, 5 Sekunden", "10 ml, 3 Minuten", "So viel wie nötig, bis die Hände trocken sind, ca. 5 s"],
      e: "So viel, wie in eine hohle Hand passt (3–5 ml); Hände über die gesamte Einreibezeit (üblicherweise 30 s) benetzt halten. Ablauf nach DIN EN 1500.", s: "S. 20" },
    { f: "Wogegen wirken alkoholische Händedesinfektionsmittel NICHT?",
      o: ["Gegen Sporen – danach Hände waschen", "Gegen MRSA", "Gegen behüllte Viren", "Gegen Hefen und Pilze"],
      e: "Wirksam: Bakterien inkl. MRSA, Pilze, Hefen, M. tuberculosis, behüllte Viren. Eingeschränkt: unbehüllte Viren (Noro). Unwirksam: Sporen.", s: "S. 19" },
    { f: "Was ist bei Noroviren (unbehüllte Viren) zu beachten?",
      o: ["Alkoholische Mittel wirken nur eingeschränkt → spezielles Präparat verwenden", "Händedesinfektion ist überflüssig", "Nur Händewaschen ohne Desinfektion", "Alkoholische Mittel wirken besonders gut"],
      e: "Unbehüllte Viren (Noroviren) nur eingeschränkt → spezielle Präparate (Auswahl nach VAH).", s: "S. 19" },
    { f: "Welche ist eine der 5 Indikationen der Händedesinfektion (RKI)?",
      o: ["Nach Kontakt mit der Patientenumgebung", "Nur bei sichtbarer Verschmutzung", "Einmal zu Schichtbeginn", "Nur nach dem Toilettengang"],

<h3>4. Begünstigende Faktoren und Infektionsanzeichen <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 9–11</span></h3>

<h3>5. Keime in Wunden <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 12–15</span></h3>
<ul>
  <li>Infektion entsteht durch Erreger der eigenen Hautflora oder exogene Übertragung in Epidermis/Dermis; abhängig von Pathogenität und Immunkompetenz. Übertragung u. a. beim Verbandwechsel durch Personal.</li>
  <li><b>Mikroorganismen</b> (BioStoffV § 2): zelluläre oder nichtzelluläre mikroskopisch kleine biologische Einheiten, die sich vermehren oder genetisches Material weitergeben können – Bakterien, Viren, Protozoen, Pilze.</li>
</ul>
<p class="merke"><b>Nosokomiale Infektion ★</b> (RKI 2020): Infektion, die Patient:innen im Zusammenhang mit einer medizinischen Maßnahme erwerben – z. B. in Krankenhaus, Pflegeeinrichtung oder ambulanter Praxis. Ältere Menschen besonders gefährdet.</p>
<p class="merke"><b>Bakterienstämme ★ (S. 12):</b> Staphylokokken → rahmig, gelblicher Eiter, geruchlos · Streptokokken → gelbgrauer, dünnflüssiger Eiter · Pseudomonas → blau-grünlicher Eiter, süßlich riechend.</p>
<ul>
  <li><b>Multiresistent</b> = Keime mit Resistenz gegen mehrere Antibiotikagruppen (Lösung S. 33). Resistenz bezieht sich immer nur auf Antibiotika, nie auf Antiseptika/Desinfektiva: hygienische Händedesinfektion vernichtet alle MRE; Alkohol, Polyvidonjod, Chlorhexidin, Polihexanid, Octenidin wirken. Ausnahmen mit Wirklücken: Wasserstoffperoxid und Silber (manche Pseudomonas-Stämme silberresistent) (S. 13–14).</li>
  <li><b>MRSA ★</b> (Methicillin-resistenter Staphylococcus aureus): Übertragung v. a. durch direkten Kontakt über die Hände, auch über Niesen, Kleidung, Bettwäsche, Oberflächen; gefährlich bei Immunschwäche. (Im Heft „Methycilli-“ geschrieben.)</li>
  <li><b>VRE</b> (Vancomycin-resistente Enterokokken): aus der Darmflora oder über Kontakt; besiedeln Wunden, Haut, Hände, Sonden, Katheter; bis zu 1 Woche außerhalb des Menschen überlebensfähig.</li>
  <li><b>MRGN/ESBL-Bildner:</b> multiresistente gramnegative Erreger aus Darm oder Umwelt (z. B. Wasser); machen nicht zwingend krank, gefährlich für Abwehrgeschwächte (Harnwegs-, Wund-, Atemwegsinfektionen); Übertragung über Hände, Nahrung, Gegenstände.</li>
  <li><b>Clostridium difficile:</b> anaerobes grampositives Stäbchen im Darm; unter Antibiotika Vermehrung, Toxin- und Sporenbildung (umweltresistent, durch gängige Desinfektionsmittel nicht abgetötet) → starker Durchfall.</li>
  <li>MRE sind erst bei Nachweis in Blut oder Liquor meldepflichtig; Nachweis in der Wunde nur per Abstrich. MRSA, VRE: Einzelisolierung, Mund-Nasen-Schutz, Schutzkittel, Handschuhe, Händedesinfektion vor und nach Patientenkontakt (S. 15).</li>
  <li><b>Basishygiene</b> (Lösung S. 33): Händedesinfektion, Flächendesinfektion, Schutzkleidung, Isolation.</li>
</ul>

<h3>6. Verbandwechsel – Voraussetzungen und Ziele <span class="seite">S. 15–17</span></h3>
<ul>
  <li>Immer schriftliche ärztliche Anordnung (Häufigkeit, Vorgehen, Medikamente, Wundauflage) und Einverständnis des aufgeklärten Betroffenen.</li>
  <li>Entspricht die Verordnung nicht dem Wissensstand oder gefährdet sie Patient:innen → Pflicht zum <b>Remonstrationsrecht</b> (Recht und Pflicht, eine gefahrengeneigte Versorgung schriftlich und nachweislich anzuzeigen); Austausch dokumentieren.</li>
  <li>Bei Schmerzen Analgetika auf ärztliche Anordnung rechtzeitig vorher geben (Wirkeintritt beachten). <span class="hand-inline">Handschriftlich: 30–60 min vorher.</span> Dokumentation von Wundverhältnissen, Vorkommnissen, Maßnahmen, Medikamenten.</li>
  <li><b>Ziele:</b> Wundkontrolle, Wundbeurteilung und ggf. Therapieanpassung, Vorbeugung der Keimeinschleppung, Bekämpfung bestehender Infektion, Schmerzvermeidung, Unterstützung der Heilung.</li>
  <li><b>Grundmaßnahmen:</b> Uhren und Schmuck ablegen, Haare zurückbinden/Haube, Schutzkleidung, keine ungeeignete langärmlige Kleidung. Obligatorisch: Einmalhandschuhe und Einmalschürze/-kittel, nach jedem Patientenkontakt wechseln; bei großflächigen, infektionsgefährdeten oder MRE-Wunden zusätzlich Mund-Nasen-Schutz. (Studie Wiener-Well 2011: an 63 % der Kleidungsstücke pathogene Bakterien.)</li>
</ul>
<p class="merke"><b>Checkliste vor dem Verbandwechsel (S. 17–18):</b> ärztliche Anordnung · Einverständnis · Wunddokumentation · alles mit Wundkontakt steril (Instrumente, Spüllösungen, Handschuhe, Material) · richtige Reihenfolge (kolonisierte/infizierte Wunden zuletzt) · aufwändige Verbandwechsel zu zweit · Kontakt mit Exsudat vermeiden (Handschuhe, Kittel, MNS) · sterile, gut sitzende, bakteriendichte Wundauflage · Non-Touch-Technik (RKI) · sterile Spüllösung, Haltbarkeit beachten · festklebende Kompressen mit steriler Pinzette lösen · Händedesinfektion vor und nach · Arbeitsfläche desinfizieren · keine künstlichen Nägel, Nagellack, Schmuck.</p>
<p class="hand">Spüllösung nicht kalt, Raumtemperatur (Zellteilung erst ab 28 °C).</p>

<h3>7. Händedesinfektion <span class="seite">S. 18–21</span></h3>
<ul>
  <li>Grundlegendste Hygienemaßnahme; laut RKI die wichtigste Maßnahme zur Prävention nosokomialer Infektionen; <b>100- bis 1000-mal wirksamer als Händewaschen</b>. Rechtliche Pflicht; Orientierung an RKI und TRBA.</li>
  <li><b>Ignaz Semmelweis</b> (geb. 1818, Wiener Allgemeines Krankenhaus): Kindbettfieber durch Ärzte nach Leichensektion; Chlorkalklösung senkte die Sterblichkeit; „Retter der Mütter“. Händedesinfektion vor OPs erst 1867 eingeführt.</li>
  <li><b>Ziele:</b> Eigen- und Fremdschutz, Beseitigung der transienten Flora, Reduktion der resistenten Keimflora, Unterbrechung von Infektionsketten, weniger Folgekosten.</li>
  <li><b>Wirkstoff:</b> fast immer Alkohol (n-Propanol, Iso-Propanol, Ethanol) – schädigt Zellwände; oft rückfettend. Wirksam gegen gramnegative und grampositive Bakterien inkl. MRSA, Pilze, Hefen, Mycobacterium tuberculosis, behüllte Viren (HSV, HBV, HIV, Influenza); unbehüllte Viren (Noroviren) nur eingeschränkt → spezielle Präparate (Auswahl nach VAH). Keine Wirkung gegen Sporen → danach Händewaschen (RKI).</li>
  <li><b>TRBA 250:</b> bei Tätigkeiten mit Händedesinfektion keine Schmuckstücke, Ringe, Uhren, Piercings, künstlichen Nägel oder Armbänder an Händen/Unterarmen; Nägel kurz und rund.</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>5 Indikationen (RKI)</th><th>Technik (DIN EN 1500, RKI, VAH)</th></tr></thead>
  <tbody>
    <tr><td style="font-weight:400;white-space:normal">1. vor direktem Patientenkontakt<br>2. vor aseptischen Tätigkeiten<br>3. nach Kontakt mit potenziell infektiösem Material<br>4. nach direktem Patientenkontakt<br>5. nach Kontakt mit der direkten Patientenumgebung<br><br>Wundversorgung = aseptische Tätigkeit → Händedesinfektion vor jedem Kontakt mit nicht intakter Haut, auch vor dem Richten von Material und Instrumenten.</td>
    <td>1. Uhren und Schmuck ablegen<br>2. eine hohle Hand voll (3–5 ml)<br>3. Hände über die gesamte Einreibezeit (meist 30 s) benetzt halten<br>4. Handfläche auf Handfläche inkl. Handgelenk<br>5. Fingerkuppen kreisend in der Handfläche (Fingerspitzen, Nagelfalze, Daumen, Zwischenräume)<br>6. Handfläche auf Handrücken<br>7. Handflächen mit verschränkten, gespreizten Fingern<br>8. Außenseite der verschränkten Finger auf gegenüberliegende Handfläche<br>9. Daumen kreisend in der geschlossenen Handfläche</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Fehlerquellen</b> (Lösung Übung III, S. 33): Händewaschen statt Desinfektion, zu kurze Einwirkzeit, zu wenig Mittel, zu selten, vorgeschädigte Haut/Läsionen, Störutensilien wie Schmuck und lange Nägel.</li>
</ul>

<h3>8. Kosten und Durchführung <span class="seite">S. 22–25</span></h3>
<ul>
  <li>Stationär stellt der Arbeitgeber die Hygieneausstattung. Ambulant: Pflegehilfsmittel-Paket nach § 40 Abs. 2 SGB XI, max. 40 € monatlich, ab Pflegegrad 1 bei häuslicher Versorgung (MNS, Einmalhandschuhe, Einmalschürzen, Bettschutzeinlagen, Hände-/Flächendesinfektion). Hilfsmittel sind für die Patient:innen, nicht für die Pflegekraft. Kassen veranschlagen meist 10 min bzw. ca. 10 € je Verbandwechsel. Laut HKP-Richtlinie sollen chronische Wunden nur noch von spezialisierten Leistungserbringern versorgt werden.</li>
  <li><b>Stationär (S. 23–24):</b> Verbandwagen oder Tablettsystem (RKI); Wagen vor Kontamination schützen, Flächen desinfiziert. Instrumente mit ZSVA „trocken“, sonst „nass“ in Desinfektionslösung transportieren. Abwurfbehälter für Spitzes. Nach Benutzung wischdesinfizieren, auffüllen; Routinereinigung wöchentlich. Am Bett: informieren, Einverständnis, Stoppsignale vereinbaren, Analgetika rechtzeitig; Arbeitsfläche (Beistelltisch), sterile Materialien patientenfern, Bett ist keine Ablage; gute Ausleuchtung, Bett auf Arbeitshöhe, Fenster/Türen zu, Besucher raus.</li>
  <li><b>Ambulant (S. 24):</b> Materialien staub-, hitze-, feuchtgeschützt in Kunststoffboxen lagern; Licht (Stirnlampe); Haustiere aus dem Zimmer; Arbeitsfläche aus wischdesinfiziertem Kunststofftablett, Bett und Fußboden sind keine Ablage; Abwurfbehälter aus Kunststoff, nicht aus Glas (Unfallverhütungsvorschrift).</li>
</ul>
<p class="merke"><b>Eigentlicher Verbandwechsel (S. 25):</b> 1 Händedesinfektion · 2 alten Verband mit sterilem Wasser/NaCl 0,9 % lösen · 3 Tamponaden mit steriler Pinzette entfernen · 4 Verband auf Eiter, Blut, Sekret prüfen · 5 im Abwurf entsorgen · 6 Handschuhe verwerfen · 7 Händedesinfektion · 8 ggf. Wundabstrich · 9 Handschuhwechsel + Händedesinfektion · 10 Wunde und Rand aseptisch mit sterilen Instrumenten reinigen · 11 wischen, nicht tupfen, pro Wischgang neuer Tupfer · 12 Wundinspektion · 13 Handschuhwechsel + Händedesinfektion · 14 Fäden/Klammern mit neuen sterilen Instrumenten · 15 Taschen austamponieren · 16 Verband nach AO und Phase auflegen und fixieren · 17 Abfall, Handschuhe, Kittel entsorgen · 18 Händedesinfektion.</p>

<h3>9. Non-Touch-Technik und Wundabstrich <span class="seite">S. 26–27</span></h3>
<ul>
  <li><b>Non-Touch-Technik</b> („nicht berühren“): nur steriles Material berührt die Wunde. Arbeiten mit unsterilen Handschuhen und sterilen Instrumenten; Wunde nie mit den Händen berühren. Alternativ sterile Handschuhe (zweite Person oder gute Vorbereitung) oder Aufteilung in sterile und unsterile Hand. Unsaubere Materialien gehen nie zur sauberen Wunde zurück; aufwändige Verbandwechsel zu zweit.</li>
  <li><b>Wundabstrich</b> aus der Wundtiefe (eigentlicher Wundkeim statt Oberflächenkeime). Vorher mechanische Reinigung mit angefeuchteten Kompressen und/oder Spülung mit Kochsalzlösung – keine Antiseptika oder chemischen Zusätze (verfälschen das Ergebnis). Ausnahme: Verdacht auf MRE → ohne vorherige Säuberung abstreichen.</li>
  <li>Deklariertes Abstrichröhrchen, Herstellerangaben; Information, Händedesinfektion, Einmalhandschuhe. Dokumentieren: Entnahmestelle, Wundart, Grunderkrankung, bisherige Antibiotikatherapie; Begleitschein und Etikett vollständig; gewünschte Untersuchung; Lagerung bei Zimmertemperatur; zeitnaher Transport.</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Technik</th><th>Durchführung</th><th>Indikation</th></tr></thead>
  <tbody>
    <tr><td style="white-space:normal">Essener Wundkreisel</td><td>kreisend von außen nach innen über möglichst großes Areal</td><td>gezielte MRE-Suche, z. B. bei Neuaufnahme</td></tr>
    <tr><td style="white-space:normal">Levine-Technik</td><td>ca. 1 cm² eines klinisch infizierten Areals unter leichtem Druck</td><td>Erregersuche in Unterminierungen/Taschen bei Verdacht auf Wundinfektion</td></tr>
  </tbody>
</table></div>

<h3>10. Nachbereitung <span class="seite">S. 28–29</span></h3>
<ul>
  <li>Instrumente sofort kontaminationsfrei in Auffangbehälter; Handschuhe und Kittel entsorgen; Händedesinfektion inkl. Unterarme; Patient:in angenehm lagern, Trinkbecher, Brille, Klingel bereitlegen; nach Druckgefühl, Schmerz, Juckreiz fragen; Arbeitsflächen desinfizieren; Müllbeutel außerhalb des Zimmers entsorgen; Händedesinfektion; Dokumentation; stationär Verbandwagen wischdesinfizieren und auffüllen.</li>
  <li><b>Komplikationen mangelnder Hygiene</b> (Lösung Übung III, S. 34): schmerzhafte Entzündungen, Ausbreitung lokaler zu systemischer Infektion, Sepsis, Organinfektionen (Pneumonie), Ausbreitung von MRE auf immungeschwächte Patient:innen, Wundheilungsstörung (Vergrößerung, Stagnation).</li>
  <li><b>Fehlerquellen bei Material (S. 34):</b> geöffnete Materialien verwendet, Haltbarkeit (auch nach Öffnen) nicht beachtet, unsteriles oder feucht gelagertes Material, keine Non-Touch-Technik, keine aseptische Wundreinigung.</li>
</ul>
<p class="hand">Kein Prüfungsstoff: Umgang mit Verbandmaterial (Verfallsdatum prüfen, keine angebrochenen Materialien, nicht unsteril lagern, Wechselintervall nach Exsudat und Herstellerangaben – nicht nach Tourenplan) und die Symboltabelle (z. B. LOT = Charge, SN = Seriennummer, REF = Bestellnummer, durchgestrichene 2 = nicht zur Wiederverwendung).</p>

  hinweis:
    "Quelle ist ausschließlich das Kursheft; Seitenzahlen in Klammern. ★ = im Heft handschriftlich als prüfungsrelevant markiert („Prüfung“ bzw. „X Prüfung“/oranges X). Handschriftliche Notizen sind als solche gekennzeichnet und wurden nicht korrigiert. Die im Heft zitierten Primärquellen (Danzer 2019, Protz/Timm 2019, DNQP, DGE u. a.) wurden nicht separat geprüft.",

  karten: [
    { k: "Wundheilung", f: "Wie definiert das Heft die Wundheilung?",
      a: "Komplexer Prozess: physiologische Vorgänge zur Regeneration zerstörten Gewebes, die v. a. durch Neubildung von Bindegewebe und Kapillaren den Wundverschluss bewirken (Pfitzmann).", s: "S. 3" },
    { k: "Wundheilung", f: "Primäre vs. sekundäre Wundheilung? ★",
      a: "Primär: aseptische OP-Wunden/frische Verletzungen, Ränder adaptiert und glatt; minimale Narbe, ca. 10 Tage (handschr.: Naht/Klammern, 6–10 d).\nSekundär: Lücke füllt sich mit Granulationsgewebe, starke Narbe; alle chronischen Wunden und Verbrennungen; dauert länger, Infektionsrisiko.", s: "S. 3, 5", h: true },
    { k: "Wundheilung", f: "Wie viele Wundheilungsphasen gibt es? ★",
      a: "5: Hämostase, Exsudation, Granulation, Epithelisierung, Remodulierung.\n3 (Praxis): Exsudations-, Granulations-, Epithelisierungsphase (Hämostase + Exsudation und Epithelisierung + Remodulierung zusammengefasst).\nHandschr.: beides richtig.", s: "S. 3–4", h: true },
    { k: "Wundheilung", f: "Was passiert in der Hämostase?",
      a: "Unmittelbare Reaktion auf die Verletzung: Kapillaren ziehen sich zusammen, Vasokonstriktion, Blutgerinnsel – Thrombozyten und Erythrozyten bilden einen Thrombus als Grundlage der Reparation.", s: "S. 3–4" },
    { k: "Wundheilung", f: "Was kennzeichnet die Exsudationsphase?",
      a: "Reinigungsphase: starke Exsudation, Entzündungsreaktion, Keimabwehr, Abtransport von Zelltrümmern; Fibroblastenvermehrung leitet Neoangiogenese ein. Bei Immunschwäche abgeschwächte/verzögerte Entzündung.", s: "S. 3–4" },
    { k: "Wundheilung", f: "Was kennzeichnet die Granulationsphase?",
      a: "Akut ab dem 2. Tag, bis zu 14 Tage. Fibroblasten bauen gefäß-, zell- und kollagenreiches Gewebe; Neoangiogenese, Wundkontraktion, nachlassende Exsudation. Gewebe tiefrot, gekörnt, feucht glänzend.", s: "S. 3–4" },
    { k: "Wundheilung", f: "Epithelisierung und Remodulierung?",
      a: "Epithelisierung: Granulationsgewebe trocknet ab, Epithel bildet sich, „Überhäutung“, erstes Narbengewebe (handschr.: feuchtes Milieu wichtig!).\nRemodulierung: über Monate; zell- und gefäßarme Narbe ohne Hautanhangsorgane, max. 80 % der Belastbarkeit.", s: "S. 3–4", h: true },
    { k: "Wundheilung", f: "Was ist Hypergranulation? (handschr.)",
      a: "„Wildes Fleisch“: zu feucht, über das Hautniveau hinaus, dunkelrot, körnig, glänzend feucht. Zählt zu den lokalen Einflussfaktoren.", s: "S. 4 handschr., S. 5, 27", h: true },
    { k: "Grundlagen", f: "Was bedeutet Kausaltherapie? Beispiele?",
      a: "Behebung der Wundursache – muss vor dem Heilungsprozess erfolgen.\npAVK: Durchblutung (Dilatation, Bypass) · CVI: Kompression · Dekubitus: Druck-, Reibe-, Scherkräfte minimieren · DFU: Stoffwechseleinstellung + Druckentlastung.", s: "S. 5" },
    { k: "Grundlagen", f: "Nenne allgemeine (systemische) Einflussfaktoren.",
      a: "Entstehen im Körper oder Geist: Allgemeinzustand, Mobilität, Ernährung, Flüssigkeit, Schmerz, Hautzustand, Immunstatus, Medikamente, Nikotin, Adipositas, Lebensalter, Psyche, Adhärenz, Stoffwechsel-/Gefäßerkrankungen, Entzündungen/Infektionen.", s: "S. 5" },
    { k: "Grundlagen", f: "Nenne lokale Einflussfaktoren.",
      a: "Entstehen in der Wunde selbst: Entzündung, Infektion, Hypergranulation, Druck, Scherkräfte, hypertrophe Narbe, Auskühlung/Austrocknung, Ödeme, Hämatome, Nekrosen, Schorf, Dehiszenz, Fremdkörper, OP-Technik (Naht unter Spannung).", s: "S. 5, 27" },
    { k: "Allgemein", f: "Welche Rolle spielt der Allgemeinzustand?",
      a: "Wundheilung hat hohen Energiebedarf. Je schlechter der Allgemeinzustand, desto schlechter die Wundheilung; Erhalt lebenswichtiger Organe hat Vorrang.", s: "S. 6" },
    { k: "Ernährung", f: "Was ist Malnutrition – wen betrifft sie? (Übung I)",
      a: "Fehl- bzw. Mangelernährung: Ungleichgewicht zwischen Makro-, Mikronährstoffen und Flüssigkeit. Möglich bei Über-, Normal- und Untergewicht.", s: "S. 7, 30" },
    { k: "Ernährung", f: "Wie verändert sich der Bedarf im Alter?",
      a: "Bewegung, Muskelmasse, Stoffwechselleistung und Fettmasse ↓ → Energiebedarf ↓, Vitamin- und Mineralstoffbedarf bleibt gleich → weniger Energiedichte, mehr Vitamine/Mineralstoffe.", s: "S. 7" },
    { k: "Ernährung", f: "Wie erfasst man den Ernährungszustand? ★ (Übung I)",
      a: "Lösung: Screening, vertiefendes Assessment (handschr. Reihenfolge: 1. Screening, 2. vertieftes Assessment). Text: Laboruntersuchungen, Screening. Frühzeitiges Erkennen ist Voraussetzung für Gegenmaßnahmen.", s: "S. 7, 13, 30", h: true },
    { k: "Ernährung", f: "Was sind Makronährstoffe? ★",
      a: "Kohlenhydrate ca. 50–60 % – wichtigste Energiequelle\nFette ca. 30–35 % – Energiespeicher, Wärme-/Kälteschutz, fettlösliche Vitamine E, D, K, A („EDEKA“)\nProteine ca. 10–15 % – Struktur, Abwehr, Transport.", s: "S. 8, 11", h: true },
    { k: "Ernährung", f: "Welche Aufgaben haben Proteine und Albumin?",
      a: "Strukturproteine (Kollagen, Keratin, Elastin), Schutzproteine (Fibrinogen, Thrombin), Transportproteine (Hämoglobin, Transferrin), Enzyme (Kollagenaufbau). Albumin reguliert Flüssigkeit in Gefäßen – Mangel → Eiweißödeme.", s: "S. 8" },
    { k: "Ernährung", f: "Welche Nährstoffe sind bei bestehenden Wunden wichtig? ★",
      a: "Zell-/Kollagenaufbau: Proteine, Vitamin A, alle B-Vitamine, Vitamin C, Albumin, Zink, Eisen. Antientzündlich/Radikalfänger: Vitamin E.\nDazu ausreichend Flüssigkeit (Verlust durch Fieber, Wundsekret).", s: "S. 7–8, 10" },
    { k: "Ernährung", f: "Wofür werden Vitamin C, Zink und Eisen benötigt?",
      a: "Vitamin C: Kollagensynthese, Immunsystem, Eisenresorption, Regeneration Vit E.\nZink: Wundverschluss, Zellwachstum, Immunsystem.\nEisen: Sauerstofftransport (Hämoglobin), Kollagensynthese.", s: "S. 9–10" },
    { k: "Ernährung", f: "Mengen- vs. Spurenelemente?",
      a: "Mengenelemente (> 50 mg/kg): Natrium, Kalium, Kalzium, Magnesium.\nSpurenelemente (< 50 mg/kg): Eisen, Selen, Jod, Zink, Mangan.\nBeide essentiell, mit der Nahrung aufzunehmen.", s: "S. 10" },
    { k: "Ernährung", f: "Wie können Nährstoffe zugeführt werden? ★",
      a: "Tägliche Nahrung · Anreicherung (Sahne, Butter, Öl, Nüsse, Proteinpulver, Vitaminpräparate) · angereicherte Trinknahrung · Sonden-/parenterale Ernährung. Individuelle Beratung durch Expert:innen.", s: "S. 11" },
    { k: "Ernährung", f: "Folgen der Malnutrition für die Wundheilung?",
      a: "Verlängerte Entzündungsphase, Kollagensynthese ↓, Immunschwäche, Dekubitusrisiko ↑, Fibroblastenaktivität ↓, Angiogenese ↓, Gerinnungsstörung (Vit-K-Mangel), Proteinmangelödeme, mechanische Stabilität ↓.", s: "S. 11" },
    { k: "Ernährung", f: "Wie kann Mangelernährung Wunden verursachen?",
      a: "Antriebsarmut + Immobilität → Dekubitus\nKachexie → Nekrose\nEiweißmangelödeme → Ulcus.", s: "S. 12" },
    { k: "Bewegung", f: "Warum fördert Bewegung die Wundheilung?",
      a: "Muskelaktivität, Gelenkbeweglichkeit, Durchblutung (O₂, Nährstoffe), Kollateralenbildung, Allgemeinzustand; Positionswechsel vermeidet Druckschäden. Aktiv und passiv wirksam. Handschr.: Muskelpumpe, venöser Rückfluss.", s: "S. 12", h: true },
    { k: "Schmerz", f: "Warum beeinträchtigt Schmerz die Wundheilung?",
      a: "Stress → Cortison (negativ in jeder Phase) und Adrenalin (Gefäßverengung → Blut-, Nährstoff-, O₂-Zufuhr ↓); Chronifizierung möglich, Lebensqualität ↓.", s: "S. 13" },
    { k: "Schmerz", f: "Wie definiert die IASP Schmerz?",
      a: "Unangenehmes Sinnes- und Gefühlserlebnis, verknüpft mit aktueller oder potenzieller Gewebeschädigung. Warnsignal – Polyneuropathie kann die Warnfunktion beeinträchtigen.", s: "S. 13" },
    { k: "Schmerz", f: "Nenne die vier Schmerzarten.",
      a: "Nozizeptiv: Reiz bei Gewebsschädigung · neuropathisch: Nervenschädigung, einschießend, elektrisierend · noziplastisch: ohne Gewebsschaden, Sensibilisierung · psychogen: negative Erfahrungen, kein organischer Schaden.", s: "S. 13" },
    { k: "Schmerz", f: "Wie lassen sich die Schmerzarten lindern?",
      a: "Nozizeptiv und neuropathisch: nicht-medikamentös und medikamentös. Psychogen: nicht durch Schmerzmittel, sondern vertrauensbasierte Kommunikation, Zuwendung, soziale Unterstützung.", s: "S. 14" },
    { k: "Schmerz", f: "Akuter, prozeduraler, chronischer Schmerz?",
      a: "Akut: Warnsignal, an Heilungsdauer gekoppelt.\nProzedural: akuter Schmerz bei Versorgungen, z. B. Wundbehandlung.\nChronisch: mind. 3 Monate, keine Warnfunktion mehr.", s: "S. 14" },
    { k: "Schmerz", f: "Wie wird Schmerz erfasst?",
      a: "Subjektiv, nicht messbar. Vor, während, nach der Behandlung und bei Statusänderung; NRS, VRS, GRS/SAS – immer dieselbe Skala. Bei Demenz Fremdeinschätzung mit BESD oder BISAD.", s: "S. 14–15" },
    { k: "Schmerz", f: "Welche Faktoren lösen Wundschmerz aus?",
      a: "Infektion (Erysipel), Druck, Ödem, Arthritis, Dermatitis, pAVK, Neuropathie, Wundart, Trauma, Nahtdehiszenz, viel Exsudat, ausgetrocknete Wunde, Wundbehandlung, Entfernen der Auflage, einschnürende Verbände.", s: "S. 15" },
    { k: "Schmerz", f: "Schmerzvermeidung vor dem Verbandwechsel?",
      a: "Informieren, Schmerz ernst nehmen, Erfahrung einbeziehen, Vorgehen absprechen, Analgetika rechtzeitig (Wirkeintritt), Zugluft vermeiden, stressfreie Umgebung, gute Vorbereitung, ansprechen/Pausen, Stoppsignale vereinbaren.", s: "S. 16–17" },
    { k: "Schmerz", f: "Schmerzvermeidung während des Verbandwechsels?",
      a: "Behutsam reinigen (angefeuchtete Kompressen andrücken, nicht kräftig wischen), Reize vermeiden, zügig verbinden, Sekundärverband nicht zu stramm, feuchte Auflagen, Ablösen anfeuchten, angewärmte Spülung mit wenig Druck, Auflagen ohne Kleberand.", s: "S. 17" },
    { k: "Schmerz", f: "Erkläre das WHO-Stufenschema.",
      a: "I: Nichtopioid (ASS, NSAR, Metamizol)\nII: schwaches Opioid (Tramadol, Tilidin, Codein) + Stufe I\nIII: starkes Opioid (Morphin, Fentanyl, Oxycodon …) + Stufe I\nGgf. Koanalgetika/Adjuvantien; Start nach Schmerzstärke; II + III nicht kombinieren.", s: "S. 17" },
    { k: "Schmerz", f: "Weitere schmerzreduzierende Strategien?",
      a: "Kälte-/Wärmeanwendungen, TENS, Ultraschall, Akupunktur (nur geschultes Personal), Massage/Positionierung (Kinästhetik), Meditation, Atem- und Entspannungsübungen, Musik.", s: "S. 18" },
    { k: "Haut", f: "Hautprobleme bei Diabetes, CVI und pAVK?",
      a: "Diabetes: trocken, Pilzinfektionen, Rhagaden, Malum perforans.\nCVI: Stauungsekzem, Ödeme, Dermatoliposklerose, Hyperpigmentierung.\npAVK: livide, kühl, dünn, glänzend; Zellregeneration stark verzögert.", s: "S. 19" },
    { k: "Haut", f: "Grundsätze der Hautpflege?",
      a: "Trocken und sauber; hautneutrale, leicht saure Syndets, keine alkalischen Seifen; trockene Haut mit W/O; keine O/W bei problematischer Haut (Dochteffekt); keine Parfüm-, Konservierungsstoffe, Emulgatoren. Feucht auf feucht, fett auf trocken.", s: "S. 20" },
    { k: "Haut", f: "Hautschutz bei bestehenden Wunden?",
      a: "Wundrand vor Mazeration schützen (Hautschutzfilm, Folie, Hydrokolloid, Hydrofaser); Narbenpflege Dexpanthenol; Analtampons ≥ 2× tgl. wechseln (Ileus!); silikonbeschichtete Auflagen; bei Pergament-/Altershaut keine Kleberänder.", s: "S. 20–21" },
    { k: "Haut", f: "Welche Hautmaßnahmen sind ungeeignet?",
      a: "Salben/Zinkpaste in offene Wunden reiben, Parfümzusätze, Alkohollösungen (Franzbranntwein), abdichtende Pasten, Fette/Öle (Melkfett, Babyöl), Puder, Massieren gefährdeter Hautstellen.", s: "S. 21" },
    { k: "Nikotin", f: "Wie schadet Rauchen der Wundheilung?",
      a: "Blausäure hemmt O₂-Transport; CO bindet an Hämoglobin; Nikotin → Dopamin/Epinephrin → peripherer Blutfluss ↓, Thrombozytenaggregation ↑ → Mikrookklusionen; Infektionsrisiko ↑. Entwöhnung, Aufklärung (auch Passivrauchen).", s: "S. 21–22" },
    { k: "Adipositas", f: "Warum heilen Wunden bei Adipositas schlechter?",
      a: "Herzauswurfleistung reicht nicht → O₂-Versorgung ↓; Spannung auf Nähte, Bakterien in feuchten Hautfalten, Dehiszenzen; oft Malnutrition → Aufklärung, Ernährungsberatung, Gewichtsreduktion.", s: "S. 22" },
    { k: "Adhärenz", f: "Was ist Adhärenz – und was Compliance?",
      a: "Adhärenz: Ausmaß, in dem Betroffene gemeinsam vereinbarte Maßnahmen einhalten und in den Alltag integrieren (handschr.: aktive Mitarbeit/Mithilfe). Compliance (handschr.): Bereitschaft. Basis: Krankheitsverständnis, respektvolle Kommunikation.", s: "S. 22–23, 29", h: true },
    { k: "Adhärenz", f: "Welche Faktoren beeinflussen die Adhärenz?",
      a: "Sozialökonomisch (Bildung, Wege, Kosten) · Behandlungsteam/System (unabgestimmt, unverständliche Anweisungen, fehlende Schulung) · krankheitsbedingt (Demenz, Depression, Sucht) · therapiebezogen (Dauer, Nebenwirkungen) · individuell (Angst, Erwartungen).", s: "S. 23" },
    { k: "Psyche", f: "Wie wirkt die psychische Verfassung?",
      a: "Stabile Psyche fördert die Heilung; Depression, Psychosen, Sucht, Demenz senken die Kooperation. Manche manipulieren die Wunde aus Angst vor Einsamkeit. Suchtkranke oft schlechter AZ und Ernährungszustand.", s: "S. 23–24" },
    { k: "Psyche", f: "Demenz und chronische Wunde – worauf achten? (Übung III)",
      a: "Bewegungsaktiv: hoher Energiebedarf (3000–4000 kcal), Wunde erhöht ihn → Energiezufuhr sichern. Schmerz wird oft nicht erkannt → Beobachtung, Fremdeinschätzung.", s: "S. 30" },
    { k: "Psyche", f: "Wie legt man einen Ablenkungsverband an? (Übung III)",
      a: "Elastische Mullbinden um die Handgelenke wickeln, mit breiten Pflasterstreifen befestigen; ggf. mit farbiger Kohäsivbinde umwickeln, um die Aufmerksamkeit darauf zu lenken.", s: "S. 30" },
    { k: "Immunstatus", f: "Welchen Einfluss hat der Immunstatus?",
      a: "Angeborene/erworbene oder alters-, therapie-, krankheitsbedingte Schwäche → unzureichende Immunantwort → schlecht beherrschbare Infektionen. Jede immunschwächende Krankheit/Medikation kann die Heilung zum Stillstand bringen.", s: "S. 24" },
    { k: "Medikamente", f: "Welche Medikamente stören die Wundheilung?",
      a: "Immunsuppressiva (Infektionen), Zytostatika (Zellteilung, Granulation), Glucocorticoide (Proliferation, Kollagen ↓), NSAR (Entzündungsantwort, Zugfestigkeit), Antikoagulantien, Diuretika, Barbiturate, Antibiotika.", s: "S. 25" },
    { k: "Alter", f: "Wie wirkt sich das Lebensalter aus?",
      a: "Zellteilung, Hautelastizität, Kollagenerneuerung ↓; dünne, trockene Haut; Multimorbidität verschlechtert die Gefäßsituation. Nicht beeinflussbar – gesunder Lebensstil wirkt aber positiv.", s: "S. 25–26" },
    { k: "Weitere", f: "Weitere allgemeine Einflussfaktoren?",
      a: "Durchblutungsstörungen, verminderte O₂-Sättigung, Seneszenz (Überalterung der Zellen, v. a. Fibroblasten), erhöhte Proteaseaktivität, Schlafstörungen, fehlende soziale Kontakte, Haustiere (Hygiene!), maligne Erkrankungen, schlechte Beratung.", s: "S. 26–27", h: true },
    { k: "Lokal", f: "Wie wirkt die Entzündung lokal auf die Heilung?",
      a: "Startschuss der Heilung in der Exsudationsphase, ≠ Infektion. Bei chronischen Wunden übersteigert: Elastase, Plasmin zerstören die extrazelluläre Matrix, deaktivieren Wachstumsfaktoren, fördern Fibroblastenseneszenz → Stagnation.", s: "S. 28" },
    { k: "Lokal", f: "Wie wirkt eine Infektion auf die Heilung?",
      a: "Infektionsbekämpfung hat Vorrang, Stoffwechsel ↑ → Nährstoffe, Flüssigkeit, O₂ fehlen für die Wundheilung → Verzögerung bis Stagnation.", s: "S. 28" },
    { k: "Lokal", f: "Wirkung von Druck und Scherkräften?",
      a: "Verursachen Wunden (Dekubitus); Verschiebung von Hautschichten (z. B. zu straffe Kompression) → Kapillarüberdehnung, Minderdurchblutung, bei Älteren Kapillarabriss. Bei DFS und Dekubitus: Druckentlastung entscheidend.", s: "S. 28" },
    { k: "Lokal", f: "Warum stören Fremdkörper?",
      a: "Jeder Fremdkörper behindert die Heilung (Verband-/Salbenreste, Schmutz, Implantate): Unterversorgung, Exsudatstau, Granulome, Abszesse, Fisteln, Entzündung.", s: "S. 29" },
    { k: "Handschriftlich", f: "Merkpunkte aus den Notizen?",
      a: "Wunden spätestens nach 4 Wochen evaluieren (S. 15) · Kompression auch mit Wunde (S. 5) · Langzug: hoher Arbeits-, geringer Ruhedruck; Kurzzug: hoher Ruhe-, geringer Arbeitsdruck (S. 31) · Jodsalbe, Octenisept, Silber max. 14 d (S. 28).", s: "S. 5, 15, 28, 31", h: true }
  ],

<h3>7. Nikotin, Adipositas, Adhärenz, Psyche <span class="seite">S. 21–24</span></h3>
<ul>
