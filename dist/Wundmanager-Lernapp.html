<script>/* themen/dekubitus.js */
/*
 * Thema: Dekubitus, Ulcus cruris, Diabetisches Fußulkus
 * Quelle: murimed-Kursheft Wundexperte Modul I (Seitenangaben = Originalseiten des Hefts).
 * Inhalte übernommen aus "Zusammenfassung_Dekubitus_UlcusCruris_DFU.pdf" und
 * "Lernkarten_Dekubitus_UlcusCruris_DFU.pdf".
 *
 * Quiz-Format: bei "o" (Optionen) steht die RICHTIGE Antwort immer an erster
 * Stelle; die App mischt die Reihenfolge beim Anzeigen.
 * "h: true" = Inhalt stammt (teilweise) nur aus handschriftlichen Notizen im Heft.
 */
Lernapp.thema({
  id: "dekubitus-ulcus-dfu",
  titel: "Dekubitus, Ulcus cruris, Diabetisches Fußulkus",
  kurz: "Dekubitus & Ulcus",
  quelle: "murimed-Kursheft Wundexperte Modul I",
  hinweis:
    "Quelle ist ausschließlich das Kursheft; Seitenzahlen in Klammern (die nachgereichten Heftseiten 12 und 13 sind mit ihrer Originalseitenzahl zitiert). Die im Heft zitierten Primärquellen wurden nicht separat geprüft.",

  karten: [
    { k: "Chron. Wunde", f: "Wann gilt eine Wunde als chronisch?",
      a: "Wenn sie innerhalb von 4–12 Wochen trotz fachgerechter Therapie keine Heilungstendenz zeigt.\nVon Beginn an chronisch, wenn die Ursache eine chronische Erkrankung ist (Dekubitus, Ulcus cruris, Diabetisches Fußulkus).", s: "S. 2–4" },
    { k: "Chron. Wunde", f: "Akute vs. chronische Wunde?",
      a: "Akut: Wundheilungsphasen regelrecht durchlaufen, Heilung innerhalb von 4 Wochen.\nChronisch: Phasen nicht regelrecht durchlaufen, keine Heilungstendenz nach 4–12 Wochen.", s: "S. 4" },
    { k: "Chron. Wunde", f: "Was sind „Hard-to-heal“-Wunden?",
      a: "Ulcera > 6 cm², älter als 6 Monate, bei denen ein Ansprechen auf Kompressionstherapie innerhalb von 6 Monaten unwahrscheinlich ist.", s: "S. 4" },
    { k: "Dekubitus", f: "Definiere den Dekubitus (NPUAP 2014).",
      a: "Lokal begrenzte Schädigung der Haut und/oder des darunter liegenden Gewebes, typischerweise über knöchernen Vorsprüngen, infolge von Druck oder von Druck in Verbindung mit Scherkräften.", s: "S. 5" },
    { k: "Dekubitus", f: "Scherkräfte vs. Reibung?",
      a: "Scherkräfte verformen tieferliegendes Gewebe.\nReibung wirkt nur oberflächlich (Haut gegen Bettlaken).", s: "S. 5" },
    { k: "Dekubitus", f: "Welche Mechanismen führen zum druckbedingten Zelltod?",
      a: "Direkte Deformation des Gewebes und Verschluss von Blut- und Lymphgefäßen → O₂-Mangel, kein Abtransport von Stoffwechselprodukten.\nMuskelzellen sind besonders empfindlich: Nekrosen innerhalb von Minuten möglich.", s: "S. 5–6" },
    { k: "Dekubitus", f: "Beschreibe die Entstehungskaskade des Dekubitus.",
      a: "Immobilität → Druck → Zellverformung, Gefäßkompression → lokale Ischämie → gestörter Zellstoffwechsel (Hypoxie, Nekrose, Giftstoffe) → Azidose → Vasodilatation → Flüssigkeitsaustritt → Ödem/Blasen, Thrombosen → Absterben.", s: "S. 7" },
    { k: "Dekubitus", f: "Nenne Prädilektionsstellen in Rückenlage.",
      a: "Hinterhaupt, Schulterblätter, Dornfortsätze, Kreuzbein, Fersen.\nHandschriftlich: auch an Hilfsmitteln (Brille, O₂-Brille, Zahnprothese).", s: "Lösung S. 35", h: true },
    { k: "Dekubitus", f: "Prädilektionsstellen im Sitzen und in Seitenlage?",
      a: "Sitzen: Hinterhaupt, Schulterblatt, Dornfortsätze, Ellenbogen, Sitzhöcker, Fersen.\nSeitenlage: Ohrmuschel, Jochbein, Schulter, Ellenbogen, Rippen, großer Rollhügel, Knie/Wadenbein, seitliche Knöchel.", s: "S. 35" },
    { k: "Dekubitus", f: "Was sind die drei wichtigsten Risikofaktoren für einen Dekubitus?",
      a: "1. Beeinträchtigung der Mobilität\n2. Störung der Durchblutung\n3. beeinträchtigter Hautzustand bzw. bereits vorhandener Dekubitus", s: "S. 8" },
    { k: "Dekubitus", f: "Dekubitus Kategorie I und II?",
      a: "I: intakte Haut, nicht wegdrückbare Rötung über knöchernem Vorsprung.\nII: Teilverlust der Haut – flaches Geschwür mit rosa Wundbett ohne Beläge oder serumgefüllte Blase.", s: "S. 9" },
    { k: "Dekubitus", f: "Dekubitus Kategorie III und IV?",
      a: "III: vollständiger Hautverlust, Subcutis kann sichtbar sein; Knochen, Sehnen, Muskeln nicht offen.\nIV: vollständiger Gewebeverlust mit freiliegenden Knochen, Sehnen oder Muskeln; Osteomyelitis möglich.", s: "S. 9" },
    { k: "Dekubitus", f: "Welche zwei Zusatzkategorien gibt es?",
      a: "Keiner Kategorie zuordenbar (Tiefe unbekannt, Wundbett durch Beläge/Schorf bedeckt).\nVermutete tiefe Gewebeschädigung (livider/rötlich-brauner Bereich intakter Haut oder blutgefüllte Blase).", s: "S. 10" },
    { k: "Dekubitus", f: "Beschreibe den Fingertest. (Übung II)",
      a: "Leichter Fingerdruck auf die Rötung.\nWeißfärbung → Test negativ → kein Dekubitus.\nBleibt rot → Test positiv → Dekubitus Kategorie I.", s: "S. 35" },
    { k: "Dekubitus", f: "Dekubitus vs. Feuchtigkeitswunde (IAD, Intertrigo)?",
      a: "Dekubitus: scharf begrenzt, Ursprung in der Tiefe, über knöchernen Vorsprüngen.\nFeuchtigkeitswunden: Ursprung an der Epidermis, in Hautfalten und Vertiefungen (z. B. Gesäßfalte).", s: "S. 10" },
    { k: "Prophylaxe", f: "Was ist die beste Form der Dekubitusprophylaxe?",
      a: "Regelmäßige Druckentlastung gefährdeter Körperstellen.\nProphylaxe muss vorausschauend, konsequent, regelmäßig erfolgen – bevor Rötungen auftreten.", s: "S. 11–12" },
    { k: "Prophylaxe", f: "Bestandteile der Dekubitusprophylaxe?",
      a: "Risikoeinschätzung, Förderung der Eigenbewegung, Hautbeobachtung, Hautpflege, Beratung, Positionswechsel, Freilage, Vermeidung therapiebedingten Drucks, Ernährung und Flüssigkeit, Kontinuität und Evaluation.", s: "S. 11–12" },
    { k: "Prophylaxe", f: "Energie- und Proteinbedarf bei Dekubitus?",
      a: "Energie 35–40 kcal/kg KG, Protein 2 g/kg KG; eiweißreich, ggf. hochkalorisch, Vitamine A, B, C, K und Mineralstoffe.", s: "S. 12" },
    { k: "Prophylaxe", f: "Welche Hilfsmittel sind ungeeignet?",
      a: "Luftringe, Lochkissen, Gelkissen, Fellfersenschoner, Lagerungsfell, Wasserkissen, Wassermatratzen, wassergefüllte Handschuhe.", s: "S. 12" },
    { k: "Prophylaxe", f: "Welche Hilfsmittel sind geeignet bzw. bedingt geeignet?",
      a: "Geeignet: Kissen, Decken, Still-/Bananenkissen, Luftkammerkissen, Fersenfreilagerungsbandagen, grobporiger PU-Schaum, Schaumstoffmatratzen.\nBedingt: Weichlagerungs-, Wechseldruckmatratzen.", s: "S. 12" },
    { k: "Wundphasen", f: "Versorgung einer schwarzen, trockenen Nekrose?",
      a: "Débridement, Feuchtigkeitszufuhr, Aufweichen → Hydrogele + Deckverband oder Feuchtverbände.\nAusnahme bei arterieller Ursache: nicht einweichen (S. 33).", s: "S. 13, 33" },
    { k: "Wundphasen", f: "Versorgung in der Granulationsphase?",
      a: "Blassrosa, schlecht: Exsudat aufnehmen, Granulation anregen → Alginate, Hydrokolloide, Kollagen, PU, Vakuumtherapie.\nRot, fest: vor Austrocknung schützen → Hydrokolloide, Hydrogele, Hydropolymere, PU-Schaum.", s: "S. 13" },
    { k: "Ulcus cruris", f: "Verteilung der Ursachen des Ulcus cruris?",
      a: "60–70 % venös, ca. 10 % arteriell, ca. 10 % gemischt (mixtum), ca. 10 % andere (Infektionen, Mykosen, Malignome, Kalziphylaxie, Medikamente).", s: "S. 14" },
    { k: "Ulcus cruris", f: "Was bedeutet „Ulcera crurum“?",
      a: "Mehrere Ulzerationen an beiden Unterschenkeln.\nUlcus cruris = ein Geschwür; Ulcera cruris = mehrere an einem Unterschenkel.", s: "S. 14" },
    { k: "Venosum", f: "Wie entsteht ein Ulcus cruris venosum?",
      a: "Komplikation der CVI: gestörter Rückfluss → Druck bis in die Kapillaren → Ödem → Lymphsystem überlastet → Dermatoliposklerose → längere Diffusionsstrecke → Minderversorgung → Ulcus.", s: "S. 14–15" },
    { k: "Venosum", f: "Wie verteilt sich der venöse Abfluss und was ist die Hauptkraft?",
      a: "Ca. 10 % oberflächlich (epifaszial), ca. 90 % tief (subfaszial).\nHauptkraft: Wadenmuskelpumpe; Venenklappen als Volumenventile.", s: "S. 14" },
    { k: "Venosum", f: "Widmer-Klassifikation der CVI?",
      a: "I Corona phlebectatica, Phlebödem\nII Ödem, Dermatoliposklerose, Atrophie blanche, Purpura jaune d’ocre, Stauungsekzem IIIa abgeheiltes Ulcus\nIIIb florides Ulcus", s: "S. 15" },
    { k: "Venosum", f: "Wann gilt ein Ulcus cruris venosum als therapieresistent?",
      a: "Keine Heilungstendenz innerhalb von 3 Monaten unter adäquater phlebologischer Therapie oder nicht abgeheilt innerhalb von 12 Monaten.", s: "S. 15" },
    { k: "Venosum", f: "Konservative Therapie des Ulcus cruris venosum?",
      a: "Phasengerechte Wundtherapie, Kompression, Hautpflege, Gehtraining (Sprunggelenk), Gewichtsreduktion, Ernährung, Flüssigkeit, manuelle Lymphdrainage, Wechselbäder bzw. kaltes Abduschen 2× tägl. 5–10 min.", s: "S. 17" },
    { k: "Venosum", f: "Operative/endovaskuläre Verfahren beim Ulcus cruris venosum?",
      a: "Sklerotherapie, Radiofrequenzablation, endovenöse Lasertherapie, Crossektomie, Perforansligatur, Phlebektomie, Varizenstripping.", s: "S. 17" },
    { k: "Kompression", f: "Wie wirkt die Kompressionstherapie?",
      a: "Verkleinert den Venendurchmesser → fast doppelte Fließgeschwindigkeit, weniger transmuraler Druck, Venenklappen schließen wieder; venöser und lymphatischer Rückfluss ↑, Ödem ↓.", s: "S. 18" },
    { k: "Kompression", f: "Drei Phasen der Kompressionstherapie bei CVI?",
      a: "Entstauung: PKV oder MAK\nErhaltung: MKS, Ulcus-Strumpfsysteme\nPrävention: nach Abheilung, meist MKS der KKL II", s: "S. 19" },
    { k: "Kompression", f: "Was bedeuten PKV, MKS, MAK, IPK?",
      a: "PKV – phlebologischer Kompressionsverband (Binden)\nMKS – medizinischer Kompressionsstrumpf\nMAK – medizinisches adaptives Kompressionssystem (Klett/Wrap)\nIPK – intermittierende pneumatische Kompression (nur unterstützend)", s: "S. 19" },
    { k: "Kompression", f: "Welche Rolle spielt Bewegung bei der Kompressionstherapie?",
      a: "Eigenbewegung ist stets Bestandteil – Wirkung nur bei aktivierter Muskelpumpe und beweglichem Sprunggelenk (Fußkreisen, Fußwippen, Nordic Walking, Drainagebeutel bei Bettlägerigen).", s: "S. 20" },
    { k: "Kompression", f: "Was besagt die 3S-3L-Regel?",
      a: "„Sitzen und Stehen ist Schlecht, Lieber Laufen und Liegen!“", s: "S. 21" },
    { k: "Kompression", f: "Nenne Beratungsinhalte bei CVI/Ulcus cruris venosum.",
      a: "Flache Schuhe, keine einschnürende Kleidung, Beine hochlegen (20–30°), nicht übereinanderschlagen, Bettende hoch, Kneipp/kalte Güsse, Wärme > 28 °C meiden, Venensport, Gewicht reduzieren, trinken, Kompressionsstrümpfe lebenslang.", s: "S. 20–21" },
    { k: "Kompression", f: "Hautpflege unter Kompression?",
      a: "Täglich, am besten abends; Creme vor dem Anziehen eingezogen; W/O mit Urea/Glyzin; ohne Alkohol, Allergene (Parabene, Perubalsam, Wollwachs, Propylenglykol, Ringelblume, Rosskastanie) und Duftstoffe.", s: "S. 21" },
    { k: "Arteriosum", f: "Ursache und Risikofaktoren des Ulcus cruris arteriosum?",
      a: "pAVK, in ca. 95 % Atherosklerose.\nNikotin, Hypertonie, Diabetes, Dyslipidämie, Adipositas, Bewegungsmangel, Hyperfibrinogenämie, Homocysteinämie, Polyarthritis.", s: "S. 22–23" },
    { k: "Arteriosum", f: "Klinisches Bild des Ulcus cruris arteriosum?",
      a: "Äußere Fußränder, Unterschenkel-Außenseite, Außenknöchel; scharf begrenzt, wie ausgestanzt; Haut blass, marmoriert oder livide, glänzend, haarlos; verdickte Nägel; tiefe Wunden.", s: "S. 24" },
    { k: "Arteriosum", f: "Was ist bei der ABI-Messung zu beachten?",
      a: "Bei Mönckeberg-Sklerose (Mediaverkalkung) falsch hohe Werte.\nWichtig: periphere Dopplerdrücke < 70 mmHg → fehlende Wundheilung.", s: "S. 24" },
    { k: "Arteriosum", f: "Fontaine und Rutherford im Vergleich?",
      a: "I = Rutherford 0\nIIa = I/1\nIIb = I/2–3\nIII Ruheschmerz = II/4\nIV Ulcus, Gangrän = III/5–6", s: "S. 24" },
    { k: "Arteriosum", f: "Was bedeutet das IRAN-Prinzip?",
      a: "Infektionskontrolle, Mumifizierung der Gangrän\nRevaskularisation\nAmputation bzw. Nekroseentfernung im infektionsfreien Stadium\nNachsorge", s: "S. 25" },
    { k: "Arteriosum", f: "Wann ist Kompression beim arteriellen Ulcus verboten?",
      a: "Bei kritischer Ischämie (absoluter systolischer Knöchelarteriendruck < 50 mmHg): keine Kompressionstherapie!", s: "S. 25" },
    { k: "Arteriosum", f: "Therapie ohne Möglichkeit zur Revaskularisation?",
      a: "Mumifizierte trockene Nekrose → nach Austrocknen des Randsaums trocken behandeln.\nFeuchte Wunde → lokal antiseptisch, Infektionsprophylaxe, engmaschige Kontrolle.", s: "S. 26" },
    { k: "Arteriosum", f: "Wie lagert man die Beine bei pAVK – und bei CVI?",
      a: "pAVK: Beine nachts tief lagern, Füße warmhalten (S. 26).\nCVI: Beine hochlegen, Bettende hochstellen (S. 20).", s: "S. 20, 26" },
    { k: "Vergleich", f: "Venosum vs. arteriosum: Lokalisation, Wundrand, Tiefe?",
      a: "Venosum: Innenknöchel/Vorderseite; Rand diffus, flach; bis Subcutis.\nArteriosum: Außenknöchel/Außenseite, Fußrand; Rand wie ausgestanzt; tief, Sehnen/Knochen sichtbar.", s: "S. 27, 36" },
    { k: "Vergleich", f: "Venosum vs. arteriosum: Schmerz, Ödem, Temperatur, Pulse?",
      a: "Venosum: mäßig, Linderung durch Hochlagern; Ödeme; warm; Pulse tastbar.\nArteriosum: stark, Ruheschmerz, Linderung durch Herabhängen; keine Ödeme; kalt; Pulse kaum tastbar.", s: "S. 27" },
    { k: "Vergleich", f: "Venosum vs. arteriosum: Wundbeschaffenheit?",
      a: "Venosum: feucht-glänzend, viel Exsudat, schmierig-fibrinöse Beläge (Nekrosen → an pAVK denken).\nArteriosum: wenig Exsudat, trocken, ggf. freiliegende Sehnen und Knochen, Nekrosen.", s: "S. 27" },
    { k: "Mixtum", f: "Was ist beim Ulcus cruris mixtum zu beachten?",
      a: "Arterielle und venöse Ursache; Schmerz meist führend; Kompression stark eingeschränkt oder kontraindiziert → pAVK früh behandeln, um wieder komprimieren zu können.", s: "S. 28" },
    { k: "Diab. Fuß", f: "Was ist das Diabetische Fußsyndrom?",
      a: "Schleichende Spätkomplikation durch Makro- und Mikroangiopathie, Neuropathie und Chondroarthropathie; umfasst alle pathologischen Veränderungen am Fuß (Ulkus, Nagelbett, Infektion, Deformität).", s: "S. 28" },
    { k: "Diab. Fuß", f: "Ursachenverteilung diabetischer Fußulcera?",
      a: "Ca. 50 % Polyneuropathie, ca. 15 % pAVK, ca. 35 % Zusammenwirken von PNP und Gefäßerkrankung.", s: "S. 29" },
    { k: "Diab. Fuß", f: "Welche Formen der Polyneuropathie gibt es?",
      a: "Sensibel: Kribbeln, Brennen, Taubheit, schmerzlose Wunden.\nMotorisch: Faszikulationen, Krämpfe, Schwäche, Parese der Zehenspreizung.\nAutonom: Hypo-/Anhidrosis, Ödem, Ulcus, Osteoarthropathie, Tachykardie, Gastroparese.", s: "S. 29" },
    { k: "Diab. Fuß", f: "Neuropathischer vs. ischämischer diabetischer Fuß?",
      a: "Neuropathisch: trocken, warm, rosig, Pulse tastbar, schmerzlos (Malum perforans).\nIschämisch: kühl, blass/livide, Pulse vermindert, Schmerzen, akrale Nekrosen.", s: "S. 30" },
    { k: "Diab. Fuß", f: "Was ist der Charcot-Fuß (DNOAP)?",
      a: "Diabetische Neuro-Osteoarthropathie: meist einseitige, schmerzlose Destruktion des Fußskeletts nach unbemerkten Traumata; Überwärmung > 1 °C (oft > 2 °C) gegenüber der Gegenseite.", s: "S. 30" },
    { k: "Diab. Fuß", f: "Klassifikation nach Wagner und Armstrong?",
      a: "Wagner 0 keine Läsion · 1 oberflächlich · 2 bis Sehne/Kapsel · 3 bis Knochen · 4 Nekrose von Fußteilen · 5 Nekrose des ganzen Fußes.\nArmstrong: A ohne · B Infektion · C Ischämie · D beides.", s: "S. 29" },
    { k: "Diab. Fuß", f: "Wie prüft man die Sensibilität beim diabetischen Fuß?",
      a: "Monofilament nach Semmes-Weinstein, Stimmgabel nach Rydel-Seiffer, Tip Therm.", s: "S. 32" },
    { k: "Diab. Fuß", f: "Was bedeutet die IRAS-Regel?",
      a: "Infektsanierung\nRevaskularisation\nAmputation, wenn unumgänglich\nSchulung, Beratung, Information", s: "S. 32" },
    { k: "Diab. Fuß", f: "Wesentliche Therapiebestandteile beim diabetischen Fußulkus?",
      a: "Blutzucker optimieren, Infektionskontrolle, Débridement, konsequente vollständige Druckentlastung (Orthesen, Total Contact Cast, Rollstuhl, Bettruhe), phasengerechte Wundversorgung, Gefäßtherapie, Schulung.", s: "S. 32" },
    { k: "Diab. Fuß", f: "Was ist bei der Hautpflege des diabetischen Fußes zu beachten?",
      a: "W/O-Cremes oder Schäume mit Urea (Hornhaut, Rhagaden, Juckreiz).\nZehenzwischenräume nicht eincremen → Mazeration und Pilzbefall vermeiden.", s: "S. 33" },
    { k: "Diab. Fuß", f: "Warum Hydrokolloide beim diabetischen Fuß nur mit Vorsicht?",
      a: "Bei PNP fehlen oft Entzündungszeichen; durch den eingeschränkten Gasaustausch kann sich eine Infektion unbemerkt ausbreiten.\nKI: Infektion, freiliegende Muskeln/Sehnen/Knochen, ischämische Ulcera (pAVK IV).", s: "S. 33" }
  ],

  quiz: [
    { f: "Ab wann gilt eine Wunde laut Expertenstandard als chronisch?",
      o: ["Wenn sie nach 4–12 Wochen trotz fachgerechter Therapie keine Heilungstendenz zeigt", "Wenn sie nach 7 Tagen noch nicht verschlossen ist", "Erst wenn sie länger als 1 Jahr besteht", "Wenn sie größer als 6 cm² ist"],
      e: "Chronisch = keine Heilungstendenz nach 4–12 Wochen trotz fachgerechter Therapie. Dekubitus, Ulcus cruris und Diabetisches Fußulkus sind von Beginn an chronisch.", s: "S. 2–4" },
    { f: "Was beschreibt Dekubitus Kategorie II?",
      o: ["Teilverlust der Haut: flaches Geschwür mit rosa Wundbett ohne Beläge oder serumgefüllte Blase", "Intakte Haut mit nicht wegdrückbarer Rötung", "Vollständiger Hautverlust, Subcutis sichtbar, Knochen nicht offen", "Vollständiger Gewebeverlust mit freiliegendem Knochen"],
      e: "I: nicht wegdrückbare Rötung · II: Teilverlust der Haut/Blase · III: vollständiger Hautverlust · IV: freiliegende Knochen, Sehnen oder Muskeln.", s: "S. 9" },
    { f: "Welche Dekubitus-Kategorie liegt bei freiliegenden Sehnen vor?",
      o: ["Kategorie IV", "Kategorie III", "Kategorie II", "Keiner Kategorie zuordenbar"],
      e: "IV: vollständiger Gewebeverlust mit freiliegenden Knochen, Sehnen oder Muskeln; Osteomyelitis möglich.", s: "S. 9" },

<h3>1. Chronische Wunden <span class="seite">S. 2–4</span></h3>
<ul>
  <li>Ca. 1,2 Mio. Menschen in Deutschland haben eine chronische Wunde, meist &gt; 70 Jahre und multimorbid. Im Schnitt dauert es 4 Jahre bis zur ursachengerechten Behandlung; vom ersten Symptom der Grunderkrankung bis zur Wunde ca. 11 Jahre (S. 2).</li>
  <li><b>Chronisch</b> = keine Heilungstendenz nach 4–12 Wochen trotz fachgerechter Therapie (Expertenstandard). <b>Akut</b> = Wundheilungsphasen regelrecht durchlaufen, Heilung innerhalb von 4 Wochen (S. 3–4).</li>
  <li>Von Beginn an chronisch, wenn die Ursache eine chronische Erkrankung ist: Dekubitus, Ulcus cruris (venosum, arteriosum, mixtum), Diabetisches Fußulkus – zugleich die häufigsten chronischen Wundarten (S. 2, 4).</li>
  <li><b>Hard-to-heal:</b> Ulcera &gt; 6 cm², älter als 6 Monate, Ansprechen auf Kompression innerhalb von 6 Monaten unwahrscheinlich. Pathomechanismus: pathologische Entzündung, kein Übergang von der Exsudations- in die Granulationsphase (S. 4).</li>
</ul>

<h3>2. Dekubitus <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 5–13</span></h3>
<p class="merke"><b>Definition (NPUAP 2014):</b> „Ein Dekubitus ist eine lokal begrenzte Schädigung der Haut und/oder des darunter liegenden Gewebes, typischerweise über knöchernen Vorsprüngen, infolge von Druck oder von Druck in Verbindung mit Scherkräften.“ (S. 5)</p>
<ul>
  <li>Scherkräfte verformen tieferliegendes Gewebe; nicht gleichbedeutend mit Reibung (nur oberflächlich, Haut gegen Bettlaken). Es gibt keinen Schwellenwert für schädlichen Druck (S. 5).</li>
  <li><b>Mechanismen:</b> direkte Deformation des Gewebes und Verschluss von Blut- und Lymphgefäßen → Minderversorgung mit O₂, Stoffwechselprodukte nicht abtransportiert. Muskelzellen sind besonders empfindlich: Muskelnekrosen innerhalb von Minuten möglich; Hautzellen widerstandsfähiger. Dekubitus entsteht in der Tiefe, nicht in der Epidermis (S. 5–6).</li>
  <li><b>Kaskade (S. 7):</b> eingeschränkte Mobilität → Druck → Zellverformung, Gefäßkompression → lokale Ischämie → gestörter Zellstoffwechsel (Hypoxie, Muskelnekrose, keine Giftstoff-Abfuhr) → Azidose → Vasodilatation → Flüssigkeitsaustritt → Ödem/Blasen bzw. Gefäßthrombosen → irreversibles Absterben. Mikroklima (Temperatur, Feuchtigkeit) und Scherkräfte verstärken.</li>
  <li><b>Prädilektionsstellen:</b> Knochen mit geringer Weichteildeckung – Kreuz- und Steißbein, Trochanter major, Fersen, Hinterhaupt, Schulterblätter, Dornfortsätze, Ellenbogen, Ohrmuschel, Jochbein, seitliche Knöchel u. a.; außerdem unter Prothesen, Gipsverbänden, engen Schuhen (S. 6, Lösung S. 35). <span class="hand-inline">Handschriftlich: auch Hilfsmittel wie Brille, O₂-Brille, Zahnprothese.</span></li>
  <li><b>Risikofaktoren</b> (&gt; 100 bekannt): die wichtigsten sind Beeinträchtigung der Mobilität, Störung der Durchblutung und beeinträchtigter Hautzustand bzw. vorhandener Dekubitus. Je höher der Unterstützungsbedarf, desto höher das Risiko (S. 8).</li>
</ul>
<div class="tabelle"><table>
  <caption>Klassifikation nach EPUAP/NPUAP/PPPIA ★ (S. 9–10)</caption>
  <thead><tr><th>Kategorie</th><th>Befund</th></tr></thead>
  <tbody>
    <tr><td>I</td><td>intakte Haut mit nicht wegdrückbarer Rötung, meist über knöchernem Vorsprung</td></tr>
    <tr><td>II</td><td>Teilverlust der Haut: flaches, offenes Geschwür mit rosa Wundbett ohne Beläge oder intakte/offene, serumgefüllte Blase</td></tr>
    <tr><td>III</td><td>vollständiger Hautverlust; Subcutis kann sichtbar sein, Knochen, Sehnen, Muskeln liegen nicht offen; ggf. Unterminierungen</td></tr>
    <tr><td>IV</td><td>vollständiger Gewebeverlust mit freiliegenden Knochen, Sehnen oder Muskeln; Osteomyelitis möglich</td></tr>
    <tr><td>keiner Kategorie zuordenbar</td><td>Tiefe unbekannt: Wundbett durch Beläge/Schorf bedeckt</td></tr>
    <tr><td>vermutete tiefe Gewebeschädigung</td><td>Tiefe unbekannt: livider/rötlich-brauner Bereich intakter Haut oder blutgefüllte Blase</td></tr>
  </tbody>
</table></div>
<ul>
  <li>Die Klassifikation ist keine Reihenfolge: Aus Kategorie I kann ohne Gegenmaßnahmen direkt Kategorie IV werden (S. 10).</li>
  <li>Abgrenzung zu Feuchtigkeitswunden (IAD, Mazeration, Intertrigo): Dekubitus ist scharf begrenzt, entsteht in der Tiefe, über knöchernen Vorsprüngen; Feuchtigkeitswunden in Hautfalten (z. B. Gesäßfalte). Kategorie II nicht für Skin Tears oder Pflasterschäden verwenden (S. 9–10).</li>
  <li><b>Fingertest</b> (Übung II, S. 35): Leichter Druck mit dem Finger auf die Rötung. Weißfärbung → Test negativ, kein Dekubitus. Bleibt die Stelle rot → Test positiv, Dekubitus Kategorie I.</li>
</ul>
<h4>Dekubitusprophylaxe (S. 11–12)</h4>
<ul>
  <li>Muss vorausschauend, konsequent und regelmäßig erfolgen – bevor Rötungen auftreten. Abweichungen (z. B. Ablehnung) mit Begründung dokumentieren. Schätzungsweise jeder 3. Mensch mit höhergradigem Dekubitus stirbt an Sepsis (S. 11).</li>
  <li>Bestandteile: Risikoeinschätzung · Förderung der Eigenbewegung · Hautbeobachtung · Hautpflege (sauber, trocken, pH-neutrale Syndets, W/O mit Urea) · Beratung · Positionswechsel (30°-Seitenlage, 135°, schiefe Ebene, Bobath, Weichlagerung, Mikropositionierung als Ergänzung) · Vermeidung therapiebedingten Drucks (Zu- und Ableitungen) · Ernährung · Kontinuität und Evaluation (S. 11–12).</li>
  <li><b>Regelmäßige Druckentlastung gefährdeter Körperstellen = beste Form der Dekubitusprophylaxe</b> (S. 12).</li>
  <li>Ernährung: eiweißreich, ggf. hochkalorisch, Vitamine A, B, C, K und Mineralstoffe; bei Dekubitus Energie 35–40 kcal/kg KG, Protein 2 g/kg KG (S. 12).</li>
</ul>

<p>Hilfsmittel ersetzen niemals Anleitung, Unterstützung und Motivation zur Eigenbewegung.</p>

<h3>3. Ulcus cruris – Überblick <span class="seite">S. 14</span></h3>
<ul>
  <li>Mindestens bis in die Dermis reichender Substanzdefekt, meist am distalen Unterschenkel. 60–70 % venös, ca. 10 % arteriell, ca. 10 % gemischt (mixtum), ca. 10 % andere Ursachen (Infektionen, Mykosen, Malignome, Kalziphylaxie, Medikamente).</li>
  <li>Ein Geschwür = Ulcus cruris; mehrere an einem Bein = Ulcera cruris; an beiden Beinen mehrere = Ulcera crurum.</li>
</ul>

<h3>4. Ulcus cruris venosum <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 14–22</span></h3>
<ul>
  <li>Venöses Beingeschwür infolge einer CVI – Komplikation der CVI. Ursachen: primäre Varikosis, Phlebothrombose, Thrombophlebitis, posttraumatische Verletzungen, Angiodysplasien (S. 14).</li>
  <li>Venöser Rückfluss: ca. 10 % oberflächlich (epifaszial), ca. 90 % tief (subfaszial); Hauptkraft ist die Wadenmuskelpumpe; Venenklappen = Volumenventile (S. 14).</li>
  <li><b>Pathogenese (S. 15):</b> gestörter Rückfluss (Phlebothrombose, postthrombotisches Syndrom, Varikosis) → Privatkreislauf, Druckerhöhung bis in die Kapillaren → Ödem → Lymphsystem überlastet → Dermatoliposklerose → längere Diffusionsstrecke → Minderversorgung → Ulcus.</li>
  <li><b>Therapieresistent:</b> keine Heilungstendenz binnen 3 Monaten unter adäquater phlebologischer Therapie oder nach 12 Monaten nicht abgeheilt (S. 15).</li>
  <li><b>Klinik:</b> typischerweise an der Knöchelinnenseite; rund, oval, zackig oder gamaschenartig; Wundgrund schmierig-fibrinös bis eitrig; Umgebung oft ekzematös. Komplikationen: Stauungsdermatitis, Infektion, Erysipel, Kontaktallergien, Karzinom (S. 15–16).</li>
  <li><b>Diagnostik (S. 16):</b> Anamnese, Inspektion, Palpation, Wundabstrich, Umfangsmessung, Gangbild, neurologische Untersuchung, Doppler-/Farbduplexsonografie, ABI/KADI (arterielle Mitbeteiligung ausschließen), ggf. Phlebografie, Histologie, Ausschluss von Diabetes, Polyneuropathie, pAVK, Blutuntersuchung.</li>
</ul>
<div class="tabelle"><table>
  <caption>CVI nach Widmer (mod. nach Marshall/Wüstenberg) (S. 15)</caption>
  <thead><tr><th>Grad</th><th>Klinisches Bild</th></tr></thead>
  <tbody>
    <tr><td>I</td><td>Corona phlebectatica (Fußrand), Phlebödem</td></tr>
    <tr><td>II</td><td>Ödem, Dermatoliposklerose, Atrophie blanche, Purpura jaune d’ocre, Stauungsekzem</td></tr>
    <tr><td>IIIa</td><td>abgeheiltes Ulcus (Ulcusnarbe)</td></tr>
    <tr><td>IIIb</td><td>florides Ulcus</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Therapie (S. 17):</b> zuerst Kausaltherapie. Endovaskulär/operativ: Sklerotherapie, Radiofrequenzablation, endovenöse Lasertherapie, Crossektomie, Perforansligatur, Phlebektomie, Varizenstripping. Konservativ: phasengerechte Wundtherapie, Kompression, Hautpflege, Gehtraining (Sprunggelenk), Gewichtsreduktion, Ernährung, Flüssigkeit, MLD, Wechselbäder/kaltes Abduschen. Varikosis und postthrombotisches Syndrom sind nicht heilbar.</li>
  <li><b>Lokaltherapie (S. 18):</b> erst Wundreinigung/Débridement; Antiseptika bei kritischer Kolonisation oder Infektion, systemische Antibiotika kritisch; Umgebungshaut mit Acrylat-Copolymer schützen; anfangs Superabsorber/Hydrokapillarverbände, danach feinporige PU-Schäume; Wundauflagen ohne Kleberand.</li>
</ul>
<h4>Kompressionstherapie (S. 18–20)</h4>
<ul>
  <li>Steigert venösen und lymphatischen Rückfluss, verkleinert den Venendurchmesser → fast doppelte Fließgeschwindigkeit, weniger transmuraler Druck, Venenklappen schließen wieder.</li>
  <li>Drei Phasen: Entstauungsphase (PKV mit Kurzzugbinden/Mehrkomponentensystemen oder MAK) → Erhaltungsphase (MKS, Ulcus-Strumpfsysteme) → Prävention nach Abheilung (meist MKS der KKL II).</li>
  <li>Methoden: PKV (Binden, v. a. Entstauung) · MKS (Strumpf, Erhaltung und Prävention) · MAK (Klett-/Wrap-Systeme, Entstauung) · IPK (nur unterstützend, kein Ersatz).</li>
  <li>Eigenbewegung ist stets Bestandteil einer effektiven Kompressionstherapie (Sprunggelenksbeweglichkeit, Abrollen, Fußgymnastik, Nordic Walking; bei Bettlägerigen Drainagebeutel-Training).</li>
</ul>
<p class="merke"><b>3S-3L-Regel ★ (S. 21):</b> „Sitzen und Stehen ist Schlecht, Lieber Laufen und Liegen!“</p>
<ul>
  <li><b>Weitere Beratung (S. 20–21):</b> flache Schuhe; keine einschnürende Kleidung; Beine hochlegen (20–30°, über Herzniveau), nicht übereinanderschlagen; Bettende hochstellen; Kneipp, kalte Güsse; Wärme &gt; 28 °C meiden; Venensport; Gewicht reduzieren; trinken; ballaststoffreich essen; Kompressionsstrümpfe lebenslang; Nägel kurz.</li>
  <li><b>Hautpflege unter Kompression (S. 21–22):</b> mindestens täglich, am besten abends; Creme muss vor dem Anziehen eingezogen sein; W/O-Basis mit Urea und/oder Glyzin; meiden: Alkohol, Allergene (Parabene, Perubalsam, Wollwachs, Propylenglykol, Ringelblume, Rosskastanie), Duftstoffe; sehr fetthaltige Salben im Sommer → Wärmestau, Follikulitis; Baumwollschlauchverband unter der Bandage; lockere Schuppen entfernen.</li>
</ul>

<h3>5. Ulcus cruris arteriosum <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 22–27</span></h3>
<ul>
  <li>Substanzdefekt infolge der pAVK; Ursache in ca. 95 % Atherosklerose. In Deutschland ca. 4,5 Mio. Betroffene (S. 22).</li>
  <li>Ursachen der Minderdurchblutung: Atherosklerose, arterielle Embolie, Vaskulitis, Gerinnungsstörungen, Veranlagung, Trauma. Risikofaktoren: Nikotin, Hypertonie, Diabetes, Dyslipidämie, abdominale Adipositas, Ernährung, Bewegungsmangel, Hyperfibrinogenämie, Homocysteinämie (&gt; 15 µmol/l), Polyarthritis (S. 23).</li>
  <li><b>Klinik (S. 24):</b> an äußeren Fußrändern, Außenseiten der Unterschenkel, Außenknöcheln; scharf begrenzt, wie ausgestanzt; Haut blass, weiß, marmoriert oder livide, glänzend, haarlos; verdickte Zehennägel; distale Hypothermie; tiefe Wunden mit freiliegenden Sehnen und Knochen.</li>
  <li><b>Diagnostik (S. 24–25):</b> Inspektion, Pulse, KADI/ABI – Achtung: bei Mönckeberg-Sklerose falsch hohe Werte (wichtig: periphere Dopplerdrücke &lt; 70 mmHg → fehlende Wundheilung); Doppler/Duplex, tcpO₂, Labor, Laufband, EKG, Wundabstrich, Angiografie, DSA (Nierenfunktion beachten).</li>
</ul>
<div class="tabelle"><table>
  <caption>Klassifikation der pAVK (S. 24)</caption>
  <thead><tr><th>Fontaine</th><th>Klinik</th><th>Rutherford</th></tr></thead>
  <tbody>
    <tr><td>I</td><td>asymptomatisch</td><td>Grad 0 / Kat. 0</td></tr>
    <tr><td>IIa</td><td>Gehstrecke &gt; 200 m</td><td>Grad I / Kat. 1 (leichte Claudicatio)</td></tr>
    <tr><td>IIb</td><td>Gehstrecke &lt; 200 m</td><td>Grad I / Kat. 2–3 (mäßige bis schwere Claudicatio)</td></tr>
    <tr><td>III</td><td>ischämischer Ruheschmerz</td><td>Grad II / Kat. 4</td></tr>
    <tr><td>IV</td><td>Ulcus, Gangrän</td><td>Grad III / Kat. 5 (kleinflächige) bzw. 6 (großflächige Nekrose)</td></tr>
  </tbody>
</table></div>
<p class="merke"><b>IRAN-Prinzip ★ (S. 25):</b> Infektionskontrolle, Mumifizierung der Gangrän · Revaskularisation · Amputation bzw. Nekroseentfernung im infektionsfreien Stadium · Nachsorge (Wundbehandlung, Schuhwerk, Gefäßsport, Risikofaktoren).</p>
<p class="warnung">Ohne Abklärung des Gefäßstatus und ohne Zweitmeinung keine Amputation!</p>
<ul>
  <li><b>Bei möglicher Revaskularisation (S. 25):</b> invasiv (PTA, Stent, Bypass, Patch; danach Débridement); systemisch (Durchblutung verbessern, Infusionen, ggf. Antibiotika, Risikofaktoren, Gehtraining im Stadium IIa); lokal (Wundreinigung, Nekrosen abtragen, Abszesse entlasten, phasengerechte Auflagen, Druckreduzierung). <b>Bei kritischer Ischämie (Knöchelarteriendruck &lt; 50 mmHg) keine Kompressionstherapie!</b></li>
  <li><b>Ohne Revaskularisationsmöglichkeit (S. 26):</b> mumifizierte trockene Nekrose → trocken behandeln; feuchte Wunde → lokal antiseptisch, Infektionsprophylaxe.</li>
  <li><b>Unterstützend (S. 26):</b> engmaschige Nachsorge, Thrombozytenfunktionshemmer/ggf. Antikoagulation, Gehtraining 2–3×/Woche, Rauchstopp, orthopädisches Schuhwerk, Fußpflege, keine einengende Kleidung, Beine nachts tief lagern, Füße warmhalten, regelmäßige Puls- und Hautkontrolle.</li>
</ul>
<div class="tabelle"><table>
  <caption>Ulcus cruris venosum vs. arteriosum ★ (Übung III, S. 27, Lösung S. 36)</caption>
  <thead><tr><th>Kriterium</th><th>venosum</th><th>arteriosum</th></tr></thead>
  <tbody>
    <tr><td>Grunderkrankung</td><td>CVI</td><td>pAVK</td></tr>
    <tr><td>Lokalisation</td><td>Unterschenkel-Vorderseite oder Innenknöchel; ggf. gamaschenartig</td><td>Unterschenkel-Außenseite, Außenknöchel, äußere Fußränder</td></tr>
    <tr><td>Schmerzen</td><td>unterschiedlich; Linderung durch Hochlagern</td><td>stark; Ruheschmerz nachts → Linderung durch Herabhängen des Beins; Claudicatio</td></tr>
    <tr><td>Haut</td><td>trocken, schuppig, Hyperpigmentierung, Atrophie blanche, Purpura jaune d’ocre, Dermatoliposklerose, Stauungsekzem</td><td>blass, weiß, marmoriert oder livide, glänzend, haarlos; Nekrosen/Gangrän an Zehen; verdickte Nägel</td></tr>
    <tr><td>Ödeme</td><td>Knöchel- und Unterschenkelödeme</td><td>keine</td></tr>
    <tr><td>Hauttemperatur</td><td>warm</td><td>kalt</td></tr>
    <tr><td>Fußpulse</td><td>tastbar</td><td>kaum oder nicht tastbar</td></tr>
    <tr><td>Wundrand</td><td>diffus, unregelmäßig, flach</td><td>klar abgegrenzt, wie ausgestanzt</td></tr>
    <tr><td>Wunde</td><td>feucht-glänzend, viel Exsudat, schmierig-fibrinöse Beläge</td><td>wenig Exsudat, trocken; ggf. freiliegende Sehnen/Knochen, Nekrosen</td></tr>
    <tr><td>Wundtiefe</td><td>bis in die Subcutis</td><td>tief – Sehnen, Knochen können sichtbar sein</td></tr>
  </tbody>
</table></div>

<h3>6. Ulcus cruris mixtum <span class="seite">S. 28</span></h3>
<ul>
  <li>Arterielle und venöse Ursache; meist mehrere Ulcera ohne typische Prädilektionsstellen; führendes Symptom ist meist der Schmerz. <span class="hand-inline">Handschriftlich: „arteriovenös“.</span></li>
  <li>Kompressionstherapie ist durch die arterielle Komponente stark eingeschränkt oder kontraindiziert → pAVK frühzeitig behandeln, um später wieder komprimieren zu können.</li>
</ul>

<h3>7. Diabetisches Fußulkus <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="seite">S. 28–34</span></h3>
<ul>
  <li>Ca. 6 Mio. Menschen mit Diabetes in Deutschland. Diabetisches Fußsyndrom = Spätkomplikation durch Makro- und Mikroangiopathie, Neuropathie und Chondroarthropathie; umfasst alle pathologischen Veränderungen am Fuß. 2–10 % aller Diabetiker entwickeln ein Fußulkus. Jährlich ca. 8.500 Major- (oberhalb des Sprunggelenks) und ca. 30.400 Minoramputationen (S. 28).</li>
  <li>Ursachen: ca. 50 % Polyneuropathie, ca. 15 % pAVK, ca. 35 % Kombination (S. 29).</li>
  <li><b>Polyneuropathie (S. 29):</b> sensibel (Kribbeln, Ameisenlaufen, brennende Schmerzen, Taubheit, Watte-Gefühl, verminderte Temperaturempfindung, schmerzlose Wunden); motorisch (Faszikulationen, Krämpfe, Muskelschwäche, frühes Zeichen: Parese der Zehenspreizung); autonom (Hypo-/Anhidrosis, Ödem, Ulcus, Osteoarthropathie, Ruhetachykardie, Gastroparese, Blasenstörung u. a.).</li>
</ul>
<div class="tabelle"><table>
  <caption>Arten des Diabetischen Fußulkus (S. 30)</caption>
  <thead><tr><th>Form</th><th>Merkmale</th></tr></thead>
  <tbody>
    <tr><td>neuropathisch</td><td>trockener, warmer, rosiger Fuß; Fußpulse tastbar; Sensibilitätsstörung (Vibration, Druck, Schmerz, Temperatur); schmerzlose Ulcera (Malum perforans)</td></tr>
    <tr><td>ischämisch</td><td>kühler, blasser, ggf. livider Fuß; Pulse vermindert oder fehlend; krampfartige Schmerzen beim Gehen oder in Ruhe; akrale Nekrosen, Gangrän</td></tr>
    <tr><td style="white-space:normal">ischämisch + neuropathisch</td><td>Zeichen des ischämischen Fußes, jedoch ohne Schmerzen</td></tr>
    <tr><td style="white-space:normal">Sonderform DNOAP (Charcot-Fuß)</td><td>meist einseitige, schmerzlose Destruktion des Fußskeletts nach unbemerkten Traumata; Nekrosen an Fußgelenken; Lymphödem; Überwärmung &gt; 1 °C (oft &gt; 2 °C) gegenüber der Gegenseite</td></tr>
  </tbody>
</table></div>
<div class="tabelle"><table>
  <caption>Klassifikation nach Wagner und Armstrong ★ (S. 29)</caption>
  <thead><tr><th>Grad</th><th>Wagner (Stadium A = ohne Infektion/Ischämie)</th></tr></thead>
  <tbody>
    <tr><td>0</td><td>keine Läsion, evtl. Fußdeformation, Cellulitis, Hyperkeratose</td></tr>
    <tr><td>1</td><td>oberflächliches Ulcus</td></tr>
    <tr><td>2</td><td>tiefes Ulcus bis Sehne oder Kapsel</td></tr>
    <tr><td>3</td><td>tiefes Ulcus bis Knochen und/oder Sehnen</td></tr>
    <tr><td>4</td><td>Nekrose von Fußteilen</td></tr>
    <tr><td>5</td><td>Nekrose des gesamten Fußes</td></tr>
  </tbody>
</table></div>
<p>Armstrong-Stadien: A ohne Zusatz · B mit Infektion · C mit Ischämie · D mit Infektion und Ischämie.</p>
<p class="hand">Als Prüfungshinweis vermerkt: Klassifikationen nach Fontaine, Widmer, Wagner.</p>
<ul>
  <li><b>Risikofaktoren (S. 31):</b> u. a. Neuropathie, pAVK, Alter &gt; 60, Adipositas (BMI &gt; 35), Nikotin, Alkohol, Sehschwäche, Hornhaut, Fußdeformität, falsche Fußpflege, Barfußlaufen, ungeeignetes Schuhwerk, nicht bemerkte Bagatellverletzungen, eingeschränkte Gelenkbeweglichkeit, vorangegangene Amputation. Läsion meist im Vorfuß- und Zehenbereich.</li>
  <li><b>Diagnostik (S. 32):</b> Untersuchung von Farbe, Temperatur, Puls- und Reflexstatus; tcpO₂; Podografie; KADI; Duplex; MR-Angiografie; Monofilament nach Semmes-Weinstein, Stimmgabel nach Rydel-Seiffer, Tip Therm; Röntgen/CT/MRT (Charcot).</li>
</ul>
<p class="merke"><b>IRAS-Regel ★ (S. 32):</b> Infektsanierung · Revaskularisation · Amputation, wenn unumgänglich · Schulung, Beratung, Information. Ziele: Lebensqualität, Senkung des Amputationsrisikos, Funktionserhalt – nur multiprofessionell erreichbar.</p>
<ul>
  <li><b>Therapie (S. 32):</b> Blutzucker optimieren, Grunderkrankungen behandeln, Infektionskontrolle, Débridement, konsequente und vollständige Druckentlastung (Gehstützen, Orthesen, Rollstuhl, Total Contact Cast, Bettruhe), phasengerechte Wundversorgung, Gefäßtherapie, Fußchirurgie, ggf. Angioplastie/Amputation (Zweitmeinung!), Schulung.</li>
  <li><b>Hautpflege (S. 33):</b> W/O-Cremes oder Schäume mit Urea; Zehenzwischenräume nicht eincremen (Mazeration, Pilze).</li>
  <li><b>Wundversorgung (S. 33):</b> Verdacht auf Infektion → Antiseptika, Auflagen mit Polihexanid; systemische Antibiose nach Antibiogramm. Trockene Nekrosen bei arterieller/gemischter Ursache nicht einweichen und erst nach Revaskularisation entfernen. Standard: PU-Schaumverbände ohne Klebeflächen; Fixierung locker, an Zehen kein Druck durch Drehungen. Hydrokolloide nur mit engmaschiger Kontrolle (Infektion wird bei PNP nicht bemerkt); kontraindiziert bei klinischer Infektion, freiliegenden Muskeln/Sehnen/Knochen, ischämischen Ulcera (pAVK IV).</li>
  <li><b>Prävention (S. 34):</b> tägliche Fußinspektion, Blutzuckerkontrolle, regelmäßige Fuß- und Nagelpflege, Hautpflege, Verletzungen vermeiden, geeignete Schuhe – nur wirksam bei aktiver Mitarbeit und regelmäßiger Schulung.</li>
</ul>

    { k: "Diagnose", f: "Welche Klassifikation gehört zu welcher Wunde?",
      a: "Dekubitus – EPUAP/NPUAP\nUlcus cruris venosum – Widmer, CEAP\nUlcus cruris arteriosum – Fontaine, TASC, Rutherford\nDiab. Fußulkus – Wagner-Armstrong", s: "S. 8, 13" },
    { k: "Lokalisation", f: "Wie beeinflusst die Lokalisation die Heilung?",
      a: "Gut durchblutete Stellen (Gesicht) heilen schneller als z. B. Haut über dem Schienbein; Muskulatur schneller als Faszien/Sehnen; über Gelenken Zugkräfte und Reibung.", s: "S. 13" },
    { k: "Lokalisation", f: "Kranial, kaudal, proximal, distal?",
      a: "Kranial – kopfwärts\nKaudal – zum Steißbein hin\nProximal – zur Körpermitte/zum Rumpf\nDistal – vom Rumpf weg", s: "S. 14" },
    { k: "Lokalisation", f: "Medial, lateral, dexter, sinister, palmar, plantar?",
      a: "Medial – zur Körpermitte · lateral – seitlich · dexter – rechts · sinister – links · palmar – zur Handfläche · plantar – zur Fußsohle.", s: "S. 14" },
    { k: "Lokalisation", f: "Anterior, posterior, radial, ulnar, tibial, fibular?",
      a: "Anterior/ventral – vorne · posterior/dorsal – hinten · radial – zur Speiche · ulnar – zur Elle · tibial – zum Schienbein · fibular – zum Wadenbein.", s: "S. 14" },
    { k: "Dauer", f: "Warum ist die Wunddauer relevant?",
      a: "Je älter die Wunde, desto länger die Heilung und desto höher die Wahrscheinlichkeit fehlerhafter Zellteilung/Entartung; bei länger bestehenden Wunden neuen Gefäßstatus erheben. Rezidive auf Narben heilen schlechter.", s: "S. 14" },
    { k: "Größe", f: "Welche Größenangaben sind ungeeignet?",
      a: "Vergleiche wie handtellergroß, tomatengroß, erbsengroß, Ein-Euro-Stück-groß sowie „Wunde schaut prima aus“ oder „ohne Befund“.", s: "S. 15" },
    { k: "Größe", f: "Wie werden Länge und Breite gemessen?",
      a: "Länge = größter Abstand in Kopf-Fuß-Achse (vertikal), Breite = größter horizontaler Abstand; beide im 90°-Winkel. Messpunkte im Team einheitlich.", s: "S. 15" },
    { k: "Größe", f: "Wie funktioniert die Uhrmethode?",
      a: "Für Taschen, Fisteln, Unterminierungen: Kopf = 12 Uhr, Fuß = 6 Uhr, unabhängig von der Lage. An Hand/Fuß: Finger-/Zehenspitzen = 12 Uhr, Handgelenk/Ferse = 6 Uhr.", s: "S. 16" },
    { k: "Größe", f: "Wie misst man Tiefe und Volumen einer Wunde?",
      a: "Tiefe: senkrecht an der tiefsten Stelle mit sterilen Pinzetten, Sonden, Knopfkanülen, Spülkathetern – keine Watteträger.\nVolumen: Auslitern mit Folie und Ringerlösung (ml).", s: "S. 16" },
    { k: "Gewebe", f: "Trockene vs. feuchte Nekrose?",
      a: "Trocken: dunkelbraun bis schwarz, hart, lederartig, klar abgegrenzt.\nFeucht: grau-gelb, weich, faserige oder schmierige Beläge.", s: "S. 17" },
    { k: "Gewebe", f: "Warum Nekrosen abtragen – und wann nicht?",
      a: "Fördert die Heilung, macht das Wundausmaß beurteilbar, entfernt das Keimreservoir – erst nach Demarkation.\nAusnahme: hochgradige pAVK – erst nach Behandlung der Grunderkrankung.", s: "S. 17" },
    { k: "Gewebe", f: "Was ist eine Gangrän?",
      a: "Spezielle Nekrose: akral, meist scharf begrenzt, durch Durchblutungsstörung; Wasserverlust → Mumifizierung; schwarz durch Blutabbauprodukte.", s: "S. 17" },
    { k: "Gewebe", f: "Wie unterscheidet man Eiter von Fibrin?",
      a: "Mit steriler Kompresse über die Wunde wischen: Eiter lässt sich abwischen, Fibrinbeläge haften fest am Wundgrund. (Sicher nur histologisch.)", s: "S. 18" },
    { k: "Gewebe", f: "Gutes vs. schlechtes Granulationsgewebe?",
      a: "Gut: rot, feinkörnig, feucht glänzend, fest.\nSchlecht: blassrosa bis gräulich, schwammig, grobkörnig, stark exsudierend (Durchblutung, Eiweißmangel, Keimlast, fehlende Druckentlastung).", s: "S. 18" },
    { k: "Gewebe", f: "Was ist Hypergranulation und wie wird sie behandelt?",
      a: "Überschießendes Granulationsgewebe über Hautniveau (vermutlich durch Entzündung, Fremdkörper, Reibung).\nTrockene Wundversorgung oder kontrollierte Druckverbände.", s: "S. 19" },
    { k: "Gewebe", f: "Wie wird eine frisch epithelisierte Wunde versorgt?",
      a: "Mit einem Schutzverband abdecken – Folienverbände oder transparente Hydrokolloide –, da das neue Gewebe empfindlich und wenig belastbar ist.", s: "S. 19" },
    { k: "Gewebe", f: "Aussehen von Fettgewebe, Muskel, Sehne?",
      a: "Fett: gelb-orange/weiß/grau, ölig, kugelig; abgestorben grau, bröselig.\nMuskel: vital rot; abgestorben fahlgrau bis schwarz.\nSehne: gelblich, glatt, glänzend, längs gefasert.", s: "S. 19–20" },
    { k: "Exsudat", f: "Welche Funktionen hat das Exsudat?",
      a: "Verhindert Austrocknen, erleichtert Einwandern von Fibroblasten, ermöglicht Zellbewegung und -teilung, liefert Nährstoffe, transportiert Immun- und Wachstumsfaktoren, unterstützt Autolyse.", s: "S. 20" },
    { k: "Exsudat", f: "Was bedeutet eine plötzlich zunehmende Exsudation bei fortgeschrittener Heilung?",
      a: "Mögliches Zeichen einer beginnenden Infektion – der Körper versucht, Keime und Fremdkörper auszuspülen.", s: "S. 21" },
    { k: "Exsudat", f: "Was deutet grünes, graublaues oder klares Exsudat an?",
      a: "Grün: Pseudomonas aeruginosa\nGrau/blau: Rückstände silberhaltiger Auflagen\nKlar/bernstein: normal serös; ggf. Harnwegs-/Lymphfistel", s: "S. 21" },
    { k: "Exsudat", f: "Zähflüssiges vs. dünnflüssiges Exsudat?",
      a: "Zäh: hoher Eiweißanteil (Entzündung), Verbandrückstände, Nekrose in Autolyse, Darmfistel.\nDünn: wenig Eiweiß (Mangelernährung, venöse/kardiale Erkrankung), Lymph-/Gelenk-/Harnwegsfistel.", s: "S. 22" },
    { k: "Geruch", f: "Wie wird Wundgeruch dokumentiert?",
      a: "Nur ja/nein – Geruch ist nicht objektiv erfassbar; Begriffe wie süßlich, faulig sind subjektiv. Nicht jeder Geruch bedeutet Infektion.", s: "S. 22" },
    { k: "Wundrand", f: "Unterminierung, Wundtasche, Untertunnelung?",
      a: "Unterminiert: bis max. 1 cm unterhöhlt.\nWundtasche: ab 1 cm.\nUntertunnelung: Verbindungsgang zu einer anderen Wunde.", s: "S. 23" },
    { k: "Wundrand", f: "Warum muss der Wundrand gereinigt werden?",
      a: "Die Epithelisierung geht vom Wundrand aus; Verkrustungen (z. B. eingetrocknetes Exsudat) verhindern das Einwandern der Epithelzellen.", s: "S. 24" },
    { k: "Wundrand", f: "Wie schützt man den Wundrand?",
      a: "Alkoholfreie transparente Hautschutzfilme (Hydropolymere, Silikone), Barrierecremes; trocknen lassen, keine zusätzlichen fetthaltigen Produkte.", s: "S. 24" },
    { k: "Wundrand", f: "Warum eignet sich Zinkpaste nicht als Wundrandschutz?",
      a: "Verhindert Beurteilung, schwer entfernbar (Öle stören Kleben), verdeckt Rötungen, stört in der Wunde die Heilung, mechanische Belastung beim Entfernen, trocknet aus → Risse und Keimeintritt.", s: "S. 24" },
    { k: "Umgebung", f: "Was bedeuten MASD und MARSI?",
      a: "MASD: Moisture Associated Skin Damage – Hautschäden durch Feuchtigkeit.\nMARSI: Medical Adhesive-Related Skin Injury – Schäden durch Ablösen von Wundauflagen.", s: "S. 25" },
    { k: "Infektion", f: "Entzündung vs. Infektion einer Wunde?",
      a: "Entzündung: durch die Gewebeschädigung selbst ausgelöst, physiologisch in der Exsudationsphase.\nInfektion: Eindringen, Anheften, Vermehren von Erregern; in jeder Phase; lokal, ausbreitend, systemisch.", s: "S. 25–26" },
    { k: "Infektion", f: "Was ist bei Infektionszeichen bei pAVK und diabetischer Neuropathie zu beachten?",
      a: "pAVK: Rötung und Überwärmung kaum vorhanden – Schmerz ist das aussagekräftigste Zeichen.\nNeuropathie: Schmerz fehlt, Fieber höchstens subfebril.", s: "S. 27" },
    { k: "Infektion", f: "Zeichen einer Infektion in Wundtaschen?",
      a: "Geröteter, verhärteter, ödematöser, schmerzhafter Wundrand; starke, dickflüssige, eitrige Exsudation; Geruch; oft Auslöser systemischer Infektion.", s: "S. 28" },
    { k: "Schmerz", f: "Mit welchen Instrumenten wird Wundschmerz erfasst?",
      a: "Selbsteinschätzung: VRS (verbal), NRS (numerisch), GRS (Gesichter).\nFremdeinschätzung: BESD, BISAD. Dazu Qualität und Auslöser dokumentieren.", s: "S. 28" },
    { k: "Sinne", f: "Welche Sinne nutzt man bei der Wundbeurteilung?",
      a: "Hören (Anamnese, Schmerzlaute), Sehen (Haut, Gangbild, Schuhe, Hilfsmittel), Tasten (Verhärtung, Ödem, Temperatur), Riechen (Geruch ja/nein). Alte Farbmodelle (schwarz/gelb) nicht mehr verwenden.", s: "S. 29" }
  ],

  zusammenfassung: `
<h3>1. Rechtliche Grundlagen der Dokumentation <span class="seite">S. 3</span></h3>
<ul>
  <li>Pflegeberufegesetz (PflBG): § 4 Vorbehaltene Tätigkeiten, § 5 Ausbildungsziel.</li>
  <li>SGB XI: § 85 Pflegesatzverfahren, § 104 Pflichten der Leistungserbringer, § 105 Abrechnung, § 140 Überleitung in Pflegegrade, § 112 Qualitätsverantwortung, § 113 Maßstäbe und Grundsätze der Pflegequalität, § 114 Qualitätsprüfungen.</li>
  <li>SGB V: § 70 Qualität, Humanität und Wirtschaftlichkeit, § 135a Verpflichtung zur Qualitätssicherung. (Im Heft steht hier versehentlich „Fünftes Buch (SGB XI)“.)</li>
  <li>Heimgesetz § 13 Aufzeichnungs- und Aufbewahrungspflicht · Transparenzvereinbarungen PTV-S (stationär) und PTV-A (ambulant) · Expertenstandards.</li>
  <li>Wunddokumentation ist Teil der Pflegedokumentation – nicht der Leistungs-/Durchführungsnachweise (separate Formulare mit Anzahl, Art, Datum, Uhrzeit, Handzeichen; ambulant Abrechnungsgrundlage). Beides auf einem Bogen widerspräche fachlichen und datenschutzrechtlichen Zielen.</li>
</ul>

<h3>2. Aufgaben, Ziele und Anforderungen <span class="seite">S. 4–5</span></h3>
<ul>
  <li><b>Ziele:</b> Heilungsverlauf anhand festgelegter Parameter für alle Beteiligten nachvollziehbar machen; Basis koordinierter Therapie; Doppeluntersuchungen und Versorgungsbrüche vermeiden; Probleme schnell sichtbar machen, schnelles Eingreifen; rechtliche Absicherung; Kommunikationsmittel und Teil der Qualitätssicherung.</li>
</ul>
<p class="merke"><b>Grundsätzliche Anforderungen (S. 4):</b> richtig, vollständig, nachvollziehbar, objektiv · Papier dokumentenecht (Kugelschreiber); digital unveränderbar (Rollen, Speicher-/Löschregeln, Passwörter) · immer persönlich und zeitnah · nicht im Voraus, nicht delegieren · jeder Eintrag mit Unterschrift bzw. Handzeichen (Handzeichenlegende mind. jährlich aktualisieren) · Korrekturen: einmal durchstreichen, lesbar lassen, Datum + Handzeichen · Korrekturfluid, Überkleben, Schwärzen, Seiten austauschen sind verboten – rechtlich ggf. Urkundenfälschung.</p>
<ul>
  <li><b>Spezifische Anforderungen</b> (Expertenstandard chronische Wunden, S. 5): ersichtlich sein muss, welche hygienischen Maßnahmen erfolgen, wie der Mensch mit wund- und therapiebedingten Beeinträchtigungen umgeht, Informationen zu Druckentlastung, Bewegung, Kompression, Ernährung, Rezidivprophylaxe, Selbstmanagementkompetenzen, Beteiligung an Maßnahmen, Wirkung, Verbesserung/Verschlechterung und Gründe für Änderungen.</li>
  <li>Der Expertenstandard empfiehlt, zur primären Wunddokumentation pflegerische Fachexpert:innen (z. B. Wundexpert:innen) hinzuzuziehen – intern oder extern (S. 5).</li>
</ul>

<h3>3. Bestandteile der Wunddokumentation <span class="seite">S. 6–10</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Bestandteil</th><th>Inhalt</th><th>Besonderheit</th></tr></thead>
  <tbody>
    <tr><td style="white-space:normal">Pflegerische Anamnese ★</td><td>Einschätzung der wund- und therapiebedingten Einschränkungen und der Selbstmanagementkompetenzen von Betroffenen und Angehörigen</td><td>keine validen Instrumente → Kriterien der Expert:innenarbeitsgruppe</td></tr>
    <tr><td style="white-space:normal">Wundspezifisches Assessment</td><td>Beschreibung nach festgelegten Kriterien, bisheriger Versorgungsprozess, Heilungsverlauf/Wundbericht</td><td>standardisierte Verfahren, z. B. EPUAP, PSST, PUSH, CEAP, Wagner-Armstrong</td></tr>
    <tr><td style="white-space:normal">Fotodokumentation</td><td>Visualisierung des Heilungsverlaufs</td><td>nur ergänzend – ersetzt nie die schriftliche Dokumentation</td></tr>
  </tbody>
</table></div>
<p>Keine standardisierten bundesweiten Bögen. Einfache Bögen mit Ankreuzfeldern vermeiden subjektive Aussagen wie „Wunde sifft“ oder „sieht gut aus“. Für jede Wunde eine eigene Dokumentation – auch bei gleichartigen Wunden (S. 6–7).</p>
<div class="tabelle"><table>
  <caption>Pflegerische Anamnese – Kriterien ★ (S. 7–8)</caption>
  <thead><tr><th>Kriterium</th><th>Komponenten</th></tr></thead>
  <tbody>
    <tr><td style="white-space:normal">Verständnis des Krankseins</td><td>Ursache, Heilung und Vorstellung zur Heilungszeit, Symptome (Geruch, Exsudat, Juckreiz), Bedeutung spezieller Maßnahmen</td></tr>
    <tr><td style="white-space:normal">Wund- und therapiebedingte Einschränkungen</td><td>Schmerz (Ort, Stärke, Qualität, Dauer, Auslöser, Linderung), Mobilität/Aktivität, Schlaf, psychosoziale Aspekte, Abhängigkeit von Hilfe, Juckreiz/Beinschwellung, Kleidung/Schuhe, Hygiene</td></tr>
    <tr><td style="white-space:normal">Wundbezogene Hilfsmittel</td><td>z. B. Kompressionsstrümpfe, spezielle Schuhe, Orthesen, druckverteilende Matratzen, Sitzkissen</td></tr>
    <tr><td style="white-space:normal">Selbstmanagementkompetenzen</td><td>Umgang mit Einschränkungen, Einstellung zu Wunde und Verbandwechsel, Alltagsaktivitäten, krankheitsspezifische Maßnahmen (Entstauung, Gefäßtraining, Fußpflege/-inspektion, Druckentlastung), Hautschutz, Ernährung, Blutzucker, Raucherentwöhnung</td></tr>
  </tbody>
</table></div>
<p>Zusätzlich: Name, Geburtsdatum, Medikation, Allergien, soziales Umfeld, behandelnde Ärzt:innen, Immunstatus, Begleiterkrankungen, Operationen, geistiger/seelischer Zustand, Lebensgewohnheiten, Wissen und Einstellung, Kontinenzsituation.</p>
<ul>
  <li><b>Wundspezifisches Assessment (S. 8–9):</b> medizinische Wunddiagnose, Lokalisation, Dauer, Rezidivzahl, Größe, Wundgrund, Exsudat, Geruch, Rand, Umgebung, Entzündungszeichen, Schmerz; dazu Therapie, Behandlungsschema, vollständige Produktbezeichnung und -größe, Datum und Handzeichen.</li>
  <li><b>Wiederholung:</b> je nach Verlauf, bei Verschlechterung oder nach Interventionen (z. B. Débridement, Infektion), spätestens nach 4 Wochen (S. 9, 11).</li>
</ul>
<h4>Fotodokumentation (S. 10)</h4>
<ul>
  <li>Einwilligung des Betroffenen bzw. gesetzlichen Vertreters nach Aufklärung über Grund und Zweck.</li>
  <li>Bei Wiederholung gleicher Abstand, Winkel, Belichtung, Kamera und Lagerung.</li>
  <li>Grundsätzlich nach der Reinigung fotografieren (Ausnahme: Auffälligkeiten, die nur vorher sichtbar sind).</li>
  <li>Einfarbiger, dunkler Hintergrund; Wunde mind. ⅓ des Bildes; Lineal/Maßband zur Größenbestimmung.</li>
  <li>Eindeutig zuordenbar (Name, Datum, Körperseite); bei den Dokumentationsunterlagen aufbewahren.</li>
</ul>
<p class="merke"><b>Aufbewahrung und Krankenkassen (S. 10):</b> § 630f BGB – Pflegedokumentation 10 Jahre aufbewahren. § 199 BGB – 30 Jahre Verjährungsfrist für Schadensersatz bei Verletzung von Körper und Gesundheit → empfohlen: Wunddokumentation inkl. Fotos 30 Jahre. Krankenkassen dürfen die Wunddokumentation nicht anfordern; Auszüge nur an den Medizinischen Dienst (MD) (§ 275 SGB V).</p>
<p class="hand">Als Prüfungsthema markiert: „Paragraphen“, § 630f BGB, § 199 BGB.</p>

<h3>4. Kriterien der Wundbeurteilung <span class="seite">S. 11–28</span></h3>
<ul>
  <li><b>Medizinische Wunddiagnose (S. 12–13):</b> Grunderkrankung, Wundart, Schweregrad – Dekubitus nach EPUAP/NPUAP, Ulcus cruris venosum nach Widmer/CEAP, arteriosum nach Fontaine/TASC/Rutherford, diabetisches Fußulkus nach Wagner-Armstrong. Fehlt sie, bei Ärzt:innen erfragen und dokumentieren.</li>
  <li><b>Lokalisation (S. 13–14):</b> schriftlich und grafisch. Gut durchblutete Stellen (Gesicht) heilen schneller als z. B. Haut über dem Schienbein; Muskulatur schneller als Faszien/Sehnen; Gelenkregionen durch Zugkräfte und Reibung belastet.</li>
</ul>
<div class="tabelle"><table>
  <caption>Lagebezeichnungen (S. 14)</caption>
  <thead><tr><th>Begriff</th><th>Bedeutung</th><th>Begriff</th><th>Bedeutung</th></tr></thead>
  <tbody>
    <tr><td>anterior/ventral</td><td>vorne (Bauch-/Brustseite)</td><td>posterior/dorsal</td><td>hinten (Rücken-/Gesäßseite)</td></tr>
    <tr><td>kranial</td><td>kopfwärts</td><td>kaudal</td><td>zum Steißbein hin</td></tr>
    <tr><td>medial</td><td>zur Körpermitte</td><td>lateral</td><td>seitlich</td></tr>
    <tr><td>proximal</td><td>zur Körpermitte/zum Rumpf</td><td>distal</td><td>vom Rumpf weg</td></tr>
    <tr><td>dexter</td><td>rechts</td><td>sinister</td><td>links</td></tr>
    <tr><td>palmar</td><td>zur Handfläche</td><td>plantar</td><td>zur Fußsohle</td></tr>
    <tr><td>radial / ulnar</td><td>zur Speiche / zur Elle</td><td>tibial / fibular</td><td>zum Schienbein / zum Wadenbein</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Wunddauer (S. 14):</b> Zeitspanne seit Auftreten. Je älter die Wunde, desto länger die Heilung und desto höher das Risiko einer Entartung; bei länger bestehenden Wunden neuen Gefäßstatus erheben. Rezidive auf Narbengewebe heilen schlechter.</li>
  <li><b>Rezidive (S. 15):</b> Anzahl und rezidivfreie Zeit in Monaten erfassen.</li>
  <li><b>Wundgröße (S. 15–16):</b> keine Vergleiche wie „handtellergroß“, „Ein-Euro-Stück“ oder „Wunde o. B.“. Länge = größte Ausdehnung in Kopf-Fuß-Achse, Breite = größte horizontale Ausdehnung, im 90°-Winkel; Einmalpapierlineal, Folie zum Umzeichnen. Messpunkte im Team einheitlich festlegen.</li>
  <li><b>Uhrmethode:</b> v. a. für Taschen, Fisteln, Unterminierungen; Kopf = 12 Uhr, Fuß = 6 Uhr unabhängig von der Lage; an Händen/Füßen Zehen- bzw. Fingerspitzen = 12 Uhr, Ferse/Handgelenk = 6 Uhr.</li>
  <li><b>Tiefe:</b> senkrecht an der tiefsten Stelle mit sterilen Pinzetten, Sonden, Knopfkanülen, Spülkathetern – keine Watteträger (Rückstände, Infektionsrisiko). <b>Volumen:</b> Auslitern mit Folie und z. B. Ringerlösung, Angabe in ml.</li>
</ul>
<h4>Wundgrund und Gewebearten (S. 16–20)</h4>
<ul>
  <li><b>Nekrose:</b> Endstadium einer Zellschädigung. Trocken: dunkelbraun bis schwarz, hart, lederartig, klar abgegrenzt. Feucht: grau-gelb, weich, faserig/schmierig. Ausdehnung der Wunde nicht beurteilbar. Gangrän: akraler, scharf begrenzter Gewebeuntergang durch Durchblutungsstörung, Mumifizierung, schwarz.</li>
  <li>Nekrosen grundsätzlich abtragen (Heilung, Wundausmaß, Keimreservoir) – aber erst nach Demarkation. Ausnahme: hochgradige pAVK → äußerste Vorsicht, erst nach Behandlung der Grunderkrankung (S. 17).</li>
  <li><b>Fibrinbeläge:</b> Fibrin = wasserunlösliches Protein; erster Wundverschluss und Gerüst für Granulation; zu fest anhaftend → Störung. Infektfibrin: festsitzend, hell- bis dunkelgelb, schmierig. Eiter vs. Fibrin: optisch gleich; mit steriler Kompresse wischen – Eiter lässt sich abwischen, Fibrin haftet fest (S. 18).</li>
  <li><b>Granulationsgewebe:</b> feucht glänzend, leicht verletzlich, tiefrot, körnig. Gut: rot, feinkörnig, feucht glänzend, fest (gute Durchblutung, Eiweiß, Druckentlastung). Schlecht: blassrosa bis gräulich, schwammig, grobkörnig, stark exsudierend (schlechte Durchblutung, Eiweißmangel, Keimlast, fehlende Druckentlastung). Hypergranulation (über Hautniveau) behandeln: trockene Versorgung oder kontrollierte Druckverbände (S. 18–19).</li>
  <li><b>Epithelgewebe:</b> frisch rosa, wächst vom Rand ein; frisch epithelisierte Wunden mit Schutzverband (Folien, transparente Hydrokolloide) abdecken (S. 19).</li>
  <li><b>Fettgewebe:</b> gelb-orange, weiß oder grau, ölig, kugelig; schlecht durchblutet; abgestorben gräulich, bröselig. <b>Muskel:</b> vital rot, abgestorben fahlgrau bis schwarz. <b>Knochen:</b> gelb-weiß bis grau, hart. <b>Sehnen:</b> gelblich, glatt, glänzend, längs gefasert; geschädigt bräunlich, abgefasert; Taschen entlang des Verlaufs (S. 19–20).</li>
</ul>
<h4>Exsudat (S. 20–22)</h4>
<ul>
  <li><b>Funktion:</b> verhindert Austrocknen, erleichtert das Einwandern von Fibroblasten, ermöglicht Zellbewegung und -teilung, liefert Nährstoffe, transportiert Immun- und Wachstumsfaktoren, unterstützt Autolyse.</li>
  <li>Zu viel → Mazeration, Hautirritation, toxisches Kontaktekzem. Physiologisch nimmt die Menge ab; plötzlicher Anstieg bei fortgeschrittener Heilung → beginnende Infektion.</li>
  <li>Erfassen: Quantität (Verbandwechselhäufigkeit, durchnässte Kompressen) und Qualität (Farbe, Viskosität); Mengenkategorien im Team vereinbaren.</li>
</ul>
<div class="tabelle"><table>
  <caption>Exsudatfarbe und Viskosität (S. 21–22)</caption>
  <thead><tr><th>Befund</th><th>mögliches Anzeichen für</th></tr></thead>
  <tbody>
    <tr><td style="white-space:normal">transparent, klar, bernsteinfarben</td><td>normales seröses Exsudat; Harnwegs- oder Lymphfistel</td></tr>
    <tr><td style="white-space:normal">trübe, milchig, cremefarben, eitrig</td><td>Fibrin; eitriges Exsudat bei Infektion; Entzündung</td></tr>
    <tr><td style="white-space:normal">rot, rosa, blutig</td><td>Kapillarverletzung (z. B. unsachgemäßes Entfernen der Auflage)</td></tr>
    <tr><td style="white-space:normal">gelb, braun</td><td>Darm-/Harnwegsfistel; Rückstände (z. B. Hydrokolloid), Schorf</td></tr>
    <tr><td style="white-space:normal">grün</td><td>Pseudomonas aeruginosa</td></tr>
    <tr><td style="white-space:normal">grau, blau</td><td>Rückstände silberhaltiger Wundauflagen</td></tr>
    <tr><td style="white-space:normal">zäh, hochviskös</td><td>hoher Eiweißanteil (Entzündung), Verbandrückstände, Nekrose in Autolyse, Darmfistel</td></tr>
    <tr><td style="white-space:normal">dünnflüssig, niedrigviskös</td><td>geringer Eiweißanteil (Mangelernährung, venöse oder kardiale Erkrankung), Lymph-, Gelenk-, Harnwegsfistel</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Wundgeruch (Foetor) (S. 22):</b> nicht objektiv erfassbar → nur ja/nein; nicht immer Infektion (auch sich reinigende Wunden riechen); belastet die Lebensqualität stark.</li>
  <li><b>Wundrand (S. 22–24):</b> Grenze zur intakten Haut; mit fortschreitender Heilung glatt und rosa. Zur Epithelisierung Verkrustungen entfernen. Schutz: alkoholfreie transparente Hautschutzfilme (Hydropolymere, Silikone), Barrierecremes; trocknen lassen, keine zusätzlichen fetthaltigen Produkte.</li>
</ul>
<div class="tabelle"><table>
  <caption>Wundrandmerkmale (S. 23)</caption>
  <thead><tr><th>Merkmal</th><th>Beschreibung</th><th>Merkmal</th><th>Beschreibung</th></tr></thead>
  <tbody>
    <tr><td>avital</td><td>keine Heilungstendenz</td><td>livide</td><td>blassbläulich, fahl</td></tr>
    <tr><td>borkig</td><td>Borken aus eingetrocknetem Exsudat</td><td>mazeriert</td><td>aufgeweicht</td></tr>
    <tr><td>eingerollt</td><td>nach innen gedreht, kein Kontakt zum Wundgrund</td><td>nekrotisch</td><td>livide bis schwarz, Gewebeuntergang</td></tr>
    <tr><td>gerötet</td><td>Mehrdurchblutung, z. B. Infektion</td><td>ödematös</td><td>geschwollen, verdickt</td></tr>
    <tr><td>glatt</td><td>ohne Erhabenheit in die Wunde</td><td>schuppig</td><td>trockene Schuppen</td></tr>
    <tr><td>hyperkeratotisch</td><td>Verhornung durch Druck/Reibung, oft am Fuß</td><td>vital</td><td>gesund, beginnende Epithelisierung</td></tr>
    <tr><td>unterminiert</td><td>bis 1 cm unterhöhlt; ab 1 cm = Wundtasche; Verbindung zu anderer Wunde = Untertunnelung</td><td>zerklüftet</td><td>ohne klare Abgrenzung</td></tr>
  </tbody>
</table></div>
<p class="warnung">Warum keine Zinkpaste als Wundrandschutz? (S. 24) Verhindert die Beurteilung, lässt sich schwer entfernen (Öle stören dann das Kleben), verdeckt Rötungen als Infektionszeichen, stört in der Wunde die Heilung, mechanische Belastung beim Entfernen, trocknet durch Puderanteil aus → Risse, Eintrittspforte für Keime.</p>
<ul>
  <li><b>Wundumgebung (S. 24–25):</b> angrenzende Haut; z. B. unauffällig, trocken, rissig, atroph, livide. Ausschlag, Juckreiz, Ödem unter dem Kleberand → Allergie; gerötet, warm, schmerzhaft → Infektion. MASD = Moisture Associated Skin Damage (Feuchtigkeit); MARSI = Medical Adhesive-Related Skin Injury (Ablösen von Auflagen).</li>
  <li><b>Entzündung vs. Infektion (S. 25–26):</b> Entzündung = Abwehrreaktion auf chemische/physikalische Reize, Mikroorganismen oder Zellzerfall; in der Wunde durch die Gewebeschädigung selbst ausgelöst, gehört zur Exsudationsphase. Infektion = aktives/passives Eindringen, Anheften und Vermehren von Erregern; in jeder Phase möglich: lokal, sich ausbreitend, systemisch.</li>
  <li><b>Infektionszeichen nach EWMA (S. 26–27)</b> unterscheiden sich je Wundart. Besonderheiten: bei pAVK sind Rötung und Überwärmung kaum vorhanden – Schmerz ist das aussagekräftigste Infektionszeichen; bei diabetischer Neuropathie fehlt der Schmerz, Fieber höchstens subfebril. Diabetischer Fuß u. a. „probes to bone“, Fluktuation, Ulcusbasis von rosa nach gelb/grau; arteriell u. a. trockene Nekrose wird nass.</li>
  <li><b>Infektion in Wundtaschen (S. 28):</b> geröteter, verhärteter, ödematöser, schmerzhafter Rand; starke, dickflüssige, eitrige Exsudation; Geruch; oft Auslöser systemischer Infektion.</li>
  <li><b>Wundschmerz (S. 28):</b> Quantität und Qualität bei jedem Verbandwechsel erfassen; Selbsteinschätzung mit VRS, NRS, GRS (Gesichter), Fremdeinschätzung mit BESD, BISAD; schmerzauslösende und lindernde Situationen sowie Qualität (pochend, brennend, stechend) dokumentieren; Expertenstandards Schmerz beachten.</li>
</ul>
<p class="merke"><b>Wundbeurteilung mit allen Sinnen (S. 29):</b> Hören (Anamnese, Schmerzlaute), Sehen (Haut, Gangbild, Kleidung, Schuhe, Hilfsmittel), Tasten (Verhärtung, Ödem, Temperatur, Faszienlücken), Riechen (Geruch ja/nein). Alte Farbmodelle (schwarz = Nekrose, gelb = Fibrin) werden nicht mehr verwendet.</p>
<p><b>Übungen (Lösung S. 30):</b> 1 – Dekubitus Kategorie IV, Exsudationsphase, Fettnekrose, Tasche spülen und austamponieren; 2 – Ulcus cruris arteriosum mit trockener, demarkierter Nekrose in der Exsudationsphase → Nekrose entfernen.</p>

      a: "Kontaminiert: Keime vermehren sich nicht.\nKolonisiert: vermehrungsfähige Keime, Heilung nicht nachhaltig gestört.\nKritisch kolonisiert: erhöhte Besiedlung, infektgefährdet.", s: "S. 7" },
    { k: "Ablauf", f: "Maßnahmen bei kritisch kolonisierter und lokal infizierter Wunde?",
      a: "Kritisch kolonisiert: aseptischer Verband + Wundabstrich.\nLokal infiziert: aseptischer Verband; je nach Abstrich Antiseptika/antimikrobielle Lokaltherapie.", s: "S. 8" },
    { k: "Ablauf", f: "Maßnahmen bei systemischer Infektion?",
      a: "Aseptischer Wundverband, wiederholter Wundabstrich, Antiseptika/antimikrobielle Lokaltherapie, systemische antimikrobielle Therapie.", s: "S. 8" },
    { k: "Risiko", f: "Welche Faktoren begünstigen eine Wundinfektion?",
      a: "Lokalisation (Anus, Sakralbereich, Füße, Inkontinenz), Umgebungsfaktoren (Hygiene, Haustiere), (Begleit-)Erkrankungen (Immunschwäche, Diabetes, Aids, terminale Phase), Wundart (Verbrennung, DFU, Tumorexulzeration).", s: "S. 9" },
    { k: "Risiko", f: "Anzeichen infektgefährdeter Wunden?",
      a: "Entzündungszeichen, viel/trübes/zäh-eitriges Exsudat, Geruch, bröckeliges blutendes Granulationsgewebe, Verfärbung, Taschen, Vergrößerung, Erythem, Verhärtung, Ödem, Zellulitis, Leukozytose, Abszess.", s: "S. 10" },
    { k: "Risiko", f: "Infektionszeichen bei pAVK und diabetischer Neuropathie?",
      a: "pAVK: Rötung kaum, Überwärmung eingeschränkt – Schmerz ist das aussagekräftigste Zeichen.\nNeuropathie: kaum Schmerz, Fieber höchstens subfebril.", s: "S. 10–11" },
    { k: "Risiko", f: "Was beschreibt die PEDIS-Klassifikation?",
      a: "Schwere der (diabetischen) Fußinfektion nach Lipsky 2006:\n1 nicht infiziert · 2 leicht (≤ 2 cm, oberflächlich) · 3 moderat (tief, Abszess, Knochen) · 4 schwer (systemische Zeichen).", s: "S. 11" },
    { k: "Keime", f: "Was ist eine nosokomiale Infektion?",
      a: "Infektion, die Patient:innen im Zusammenhang mit einer medizinischen Maßnahme erwerben – z. B. im Krankenhaus, in Pflegeeinrichtungen oder ambulanten Praxen (RKI).", s: "S. 12" },
    { k: "Keime", f: "Eiterbild von Staphylo-, Streptokokken und Pseudomonas?",
      a: "Staphylokokken: rahmig, gelblich, geruchlos\nStreptokokken: gelbgrau, dünnflüssig\nPseudomonas: blau-grünlich, süßlich riechend", s: "S. 12" },
    { k: "Keime", f: "Was sind Mikroorganismen (BioStoffV)?",
      a: "Zelluläre oder nichtzelluläre mikroskopisch kleine biologische Einheiten, die sich vermehren oder genetisches Material weitergeben können: Bakterien, Viren, Protozoen, Pilze.", s: "S. 12" },
    { k: "MRE", f: "Was bedeutet „multiresistent“? (Übung II)",
      a: "Keime haben eine Resistenz gegenüber mehreren Antibiotikagruppen entwickelt.", s: "S. 33" },
    { k: "MRE", f: "Helfen Antiseptika und Händedesinfektion gegen MRE?",
      a: "Ja. Resistenz bezieht sich nur auf Antibiotika. Händedesinfektion vernichtet alle MRE; Alkohol, PVP-Jod, Chlorhexidin, Polihexanid, Octenidin wirken. Ausnahme: H₂O₂ und Silber (Lücken; manche Pseudomonas silberresistent).", s: "S. 13–14" },
    { k: "MRE", f: "Was ist MRSA und wie wird er übertragen?",
      a: "Methicillin-resistenter Staphylococcus aureus; v. a. direkter Kontakt über die Hände, auch Niesen, Kleidung, Bettwäsche, Oberflächen; gefährlich bei Immunschwäche.", s: "S. 14" },
    { k: "MRE", f: "Was kennzeichnet VRE und MRGN/ESBL?",
      a: "VRE: Vancomycin-resistente Enterokokken aus der Darmflora; bis 1 Woche außerhalb des Menschen überlebensfähig.\nMRGN/ESBL: gramnegative Erreger aus Darm/Umwelt; gefährlich für Abwehrgeschwächte.", s: "S. 14" },
    { k: "MRE", f: "Was ist das Besondere an Clostridium difficile?",
      a: "Anaerobes grampositives Stäbchen im Darm; unter Antibiotika Vermehrung mit Toxin- und Sporenbildung – Sporen werden durch gängige Desinfektionsmittel nicht abgetötet; starker Durchfall.", s: "S. 14" },
    { k: "MRE", f: "Wann sind MRE meldepflichtig, welche Maßnahmen bei MRSA/VRE?",
      a: "Erst bei Nachweis in Blut oder Liquor.\nMRSA/VRE: Einzelisolierung, Mund-Nasen-Schutz, Schutzkittel, Handschuhe, Händedesinfektion vor und nach Kontakt.", s: "S. 15" },
    { k: "MRE", f: "Was gehört zur Basishygiene? (Übung II)",
      a: "Händedesinfektion, Flächendesinfektion, Schutzkleidung, Isolation.", s: "S. 33" },
    { k: "VW", f: "Was ist vor jedem Verbandwechsel rechtlich erforderlich?",
      a: "Schriftliche ärztliche Anordnung (Häufigkeit, Vorgehen, Medikamente, Wundauflage) und Einverständnis der aufgeklärten Person.", s: "S. 15" },
    { k: "VW", f: "Was ist das Remonstrationsrecht?",
      a: "Recht und Pflicht, eine gefahrengeneigte Versorgung (z. B. veraltete oder gefährdende Verordnung) schriftlich und nachweislich anzuzeigen; Gespräch mit dem Arzt dokumentieren.", s: "S. 15" },
    { k: "VW", f: "Welche Ziele hat ein Verbandwechsel?",
      a: "Wundkontrolle, Wundbeurteilung und Therapieanpassung, Vorbeugung von Keimeinschleppung, Bekämpfung bestehender Infektion, Schmerzvermeidung, Unterstützung der Heilung.", s: "S. 16" },
    { k: "VW", f: "Welche Grundmaßnahmen und Schutzkleidung sind beim Verbandwechsel obligatorisch?",
      a: "Uhren/Schmuck ab, Haare zurück, keine langen Ärmel; Einmalhandschuhe und Einmalschürze/-kittel, nach jedem Patientenkontakt wechseln; bei MRE/großflächigen Wunden zusätzlich MNS.", s: "S. 16" },
    { k: "VW", f: "Was gilt für Spüllösungen und festklebende Kompressen?",
      a: "Spüllösung steril, Haltbarkeit beachten (handschriftlich: Raumtemperatur, nicht kalt).\nFestklebende Kompressen mit steriler Pinzette entfernen.", s: "S. 17", h: true },
    { k: "Hände", f: "Warum ist die Händedesinfektion so wichtig?",
      a: "Grundlegendste Hygienemaßnahme; laut RKI die wichtigste Maßnahme gegen nosokomiale Infektionen; 100- bis 1000-mal wirksamer als Händewaschen.", s: "S. 18" },
    { k: "Hände", f: "Wer war Ignaz Semmelweis?",
      a: "Arzt (geb. 1818) am Wiener Allgemeinen Krankenhaus; erkannte die Übertragung von Kindbettfieber über Ärztehände nach Sektionen; Chlorkalklösung; „Retter der Mütter“. Händedesinfektion vor OPs erst 1867 eingeführt.", s: "S. 18, 32" },
    { k: "Hände", f: "Gegen was wirken alkoholische Händedesinfektionsmittel – und gegen was nicht?",
      a: "Wirksam: Bakterien inkl. MRSA, Pilze, Hefen, M. tuberculosis, behüllte Viren.\nEingeschränkt: unbehüllte Viren (Noro) → Spezialpräparat.\nUnwirksam: Sporen → danach Hände waschen.", s: "S. 19" },
    { k: "Hände", f: "Was fordert die TRBA 250 für die Hände?",
      a: "Keine Schmuckstücke, Ringe, Armbanduhren, Piercings, künstlichen Fingernägel oder Armbänder an Händen und Unterarmen; Nägel kurz und rund geschnitten.", s: "S. 19" },
    { k: "Hände", f: "Nenne die 5 Indikationen der Händedesinfektion (RKI).",
      a: "1. vor Patientenkontakt\n2. vor aseptischen Tätigkeiten\n3. nach Kontakt mit infektiösem Material\n4. nach Patientenkontakt\n5. nach Kontakt mit der Patientenumgebung", s: "S. 20" },
    { k: "Hände", f: "Menge und Einwirkzeit bei der Händedesinfektion?",
      a: "So viel, wie in eine hohle Hand passt (3–5 ml); Hände über die gesamte Einreibezeit (üblicherweise 30 s) benetzt halten. Ablauf nach DIN EN 1500.", s: "S. 20" },
    { k: "Hände", f: "Fehlerquellen bei der Händedesinfektion? (Übung III)",
      a: "Händewaschen statt Desinfektion, zu kurze Einwirkzeit, zu wenig Mittel, zu selten, vorgeschädigte Haut, Schmuck oder lange Nägel nicht abgelegt.", s: "S. 33" },
    { k: "Kosten", f: "Was steht Pflegebedürftigen nach § 40 Abs. 2 SGB XI zu?",
      a: "Pflegehilfsmittel-Paket bis max. 40 € monatlich ab Pflegegrad 1 bei häuslicher Versorgung: MNS, Einmalhandschuhe, Einmalschürzen, Bettschutzeinlagen, Hände-/Flächendesinfektion.", s: "S. 22" },
    { k: "Durchführung", f: "Was ist stationär am Krankenbett zu beachten?",
      a: "Informieren, Einverständnis, Stoppsignale, Analgetika rechtzeitig; Arbeitsfläche schaffen, sterile Materialien patientenfern, Bett ist keine Ablage; Licht, Arbeitshöhe, Türen/Fenster zu, Besucher raus.", s: "S. 23–24" },
    { k: "Durchführung", f: "Besonderheiten im ambulanten Bereich?",
      a: "Material staub-, hitze-, feuchtgeschützt in Kunststoffboxen; Licht (Stirnlampe); Haustiere raus; desinfiziertes Kunststofftablett; Bett/Fußboden keine Ablage; Abwurfbehälter nicht aus Glas.", s: "S. 24" },
    { k: "Durchführung", f: "Wie wird die Wunde gereinigt?",
      a: "Aseptisch mit sterilen Instrumenten und Tupfern/Kompressen; wischen, nicht tupfen; pro Wischgang ein neuer Tupfer bzw. eine neue Kompresse.", s: "S. 25" },
    { k: "Durchführung", f: "Wann erfolgen Handschuhwechsel und Händedesinfektion beim Verbandwechsel?",
      a: "Zu Beginn; nach Entfernen des alten Verbands; vor der Wundreinigung (nach ggf. Abstrich); nach der Inspektion vor dem neuen Verband; am Ende nach Entsorgung.", s: "S. 25" },
    { k: "Technik", f: "Was ist die Non-Touch-Technik?",
      a: "Nur steriles Material berührt die Wunde: unsterile Handschuhe + sterile Instrumente, Wunde nie mit den Händen berühren; alternativ sterile Handschuhe oder sterile/unsterile Hand. Unsauberes Material nie zurück zur Wunde.", s: "S. 26" },
    { k: "Abstrich", f: "Wie wird ein Wundabstrich vorbereitet?",
      a: "Aus der Wundtiefe; vorher mechanische Reinigung mit angefeuchteten Kompressen und/oder Spülung mit NaCl – keine Antiseptika.\nAusnahme: Verdacht auf MRE → ohne vorherige Säuberung.", s: "S. 26" },
    { k: "Abstrich", f: "Was ist beim Wundabstrich zu dokumentieren und zu beachten?",
      a: "Entnahmestelle, Wundart, Grunderkrankung, bisherige Antibiose; Begleitschein und Etikett vollständig; gewünschte Untersuchung; Lagerung bei Zimmertemperatur; zeitnaher Transport.", s: "S. 27" },
    { k: "Abstrich", f: "Essener Wundkreisel vs. Levine-Technik?",
      a: "Essener Wundkreisel: kreisend von außen nach innen, großes Areal – MRE-Screening.\nLevine: ca. 1 cm² unter leichtem Druck – Erregersuche bei Infektverdacht, Taschen/Unterminierungen.", s: "S. 27" },
    { k: "Nach", f: "Was gehört zur Nachbereitung des Verbandwechsels?",
      a: "Instrumente sicher entsorgen, Handschuhe/Kittel ab, Händedesinfektion inkl. Unterarme, Patient lagern, nach Beschwerden fragen, Flächen desinfizieren, Müll außerhalb entsorgen, Dokumentation, Wagen auffüllen.", s: "S. 28" },
    { k: "Nach", f: "Komplikationen mangelnder Hygiene beim Verbandwechsel? (Übung III)",
      a: "Schmerzhafte Entzündungen, Ausbreitung zur systemischen Infektion, Sepsis, Organinfektionen (Pneumonie), MRE-Ausbreitung auf Immungeschwächte, Wundheilungsstörung.", s: "S. 34" },
    { k: "Nach", f: "Fehlerquellen beim Umgang mit Material und Spüllösungen? (Übung III)",
      a: "Geöffnete Materialien, Haltbarkeit (auch nach Öffnen) nicht beachtet, unsteril oder feucht gelagert, keine Non-Touch-Technik, keine aseptische Wundreinigung.", s: "S. 34" }
  ],

  <li><b>Ignaz Semmelweis</b> (geb. 1818, Wiener Allgemeines Krankenhaus): Kindbettfieber durch Ärzte nach Leichensektion; Chlorkalklösung senkte die Sterblichkeit; „Retter der Mütter“. Händedesinfektion vor OPs erst 1867 eingeführt.</li>

  <li><b>Ambulant (S. 24):</b> Materialien staub-, hitze-, feuchtgeschützt in Kunststoffboxen lagern; Licht (Stirnlampe); Haustiere aus dem Zimmer; Arbeitsfläche aus wischdesinfiziertem Kunststofftablett, Bett und Fußboden sind keine Ablage; Abwurfbehälter aus Kunststoff, nicht aus Glas (Unfallverhütungsvorschrift).</li>

<h3>9. Non-Touch-Technik und Wundabstrich <span class="seite">S. 26–27</span></h3>
<ul>
  <li><b>Non-Touch-Technik</b> („nicht berühren“): nur steriles Material berührt die Wunde. Arbeiten mit unsterilen Handschuhen und sterilen Instrumenten; Wunde nie mit den Händen berühren. Alternativ sterile Handschuhe (zweite Person oder gute Vorbereitung) oder Aufteilung in sterile und unsterile Hand. Unsaubere Materialien gehen nie zur sauberen Wunde zurück; aufwändige Verbandwechsel zu zweit.</li>
  <li><b>Wundabstrich</b> aus der Wundtiefe (eigentlicher Wundkeim statt Oberflächenkeime). Vorher mechanische Reinigung mit angefeuchteten Kompressen und/oder Spülung mit Kochsalzlösung – keine Antiseptika oder chemischen Zusätze (verfälschen das Ergebnis). Ausnahme: Verdacht auf MRE → ohne vorherige Säuberung abstreichen.</li>
  <li>Deklariertes Abstrichröhrchen, Herstellerangaben; Information, Händedesinfektion, Einmalhandschuhe. Dokumentieren: Entnahmestelle, Wundart, Grunderkrankung, bisherige Antibiotikatherapie; Begleitschein und Etikett vollständig; gewünschte Untersuchung; Lagerung bei Zimmertemperatur; zeitnaher Transport.</li>
</ul>

    <tr><td style="white-space:normal">Essener Wundkreisel</td><td>kreisend von außen nach innen über möglichst großes Areal</td><td>gezielte MRE-Suche, z. B. bei Neuaufnahme</td></tr>
    <tr><td style="white-space:normal">Levine-Technik</td><td>ca. 1 cm² eines klinisch infizierten Areals unter leichtem Druck</td><td>Erregersuche in Unterminierungen/Taschen bei Verdacht auf Wundinfektion</td></tr>
  </tbody>
</table></div>

<h3>10. Nachbereitung <span class="seite">S. 28–29</span></h3>
<ul>
  <li>Instrumente sofort kontaminationsfrei in Auffangbehälter; Handschuhe und Kittel entsorgen; Händedesinfektion inkl. Unterarme; Patient:in angenehm lagern, Trinkbecher, Brille, Klingel bereitlegen; nach Druckgefühl, Schmerz, Juckreiz fragen; Arbeitsflächen desinfizieren; Müllbeutel außerhalb des Zimmers entsorgen; Händedesinfektion; Dokumentation; stationär Verbandwagen wischdesinfizieren und auffüllen.</li>
  <li><b>Komplikationen mangelnder Hygiene</b> (Lösung Übung III, S. 34): schmerzhafte Entzündungen, Ausbreitung lokaler zu systemischer Infektion, Sepsis, Organinfektionen (Pneumonie), Ausbreitung von MRE auf immungeschwächte Patient:innen, Wundheilungsstörung (Vergrößerung, Stagnation).</li>
  <li><b>Fehlerquellen bei Material (S. 34):</b> geöffnete Materialien verwendet, Haltbarkeit (auch nach Öffnen) nicht beachtet, unsteriles oder feucht gelagertes Material, keine Non-Touch-Technik, keine aseptische Wundreinigung.</li>
</ul>
<p class="hand">Kein Prüfungsstoff: Umgang mit Verbandmaterial (Verfallsdatum prüfen, keine angebrochenen Materialien, nicht unsteril lagern, Wechselintervall nach Exsudat und Herstellerangaben – nicht nach Tourenplan) und die Symboltabelle (z. B. LOT = Charge, SN = Seriennummer, REF = Bestellnummer, durchgestrichene 2 = nicht zur Wiederverwendung).</p>
`
});

</script>
