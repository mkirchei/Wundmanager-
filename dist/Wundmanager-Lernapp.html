  <li><b>Adipositas:</b> Herzauswurfleistung reicht nicht → O₂-Versorgung ↓; Spannung auf Nähte, Bakterienvermehrung in Hautfalten, Dehiszenzen; häufig Malnutrition → Aufklärung, Ernährungsberatung, Gewichtsreduktion, Ernährungsumstellung.</li>
  <li><b>Adhärenz:</b> Ausmaß, in dem Betroffene vereinbarte Maßnahmen einhalten und in den Alltag integrieren; Basis: Krankheitsverständnis, respektvolle Kommunikation. <span class="hand-inline">Handschr.: Adhärenz = aktive Mitarbeit/Mithilfe; Compliance = Bereitschaft.</span> Einflussfaktoren (S. 23): sozialökonomisch (Analphabetismus, Bildung, Kultur, weite Wege, Kosten) · Behandlungsteam/Gesundheitssystem (unabgestimmtes Team, unverständliche Anweisungen, fehlende Schulung, kurze Sprechzeiten, Kritik an bisherigen Maßnahmen) · krankheitsbedingt (Schwere, Demenz, Depression, Sucht) · therapiebezogen (Dauer, Kosten, Nebenwirkungen) · individuell (Wissen, Erwartungen, Angst, fehlende Akzeptanz).</li>
  <li><b>Psychische Verfassung:</b> stabile Psyche wirkt positiv; Depression, Neurosen, Psychosen, Sucht, Selbstschädigung, Demenz senken Kooperation. Manche manipulieren die Wunde aus Angst vor Einsamkeit; Gefühl, Belastung zu sein. Suchtkranke: oft schlechter AZ, Immunabwehr ↓, Ernährungszustand ↓.</li>
  <li><b>Übung III – Demenz</b> (Lösung S. 30): bewegungsaktives Stadium → hoher Energiebedarf (3000–4000 kcal), Wunde erhöht ihn zusätzlich; Schmerzen oft nicht erkannt → sorgfältige Beobachtung, Fremdeinschätzung; <b>Ablenkungsverband</b>: elastische Mullbinden um die Handgelenke, mit breiten Pflasterstreifen befestigt, ggf. farbige Kohäsivbinde.</li>
</ul>

<h3>8. Immunstatus, Medikamente, Lebensalter, Weitere <span class="seite">S. 24–27</span></h3>
<ul>
  <li><b>Immunstatus:</b> angeborene/erworbene Defekte, alters-, therapie- oder krankheitsbedingte Schwäche → unzureichende Immunantwort → schlecht beherrschbare Infektionen. Jede Krankheit/Medikation, die das Immunsystem schwächt, kann die Wundheilung zum Stillstand bringen.</li>
  <li><b>Medikamente:</b> Immunsuppressiva, Zytostatika, Glucocorticoide/Kortikosteroide, NSAR, Antikoagulantien (Marcumar, Heparin), Diuretika, Barbiturate, Antibiotika. Immunsuppressiva → Wundinfektionen; Zytostatika hemmen Zellteilung, v. a. Granulationsgewebe; Glucocorticoide hemmen Zellproliferation und Kollagensynthese in allen Phasen (systemisch ausgeprägt; topisch teils schmerzlindernd/unterstützend); NSAR beeinflussen die Entzündungsantwort, Langzeitgabe → Zellteilung und Zugfestigkeit ↓. Medikationsplan im Blick; Absetzen nicht unabdingbarer Mittel ärztlich anregen.</li>
  <li><b>Lebensalter:</b> Zellteilungsrate, Hautelastizität, Kollagenerneuerung ↓; dünne, trockene Haut; Multimorbidität → Gefäßsituation ↓; nicht beeinflussbar, aber gesunder Lebensstil wirkt positiv.</li>
  <li><b>Weitere:</b> Durchblutungsstörungen; alles, was O₂-Sättigung senkt (Lungenschäden, niedriger Blutdruck); <b>Seneszenz</b> (<span class="hand-inline">handschr.: Überalterung der Zellen</span>) v. a. der Fibroblasten; <b>erhöhte Proteaseaktivität (EPA)</b> stimuliert Entzündung weiter; Schlafstörungen; fehlende soziale Kontakte; Haustiere (positiv, aber Infektionsgefahr bei fehlender Hygiene, z. B. Wunde lecken, nicht entwurmt); maligne/konsumierende Erkrankungen → oft nicht heilende Wunden; Qualität von Beratung und Schulung.</li>
</ul>

<h3>9. Lokale Einflussfaktoren <span class="seite">S. 27–29</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Faktor</th><th>Wirkung (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Entzündung</td><td>Startschuss der Heilung in der Exsudationsphase; nicht gleich Infektion (lokal, kein Eiter, keine hohe Keimzahl; Mehrdurchblutung, mehr Nährstoffe/O₂/Abwehrzellen). Bei chronischen Wunden übersteigert → proteolytische Enzyme (Elastase, Plasmin) zerstören extrazelluläre Matrix, deaktivieren Wachstumsfaktoren, erhöhen Fibroblastenseneszenz → Stagnation.</td></tr>
    <tr><td>Infektion</td><td>= Eindringen pathogener Mikroorganismen mit Besiedlung und Vermehrung. Bekämpfung hat Vorrang, Stoffwechsel ↑ → Nährstoffe, Flüssigkeit, O₂ fehlen für die Heilung → Verzögerung bis Stagnation.</td></tr>
    <tr><td>Scherkräfte, Druck</td><td>Ursache von Wunden (Dekubitus); Verschiebung von Hautschichten (Fortbewegung, zu straffer Kompressionsverband) → Überdehnung der Kapillaren, Minderdurchblutung; bei Älteren Abreißen von Kapillaren. Bei DFS und Dekubitus ist Druckentlastung ausschlaggebend.</td></tr>
    <tr><td>Fremdkörper</td><td>Jeder Fremdkörper behindert die Wundheilung (Verbandreste, Salbenreste, Schmutz, Metallimplantate): Unterversorgung, Abflusshindernis für Exsudat, Granulome, Abszesse, Fisteln, Entzündung.</td></tr>
  </tbody>
</table></div>
<p class="hand"><b>Handschriftliche Zusatznotizen</b> (nicht im Druck, nicht geprüft): Wundränder arteriell „wie ausgestanzt“, venös „nicht scharf begrenzt“; Biofilm milchig, schleimig, glänzend (S. 28) · Jodsalbe, Octenisept („zelltoxisch“), Silber jeweils max. 14 d (S. 28) · Alginat auf feuchte Nekrosen, viel Flüssigkeit (S. 27) · Kompression: Langzug = hoher Arbeitsdruck, geringer Ruhedruck; Kurzzug = hoher Ruhedruck, geringer Arbeitsdruck (S. 31) · „Pflegefachperson statt Pflegefachkraft“, „Zugehörige und Angehörige“ (S. 13) · Cleopatra-Ölbad: Milch, Öl (Oliven/Mandel) + Prise Salz (S. 29).</p>
<p class="merke"><b>Zusammenfassung (S. 29):</b> Wundheilung kann in allen Phasen durch allgemeine und lokale Faktoren gestört oder zur Stagnation gebracht werden. Erst erkennen, welche Faktoren beteiligt sind – dann gezielt unterstützende Maßnahmen ergreifen.</p>

<script>/* themen/ernaehrung.js */
/*
 * Thema: Expertenstandard Ernährungsmanagement zur Sicherung und Förderung der oralen Ernährung in der Pflege
 * Quelle: murimed-Lernheft Expertenstandard Ernährungsmanagement, Modul II (Seitenangaben beziehen sich auf das Heft).
 * Inhalte übernommen aus "Zusammenfassung_Expertenstandard_Ernaehrungsmanagement.pdf" und
 * "Lernkarten_Expertenstandard_Ernaehrungsmanagement.pdf".
 *
 * Quiz-Format: bei "o" (Optionen) steht die RICHTIGE Antwort immer an erster
 * Stelle; die App mischt die Reihenfolge beim Anzeigen.
 * "h: true" = Inhalt stammt (teilweise) nur aus handschriftlichen Notizen im Heft.
 * Das Heft enthält keine handschriftlichen Notizen oder Prüfungsmarkierungen,
 * daher hier weder "h: true" noch ★.
 */
Lernapp.thema({
  id: "ernaehrung",
  titel: "Expertenstandard Ernährungsmanagement",
  kurz: "Ernährung",
  quelle: "murimed-Lernheft Expertenstandard Ernährungsmanagement, Modul II",
  hinweis:
    "Quelle ist ausschließlich das Lernheft; Seitenzahlen in Klammern. Das Heft enthält keine handschriftlichen Notizen oder Prüfungsmarkierungen, daher keine ★. Die im Heft zitierten Primärquellen (v. a. DNQP 2017) wurden nicht separat geprüft.",

  karten: [
    { k: "Grundlagen", f: "Warum ist Ernährung ein Grundbedürfnis?",
      a: "Bedürfnis = körperlicher oder geistiger Mangelzustand. Nahrung und Trinken gehören zu den primären Bedürfnissen (Selbst- und Arterhaltung). Im Bedürfnis-„Turm“ sind Hunger und Durst das Fundament – ohne sie keine höheren Stufen.", s: "S. 2" },
    { k: "Grundlagen", f: "Warum gibt es den Expertenstandard Ernährungsmanagement?",
      a: "Kranke und pflegebedürftige Menschen, die sich nicht selbst angemessen ernähren können, unterstützen; bei Risikopatienten führt fehlende Unterstützung schnell zu drastischen, existenzbedrohlichen Folgen. Erstellt, veröffentlicht und 2017 aktualisiert.", s: "S. 2–3" },
    { k: "Grundlagen", f: "Wie ist Mangelernährung definiert?",
      a: "In Anlehnung an die DGEM: ein anhaltendes Defizit an Energie und/oder Nährstoffen im Sinne einer negativen Bilanz zwischen Aufnahme und Bedarf, mit Konsequenzen für Ernährungszustand, physiologische Funktion und Gesundheitszustand. „Nahrung“ = Essen und Trinken.", s: "S. 4" },
    { k: "Grundlagen", f: "Ist jede Nahrungskarenz oder Gewichtsabnahme eine Mangelernährung?",
      a: "Nein. „Anhaltend“ bedeutet: nicht jede Nahrungskarenz führt zu Mangelernährung. Auch eine Gewichtsabnahme ist nicht grundlegend als Mangelernährung zu verstehen und nicht Teil der Definition.", s: "S. 4" },
    { k: "Grundlagen", f: "Welches Ziel verfolgt der Expertenstandard?",
      a: "Bei jedem Menschen mit pflegerischem Unterstützungsbedarf ist eine orale Nahrungsaufnahme entsprechend seinen Bedürfnissen und seinem Bedarf gesichert, und einer drohenden oder bestehenden Mangelernährung wird entgegengewirkt.", s: "S. 4" },
    { k: "Grundlagen", f: "Welche Rolle hat die Pflege bei enteraler/parenteraler Ernährung?",
      a: "Auch dann ist es Aufgabe der Pflege, eine orale Nahrungsaufnahme zu unterstützen, sofern dadurch kein Schaden entsteht. Reicht die orale Zufuhr nicht, ernährungstherapeutische Beratung/Behandlung durch Ernährungsfachkräfte/Ärzte.", s: "S. 4" },
    { k: "Grundlagen", f: "Für wen gilt der Expertenstandard – und für wen nicht?",
      a: "Zielgruppe: erwachsene pflegebedürftige Menschen, die ganz oder teilweise oral Nahrung/Flüssigkeit aufnehmen können; Angehörige (Information, Beratung, Anleitung).\nNicht: Säuglinge, Kleinkinder, Jugendliche; spezielles Ernährungsmanagement z. B. bei Diabetes oder Anorexia nervosa.", s: "S. 4–5" },
    { k: "Grundlagen", f: "An wen richtet sich der Standard? Welche Rolle hat die Pflege?",
      a: "An Pflegefachkräfte in Krankenhaus, stationärer Rehabilitation/Altenhilfe und ambulanter Versorgung. Pflegefachkräfte haben die Schlüsselrolle im multidisziplinären Team (Nähe zu den Betroffenen, Einblick in Risiken und Ressourcen).", s: "S. 5" },
    { k: "Grundlagen", f: "Welche Umsetzungsvoraussetzungen nennt der Standard?",
      a: "Unzureichende Unterstützung beruht v. a. auf Zeitmangel, Mangel an qualifiziertem Personal und häufigem Personalwechsel → angemessene Personal- und Zeitplanung; personenorientierte Organisation (z. B. Primary Nursing) für Kontinuität.", s: "S. 5" },
    { k: "Grundlagen", f: "Wer gehört zum interdisziplinären Team?",
      a: "Küchenpersonal, Ernährungsfachkräfte (Diätassistenten), Ärzte oder Zahnärzte, Logopäden, Ergotherapeuten, hauswirtschaftliche Fachkräfte. Zuständigkeiten zu Beginn in einer multiprofessionell geltenden Verfahrensregelung festlegen.", s: "S. 5–6" },
    { k: "Aufbau", f: "Nenne die sechs Phasen des Expertenstandards.",
      a: "1. Einschätzung des Ernährungszustandes\n2. Kooperation mit anderen Berufsgruppen\n3. Maßnahmenplanung\n4. umfassende, fachgerechte Unterstützung\n5. Information, Beratung und Anleitung\n6. Evaluation", s: "S. 6" },
    { k: "Aufbau", f: "Struktur-, Prozess- und Ergebniskriterien?",
      a: "Struktur (S): notwendige Voraussetzungen – Was muss die Einrichtung vorhalten, was muss die Pflegefachkraft wissen/können?\nProzess (P): notwendige Handlungen – Was muss wann wie getan werden?\nErgebnis (E): Was muss vorliegen, um die Phase abzuschließen?", s: "S. 6" },
    { k: "Phase 1", f: "Was fordern S1a, S1b, P1 und E1?",
      a: "S1a: Kompetenz zu Screening und vertieftem Assessment · S1b: Einrichtung stellt Instrumente/Hilfsmittel zur Einschätzung und Dokumentation · P1: Screening zu Beginn, bei akuten Veränderungen, in festzulegenden Abständen; bei Anzeichen vertieftes Assessment · E1: aktuelles Screening für alle, Assessment bei Anzeichen.", s: "S. 7–8" },
    { k: "Phase 1", f: "Screening vs. vertieftes Assessment?",
      a: "1. Screening: kurze, leicht durchführbare Erhebung zur frühzeitigen Identifikation gefährdeter/betroffener Menschen.\n2. Vertieftes Assessment: tiefergehende Einschätzung der Ernährungssituation und beeinflussender Faktoren, um Maßnahmen zu planen.", s: "S. 8–9" },
    { k: "Phase 1", f: "Wann wird gescreent, wann ein Assessment durchgeführt?",
      a: "Screening: zu Beginn des pflegerischen Auftrags, bei akuten Veränderungen, in individuell festzulegenden Abständen – in der Langzeitpflege ohne Anzeichen mind. alle drei Monate.\nAssessment: nach jedem auffälligen Screening.", s: "S. 9, 14" },
    { k: "Phase 1", f: "Welches Assessmentinstrument empfiehlt die Expertengruppe?",
      a: "Derzeit keines. Der erste Teil des PEMU (Pflegerische Erfassung von Mangelernährung und deren Ursachen) enthält hilfreiche, in der Langzeitpflege praxistaugliche Kriterien. Screening sollte in die Pflegeanamnese passen (keine Doppeldokumentation).", s: "S. 9" },
    { k: "Phase 1", f: "Welche Hilfsmittel und Besonderheiten gelten beim Wiegen?",
      a: "Hilfsmittel zur Bestimmung von Gewicht und Körpergröße vorhalten; ambulant Beratung intensivieren, mitgebrachte Waagen hygienisch einsetzen, Genauigkeit beachten. Auf Wiegen verzichten, wenn es für die Person eine zu große Belastung ist – dann andere Anzeichen beachten.", s: "S. 9" },
    { k: "Phase 1", f: "Wie aussagekräftig sind BMI und Gewicht?",
      a: "Einzeldaten nicht überbewerten, immer in Relation sehen. Auch bei hohem BMI oder Übergewicht kann Mangelernährung drohen oder bestehen. Ein Gewichtsverlauf ist meist aussagekräftiger als eine bloße BMI-Berechnung.", s: "S. 10" },
    { k: "Phase 1", f: "Worauf prüft das Screening?",
      a: "Hinweise auf\n• möglichen Nahrungs- und Flüssigkeitsmangel,\n• auffällig geringe Ess- und Trinkmengen,\n• erhöhten Energie-, Nährstoff- und Flüssigkeitsbedarf bzw. entsprechende Verluste.", s: "S. 10" },
    { k: "Phase 1", f: "Anzeichen für Nahrungs- und Flüssigkeitsmangel?",
      a: "Unbeabsichtigter Gewichtsverlust (z. B. 5 % in 1–3 Monaten oder 10 % in 6 Monaten), subjektiver Eindruck; weit gewordene Kleidung, tief liegende Augen, plötzliche Verwirrtheit, konzentrierter Urin.", s: "S. 10" },
    { k: "Phase 1", f: "Ab welchem BMI ist ein Nahrungsmangel wahrscheinlich?",
      a: "Über 64-Jährige: BMI < 20 kg/m² → Nahrungsmangel wahrscheinlich.\nUnter 65-Jährige: erst ab BMI 18,5 kg/m² wird Mangelernährung angenommen.", s: "S. 10" },
    { k: "Phase 1", f: "Was gilt als auffällig geringe Ess- und Trinkmenge?",
      a: "Hinweise von Betroffenen/Angehörigen: Speisen/Getränke über mehrere Tage nicht oder nicht vollständig verzehrt; auffällig große Essensreste oder weniger als 100 ml der angebotenen Getränke am Tag. Ursachen: krankheits-, therapie-, altersbedingt, psychosozial, umgebungsbedingt.", s: "S. 10" },
    { k: "Phase 1", f: "Wann ist der Bedarf erhöht?",
      a: "Schwere akute/chronische Erkrankungen, Fieber, offene Wunden (Dekubitus, Ulcus cruris), verstärkte Mobilität/Hyperaktivität (Demenz, Stress). Flüssigkeit zusätzlich: stark geheizte Räume, Sommerhitze, unzweckmäßige Kleidung. Absorptions-/Digestionsstörung, starker Blutverlust.", s: "S. 11" },
    { k: "Phase 1", f: "Besondere Risiken in der ambulanten Pflege?",
      a: "Mangelnde Unterstützung im Haushalt/Alltag; eingeschränkte Lebensmittelversorgung (Finanzen, wenig Einkaufsmöglichkeiten, Kostformen); eingeschränkte selbstständige Lebensführung (Besorgung, Zubereitung); Einschränkungen beim Essen und Trinken; soziale Isolation, Einsamkeit, Depression.", s: "S. 11" },
    { k: "Phase 1", f: "Besondere Anzeichen in der stationären Versorgung?",
      a: "Umgebung (Unruhe bei den Mahlzeiten, störende Bewohner); nicht geäußerte Bedürfnisse oder Gewohnheiten; Zurückhaltung beim Einfordern von Unterstützung oder bei der Ablehnung der Gemeinschaftsverpflegung.", s: "S. 11" },
    { k: "Phase 1", f: "Welche Instrumente helfen im vertieften Assessment?",
      a: "Einfache Ess- und Trinkprotokolle (Datum, Uhrzeit, Art der Mahlzeit, angebotene und verzehrte Menge, Art der Getränke); grobe Mengenerfassung mit Tellerdiagrammen (alles, Hälfte, Viertel, nichts); Erfassung über mehrere Tage (ca. 3–5).", s: "S. 12" },
    { k: "Phase 1", f: "Körperlich und kognitiv bedingte Beeinträchtigungen (Assessment)?",
      a: "Kognitive Überforderung (z. B. Demenz), Funktionseinschränkung von Händen/Armen, schlechter Mundzustand, Zahnprobleme/Kauen, Schluckstörungen, Müdigkeit beim Essen (z. B. Medikamente), Seh- und Hörbeeinträchtigung.", s: "S. 12" },
    { k: "Phase 1", f: "Ursachen für fehlende Lust und Appetitlosigkeit?",
      a: "Psychische Belastung (Einsamkeit, Heimweh), akute Krankheit, Schmerzen, Bewegungsmangel, Wunsch nach verringerter Ausscheidung, reduziertes Hunger-/Durstgefühl, Medikamentennebenwirkungen, reduzierter Geruchs-/Geschmackssinn, fehlende Information, kulturelle/religiöse Gründe, Abneigungen, Angst vor Unverträglichkeit.", s: "S. 12–13" },
    { k: "Phase 1", f: "Welche Faktoren aus Umgebung und Angebot prüft das Assessment?",
      a: "Umgebung: unangenehme Ess-Situation (Geräusche, Gerüche, Tischnachbarn), inadäquate Essenszeiten, Hilfsmittel, Beziehung zu Versorgungspersonen.\nAngebot: Unzufriedenheit, unangemessene Konsistenz, nicht akzeptierte oder inadäquate Diät, Speisenplanung.", s: "S. 13" },
    { k: "Phase 1", f: "Gründe für erhöhten Bedarf bzw. Verlust (Assessment)?",
      a: "Energie/Nährstoffe: Krankheiten (Fieber, Infektionen, Tumor, offene Wunden, Dekubitus, Stress, Blutverlust, Erbrechen, Durchfälle), Hyperaktivität (ständiges Umherlaufen).\nFlüssigkeit: Krankheit, starkes Schwitzen, übermäßige Hitze.", s: "S. 13–14" },
    { k: "Phase 1", f: "Was folgt aus dem vertieften Assessment?",
      a: "Problembereiche so präzisieren, dass unter Berücksichtigung von Ressourcen Maßnahmen planbar sind; ggf. andere Berufsgruppen hinzuziehen (z. B. Kauen/Schlucken, Unverträglichkeiten). Auch Ergebnis „keine Mangelernährung“ möglich, z. B. bei medizinisch gewünschter Gewichtsreduktion.", s: "S. 14" },
    { k: "Phase 2", f: "Was fordern S2a, S2b, P2 und E2?",
      a: "S2a: Fachwissen zur Steuerung berufsgruppenübergreifender Maßnahmen und Kompetenz bei ethisch komplexen Fragen · S2b: multiprofessionelle Verfahrensregelung · P2: Koordination in enger Kooperation · E2: Maßnahmen koordiniert und ggf. ethisch begründet.", s: "S. 15" },
    { k: "Phase 2", f: "Wie geht man mit ethisch komplexen Fragen um?",
      a: "Z. B. Nahrungsverweigerung, künstliche Ernährung: Patientenverfügung, Vorsorgevollmacht kennen; Fallbesprechungen mit Betroffenen, Angehörigen/Betreuern, Berufsgruppen; Wille bzw. mutmaßlicher Wille berücksichtigen; ggf. Ethikkommission/Ethikexperte.", s: "S. 15–16" },
    { k: "Phase 2", f: "Was regelt die Verfahrensregelung Ernährungsmanagement?",
      a: "Zuständigkeiten (wer erfasst, führt durch, entscheidet über Experten, koordiniert) · Abläufe (Bereitstellung, Verabreichung, Trinknahrung, Anreicherung, Mahlzeitengestaltung, Unterstützung) · Autorisierung der Pflegefachkraft zur Initiierung und Koordination.", s: "S. 16" },
    { k: "Phase 2", f: "Wann sind welche Berufsgruppen hinzuzuziehen?",
      a: "Zahn-/Kieferprobleme: Zahnmediziner verpflichtend. Schluckstörungen: Logopäden (Schluckakt, Schlucktraining, Konsistenz). Selbstständige Nahrungsaufnahme üben: Ergotherapeuten. Beispiel Chorea Huntington: pürierte Kost, Logopädie, Abstimmung mit der Küche.", s: "S. 17" },
    { k: "Phase 2", f: "Was muss in Phase 2 dokumentiert werden?",
      a: "Maßnahmen nachvollziehbar; auch notwendige, aber abgelehnte Maßnahmen; Maßnahmen anderer Berufsgruppen; worauf nach ethischer Fallbesprechung verzichtet wurde – jeweils mit Begründung.", s: "S. 17" },
    { k: "Phase 3", f: "Was fordern S3a, S3b, P3 und E3?",
      a: "S3a: Kompetenz zur Planung individueller Mahlzeiten- und Interaktionsgestaltung · S3b: Konzept zur Ernährungsversorgung · P3: gemeinsame Planung mit Betroffenen/Angehörigen · E3: individueller Maßnahmenplan liegt vor.", s: "S. 18–19" },
    { k: "Phase 3", f: "Grundlage der individuellen Planung?",
      a: "Verknüpfung von Biographiearbeit, aktuellen Ernährungsgewohnheiten und Erkenntnissen aus dem vertieften Assessment; Vorlieben, Abneigungen, Ressourcen; Aushandlungsprozess mit Betroffenen/Angehörigen. Ambulant: Verpflegung sichern (z. B. Essen auf Rädern).", s: "S. 18" },
    { k: "Phase 3", f: "Was gehört in das Konzept zur Ernährungsversorgung?",
      a: "Kost- und Darreichungsformen, Verpflegungszeiten, Menübestellsystem, Tisch- und Esskultur, Essensverteilung; ungestörte Mahlzeiten; über drei Hauptmahlzeiten hinaus Zwischen- und Spätmahlzeiten sowie Getränke; kleinere Portionen als Ersatz prüfen.", s: "S. 18–19" },
    { k: "Phase 4", f: "Was fordern S4a, S4b, P4 und E4?",
      a: "S4a: Kompetenz zur Unterstützung inkl. Risikosituationen (z. B. Aspiration) · S4b: Personalausstattung und geeignete Räume · P4: Selbstbestimmung/Eigenaktivität fördern, motivierende Gestaltung · E4: umfassende Unterstützung, auch außerhalb der Essenszeiten.", s: "S. 19–20" },
    { k: "Phase 4", f: "Welcher Grundsatz gilt für die Unterstützung beim Essen?",
      a: "Eine selbstständigkeitserhaltende und selbstständigkeitsfördernde Unterstützung sollte immer das Ziel sein – nicht vollständige Übernahme, sondern Eigenständigkeit und Autonomie ermöglichen. Laienhelfer nur vertraut und angeleitet.", s: "S. 20" },
    { k: "Phase 4", f: "Was bedeutet „geschützte Essenszeiten“?",
      a: "Mahlzeiten so planen, dass vermeidbare Unterbrechungen und Störungen ausbleiben und keine sonstigen pflegerischen oder therapeutischen Maßnahmen stattfinden; dazu helle Räume, überschaubare Essplätze, Ambiente gegen Reizüberflutung, Platz für Gehhilfen.", s: "S. 20" },
    { k: "Phase 4", f: "Welche pflegerischen Unterstützungsmaßnahmen gibt es?",
      a: "Mundgerechte Zubereitung, Bereitstellung, Anleitung zu Hilfsmitteln, Impulse zum Beginnen/Weiteressen, Anleiten, Anreichen bis vollständiges Anreichen; Essen warmhalten; Mahlzeitendauer > 45 Minuten kann die Verzehrmenge steigern; Tischsitten und Rituale.", s: "S. 20–21" },
    { k: "Phase 5", f: "Was fordern S5, P5 und E5?",
      a: "S5: Informations-, Beratungs-, Anleitungskompetenz · P5: Information/Beratung zu Entstehung und Folgen der Mangelernährung und zu Möglichkeiten, ggf. Anleitung · E5: Betroffene/Angehörige informiert, beraten, ggf. angeleitet; Inhalte dokumentiert.", s: "S. 21–22" },
    { k: "Phase 5", f: "Warum ist Beratung ambulant besonders wichtig?",
      a: "Kein vollumfänglicher Pflegevertrag, Pflegefachkräfte nur zeitweise anwesend → Eigenverantwortung fördern; nachweisliche Information, Beratung und Schulung. Bei Bedarf differenzierte Ernährungsberatung durch Ernährungsfachkraft.", s: "S. 21–22" },
    { k: "Phase 6", f: "Was fordern S6, P6 und E6?",
      a: "S6: Kompetenz, Angemessenheit und Wirksamkeit zu beurteilen · P6: gemeinsame Überprüfung von Erfolg und Akzeptanz, ggf. Neueinschätzung · E6: keine Anzeichen für Mangelernährung, soweit durch orale Nahrungsaufnahme möglich.", s: "S. 22" },
    { k: "Phase 6", f: "Wovon hängt der Erfolg der Maßnahmen ab?",
      a: "Verzehrmengen werden beeinflusst durch angebotene Speisen, Tischgemeinschaft, aktuelle Ereignisse im Umfeld, nicht ausreichend behandelte Schmerzen, notwendige Medikation. Danach: weiterführen, neu einschätzen oder anpassen.", s: "S. 23" },
    { k: "Phase 6", f: "Welcher Grundsatz gilt bei Ablehnung von Nahrung?",
      a: "Selbstbestimmung und Autonomie haben stets Vorrang vor Bedarfszielsetzung. Z. B. palliativ: Ablehnung akzeptieren, Ruhe und Symptomlinderung haben Priorität. Grenzen der oralen Ernährung erkennen, ggf. enterale/parenterale Zufuhr anregen.", s: "S. 22–23" },
    { k: "Zusammenfassung", f: "Was ist die Kernaussage der Zusammenfassung?",
      a: "Nur wenn die Pflegekraft die Ursachen für Verhalten und Wünsche kennt, kann sie Maßnahmen so gestalten, dass die Versorgung als bedarfsgerecht und angenehm empfunden wird. Druck und Zeitdruck beim Essen können zu Gewalt in der Pflege führen.", s: "S. 24" },
    { k: "Zusammenfassung", f: "Wie wird der Standard in der Einrichtung eingeführt?",
      a: "Auseinandersetzung auf Managementebene · Verständnis der Zielsetzung · Reflexion von Ressourcen und Maßnahmen · Anpassung an die Einrichtung (Qualitätszirkel) · Implementierungsschritte mit Terminen · Information und Schulung der Mitarbeitenden.", s: "S. 24–25" },
    { k: "Prozess", f: "Beschreibe den Prozessablauf Ernährungsmanagement.",
      a: "Versorgungsbeginn/akute Veränderung → Screening → Anzeichen? (nein: keine weiteren Maßnahmen) → vertiefendes Assessment → Anzeichen? → Planung/Koordination → Umsetzung inkl. Beratung → Evaluation → erfolgreich? (nein: Anpassung) → fortführen oder Abschluss.", s: "S. 26" },
    { k: "Glossar", f: "Enterale vs. parenterale Ernährung?",
      a: "Enteral: Zufuhr per Sonde oder Enterostoma über den Magen-Darm-Trakt; physiologisch, sicher, ökonomisch – der parenteralen vorzuziehen.\nParenteral: Wasser, Nährstoffe, Vitamine, Mineralstoffe, Spurenelemente intravenös; parallel oder abwechselnd mit enteraler möglich.", s: "S. 27" },
    { k: "Glossar", f: "Was sind Expertenstandards und Assessments?",
      a: "Expertenstandards: Instrumente zur Sicherung und Weiterentwicklung der Pflegequalität; verbindlich für alle stationären Einrichtungen und ambulanten Dienste (Heft zitiert § 113 Abs. 1 SGB XI); regelmäßig angepasst.\nAssessment: standardisierte Verfahren und Instrumente für medizinische, funktionale, psychosoziale Fragen.", s: "S. 27" }
  ],

  quiz: [

    { f: "Welche Aussagen zur Definition der Mangelernährung treffen laut Heft zu?",

    { f: "Welches Ziel verfolgt der Expertenstandard Ernährungsmanagement?",

<h3>1. Hintergrund, Definition und Ziel <span class="seite">S. 2–4</span></h3>
<ul>
  <li><b>Grundbedürfnis:</b> Bedürfnis = körperlicher oder geistiger Mangelzustand. Primäre Bedürfnisse (Sauerstoff, Schlaf, Sexualität, Wärme, v. a. Nahrung und Trinken) dienen der Selbst- und Arterhaltung. Im Bedürfnis-„Turm“ sind Hunger und Durst das Fundament (S. 2).</li>
  <li>Mangelernährung führt zu gesundheitlichen Risiken, verhindert/verzögert Heilung und kann Pflegebedürftigkeit verstärken; bei Risikopatienten drohen schnell existenzbedrohliche Folgen (S. 2).</li>
  <li>Expertenstandard erstellt, veröffentlicht und <b>2017 aktualisiert</b>; beschreibt frühzeitige Erfassung/Bewertung, Ursachen und Planung einer bedürfnisorientierten, bedarfsgerechten Ernährung als strukturierten Ablauf (S. 3).</li>
</ul>
<p class="merke"><b>Mangelernährung</b> (in Anlehnung an die DGEM): ein <b>anhaltendes Defizit an Energie und/oder Nährstoffen</b> im Sinne einer negativen Bilanz zwischen Aufnahme und Bedarf – mit Konsequenzen und Einbußen für Ernährungszustand, physiologische Funktion und Gesundheitszustand. „Nahrung“ = Essen und Trinken. Nicht jede Nahrungskarenz ist Mangelernährung; eine Gewichtsabnahme ist nicht Teil der Definition (S. 4).</p>
<p class="merke"><b>Ziel:</b> Bei jedem Menschen mit pflegerischem Unterstützungsbedarf ist eine orale Nahrungsaufnahme entsprechend seinen <b>Bedürfnissen und seinem Bedarf</b> gesichert, und einer drohenden oder bestehenden Mangelernährung wird entgegengewirkt (S. 4).</p>
<ul>
  <li>Essen und Trinken sind wichtig für Lebensqualität sowie soziale und kulturelle Identität. Reicht die orale Zufuhr nicht: ernährungstherapeutische Beratung/Behandlung durch Ernährungsfachkräfte/Ärzte. Auch bei enteraler/parenteraler Ernährung unterstützt die Pflege die <b>orale</b> Nahrungsaufnahme, sofern kein Schaden entsteht (S. 4).</li>
</ul>

<h3>3. Aufbau: sechs Phasen mit S-, P-, E-Kriterien <span class="seite">S. 6–7</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Phase</th><th>Struktur (S)</th><th>Prozess (P)</th><th>Ergebnis (E)</th></tr></thead>
  <tbody>
    <tr><td>1 Einschätzung des Ernährungszustandes</td><td>S1a Kompetenz zu Screening und vertieftem Assessment · S1b Instrumente/Hilfsmittel zur Einschätzung und Dokumentation</td><td>Screening zu Beginn, bei akuten Veränderungen, in festzulegenden Abständen; bei Anzeichen vertieftes Assessment</td><td>aktuelles Screening für alle; bei Anzeichen vertieftes Assessment erfolgt</td></tr>
    <tr><td>2 Kooperation mit anderen Berufsgruppen</td><td>S2a Fachwissen zur Steuerung berufsgruppenübergreifender Maßnahmen, Kompetenz bei ethisch komplexen Fragen · S2b multiprofessionelle Verfahrensregelung</td><td>Koordination auf Grundlage der Verfahrensregelung in enger Kooperation</td><td>Maßnahmen koordiniert und ggf. ethisch begründet</td></tr>

    <tr><td>4 umfassende, fachgerechte Unterstützung</td><td>S4a Kompetenz zur Unterstützung inkl. Risikosituationen · S4b Personalausstattung, geeignete Räume</td><td>Selbstbestimmung/Eigenaktivität fördern, motivierende Interaktions-/Umgebungsgestaltung; besondere Gesundheitsprobleme berücksichtigen</td><td>umfassende Unterstützung während und außerhalb der Essenszeiten; Umgebung bedürfnis-/bedarfsgerecht</td></tr>
    <tr><td>5 Information, Beratung, Anleitung</td><td>S5 Informations-, Beratungs-, Anleitungskompetenz</td><td>Information/Beratung zu Entstehung, Folgen, Möglichkeiten; ggf. Anleitung</td><td>Betroffene/Angehörige informiert, beraten, ggf. angeleitet</td></tr>
    <tr><td>6 Evaluation</td><td>S6 Kompetenz, Angemessenheit und Wirksamkeit zu beurteilen</td><td>gemeinsame Überprüfung von Erfolg und Akzeptanz; ggf. Neueinschätzung, Planänderung</td><td>keine Anzeichen für Mangelernährung, soweit durch orale Nahrungsaufnahme möglich</td></tr>
  </tbody>
</table></div>
<p><b>Struktur</b> = Voraussetzungen (Was muss die Einrichtung vorhalten, was muss die Pflegefachkraft wissen/können?) · <b>Prozess</b> = Handlungen (Was muss wann wie getan werden?) · <b>Ergebnis</b> = Was muss vorliegen, um die Phase abzuschließen? (S. 6)</p>

<h3>4. Phase 1 – Einschätzung des Ernährungszustandes <span class="seite">S. 8–14</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Schritt</th><th>Instrument / Ziel</th><th>Zeitpunkt</th></tr></thead>
  <tbody>
    <tr><td>1 Screening</td><td>kurze, leicht durchführbare Erhebung zur frühzeitigen Identifikation gefährdeter oder betroffener Menschen; systematische Ermittlung von Anzeichen</td><td>zu Beginn des pflegerischen Auftrags · bei akuten Veränderungen · in individuell festzulegenden Abständen; Langzeitpflege ohne Anzeichen mind. <b>alle 3 Monate</b> (S. 14)</td></tr>
    <tr><td>2 vertieftes Assessment</td><td>tiefergehende Einschätzung der Ernährungssituation und beeinflussender Faktoren, um Maßnahmen zu planen; Ursachen erfassen</td><td>nach jedem auffälligen Screening</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Instrumente (S1b):</b> derzeit empfiehlt die Expertengruppe <b>kein</b> Assessmentinstrument; Teil 1 des <b>PEMU</b> (Pflegerische Erfassung von Mangelernährung und deren Ursachen) bewährt in der Langzeitpflege. Screening in die Pflegeanamnese integrieren (keine Doppeldokumentation). Hilfsmittel für Gewicht und Größe vorhalten; ambulant mitgebrachte Waagen hygienisch und genau; auf Wiegen verzichten, wenn es zu belastend ist (S. 9).</li>
  <li><b>BMI/Gewicht:</b> Einzeldaten nicht überbewerten; auch bei hohem BMI/Übergewicht Mangelernährung möglich; <b>Gewichtsverlauf</b> meist aussagekräftiger als BMI (S. 10).</li>
  <li><b>Screening prüft:</b> möglichen Nahrungs-/Flüssigkeitsmangel · auffällig geringe Ess- und Trinkmengen · erhöhten Bedarf bzw. Verluste (S. 10).</li>
</ul>
<div class="tabelle"><table>
  <thead><tr><th>Screening-Bereich</th><th>Anzeichen (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Nahrungs-/Flüssigkeitsmangel</td><td>unbeabsichtigter Gewichtsverlust (z. B. <b>5 % in 1–3 Monaten</b> oder <b>10 % in 6 Monaten</b>), subjektiver Eindruck; weit gewordene Kleidung, tief liegende Augen, plötzliche Verwirrtheit, konzentrierter Urin. BMI <b>&lt; 20 kg/m²</b> bei über 64-Jährigen → Mangel wahrscheinlich; unter 65 Jahren erst ab <b>18,5 kg/m²</b></td></tr>
    <tr><td>geringe Ess-/Trinkmenge</td><td>Speisen/Getränke über mehrere Tage nicht oder unvollständig verzehrt; große Essensreste; weniger als <b>100 ml</b> der angebotenen Getränke pro Tag; Ursachen krankheits-, therapie-, altersbedingt, psychosozial, umgebungsbedingt</td></tr>
    <tr><td>erhöhter Bedarf</td><td>schwere akute/chronische Erkrankungen, Fieber, offene Wunden (Dekubitus, Ulcus cruris), Hyperaktivität (Demenz, Stress); Flüssigkeit: geheizte Räume, Sommerhitze, Kleidung; Absorptions-/Digestionsstörung, starker Blutverlust</td></tr>
    <tr><td>ambulant zusätzlich</td><td>fehlende Unterstützung im Haushalt; eingeschränkte Lebensmittelversorgung (Finanzen, Einkauf, Kostformen) und Lebensführung (Besorgung, Zubereitung); Einschränkungen beim Essen/Trinken; soziale Isolation, Einsamkeit, Depression</td></tr>
    <tr><td>stationär zusätzlich</td><td>Unruhe bei Mahlzeiten, störende Bewohner; nicht geäußerte Bedürfnisse/Gewohnheiten; Zurückhaltung beim Einfordern von Unterstützung oder bei Ablehnung der Gemeinschaftsverpflegung</td></tr>
  </tbody>
</table></div>
<p><b>Vertieftes Assessment</b> (S. 12–14): <b>Ess- und Trinkprotokolle</b> (Datum, Uhrzeit, Art der Mahlzeit, angebotene/verzehrte Menge, Getränke), grobe Mengenerfassung per <b>Tellerdiagramm</b> (alles · Hälfte · Viertel · nichts), über ca. <b>3–5 Tage</b>. Ursachenanalyse:</p>
<div class="tabelle"><table>
  <thead><tr><th>Faktorengruppe</th><th>Beispiele (Heft)</th></tr></thead>
  <tbody>
    <tr><td>körperlich/kognitiv</td><td>kognitive Überforderung (Demenz), Funktionseinschränkung Hände/Arme, schlechter Mundzustand, Zahnprobleme/Kauen, Schluckstörungen, Müdigkeit (Medikamente, Schlaf-Wach-Rhythmus), Seh-/Hörbeeinträchtigung</td></tr>
    <tr><td>fehlende Lust, kein Appetit, Ablehnung</td><td>psychische Belastung (Einsamkeit, Heimweh), akute Krankheit, Schmerzen, Immobilität, Wunsch nach verringerter Ausscheidung, reduziertes Hunger-/Durstgefühl, Medikamentennebenwirkungen, reduzierter Geruchs-/Geschmackssinn, fehlende Information, kulturelle/religiöse Gründe, Abneigungen, Angst vor Unverträglichkeiten</td></tr>
    <tr><td>Umgebung</td><td>unangenehme Ess-Situation (Geräusche, Gerüche, Tischnachbarn), inadäquate Essenszeiten, Hilfsmittelangebot, Beziehung zu Versorgungspersonen</td></tr>
    <tr><td>Angebot</td><td>Unzufriedenheit mit dem Angebot, unangemessene Konsistenz, nicht akzeptierte oder inadäquate Diät, Speisenplanung</td></tr>
    <tr><td>erhöhter Bedarf/Verlust</td><td>Energie/Nährstoffe: Fieber, Infektionen, Tumor, offene Wunden, Dekubitus, Stress, Blutverlust, Erbrechen, Durchfälle, Hyperaktivität · Flüssigkeit: Krankheit, starkes Schwitzen, Hitze</td></tr>
  </tbody>
</table></div>
<p>Problembereiche so präzisieren, dass Maßnahmen unter Berücksichtigung von Ressourcen planbar sind; bei Bedarf andere Berufsgruppen (z. B. Kauen/Schlucken, Unverträglichkeiten). Das Assessment kann trotz auffälligen Screenings „keine Mangelernährung“ ergeben, z. B. bei medizinisch gewünschter Gewichtsreduktion (S. 14).</p>

<h3>5. Phase 2 – Kooperation mit anderen Berufsgruppen <span class="seite">S. 15–17</span></h3>
<ul>
  <li>Pflegefachkraft trägt große Verantwortung für Koordination und Planung; biographische, religiöse, kulturelle Einflüsse beachten; Zwiespalt zwischen objektivem Bedarf und Befugnissen der Betroffenen sensibel aushandeln; leitet ernährungsmedizinische, diagnostische, therapeutische Maßnahmen rechtzeitig ein (S. 15).</li>
  <li><b>Ethisch komplexe Fragen</b> (Nahrungsverweigerung, künstliche Ernährung): Patientenverfügung, Vorsorgevollmacht kennen; <b>Fallbesprechungen</b> mit Betroffenen, Angehörigen/Betreuern, Berufsgruppen; Wille bzw. <b>mutmaßlicher Wille</b> (z. B. fortgeschrittene Demenz, Koma); ggf. Ethikkommission/-experte – in der Altenhilfe extrem selten (S. 15–16).</li>
  <li><b>Verfahrensregelung (S2b)</b> (S. 16): <b>Zuständigkeiten</b> (wer erfasst/bewertet, führt durch, entscheidet über Ernährungsexperten, koordiniert) · <b>Abläufe</b> (Bereitstellung, Lieferung, Angebot/Verabreichung von Speisen, Getränken, Trinknahrung, Anreicherung, Mahlzeitengestaltung, Unterstützung) · <b>Autorisierung</b> der Pflegefachkraft zur Initiierung und Koordination (Experten, Fallbesprechungen, Hilfskräfte).</li>
  <li><b>Berufsgruppen</b> (S. 17): Zahn-/Kieferprobleme → Zahnmediziner <b>verpflichtend</b>; Schluckstörungen → Logopäden (Schluckakt, Schlucktraining, Konsistenz); selbstständige Nahrungsaufnahme üben → Ergotherapeuten. <i>Beispiel:</i> Patientin mit Chorea Huntington, pürierte Kost, wöchentliche Logopädie – Küche stellt am Therapietag passende Kostform, Koordination durch Pflege.</li>
  <li><b>E2/Dokumentation</b> (S. 17): bei ethisch schwierigen Situationen ggf. formale Entscheidungshilfe für/gegen künstliche Ernährung; Maßnahmen nachvollziehbar dokumentieren – auch <b>abgelehnte</b> Maßnahmen, Maßnahmen anderer Berufsgruppen und Verzicht nach Fallbesprechung, jeweils mit Begründung.</li>
</ul>

<h3>6. Phase 3 – Maßnahmenplanung <span class="seite">S. 18–19</span></h3>
<ul>
  <li><b>S3a:</b> Planung verknüpft <b>Biographiearbeit</b>, aktuelle Ernährungsgewohnheiten und Assessment-Erkenntnisse; Vorlieben, Abneigungen, Ressourcen; Aushandlungsprozess mit Betroffenen/Angehörigen. Ambulant: Verpflegung sicherstellen/organisieren (z. B. Essen auf Rädern, Haushaltshilfe), Kontakt zu Anbietern (S. 18).</li>
  <li><b>S3b – Konzept zur Ernährungsversorgung:</b> Kost- und Darreichungsformen, Verpflegungszeiten, Menübestellsystem, Tisch- und Esskultur, Essensverteilung; ungestörte Mahlzeiten; über <b>drei Hauptmahlzeiten hinaus</b> Zwischen- und Spätmahlzeiten sowie Getränke; Demenz: Tischgemeinschaft, angepasstes Geschirr/Besteck ausprobieren; Anforderungen an Catering; kleinere/halbe Portionen als Ersatz prüfen (S. 18–19).</li>
  <li><b>P3/E3:</b> individueller Maßnahmenplan gemeinsam mit den Betroffenen; erkennen, ob Anpassung nötig ist (Energie-/Eiweißanreicherung, Konsistenzveränderung) und welche Berufsgruppen (z. B. Ärzte für Zusatznahrung) einzubeziehen sind (S. 19).</li>
</ul>

<h3>7. Phase 4 – Umfassende, fachgerechte Unterstützung <span class="seite">S. 19–21</span></h3>
<ul>
  <li><b>S4a:</b> appetitfördernde/-erhaltende Strategien; Methoden bei kognitiven Beeinträchtigungen, eingeschränkter Arm-/Handfunktion, Schluckstörungen; Umgang mit Gefahren wie <b>Aspiration</b> (S. 19–20).</li>
  <li><b>S4b:</b> angemessene Personalausstattung (auch angeleitete ehrenamtliche Laienhelfer); Menschen mit Einschränkungen brauchen oft mehr Zeit (S. 20).</li>
</ul>
<p class="merke"><b>Eine selbstständigkeitserhaltende und selbstständigkeitsfördernde Unterstützung sollte immer das Ziel aller pflegerischen Bestrebungen sein</b> (S. 20).</p>
<ul>
  <li><b>Geschützte Essenszeiten:</b> vermeidbare Unterbrechungen/Störungen vermeiden, keine sonstigen pflegerischen oder therapeutischen Maßnahmen; helle Räume, überschaubare Essplätze, Ambiente gegen Reizüberflutung (Demenz), Abstellplätze für Gehhilfen/Rollstühle, flexible Tischgemeinschaften; ambulant: Beratung zur Umgebung (S. 20).</li>
  <li><b>Maßnahmen:</b> mundgerechte Zubereitung, Bereitstellung, Anleitung zu Hilfsmitteln, Impulse zum Beginnen/Weiteressen, Anleiten, Anreichen bis vollständiges Anreichen; Essen warmhalten; Mahlzeitendauer <b>&gt; 45 Minuten</b> kann Verzehrmenge steigern; Tischsitten und Rituale nach Gewohnheit (S. 20–21).</li>
</ul>

<h3>8. Phase 5 – Information, Beratung, Anleitung <span class="seite">S. 21–22</span></h3>
<p>Pflegefachkraft informiert und berät zu Entstehung und Folgen von Mangelernährung und Flüssigkeitsmangel sowie Möglichkeiten einer angemessenen Ernährung, leitet ggf. an. Ambulant besonders wichtig (kein vollumfänglicher Pflegevertrag, nur zeitweise Präsenz → Eigenverantwortung fördern). Inhalte, Verlauf, Ergebnisse (z. B. Zielvereinbarungen) dokumentieren; bei Bedarf Ernährungsfachkraft für differenzierte Beratung.</p>

<h3>9. Phase 6 – Evaluation <span class="seite">S. 22–23</span></h3>
<ul>
  <li><b>S6:</b> Erfolg, Angemessenheit, Wirksamkeit beurteilen; Grenzen der oralen Nahrungsaufnahme erkennen und ggf. enterale/parenterale Zufuhr in Absprache anregen; palliativ ethische Entscheidungen (Beendigung/Fortsetzung oraler Ernährung, künstliche Ernährung) (S. 22).</li>
  <li><b>P6:</b> gemeinsam in individuellen Abständen überprüfen (z. B. Gewichtsverlauf, wiederholte Erfassung der Ess-/Trinkgewohnheiten). Verzehrmengen beeinflusst durch angebotene Speisen, Tischgemeinschaft, Geschehnisse im Umfeld, unzureichend behandelte Schmerzen, Medikation → weiterführen, neu einschätzen oder anpassen (S. 22–23).</li>
  <li><b>E6:</b> keine Anzeichen für Mangelernährung, soweit durch orale Ernährung möglich; wird das Ziel wegen der Bedürfnisse der Person nicht erreicht, wird dies dokumentiert (S. 23).</li>
</ul>
<p class="merke"><b>Selbstbestimmung und Autonomie des Menschen haben stets Vorrang vor Bedarfszielsetzung</b> – z. B. Ablehnung von Nahrung in palliativen Situationen akzeptieren (S. 23).</p>

<h3>10. Zusammenfassung, Einführung, Prozessablauf <span class="seite">S. 24–26</span></h3>
<p class="merke"><b>Nur wenn die Pflegekraft die Ursachen für das Verhalten und/oder die Wünsche des betroffenen Menschen kennt, kann sie die Maßnahmen so gestalten, dass die Versorgung als bedarfsgerecht und angenehm empfunden wird</b> (S. 24).</p>
<ul>
  <li>Versorgung unter Zeitdruck oder Drängen kann zu Gewalt in der Pflege und Problemen in der Pflegebeziehung führen; Abhängigkeit beim Essen kann abwehrendes Verhalten auslösen; gewahrte Autonomie fördert Akzeptanz (S. 24).</li>
  <li><b>Einführung</b> (S. 24–25): Auseinandersetzung auf Managementebene (PDL/QB) · Verständnis der Zielsetzung · Reflexion von Ressourcen und Maßnahmen · Anpassung an die Einrichtung (Qualitätszirkel) · Implementierungsschritte mit verbindlicher Terminierung · Information/Schulung der Mitarbeitenden · interne/externe Schulungen.</li>
  <li><b>Prozessablauf</b> (S. 26): Versorgungsbeginn/akute Veränderung → Screening → Anzeichen? (nein → keine weiteren Maßnahmen) → vertiefendes Assessment (Ess-/Trinkprotokolle) → Anzeichen? → Planung/Koordination (Maßnahmenplan) → Umsetzung inkl. Information, Beratung, Schulung → Evaluation → erfolgreich? (nein → Anpassung) → fortführen? (ja → erneute Evaluation; nein → keine Anzeichen). Überprüfung in individuell festgelegten Abständen und bei akuten Veränderungen.</li>
</ul>

<h3>Glossar <span class="seite">S. 27</span></h3>
<div class="tabelle"><table>
  <tbody>
    <tr><td>Enterale Ernährung</td><td>Zufuhr per Sonde oder Enterostoma über den Gastrointestinaltrakt; physiologisch, sicher, ökonomisch – der parenteralen vorzuziehen</td></tr>
    <tr><td>Parenterale Ernährung</td><td>Wasser, Nährstoffe, Vitamine, Mineralstoffe, Spurenelemente intravenös; parallel oder abwechselnd mit enteraler möglich</td></tr>
    <tr><td>Assessment</td><td>standardisierte Verfahren, Methoden, Instrumente für medizinische, funktionale, psychosoziale Fragen</td></tr>
    <tr><td>Expertenstandards</td><td>Instrumente zur Sicherung und Weiterentwicklung der Pflegequalität; verbindlich für alle stationären Einrichtungen und ambulanten Dienste; regelmäßig angepasst (Heft zitiert § 113 Abs. 1 SGB XI)</td></tr>
    <tr><td>Chorea Huntington</td><td>neurodegenerative Erkrankung, meist Manifestation zwischen 30. und 50. Lebensjahr; Bewegungsstörungen, psychische Veränderungen, zunehmender Abbau intellektueller Fähigkeiten</td></tr>

<script>/* themen/schmerz.js */
/*
 * Thema: Schmerzmanagement in der Wundversorgung
 * Quelle: murimed-Lernheft Schmerzmanagement in der Wundversorgung, Modul II
 * (Seitenangaben beziehen sich auf das Heft).
 * Inhalte übernommen aus "Zusammenfassung_Schmerzmanagement_Wundversorgung.pdf" und
 * "Lernkarten_Schmerzmanagement_Wundversorgung.pdf".
 *
 * Quiz-Format: bei "o" (Optionen) steht die RICHTIGE Antwort immer an erster
 * Stelle; die App mischt die Reihenfolge beim Anzeigen.
 * "h: true" = Inhalt stammt (teilweise) nur aus handschriftlichen Notizen im Heft.
 */
Lernapp.thema({
  id: "schmerz",
  titel: "Schmerzmanagement in der Wundversorgung",
  kurz: "Schmerz",
  quelle: "murimed-Lernheft Schmerzmanagement in der Wundversorgung, Modul II",
  hinweis:
    "Quelle ist ausschließlich das Lernheft; Seitenzahlen in Klammern. ★ = im Heft handschriftlich als „Prüfungsfrage“ markiert. Handschriftliche Notizen sind als solche gekennzeichnet und nicht geprüft. Die im Heft zitierten Primärquellen (DNQP, Feichtner/Kössler u. a.) wurden nicht separat geprüft.",

  karten: [
    { k: "Grundlagen", f: "Wie definiert die IASP Schmerz?",
      a: "„Eine unangenehme sensorische und emotionale Erfahrung, die mit einer tatsächlichen oder potenziellen Gewebeschädigung verbunden ist oder einer solchen ähnelt.“", s: "S. 4" },
    { k: "Grundlagen", f: "Welche Anmerkungen ergänzen die IASP-Definition?",
      a: "Immer persönliche Erfahrung (bio-psycho-sozial) · Schmerz ≠ Nozizeption · Konzept durch Lebenserfahrung gelernt · Schmerzbericht respektieren · nachteilige Folgen möglich · Unfähigkeit zu kommunizieren schließt Schmerz nicht aus.", s: "S. 4" },
    { k: "Grundlagen", f: "Welche Bedeutung hat Schmerztherapie laut Vorwort?",
      a: "„Jede Schmerzerfahrung formt die nächste“ (DNQP) – Verantwortung bei jedem Verbandwechsel. Zugang zur Schmerztherapie ist ein menschliches Grundrecht (IPS/IASP 2010). Schmerz wirkt negativ auf die Wundheilung.", s: "S. 3" },
    { k: "Grundlagen", f: "Nenne die Komponenten der Schmerzempfindung.",
      a: "Sensorisch-diskriminativ (Ort, Intensität) · affektiv-motivational (Unangenehmheit) · kognitiv (Einstellung) · vegetativ (Blutdruck, Pupillen) · motorisch (Reflexe, Muskelverspannung).", s: "S. 5" },
    { k: "Entstehung", f: "Wie entsteht und wird Schmerz weitergeleitet?",
      a: "Nozizeptoren (polymodal) → elektrische Impulse → Rückenmark → Thalamus (Filter) → somatosensorischer Cortex (Was, Wo, Welche Art, Wie stark) und limbisches System (emotionale Bewertung).", s: "S. 5" },
    { k: "Entstehung", f: "Warum heißt der Thalamus „Tor des Bewusstseins“?",
      a: "Er entscheidet, welche (Schmerz-)Reize wahrgenommen werden (Gate-Control-Theorie, Melzack/Wall); Konzentration und Fokussierung entscheiden mit – Ablenkung kann die Wahrnehmung beeinflussen.", s: "S. 6" },
    { k: "Entstehung", f: "Deszendierende vs. segmentale Schmerzhemmung?",
      a: "Deszendierend: Serotonin, Noradrenalin, Endorphine hemmen im Rückenmark; Biorhythmus → abends mehr Schmerz; unterstützt durch Opiate, Antidepressiva, Antikonvulsiva.\nSegmental: Druck-/Reibreiz hemmt im Rückenmark → Basis für TENS, Quaddelung, Akupunktur.", s: "S. 6" },
    { k: "Arten", f: "Was kennzeichnet nozizeptiven Schmerz?",
      a: "Warnsignal aus Gewebeschaden bei intaktem Nervensystem; somatisch oder viszeral (dumpf, kolikartig). Wundschmerz ist häufig nozizeptiv → antipyretische, ggf. morphinhaltige Analgetika.", s: "S. 7" },
    { k: "Arten", f: "Was kennzeichnet neuropathischen Schmerz?",
      a: "Schädigung des somatosensorischen Nervensystems; spitz, hell, einschießend, elektrisierend; Empfindungsort oft ≠ Entstehungsort; häufig bei Tumorwunden → trizyklische Antidepressiva, Antiepileptika.", s: "S. 8" },
    { k: "Arten", f: "Noziplastischer und psychogener Schmerz?",
      a: "Noziplastisch: veränderte Nozizeptoren ohne Gewebe-/Nervenschaden, Sensibilisierung → desensibilisierende Methoden.\nPsychogen: durch Angst/Stress, schon der Gedanke an den Verbandwechsel → genauso ernst nehmen.", s: "S. 8" },
    { k: "Arten", f: "Akuter vs. prozeduraler Schmerz?",
      a: "Akut: normale Reaktion auf Gewebeschaden, Warnsignal, biologischer Nutzen.\nProzedural: Sonderform durch Maßnahmen (Verbandwechsel, Injektion, Spülung) – Kreislauf aus Schmerz, Angst, Stress; positive Erwartung senkt Schmerz.", s: "S. 8–9" },
    { k: "Arten", f: "Primär vs. sekundär chronischer Schmerz?",
      a: "Chronisch = mind. 3 Monate, Warnfunktion verloren.\nPrimär: mit emotionalem Leid/Funktionseinschränkung, nicht durch andere Diagnose erklärbar.\nSekundär: auf Grunderkrankung zurückzuführen (Tumor, postoperativ, neuropathisch).", s: "S. 9" },
    { k: "Arten", f: "Deafferenzierungs- und Phantomschmerz?",
      a: "Deafferenzierung: Unterbrechung großer Nervenstämme (Amputation) oder Bahnen (Querschnitt).\nPhantomschmerz: Schmerz in nicht mehr vorhandenem Körperteil; Umorganisation im sensomotorischen Cortex; ≠ Stumpfschmerz.", s: "S. 9–10" },
    { k: "Arten", f: "Somatischer vs. viszeraler Schmerz?",
      a: "Somatisch: Muskeln/Bindegewebe, dumpf, strahlt aus.\nViszeral: innere Organe, schlecht lokalisierbar, vegetative Reaktionen; Übertragungsschmerz in Head-Zonen (Herzinfarkt → linker Arm, Gallenkolik → Schulter).", s: "S. 10" },
    { k: "Arten", f: "Was ist chronischer Wund- und Durchbruchschmerz?",
      a: "Dauerschmerz: Hintergrundschmerz, Mischform aus nozizeptiv, neuropathisch, psychogen; Ursachen Entzündung, Ischämie, Infektion.\nDurchbruchschmerz: akut, kurz, mittel-hoch, gleicher Ort und Ursache.", s: "S. 11" },
    { k: "Arten", f: "Was ist das Wind-up-Phänomen?",
      a: "Sensibilisierung: Ein sich wiederholender Schmerzreiz führt zu einer Intensivierung der Schmerzreaktion – leichte Berührung/Druck wird stark schmerzhaft; Lernvorgänge im Rückenmark = „Schmerzgedächtnis“, auch nach Beseitigung der Ursache.", s: "S. 11" },
    { k: "Konzepte", f: "Was beschreibt das bio-psycho-sozial-spirituelle Konzept?",
      a: "Bio (Entzündung, Verspannung) · psycho (Angst, Hilflosigkeit) · sozial (Stress, Isolation) · spirituell (Sinnfragen, Zukunftsangst). Schmerz nie nur körperlich – die beste Therapie berücksichtigt alle Ebenen.", s: "S. 12" },
    { k: "Konzepte", f: "Nenne kulturspezifische Schmerzkonzepte.",
      a: "Zeichen Gottes (erdulden) · Familienereignis (Zuwendung, offen geäußert) · eigener Wille (unterdrückt, Rückzug) · Strafe Gottes (stilles Aushalten) · technisch bewältigbar (präzise schildern, sofort handeln) · Stoizismus (verheimlichen).", s: "S. 13–14" },
    { k: "Wundheilung", f: "Wie beeinflusst Schmerz die Wundheilung?",
      a: "Systemischer Einflussfaktor: reduzierte Beweglichkeit/Mobilität, negative Stimmung, Abwehr gegen Maßnahmen. „Wir behandeln nicht die Wunde, sondern immer den ganzen Menschen.“ Simple Maßnahmen: angewärmte Spüllösung, unnötige Berührung vermeiden.", s: "S. 14–15" },
    { k: "Erfassung", f: "Was ist ein Schmerzscreening? ★",
      a: "Handschr. („Prüfungsfrage“): Screening = Ersteinschätzung Ja/Nein. Bei Nein → keine weitere Einschätzung (kein Assessment).", s: "S. 16", h: true },
    { k: "Erfassung", f: "Was erfasst das Schmerzassessment?",
      a: "Zeitliche Dimension · Intensität und akzeptables Schmerzmaß · Lokalisation/Ausstrahlung · Qualität · Begleitsymptome · Bedeutung (Kultur) · verstärkende/lindernde Faktoren · Effekte auf Lebensqualität · Medikamententagebuch (auch OTC) · Stimmung.", s: "S. 16" },
    { k: "Erfassung", f: "Welche Skalen zur Schmerzintensität gibt es?",
      a: "NRS (0–10), VRS (kein … stärkster vorstellbarer Schmerz), Gesichter-Rating-Skala (GRS). Es gibt keine „beste“ Skala – die für die Person passende finden und dokumentieren.", s: "S. 16" },
    { k: "Erfassung", f: "Welche Fremdeinschätzungsinstrumente gibt es?",
      a: "BESD (Beurteilung von Schmerzen bei Demenz: Atmung, Lautäußerung, Mimik, Körpersprache, Verhalten – handschr.), BISAD (alte Menschen mit Demenz), ZOPA (handschr.: Zurich Observation Pain Assessment, z. B. Wachkoma). Handschr. zusätzlich PAIC 15.", s: "S. 15–17", h: true },
    { k: "Erfassung", f: "Wovon ist bei Wunden grundsätzlich auszugehen?",
      a: "Bei Wunden ist so lange davon auszugehen, dass sie schmerzhaft sind, bis der betroffene Mensch das Gegenteil sagt (deutlich macht).\nHandschr.: → Schmerzmittel!", s: "S. 17–18", h: true },
    { k: "Erfassung", f: "Indirekte Schmerzindikatoren: Sprache und Mimik? (Übung I)",
      a: "Verbal: Fragen nach Schmerzmitteln, Bitten um Hilfe, Klagen, Fluchen.\nVokal: Stöhnen, Weinen, Schreien, Wimmern.\nMimik: Grimassen, zugekniffene Augen, Zähne zusammenbeißen, Stirn runzeln.", s: "S. 33" },
    { k: "Erfassung", f: "Indirekte Indikatoren: Körper und Verhalten? (Übung I)",
      a: "Körper: Muskeltonus ↑, Zittern, Blutdruck/Puls verändert, Atmung, Schwitzen, Steifheit, Schlafstörung.\nVerhalten: Unruhe, Zurückschrecken, Schonhaltung, Aggressivität, Nahrungsverweigerung, Teilnahmslosigkeit, Weglauftendenz.", s: "S. 33" },
    { k: "Verbandwechsel", f: "Schmerzreduktion vor dem Verbandwechsel?",
      a: "Informieren, Schmerzen immer ernst nehmen, Erfahrung einbeziehen, absprechen, rechtzeitig Analgetika (Wirkeintritt), Zugluft vermeiden, stressfreie Umgebung, gute Vorbereitung, Stoppsignale vereinbaren.", s: "S. 17–18" },
    { k: "Verbandwechsel", f: "Schmerzreduktion während des Verbandwechsels?",
      a: "Behutsam reinigen (andrücken statt wischen), Reize vermeiden, zügig verbinden, nicht zu stramm, feuchte Auflagen, Ablösen anfeuchten, Débridement nur mit Analgesie, angewärmte Spülung, Auflagen ohne Kleberand, Rückmeldung erfragen.", s: "S. 18" },
    { k: "Verbandwechsel", f: "Welche Verbandmaterialien gelten als atraumatisch?",
      a: "Salbenkompressen; hydroaktive Auflagen (mit Ringerlösung getränkte Wundkissen, Calcium-Alginate, Hydrokolloide, Hydrogele). Muss der Verband eingeweicht werden oder blutet es beim Abnehmen → Material überdenken!", s: "S. 19" },
    { k: "Medikamente", f: "Was ist bei Ibuprofen-Schaumverbänden zu beachten?",
      a: "Geben Ibuprofen langsam lokal frei, geringe systemische Belastung (auch für Ältere). Wunde muss feucht/nass sein (ggf. NaCl 0,9 %). Nicht bei Wunden in tieferen Schichten (Muskel, Sehne, Knochen).", s: "S. 19–20" },
    { k: "Medikamente", f: "Wie werden Lokalanästhetika angewendet?",
      a: "Kurzzeitig bei sehr schmerzhafter Versorgung; nie alleinige Maßnahme; dick auf Wundgrund/-rand, Folie, Taschen/Höhlen aussparen; nach Einwirkzeit Reste entfernen. Eutektische Mischung Lidocain 2,5 %/Prilocain 2,5 %.", s: "S. 20" },
    { k: "Medikamente", f: "Wann kommen topisch Ketamin oder Morphin zum Einsatz?",
      a: "Ketamin: neuropathische, therapieresistente Schmerzen bei Hyperalgesie oder Allodynie. Morphin-Gel 0,1 % oder Morphin-Lösung auf Alginatträger: besonders effektiv lokal.", s: "S. 20" },
    { k: "Medikamente", f: "Erkläre das WHO-Stufenschema.",
      a: "I: Nichtopioid (ASS, NSAR, Metamizol) · II: schwaches Opioid (Tramadol, Tilidin, Codein) · III: starkes Opioid (Morphin, Fentanyl …). Ggf. Koanalgetika/Adjuvantien; Start nach Schmerzstärke; I+II oder I+III, nicht II+III.", s: "S. 20" },
    { k: "Medikamente", f: "Wie wird bei chronischen Schmerzen dosiert?",
      a: "Nach festem Zeitschema (konstanter Spiegel, Durchbruchschmerz vermeiden), individuell angepasst nach Assessment; Bedarfsmedikation vorausschauend verordnet; Begleitmedikation (Laxantien, Antiemetika).", s: "S. 21" },
    { k: "Medikamente", f: "Was hilft bei neuropathischen Schmerzen?",
      a: "Antikonvulsiva (Gabapentin, Pregabalin) und Antidepressiva (Amitriptylin, Nortriptylin, niedrig dosiert). Handschr.: Antidepressiva mit zusätzlicher schmerzhemmender Wirkung.", s: "S. 19, 21", h: true },
    { k: "Medikamente", f: "Prinzipien der systemischen Schmerztherapie?",
      a: "Möglichst oral, nicht i. m. · effektives Dosierschema · Kontraindikationen/Wechselwirkungen · im Alter schrittweise anpassen · Nebenwirkungen beachten · Experten bei Komplexität · mit nicht-medikamentösen Verfahren kombinieren · aufklären · multimodal.", s: "S. 21–22" },
    { k: "Medikamente", f: "Häufige Fehler in der Schmerztherapie?",
      a: "Unterdosierung · nur „bei Bedarf“ · Kombination entgegen WHO (zwei Opioide) · Tranquilizer-Dauermedikation · fehlende Begleitmedikation (Antiemetika/Obstipationsprophylaxe bei Opiatstart, PPI bei Diclofenac).", s: "S. 22" },
    { k: "Medikamente", f: "Opioidtoleranz vs. opioidinduzierte Hyperalgesie?",
      a: "Toleranz: schleichender Wirkungsverlust → Dosiserhöhung, ggf. Opiatrotation.\nHyperalgesie: plötzlich, Schmerzschwelle sinkt, Verstärkung trotz Dosis ↑, Ganzkörperschmerz → Dosis reduzieren.", s: "S. 22" },
    { k: "Medikamente", f: "Merkmale einer Sucht und präventive Maßnahmen?",
      a: "Merkmale: Schmerz ↑ trotz Analgetika, unzuverlässige Angaben, Verordnung nicht eingehalten, frühere Abhängigkeit, psychische Erkrankung.\nPrävention: Anamnese, Aufklärung, oral/retardiert, Ausschleichschema, Fest- vor Bedarfsanordnung, Opiatrotation.", s: "S. 23" },
    { k: "Medikamente", f: "NSAR in der Wundversorgung – was beachten?",
      a: "Wirksam bei entzündlichen, klopfenden Schmerzen; 1–2 Stunden vor Verbandwechsel geben. Vorsicht ab 65 J., Gerinnungsstörungen, Niere, Ulcus duodeni; Risiken GI-Beschwerden, Ulcera, Perforation.", s: "S. 24" },
    { k: "Medikamente", f: "Opioide in der Wundversorgung – Einsatz und Risiken?",
      a: "Mäßige bis starke Schmerzen; Retard für Dauerschmerz; schnell wirksam (sublingual, oral, bukkal) vor Verbandwechsel. Risiken: Obstipation, Reaktionszeit ↓, Atemdepression, Abhängigkeits-/Missbrauchspotenzial.", s: "S. 24" },
    { k: "Medikamente", f: "Opioid-Mythen – richtig oder falsch? (Übung II)",
      a: "Alle falsch: beschleunigen nicht das Sterben · bei stabilen Schmerzen keine Dosissteigerung · Nebenwirkungen (Müdigkeit, Übelkeit) nur anfangs, ca. 6–8 Tage · keine Organschäden (Niere, Leber, Kreislauf, Kognition) bekannt.", s: "S. 33" },
    { k: "Medikamente", f: "Hyperalgesie, Algesie, Allodynie? PRISCUS? (handschr.)",
      a: "Hyperalgesie = übermäßiges Schmerzempfinden · Algesie = normales Schmerzempfinden · Allodynie = Berührung ist schmerzhaft. PRISCUS-Liste: Medikamente, nicht geeignet für Menschen > 65 J.", s: "S. 20 handschr.", h: true },
    { k: "Nicht-medik.", f: "Nenne nicht-medikamentöse Maßnahmen.",
      a: "Positionierung, Kälte/Wärme, TENS, Massagen, Akupunktur, Information, Entspannungstechniken, aufmerksamkeitsbasierte Techniken (Ablenkung), Musik, Aromatherapie; zudem Hypnotherapie.", s: "S. 25, 30" },
    { k: "Nicht-medik.", f: "Kälte vs. Wärme?",
      a: "Kälte: akute, akut-entzündliche Schmerzen, nach Trauma (Hämatom, Prellung); hemmt Rezeptoren und Leitung; aktiv beteiligen.\nWärme: länger andauernde, neuropathische Schmerzen; keine Leitlinie gibt pflegerische Maßnahmen explizit vor.", s: "S. 26" },
    { k: "Nicht-medik.", f: "Was ist bei TENS zu beachten?",
      a: "Niederspannung über Hautelektroden (4 Elektroden, 10–30 mA); setzt Endorphine u. a. frei; gut bei neuropathischen, kaum bei nozizeptiven Schmerzen; nur nach ärztlicher Anordnung und auf intakter Haut.", s: "S. 26–27" },
    { k: "Nicht-medik.", f: "Massagen und Akupunktur?",
      a: "Massage: senkt nachweislich Schmerzintensität, hilfreich vor Verbandwechsel bei Angst; Praxis: Mandelöl mit Narde, Ylang Ylang, Lavendel.\nAkupunktur: wirksam u. a. bei Knie-Arthrose, Rückenschmerz; Scheinakupunktur ebenfalls wirksam; bei starken Schmerzen nicht ausreichend.", s: "S. 27" },
    { k: "Nicht-medik.", f: "Warum ist Information schmerzlindernd?",
      a: "Vorab besprechen und gemeinsam vorgehen wirkt vertrauensbildend und angstreduzierend; Zeit wird durch Kooperation kompensiert. „Stopp“ vereinbaren – muss unbedingt eingehalten werden; gibt Kontrolle.", s: "S. 28" },
    { k: "Nicht-medik.", f: "Entspannung, Ablenkung und Musik?",
      a: "Entspannung (PMR, Imagination, Yoga, autogenes Training) vorab erlernen. Ablenkung (Gespräch, Fantasie, Bezugsperson) – besonders gut bei Kindern.\nMusik: einfach, kostenlos, Musikwunsch beachten.", s: "S. 28–29" },
    { k: "Nicht-medik.", f: "Aromatherapie und Hypnotherapie?",
      a: "Aroma: keine gesicherte Evidenz; Dufttuch 1–2 Tropfen, dezent, max. 1 Stunde.\nHypnose: Angst-, chronische Schmerzreduktion; nur speziell geschultes Personal. Alle nicht-medikamentösen Maßnahmen planen, anwenden, evaluieren.", s: "S. 30" },
    { k: "Mythen", f: "Mythen in der Wundversorgung entkräften (Übung III).",
      a: "Fixierverband schmerzlos? – Nein, Wundumgebung kann sensibilisiert sein. · DFU schmerzfrei? – Nein, auch Nervensensibilität möglich. · Nur Analgetika? – Nein, Suchtrisiko; nicht-medikamentöse Verfahren bedienen Psyche und Soziales.", s: "S. 34" },
    { k: "Zusammenfassung", f: "Kernaussage der Zusammenfassung?",
      a: "Intensive, wiederholte Schmerzen hinterlassen Spuren im Gehirn (Schmerzgedächtnis, Hyperalgesie). Effektive Schmerzlinderung ist oberstes Gebot; der effektivste Ansatz gegen die Angst ist die Vorbereitung der Schmerzepisoden.", s: "S. 32" }
  ],


  quiz: [
    // Die richtigen Antworten stehen immer vorne; die App mischt.
    { f: "Was ist ein Schmerzscreening? ★",
      o: ["Eine Ersteinschätzung Ja/Nein – bei Nein folgt keine weitere Einschätzung (kein Assessment)", "Die ausführliche Erfassung von Intensität, Lokalisation und Qualität des Schmerzes", "Die Fremdeinschätzung mit der BESD", "Das Führen eines Schmerzmedikamententagebuchs"],
      e: "Handschriftlich als „Prüfungsfrage“ markiert: Screening = Ersteinschätzung Ja/Nein; bei Nein → keine weitere Einschätzung (Assessment).", s: "S. 16", h: true },
    { f: "Wie definiert die IASP Schmerz?",
      o: ["Als unangenehme sensorische und emotionale Erfahrung, die mit einer tatsächlichen oder potenziellen Gewebeschädigung verbunden ist oder einer solchen ähnelt", "Als rein körperliche Reaktion auf eine nachweisbare Gewebeschädigung", "Als elektrischen Impuls der Nozizeptoren, der den Cortex erreicht", "Als Empfindung, die nur bei sichtbarer Wunde vorliegt"],
      e: "IASP: „eine unangenehme sensorische und emotionale Erfahrung, die mit einer tatsächlichen oder potenziellen Gewebeschädigung verbunden ist oder einer solchen ähnelt.“", s: "S. 4" },
    { f: "Welche Aussagen gehören zu den Anmerkungen der IASP zur Schmerzdefinition?",
      o: ["Die Unfähigkeit zu kommunizieren schließt Schmerz nicht aus", "Der Schmerzbericht ist zu respektieren", "Schmerz und Nozizeption sind dasselbe", "Das Schmerzkonzept ist angeboren und wird nicht gelernt"], r: 2,
      e: "Anmerkungen: immer persönliche Erfahrung · Schmerz ≠ Nozizeption · Konzept wird durch Lebenserfahrung gelernt · Schmerzbericht respektieren · nachteilige Folgen möglich · Unfähigkeit zu kommunizieren schließt Schmerz nicht aus.", s: "S. 4" },
    { f: "Welche Struktur gilt als „Tor des Bewusstseins“ und entscheidet, welche Reize wahrgenommen werden?",
      o: ["Thalamus", "Limbisches System", "Rückenmark", "Nozizeptoren"],
      e: "Der Thalamus filtert (Gate-Control-Theorie, Melzack/Wall); Konzentration, Fokussierung und Ablenkung beeinflussen die Wahrnehmung. Das limbische System übernimmt die emotionale Bewertung.", s: "S. 5–6" },
    { f: "Auf welchem Mechanismus beruhen TENS, Quaddelung und Akupunktur (Gegenirritation)?",
      o: ["Segmentale Hemmung im Rückenmark", "Wind-up-Phänomen", "Deafferenzierung", "Opioidinduzierte Hyperalgesie"],
      e: "Segmentale Hemmung: Aktivierung der Leitbahnen für Druckempfinden (z. B. Reiben der gestoßenen Stelle) hemmt im Rückenmark – Grundlage für TENS, Quaddelung, Akupunktur.", s: "S. 6" },
    { f: "Welche Schmerzqualität ist typisch für neuropathischen Schmerz?",
      o: ["Spitz, hell, einschießend, elektrisierend", "Dumpf und kolikartig aus inneren Organen", "Dumpf, aus Muskeln und Bindegewebe ausstrahlend", "Ausschließlich durch Angst und Stress ausgelöst"],
      e: "Neuropathisch: Schädigung des somatosensorischen Nervensystems; spitz, hell, einschießend, elektrisierend; Empfindungsort oft ≠ Entstehungsort; häufig bei Tumorwunden.", s: "S. 8" },
    { f: "Was ist prozeduraler Schmerz?",

  zusammenfassung: `
<h3>1. Bedeutung und Definition <span class="seite">S. 3–5</span></h3>
<ul>
  <li>„Jede Schmerzerfahrung eines Menschen formt seine Nächste“ (DNQP 2020) – Verantwortung bei jedem Verbandwechsel. Unzureichend gelinderte Schmerzen können zu langanhaltenden Einschränkungen der gesamten Lebenssituation führen; sie wirken negativ auf die Wundheilung (S. 3).</li>
  <li>Zugang zur Schmerztherapie ist ein <b>menschliches Grundrecht</b> (IPS/IASP 2010) (S. 3).</li>
</ul>
<p class="merke"><b>Schmerz (IASP):</b> „eine unangenehme sensorische und emotionale Erfahrung, die mit einer tatsächlichen oder potenziellen Gewebeschädigung verbunden ist oder einer solchen ähnelt.“ (S. 4)</p>
<ul>
  <li><b>Anmerkungen der IASP</b> (S. 4): immer persönliche Erfahrung (biologisch, psychisch, sozial beeinflusst) · Schmerz ≠ Nozizeption · Konzept wird durch Lebenserfahrung gelernt · Schmerzbericht respektieren · trotz adaptiver Rolle nachteilige Folgen möglich · Unfähigkeit zu kommunizieren schließt Schmerz nicht aus.</li>
  <li>Schmerz ist multidimensional: physisch, funktional, psychologisch, sozial, spirituell (S. 5).</li>
  <li><b>Komponenten der Schmerzempfindung</b> (S. 5): sensorisch-diskriminativ (Ort, Intensität) · affektiv-motivational (Unangenehmheit) · kognitiv (Einstellung) · vegetativ (Blutdruck, Pupillen) · motorisch (Reflexe, Muskelverspannung).</li>
</ul>

<h3>2. Schmerzentstehung, -weiterleitung und -hemmung <span class="seite">S. 5–6</span></h3>
<div class="tabelle"><table>
  <thead><tr><th>Stufe</th><th>Vorgang (Heft)</th></tr></thead>
  <tbody>
    <tr><td>Aufnahme</td><td>Nozizeptoren (freie Nervenenden, in allen Organen außer Gehirn) reagieren polymodal auf mechanische, chemische, thermische Reize → elektrische Impulse</td></tr>
    <tr><td>Weiterleitung</td><td>über das Rückenmark zum Thalamus</td></tr>
    <tr><td>Filterung</td><td>Thalamus („Tor des Bewusstseins“) entscheidet, welche Reize wahrgenommen werden (Gate-Control-Theorie, Melzack/Wall); Konzentration, Fokussierung, Ablenkung beeinflussen</td></tr>
    <tr><td>Verarbeitung</td><td>somatosensorischer Cortex (Was? Wo? Welche Art? Wie stark?) und limbisches System (emotionale Bewertung, affektiv-motivational)</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Sensibilisierung:</b> wiederholt gereizte Nozizeptoren → Schmerzschwelle sinkt, mehr Impulse → wichtig für chronische Schmerzen (S. 6).</li>
  <li><b>Deszendierende (antinozizeptive) Hemmung:</b> Serotonin, Noradrenalin hemmen Übertragung im Rückenmark; Endorphine; dauerhaft aktiv, aber Biorhythmus → abends stärkere Schmerzen; unterstützbar durch Opiate, Antidepressiva, Antikonvulsiva (S. 6).</li>
  <li><b>Segmentale Hemmung:</b> Aktivierung der Leitbahnen für Druckempfinden (z. B. Reiben der gestoßenen Stelle) hemmt im Rückenmark; Grundlage für Gegenirritation (TENS, Quaddelung, Akupunktur). <b>Gate-Control-Theorie</b> (1965): physische und psychologische Faktoren beeinflussen das Schmerzerleben (S. 6).</li>
</ul>

<h3>3. Schmerzarten und -formen <span class="seite">S. 7–11</span></h3>
<p>Einteilung u. a. nach Dauer (akut, prozedural; chronisch primär/sekundär), Qualität (sensorisch: stechend, brennend …; affektiv: quälend …), Auslöser (Ruhe-, Belastungs-, Druckschmerz), Lokalisation, Pathologie (nozizeptiv, neuropathisch, noziplastisch, psychogen), Ätiologie, Pathophysiologie, Intensität (S. 7).</p>
<div class="tabelle"><table>
  <thead><tr><th>Art</th><th>Kennzeichen (Heft)</th><th>Therapiehinweis</th></tr></thead>
  <tbody>
    <tr><td>nozizeptiv</td><td>Warnsignal aus Gewebeschaden bei intaktem Nervensystem; somatisch oder viszeral; viszeral oft dumpf, schlecht lokalisierbar, kolikartig; Wundschmerz meist nozizeptiv</td><td>antipyretische, ggf. morphinhaltige Analgetika</td></tr>
    <tr><td>neuropathisch</td><td>Schädigung/Erkrankung des somatosensorischen Nervensystems; spitz, hell, einschießend, elektrisierend; Ort oft ≠ Entstehungsort; häufig bei Tumor(-wunden)</td><td>trizyklische Antidepressiva, Antiepileptika</td></tr>
    <tr><td>noziplastisch</td><td>veränderte Nozizeptoren ohne Gewebe-/Nervenschaden; Sensibilisierung, geringe Reize → starker Schmerz; Kombination mit nozizeptiv möglich</td><td>desensibilisierende Methoden</td></tr>
    <tr><td>psychogen</td><td>durch Angst und Stress; schon der Gedanke an den Verbandwechsel → Schwitzen, Puls ↑, reale Schmerzzunahme</td><td>ebenso ernst nehmen und lindern</td></tr>
  </tbody>
</table></div>
<ul>
  <li><b>Akut:</b> normale physiologische Reaktion auf Gewebeschaden, Warnsignal, biologischer Nutzen. <b>Prozedural:</b> Sonderform des akuten Schmerzes durch Maßnahmen (Verbandwechsel, Injektion, Wundspülung); Kinder besonders betroffen; bei chronischen Wunden sehr häufig → Kreislauf aus Schmerz, Angst, Stress und verstärkter Wahrnehmung; positive Erwartung senkt Schmerz (S. 8–9).</li>
  <li><b>Chronisch:</b> mind. 3 Monate, Warnfunktion verloren; zentrale neuroplastische Veränderungen; wiederkehrende akute Ausbrüche (Minuten bis Tage). <b>Primär chronisch:</b> ≥ 3 Monate, bedeutsames emotionales Leid/Funktionseinschränkung, nicht durch andere Diagnose erklärbar. <b>Sekundär chronisch:</b> geht auf Grunderkrankung zurück (Tumor, postoperativ/posttraumatisch, neuropathisch) (S. 9).</li>
  <li><b>Deafferenzierungsschmerz:</b> komplette Unterbrechung großer Nervenstämme (Amputation) oder Bahnsysteme (Querschnitt). <b>Phantomschmerz</b> = schmerzhafte Empfindung in einer nicht mehr vorhandenen Extremität; Umorganisation im sensomotorischen Cortex; ≠ Stumpfschmerz; Medikamente mit begrenztem Erfolg (S. 9–10).</li>
  <li><b>Somatisch</b> (Muskeln, Bindegewebe; dumpf, strahlt aus) vs. <b>viszeral</b> (innere Organe, vegetative Begleitreaktion, Übertragungsschmerz in Head-Zonen: Herzinfarkt → linker Arm, Gallenkolik → Schulter) (S. 10).</li>
  <li><b>Wundschmerz:</b> alle wundbezogenen Schmerzen (Verletzung, Schwellung, Heilung, Behandlung). Chronischer Wundschmerz = Hintergrund-/Dauerschmerz, Mischform aus nozizeptiv, neuropathisch, psychogen; <b>Durchbruchschmerz</b>: akut, kurz, mittel-hoch, gleicher Ort und Ursache. Folgen: Depression bis Sterbewunsch (S. 10–11).</li>
</ul>
<p class="merke"><b>Sensibilisierung (Wind-up-Phänomen):</b> Ein sich wiederholender Schmerzreiz führt zu einer Intensivierung der Schmerzreaktion. Leichte Reize (Berührung, mäßige Hitze, Druck) werden als starker Schmerz empfunden; Lernvorgänge v. a. im Rückenmark = <b>„Schmerzgedächtnis“</b>, das auch nach Beseitigung der Ursache bestehen kann (S. 11). Ausweg: Schmerzbiografie, zu erwartende Schmerzen zügig behandeln (S. 12).</p>

<h3>4. Multidimensionalität und Kultur <span class="seite">S. 12–14</span></h3>
<p class="merke">Der Mensch ist stets in seiner <b>bio-psycho-sozialen und spirituellen Gesamtheit</b> von Schmerz betroffen → nie nur körperlich → die beste Schmerztherapie berücksichtigt alle Ebenen (S. 12).</p>
<div class="tabelle"><table>
  <thead><tr><th>bio</th><th>psycho</th><th>sozial</th><th>spirituell</th></tr></thead>
  <tbody>
    <tr><td>Entzündungen, Muskelverspannungen, vegetative Störungen, Nerven-/Gelenkschäden</td><td>Hilflosigkeit, Ängste, Sorgen, unterdrückter Ärger, Niedergeschlagenheit</td><td>Stress, Konflikte, Arbeitsunfähigkeit, Ausgrenzung, Isolation</td><td>Sinnfragen, Zukunftsangst, Vergänglichkeit, Begrenztheit, Machtlosigkeit</td></tr>
  </tbody>
</table></div>
<p><b>Kulturspezifische Schmerzkonzepte</b> (S. 13–14): Schmerz als Zeichen Gottes (erdulden, Medikamente teils abgelehnt) · Familienereignis/Kollektivismus (Zuwendung der Familie, Schmerz offen geäußert) · durch eigenen Willen bewältigbar (nicht zugelassen, Rückzug) · Strafe Gottes (stillschweigend ausgehalten) · technisch-fachlich bewältigbar (präzise Beschreibung, sofortiges Handeln) · Stoizismus (Schmerz verheimlicht, als Schwäche gedeutet).</p>
<p><b>Schmerz als Einflussfaktor auf die Wundheilung</b> (S. 14–15): Kausaltherapie zuerst; „Wir behandeln nicht die Wunde, sondern immer den ganzen Menschen.“ Schmerz mindert Beweglichkeit, Mobilität, Stimmung; Abwehr gegen Maßnahmen. Simple Maßnahmen: angewärmte Spüllösung, unnötige Berührungen vermeiden.</p>

<h3>5. Schmerzerfassung <span class="seite">S. 15–17</span></h3>
<ul>
  <li>Subjektiv, nicht durch Geräte messbar → Aussage des Betroffenen maßgeblich; verbale und nonverbale Kommunikation zentral (S. 15).</li>
  <li><b>Screening</b> <span class="stern" title="im Heft als prüfungsrelevant markiert">★</span> <span class="hand-inline">Handschriftlich („Prüfungsfrage“): Screening = Ersteinschätzung Ja/Nein; bei Nein → keine weitere Einschätzung (Assessment) (S. 16).</span> Bei jeder Schmerzbehandlung bzw. zu erwartenden Schmerzen (vor Wundreinigung, Verbandwechsel) Assessment.</li>
  <li><b>Assessment erfasst</b> (S. 16): zeitliche Dimension (Beginn, Dauer, Rhythmus) · Intensität und akzeptables Schmerzmaß · Lokalisation, Ausstrahlung · Qualität · Begleitsymptome (Taubheit, Hyperalgesie, Krämpfe, Schlafstörung, Übelkeit) · Bedeutung des Schmerzes (Kultur) · verstärkende/lindernde Faktoren · Effekte auf Lebensqualität, Funktion, Teilhabe · Schmerzmedikamententagebuch (auch OTC) · Stimmungslage.</li>
  <li><b>Skalen</b> (S. 16): NRS (0–10), VRS (kein … stärkster vorstellbarer Schmerz), Gesichter-Rating-Skala (GRS). Es gibt keine „beste“ Skala – die passende finden und dokumentieren. <span class="hand-inline">Handschriftlich: NRS – Menschen vergleichen mit dem, was sie erlebt haben.</span></li>
  <li><b>Fremdeinschätzung</b> bei eingeschränkter Selbstauskunft: <b>BESD, BISAD, ZOPA</b>; Fragen vereinfachen, Zeit lassen; sonst Informationen aller Beteiligten bündeln. Danach gemeinsamer Behandlungsplan und Verlaufskontrolle (S. 17).</li>
</ul>
<p class="hand">BESD = Beurteilung von Schmerzen bei Demenz (Atmung, Lautäußerung, Mimik, Körpersprache, Verhalten); BISAD ähnlich – Beobachtungsinstrument für alte Menschen mit Demenz; ZOPA (Zurich Observation Pain Assessment) – z. B. Wachkoma, Vitalwerte; PAIC 15 – Schmerzerfassung bei Demenz/kognitiver Beeinträchtigung (Gesichtsausdruck, Körpersprache, Lautäußerung).</p>
<p class="merke"><b>Bei Wunden ist so lange davon auszugehen, dass sie schmerzhaft sind, bis der betroffene Mensch das Gegenteil sagt (deutlich macht)</b> (S. 17). <span class="hand-inline">Handschriftlich S. 18 wiederholt: „→ Schmerzmittel!“</span></p>

    <tr><td>verbal</td><td>Fragen nach Schmerzmitteln, abgehackte/stotternde Sprache, Bitten um Hilfe, Klagen, Fluchen, rascher Sprachzerfall, Unbehagen/Protest</td></tr>

    <tr><td>Verhalten</td><td>Unruhe, Angst, Zurückschrecken vor Berührung, Schonhaltung, Aggressivität, Verwirrtheit, Nahrungsverweigerung, Ablehnung von Bewegung/Behandlung, Teilnahmslosigkeit, Weglauftendenz (Demenz)</td></tr>

<h3>6. Schmerzreduktion beim Verbandwechsel <span class="seite">S. 17–19</span></h3>
<ul>
  <li>Verbandwechsel = Stresssituation; erwarteter Schmerz → ablehnende Haltung, stellt Behandlungsprozess in Frage (S. 17).</li>
  <li><b>Maßnahmen</b> (S. 17–18): informieren, <b>Schmerzen immer ernst nehmen</b>, Erfahrung einbeziehen, absprechen, <b>rechtzeitig Analgetika (Wirkeintritt!)</b>, Zugluft vermeiden, stressfreie Umgebung, gute Vorbereitung, ansprechen/Pausen, Stoppsignale, behutsame Reinigung (angefeuchtete Kompressen andrücken, nicht kräftig wischen), unnötige Reize vermeiden, zügig verbinden, Sekundärverband nicht zu stramm, feucht haltende Auflagen, Ablösen anfeuchten, Débridement geplant mit Analgesie/Anästhesie, angewärmte Spülung mit wenig Druck, Auflagen ohne Kleberand (Silikon), Rückmeldung erfragen.</li>
  <li>Prozeduraler Schmerz kann Auslöser chronischer Schmerzen sein / Schmerzgedächtnis bilden (S. 18).</li>
  <li><b>Verbandmaterial</b> (S. 19): atraumatisch = Salbenkompressen, hydroaktive Auflagen (Ringerlösung-Wundkissen, Calcium-Alginate, Hydrokolloide, Hydrogele).</li>
</ul>
<p class="warnung"><b>Muss der Verband eingeweicht werden oder verursacht das Abnehmen Blutungen/Traumata → Material überdenken!</b> (S. 19)</p>

<h3>7. Medikamentöse Maßnahmen <span class="seite">S. 19–24</span></h3>
<ul>
  <li>Ursachen behandeln, verschlimmernde Faktoren ausschalten; Therapie aus einer Hand; Nebenwirkungen (Übelkeit, Obstipation, Erbrechen, Benommenheit, Angst, Depression) erfassen und minimieren (S. 19).</li>
  <li><b>Lokal</b> (S. 19–20): <b>PU-Schaumverbände mit Ibuprofen</b> (geringe systemische Belastung, auch für Ältere; Wunde muss feucht/nass sein, ggf. mit NaCl 0,9 % benetzen; <b>nicht</b> bei Wunden in tieferen Schichten – Muskel, Sehne, Knochen) · <b>Lokalanästhetika</b> (dick auf Wundgrund und -rand, Folie, Taschen/Höhlen aussparen, nie alleinige Maßnahme; eutektische Mischung Lidocain 2,5 %/Prilocain 2,5 %) · <b>Ketamin</b> topisch bei therapieresistenten neuropathischen Schmerzen, Hyperalgesie, Allodynie · <b>Morphin-Gel 0,1 %</b> oder Morphin-Lösung auf Alginatträger.</li>
  <li><b>Systemisch – WHO-Stufenschema</b> (S. 20): Stufe I Nichtopioid (ASS, NSAR, Metamizol) · II schwache Opioide (Tramadol, Tilidin, Codein) · III starke Opioide (Morphin, Hydromorphon, Fentanyl, Oxycodon, Pethidin, Tapentadol); jeweils ggf. Koanalgetika/Adjuvantien; Start nach Schmerzstärke; II oder III mit I kombinierbar <span class="hand-inline">(handschriftlich: 1+2 oder 1+3)</span>, <b>II + III nicht</b>; Kombination senkt Opioidbedarf.</li>
  <li>Auswahl nach Schmerzart und -intensität; bei chronischen Schmerzen <b>festes Zeitschema</b> (konstanter Spiegel, Durchbruchschmerz vermeiden); Bedarfsmedikation vorausschauend verfügbar; Begleitmedikation (Laxantien, Antiemetika). Neuropathisch: Antikonvulsiva (Gabapentin, Pregabalin), Antidepressiva (Amitriptylin, Nortriptylin, niedrig dosiert). Opioide: BtM-Rezept, besondere Aufbewahrung (S. 21).</li>
  <li><b>Prinzipien</b> (S. 21–22): möglichst oral, nicht i. m. · effektivstes Dosierungsschema (Wirkdauer, Halbwertszeit) · Kontraindikationen, Komorbiditäten, Wechselwirkungen · Alter: schrittweise anpassen · Nebenwirkungen beachten · Schmerzexpert:innen bei komplexen Situationen · mit nicht-medikamentösen Verfahren verbinden · Aufklärung (u. a. Verkehrstüchtigkeit) · interdisziplinär, multimodal.</li>
  <li><b>Häufige Fehler</b> (S. 22): Unterdosierung · nur „bei Bedarf“ · Kombination entgegen WHO (zwei Opioide/zwei Begleitmedikamente) · Tranquilizer-Dauermedikation · fehlende Begleitmedikation (Antiemetika-/Obstipationsprophylaxe bei Opiatstart, PPI bei Diclofenac).</li>
</ul>
<div class="tabelle"><table>

  </tbody>
</table></div>
<ul>
  <li><b>Sucht</b> (S. 22–23): Abhängigkeit meist durch ärztliches Handeln mitbedingt; Opiate mit hohem Suchtrisiko (euphorisierend). <b>Merkmale:</b> Schmerz ↑ trotz Analgetika, unzuverlässige Angaben, Nichteinhalten der Verordnung, keine Besserung trotz Dosis ↑, frühere Abhängigkeit, familiäre Veranlagung, psychische Erkrankung. <b>Prävention:</b> Abhängigkeit/Familienanamnese/Psyche prüfen, informieren, Alter/Geschlecht beachten, Ausschleichschema, oral statt Injektion, retardiert, Sedierungsgrad erfassen, nicht-medikamentös beraten, Fest- vor Bedarfsanordnung, Opiatrotation.</li>
</ul>
<p class="hand">PRISCUS-Liste – Medikamente, nicht geeignet für Menschen &gt; 65 J. (S. 20); Antidepressiva – zusätzliche schmerzhemmende Wirkung bei neuropathischen Schmerzen (S. 19); Hyperalgesie = übermäßiges Schmerzempfinden, Algesie = normales Schmerzempfinden, Allodynie = Berührung ist schmerzhaft (S. 20).</p>
